function bayHasWork(nn){
  const b = PAYLOAD.bays.find(x => x.n === nn);
  if(!b) return false;
  return (b.pallets||[]).some(p => (p.lines||[]).some((l,i) =>
    (st(lid(nn, p.loc, l, i)) || {}).state));
}
function putbackDone(nn){

  if(!bayHasWork(nn) && !(S.bays[nn]||{}).putback_done){
    if(!confirm('Nothing has been recorded in this bay.\n\nConfirming the putback tells '+
                'Finale every pallet here came down and went back — which changes their '+
                'locations. If you did not work this bay, tap Cancel.\n\nConfirm anyway?'))
      return;
  }

  const was = (S.bays[nn]||{}).putback_ts;
  S.bays[nn] = Object.assign(S.bays[nn]||{},
                             {putback_done:true, putback_ts: was || new Date().toISOString()});
  ev('putback_done', {bay: PAYLOAD.bays.find(b=>b.n===nn).bay}); save();
  askLaneRoom(nn);          
  render();
}

function askLaneRoom(nn){
  const b = PAYLOAD.bays.find(x => x.n === nn);
  if(!b) return;
  const st_ = S.bays[nn] || {};
  if(st_.lane_room) return;                 

  const backN = (b.putback || []).filter(pb => {
    const a_ = actualFor(pb.pallet_id);
    if(!a_ || !a_.loc) return true;                  
    return a_.loc.indexOf(b.bay + '-') === 0;        
  }).length + Object.keys(S.new_pallets || {}).filter(q => {
    const a_ = actualFor(q);
    return a_ && a_.loc && a_.loc.indexOf(b.bay + '-') === 0;
  }).length;
  setTimeout(() => dlg('One question about ' + b.bay,
    '<p>You have just put <b>'+backN+'</b> pallet'+(backN===1?'':'s')+' back into '+
    esc(b.bay)+'.</p>'+
    '<p class="sm dim">Finale can only ever see positions that hold stock, so it cannot '+
    'tell us whether a lane is genuinely full. You can.</p>'+
    '<p><b>Could another pallet fit in this lane right now?</b></p>',
    [{t:'No — it is full', c:'', f:()=>laneRoom(nn,'full',backN)},
     {t:'Yes — room for 1', c:'', f:()=>laneRoom(nn,'one',backN)},
     {t:'Yes — room for 2+', c:'', f:()=>laneRoom(nn,'two_plus',backN)},
     {t:'Not sure', c:'ghost', f:()=>laneRoom(nn,'unsure',backN)}]), 0);
}
function laneRoom(nn, ans, backN){
  const b = PAYLOAD.bays.find(x => x.n === nn);
  S.bays[nn] = Object.assign(S.bays[nn]||{}, {lane_room: ans, lane_back: backN,
                                              lane_room_ts: new Date().toISOString()});
  ev('lane_room', {bay: b ? b.bay : '', answer: ans, pallets_back: backN});
  save(); render();
}

const FULL_BUCKETS = [
  {k:'empty',    pct:0,   t:'Empty',      d:'nothing on it'},
  {k:'quarter',  pct:25,  t:'¼ full',     d:'lots of room'},
  {k:'half',     pct:50,  t:'½ full',     d:'room for more'},
  {k:'three_q',  pct:75,  t:'¾ full',     d:'a bit of room'},
  {k:'full',     pct:95,  t:'FULL',       d:'nothing else fits'},
  {k:'over',     pct:120, t:'OVERFULL',   d:'⛔ would not all fit — say what is left over'},
];

function floorDown(p){
  if(!p || !floorLoc()) return false;
  const bs = PAYLOAD.bays.find(b => (b.pallets||[]).some(x => x.loc === p.loc));
  if(!bs) return false;
  const st_ = S.bays[bs.n] || {};
  return !!(st_.putback_done || st_.closed) ||
    (bs.pallets||[]).some(p2 => (p2.lines||[]).some((l2,i2) =>
      (st(lid(bs.n, p2.loc, l2, i2)) || {}).state));
}
function adjLoc(p, line, onFloor, cameDown){
  if(!p) return '';

  if(onFloor && floorLoc()) return floorLoc();
  if(cameDown && floorLoc() && line &&
     (line.kind === 'take' || line.kind === 'aside')) return floorLoc();
  return palletFinalLoc(p.pallet_id) || p.goes_back_to || p.loc || '';
}

function cardInUse(pid){
  if(!pid) return '';
  let hit = '';
  PAYLOAD.bays.forEach(b => (b.pallets || []).forEach(p => {
    if(p.pallet_id === pid) hit = 'the plan already uses ' + pid + ' for the pallet at ' +
                                  p.loc + ' in bay ' + b.bay;
  }));
  if(!hit && (S.new_pallets || {})[pid])
    hit = pid + ' was already given to a pallet built earlier in this job';
  return hit;
}
function nextFreeCard(){
  const used = new Set();
  PAYLOAD.bays.forEach(b => (b.pallets || []).forEach(p => {
    const m = /^P-(\d+)$/.exec(p.pallet_id || ''); if(m) used.add(Number(m[1]));
  }));
  Object.keys(S.new_pallets || {}).forEach(k => {
    const m = /^P-(\d+)$/.exec(k); if(m) used.add(Number(m[1]));
  });
  let n = 1; while(used.has(n)) n++;
  return n;
}
function cardOf(x){
  if(!x) return '';
  if(typeof x === 'object') return x.card || x.pallet_id || '';
  for(const b of PAYLOAD.bays){
    for(const p of (b.pallets||[])) if(p.pallet_id === x) return p.card || x;
    for(const pb of (b.putback||[])) if(pb.pallet_id === x) return pb.card || x;
  }
  return x;                       
}

function palletLabel(p){
  if(!p) return 'the pallet';
  return p.pallet_id ? ('pallet ' + cardOf(p)) : (p.loc || 'the pallet');
}

function bucketOf(k){ return FULL_BUCKETS.find(x => x.k === k) || null; }

function nearestBucket(pct){
  if(pct == null) return null;
  let best = FULL_BUCKETS[0];
  FULL_BUCKETS.forEach(x => { if(Math.abs(x.pct - pct) < Math.abs(best.pct - pct)) best = x; });
  return best;
}

function askFullness(bayN, loc){
  const b = PAYLOAD.bays.find(x => x.n === bayN);
  const p = b && b.pallets.find(x => x.loc === loc);
  if(!p) return;
  const deck = Number(p.deck_m3 || 0), ours = Number(p.est_m3 || 0);
  const ourPct = deck > 0 ? Math.round(100 * ours / deck) : null;
  const nov = (p.no_volume || []);
  const title = (cardOf(p) || loc);

  if(ourPct == null || nov.length){
    return askFullnessBlind(bayN, loc, title, nov, ourPct);
  }
  const guess = nearestBucket(ourPct);
  dlg('Does this look about right?',
    '<div class="okbox" style="text-align:center;padding:14px 10px">'+
      '<div class="sm dim">We think '+esc(title)+' is about</div>'+
      '<div style="font-size:34px;font-weight:700;line-height:1.1;margin:4px 0">'+ourPct+'%</div>'+
      '<div class="sm dim">full — '+esc(guess.t)+', '+esc(guess.d)+'</div>'+
    '</div>'+
    '<p class="sm dim" style="margin-top:10px">If it looks about right, that is all we need.</p>',
    [{t:'✓ Yep, about right', c:'pri', f:()=>setFullness(bayN, loc, guess.k, 'confirmed', ourPct)},
     {t:'No — it is not', c:'warn', f:()=>{
        setTimeout(()=>askFullnessBlind(bayN, loc, title, nov, ourPct, true), 0); }},
     {t:'Skip', c:'ghost'}]);
}

function askFullnessBlind(bayN, loc, title, nov, ourPct, correcting){
  const prev = (S.pallets[loc] || {}).fullness || '';
  dlg(correcting ? 'What is it really?' : 'How full is ' + title + ' now it is loaded?',
    (correcting
      ? '<p class="sm dim">Thanks — that is the useful answer. Roughly, then:</p>'
      : '<p class="sm dim">We have no size on file for '+
        (nov && nov.length ? esc(nov.slice(0,3).join(', ')) : 'this one')+
        ', so we cannot even guess. Your eyeball is the only reading there is.</p>')+
    '<div id="fullbtns">'+
      FULL_BUCKETS.map(x =>
        '<button type="button" class="big '+(prev===x.k?'ok':'')+'" style="margin-bottom:8px;'+
        'text-align:left;min-height:62px" onclick="setFullness('+bayN+',\''+esc(loc)+'\',\''+
        x.k+'\',\''+(correcting?'corrected':'blind')+'\','+(ourPct==null?'null':ourPct)+')">'+
        '<b>'+x.t+'</b><div class="sm" style="font-weight:400;opacity:.8">'+x.d+'</div></button>'
      ).join('')+
    '</div>',
    [{t:'Not now', c:'ghost'}]);
}

function setFullness(bayN, loc, k, mode, ourPct){
  const b = PAYLOAD.bays.find(x => x.n === bayN);
  const p = b && b.pallets.find(x => x.loc === loc);
  const ps_ = S.pallets[loc] = S.pallets[loc] || {};
  ps_.fullness = k;
  ps_.fullness_mode = mode || 'blind';
  ps_.fullness_ts = new Date().toISOString();
  ev('fullness', {bay: b ? b.bay : '', pallet: p ? p.pallet_id : loc, bucket: k, mode: ps_.fullness_mode});
  save();
  const bk = bucketOf(k);

  if(ps_.fullness_mode === 'confirmed'){ toast('✓ ' + bk.t + ' — thanks'); render(); return; }

  const gap = (ourPct == null) ? null : bk.pct - ourPct;
  setTimeout(() => dlg('Recorded as ' + bk.t,
    (ourPct == null
      ? '<p class="dim">Nothing to compare it to — yours is the only reading, which makes it '+
        'one of the most useful answers in the whole session.</p>'
      : '<div class="warnbox"><b>We said '+ourPct+'%, you said '+bk.pct+'%.</b>'+
        '<div class="sm" style="margin-top:6px">That is what we are looking for. '+
        '<b>If you know why, it saves us guessing:</b></div>'+
        '<select id="fwhy" style="margin-top:8px">'+
          '<option value="">— skip, no idea —</option>'+

function tempLoc(){ return PAYLOAD.temp_location || ''; }

function tempPulled(sku, lot){
  let q = 0;

  (S.temp_out || []).forEach(r => {
    if(r.sku === sku && (r.lot || '') === (lot || '')) q += Number(r.qty || 0); });
  Object.keys(S.lines || {}).forEach(k => {
    const st_ = S.lines[k] || {};
    if(st_.temp_sku !== sku) return;
    if((st_.from_temp_lot != null ? st_.from_temp_lot : st_.temp_lot || '') !== (lot || '')) return;
    q += Number(st_.from_temp || 0);
  });
  return q;
}
function tempParkedHere(sku, lot){
  let q = 0;
  Object.keys(S.lines || {}).forEach(k => {
    const st_ = S.lines[k] || {};
    if(st_.temp_sku !== sku || (st_.temp_lot || '') !== (lot || '')) return;
    q += Number(st_.to_temp || 0);
  });
  return q;
}
function tempAvailable(sku, lot){
  let base = 0;
  (PAYLOAD.temp_stock || []).forEach(r => {
    if(r.sku === sku && (r.lot || '') === (lot || '')) base += Number(r.qty || 0); });
  return Math.round((base + tempParkedHere(sku, lot) - tempPulled(sku, lot)) * 1000) / 1000;
}

function tempLots(sku){
  const seen = {}, out = [];
  (PAYLOAD.temp_stock || []).forEach(r => { if(r.sku === sku) seen[r.lot || ''] = 1; });
  Object.keys(S.lines || {}).forEach(k => {
    const st_ = S.lines[k] || {};
    if(st_.temp_sku === sku && Number(st_.to_temp || 0) > 0) seen[st_.temp_lot || ''] = 1; });
  Object.keys(seen).forEach(lot => {
    const q = tempAvailable(sku, lot);
    if(q > 0.001) out.push({lot: lot, qty: q});
  });
  return out.sort((a, b) => b.qty - a.qty);
}
 
function tempAll(){
  const seen = {}, out = [];
  (PAYLOAD.temp_stock || []).forEach(r => { seen[r.sku + '␟' + (r.lot || '')] = r.desc || ''; });
  Object.keys(S.lines || {}).forEach(k => {
    const st_ = S.lines[k] || {};
    if(st_.temp_sku && Number(st_.to_temp || 0) > 0)
      seen[st_.temp_sku + '␟' + (st_.temp_lot || '')] = seen[st_.temp_sku + '␟' + (st_.temp_lot || '')] || ''; });
  Object.keys(seen).forEach(k => {
    const i = k.indexOf('␟'), sku = k.slice(0, i), lot = k.slice(i + 1);
    const q = tempAvailable(sku, lot);
    if(q > 0.001) out.push({sku: sku, lot: lot, qty: q, desc: seen[k]});
  });
  return out.sort((a, b) => b.qty - a.qty);
}

function knownLocations(){
  if(window.__LOCS) return window.__LOCS;
  const set = new Set();
  PAYLOAD.bays.forEach(b => {
    (b.pallets || []).forEach(p => { if(p.loc) set.add(p.loc);
                                     if(p.goes_back_to) set.add(p.goes_back_to); });
    (b.putback || []).forEach(pb => { if(pb.loc) set.add(pb.loc); });
    (b.pallets || []).forEach(p => (p.lines || []).forEach(l => { if(l.dest) set.add(l.dest); }));
    (b.orphan_pulls || []).forEach(o => { if(o.dest) set.add(o.dest);
                                          if(o.from_location) set.add(o.from_location); });
  });
  window.__LOCS = set;
  return set;

function normLoc(raw){

function nativeDetector(){ return typeof window.BarcodeDetector === 'function'; }

function floorLoc(){ return (PAYLOAD && PAYLOAD.floor_location) || ''; }

let ZXING_LOADING = null;
function loadZXing(){
  if(window.ZXing) return Promise.resolve(window.ZXing);
  if(ZXING_LOADING) return ZXING_LOADING;
  ZXING_LOADING = new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = './zxing.js';
    el.onload  = () => window.ZXing ? resolve(window.ZXing)
                                    : reject(new Error('zxing.js loaded but defined nothing'));
    el.onerror = () => { ZXING_LOADING = null;       
                         reject(new Error('could not load the barcode decoder')); };
    document.head.appendChild(el);
  });
  return ZXING_LOADING;
}

async function makeDetector(){
  if(nativeDetector()) return new BarcodeDetector();
  const Z = await loadZXing();
  const reader = new Z.MultiFormatReader();

  reader.setHints(new Map());
  const cv = document.createElement('canvas');
  return {
    detect: (video) => {
      const w = video.videoWidth, h = video.videoHeight;
      if(!w || !h) return [];                      

      const scale = Math.min(1, 640 / w);
      cv.width = Math.round(w * scale); cv.height = Math.round(h * scale);
      cv.getContext('2d').drawImage(video, 0, 0, cv.width, cv.height);
      const src = new Z.HTMLCanvasElementLuminanceSource(cv);
      const bmp = new Z.BinaryBitmap(new Z.HybridBinarizer(src));
      try{
        const r = reader.decode(bmp);
        return r ? [{rawValue: r.getText()}] : [];
      }catch(e){
        return [];                  
      }finally{
        reader.reset();             
      }
    }
  };
}

let CAM = null;                        

function stopCam(){
  const c = CAM; CAM = null;           
  if(!c) return;
  try{ if(c.box) c.box.hidden = true; }catch(e){}
  try{ if(c.stream) c.stream.getTracks().forEach(t => t.stop()); }catch(e){}
  try{ if(c.vid) c.vid.srcObject = null; }catch(e){}
}

(function(){ const d = document.getElementById('dlg');
             if(d){ d.addEventListener('close', stopCam);
                    d.addEventListener('cancel', stopCam); } })();

function startCam(id, onCode){
  const box = $('#'+id+'cambox'), vid = $('#'+id+'vid'), msg = $('#'+id+'msg');
  if(!box || !vid) return;
  stopCam();                           
  const token = {};                    
  const stopBtn = $('#'+id+'stop'); if(stopBtn) stopBtn.onclick = stopCam;

  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})
    .then(async st => {
       
      if(!document.body.contains(box)){ st.getTracks().forEach(t => t.stop()); return; }
      CAM = {stream: st, box: box, vid: vid, token: token};
      box.hidden = false; vid.srcObject = st;

      vid.play().catch(()=>{});

      setTimeout(() => {
        if(CAM && CAM.token === token && vid.readyState === 0 && msg)
          msg.innerHTML = '⚠️ The camera opened but is not sending a picture. '+
            'Scan with the handheld or pick the spot below.';
      }, 6000);

      if(!nativeDetector() && !window.ZXing && msg)
        msg.textContent = 'Getting the barcode reader ready…';
      let det;
      try{ det = await makeDetector(); }
      catch(e){

        stopCam();
        if(msg) msg.innerHTML = '⚠️ Could not load the barcode reader. '+
          'Scan with the handheld or pick the spot below.';
        return;
      }
      if(!CAM || CAM.token !== token) return;       
      if(msg && msg.textContent === 'Getting the barcode reader ready…') msg.textContent = '';
      const tick = async () => {
        if(!CAM || CAM.token !== token) return;       

        const dl = document.getElementById('dlg');
        if(!dl || !dl.open || !document.body.contains(vid)){ stopCam(); return; }
        let raw = null;
        try{
          const found = await det.detect(vid);
          if(found && found.length) raw = found[0].rawValue || '';
        }catch(e){   }

        if(raw){
          stopCam();
          const inp = $('#'+id); if(inp){ inp.value = raw;
            inp.dispatchEvent(new Event('change')); }
          if(onCode) onCode(raw);
          return;
        }
        setTimeout(tick, 220);
      };
      tick();
    })
    .catch(e => {

      if(msg) msg.innerHTML = '⚠️ Could not open the camera ('+esc(e.name||'blocked')+
        '). Scan with the handheld or pick the spot below.';
      try{ box.hidden = true; }catch(err){}
    });
}
function wireScan(id, selId){
  const inp = $('#'+id), sel = $('#'+selId), msg = $('#'+id+'msg');
  if(!inp || !sel) return;
  const apply = () => {
    const v = normLoc(inp.value);
    if(!v){ msg.textContent = ''; return; }
    const opt = [...sel.options].find(o => normLoc(o.value) === v);
    if(opt){ sel.value = opt.value;
      msg.innerHTML = '✓ <b>'+esc(opt.value)+'</b>'; return; }
    if(knownLocations().has(v)){

      const o = document.createElement('option');
      o.value = v; o.textContent = v + ' — scanned, outside this lane';
      sel.appendChild(o); sel.value = v;
      msg.innerHTML = '✓ <b>'+esc(v)+'</b> — that is not in this lane, which is fine if it '+
        'is where you put it.';
      return;
    }

    if(/^P-?\d+$/.test(v)){
      sel.value = '';
      msg.innerHTML = '⛔ <b>'+esc(v)+'</b> is the pallet\'s <b>temporary card</b>, not a '+
        'place. Scan the <b>Finale placard</b> instead — the laminated card with the rack '+
        'position on it, like <b>F2-A-03-2</b> — or pick the spot from the list below.';

      return;
    }
    const o = document.createElement('option');
    o.value = v; o.textContent = v + ' — scanned (not in this plan)';
    sel.appendChild(o); sel.value = v;
    msg.innerHTML = '⚠️ <b>'+esc(v)+'</b> is not a location we have seen in this plan. '+
      'We will record it exactly as scanned — check it is right.';
  };

  inp.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); e.stopPropagation(); apply(); }
  });
  inp.addEventListener('change', apply);
  inp.addEventListener('blur', apply);
  const cam = $('#'+id+'cam');
  if(cam) cam.onclick = () => startCam(id, apply);
  setTimeout(() => { try{ inp.focus(); }catch(e){} }, 30);
}

function palletChoices(bayN, exclude){

  const b = PAYLOAD.bays.find(x => x.n === bayN) || {};
  const seen = {}, out = [];
  (b.pallets || []).forEach(p => { if(p.pallet_id && p.pallet_id !== exclude && !seen[p.pallet_id]){
    seen[p.pallet_id] = 1; out.push({id:p.pallet_id, why:'came down from '+p.loc, spoil:!!p.spoil}); } });
  (b.putback || []).forEach(pb => { if(pb.pallet_id && pb.pallet_id !== exclude && !seen[pb.pallet_id]){
    seen[pb.pallet_id] = 1; out.push({id:pb.pallet_id, why:'goes to '+pb.loc}); } });

  Object.keys(S.new_pallets || {}).forEach(k => {
    const np = S.new_pallets[k] || {};
    if(np.bay_n != null && np.bay_n !== bayN) return;
    if(k !== exclude && !seen[k]){
      seen[k] = 1; out.push({id:k, why:'you built this one', built:true}); } });
  return out;
}

function laneOf(pid, bayN){
  const planned = plannedLocFor(pid);
  if(planned){ const m = String(planned).match(/^(.*)-\d+$/); if(m) return m[1]; }
  const b = PAYLOAD.bays.find(x => x.n === bayN);
  return b ? b.bay : '';
}
function lanePositions(pid, bayN){
  const lane = laneOf(pid, bayN);
  if(!lane) return [];
  const b = PAYLOAD.bays.find(x => x.bay === lane);
  const depth = b ? Math.max(Number(b.depth || 0), (b.putback || []).length,
                             Number(b.deepest || 0)) : 0;
  const out = [];
  for(let i = 1; i <= Math.max(depth, 1); i++) out.push(lane + '-' + i);
  return out;
}

                      + 'in one position. If ' + other + ' went somewhere else, record that '
                      + 'too — otherwise Finale ends up with both of them there.\n\n'
                      + 'Record it anyway?')) return false;
        }

        if(!v) return toast('⛔ where did it go? Scan the placard or pick a spot') && false;
        const rec = {state:'placed', loc:v, note:note, planned:planned,
                     ts:new Date().toISOString()};
        rec.deviated = (v !== planned) || !!note;
        S.putback_actual[pid] = rec;
        ev('putback_actual', {pallet:pid, loc:rec.loc || 'FLOOR', planned:planned, note:note});
        save(); render();
        if(note === 'split') setTimeout(()=>askSecondPallet(bayN, pid), 0);

        if(note === 'short') setTimeout(()=>askShort(bayN, pid), 0);
     }}],
    ()=>{
      wireScan('pascan', 'pa');
      const sel = $('#pan'), m = $('#panote');
      const upd = () => { m.textContent = sel.value === 'split'
        ? 'We will ask for the second pallet next — it needs its own card and its own position.'
        : sel.value === 'short'
        ? 'Say so at the end of the bay too, so nobody goes looking for it next week.' : ''; };
      sel.addEventListener('change', upd); upd();
    });
}

function sibShare(l2, s2){
  if(s2 && s2.state === 'missing')
    return Number(s2.baseline != null ? s2.baseline : l2.system_qty) || 0;
  if(s2 && s2.state === 'skipped')
    return Number(l2.planned_qty) || 0;
  if(s2 && s2.actual != null && s2.left != null)
    return (Number(s2.actual) || 0) + (Number(s2.left) || 0);
  return Number((s2 && s2.actual != null) ? s2.actual : l2.planned_qty) || 0;
}
function onPallet(b, p, sku, lot){
  const base = (() => {
    for(const l of (p.lines || []))
      if(l.kind !== 'count' && l.sku === sku && (l.lot||'') === (lot||''))
        return Number(l.system_qty || 0);
    return 0;
  })();
  for(let i = 0; i < (p.lines||[]).length; i++){
    const l = p.lines[i];
    if(l.kind !== 'count' || l.sku !== sku || (l.lot||'') !== (lot||'')) continue;
    const st_ = st(lid(b.n, p.loc, l, i));
    if(st_ && st_.counted != null) return Number(st_.counted);
  }
  return base;
}
function splitPicker(pid){
  let pal = null, bay = null;
  PAYLOAD.bays.forEach(b => (b.pallets||[]).forEach(p => {
    if(p.pallet_id === pid){ pal = p; bay = b; } }));
  if(!pal) return '<div class="sm dim">nothing recorded on that pallet</div>';

  const seen = {}, items = [];
  (pal.lines || []).forEach(l => {
    if(l.kind === 'count') return;
    const k = l.sku + '␟' + (l.lot || '');
    if(seen[k]) return; seen[k] = 1;
    items.push({sku:l.sku, lot:l.lot || '', max: onPallet(bay, pal, l.sku, l.lot),
                note: n(l.system_qty) + ' on it'});
  });
  arrivalsFor(pid).forEach(x => {
    if(!x.state || x.gone || x.tooLate) return;
    const q = Number(x.qty || 0);
    if(!(q > 0)) return;
    const k = x.sku + '␟' + (x.lot || '');
    if(seen[k]){
      const it = items.find(i => i.sku === x.sku && (i.lot || '') === (x.lot || ''));
      it.max += q; it.note += ' + ' + n(q) + ' arrived';
    } else {
      seen[k] = 1;
      items.push({sku:x.sku, lot:x.lot || '', max:q,
                  note: n(q) + ' arrived from ' + x.from});
    }
  });
  const rows = items.map((it, ix) => {

    const rid = 'sp' + ix;
    return '<div style="display:flex;gap:10px;align-items:center;padding:9px 2px;'+
      'border-bottom:1px solid var(--line);min-height:48px">'+
      '<input type="checkbox" class="splititem" id="'+rid+'" '+
        'style="width:24px;height:24px;flex:0 0 auto" '+
        'data-sku="'+esc(it.sku)+'" data-lot="'+esc(it.lot)+
        '" data-max="'+n(it.max)+'">'+

      '<label for="'+rid+'" class="grow" style="cursor:pointer;min-height:44px;display:flex;'+
        'flex-direction:column;justify-content:center"><b>'+esc(it.sku)+'</b>'+
        (it.lot ? ' <span class="dim sm">lot '+esc(it.lot)+'</span>'
                : ' <span class="dim sm">no lot</span>')+
        '<div class="sm dim">'+esc(it.note)+'</div></label>'+
      '<input class="splitqty" data-for="'+rid+'" inputmode="numeric" disabled '+
        'value="'+n(it.max)+'" style="width:78px;text-align:center;font-size:16px">'+
      '</div>';
  });
  return rows.length
    ? '<div style="max-height:250px;overflow-y:auto">'+rows.join('')+'</div>'+
      '<div class="sm dim" style="margin-top:6px">Tick what moved. If only part of it went, '+
      'change the number.</div>'
    : '<div class="sm dim">nothing left on it to move</div>';
}

function undoSplit(fromPid, newPid){
  if(!confirm('Undo the split onto ' + newPid + '?\n\nEverything goes back onto ' + fromPid +
              ' and ' + newPid + ' stops existing.')) return;
  delete (S.split_contents || {})[newPid];
  delete (S.new_pallets || {})[newPid];
  delete (S.putback_actual || {})[newPid];

  let folded = 0;
  Object.keys(S.lines || {}).forEach(id => {
    const ln = S.lines[id];
    if(!ln || !ln.placements || !ln.placements.length) return;
    if(!ln.placements.some(x => x.pallet === newPid)) return;
    const back = ln.placements.filter(x => x.pallet === newPid)
                              .reduce((a,x) => a + Number(x.qty||0), 0);
    const rest = ln.placements.filter(x => x.pallet !== newPid);
    if(rest.length) rest[0].qty = Number(rest[0].qty||0) + back;
    ln.placements = rest.length ? rest : undefined;
    folded += back;
  });

  const src = (S.putback_actual || {})[fromPid];
  if(src && src.note === 'split'){ src.note = ''; src.deviated = (src.loc !== src.planned); }
  ev('split_undone', {from:fromPid, to:newPid});
  save();
  const d = document.querySelector('dialog[open]'); if(d) d.close();
  render();
  toast('✓ split undone — everything is back on ' + fromPid +
        (folded ? ' (' + n(folded) + ' units folded back)' : ''));
}

function floorCard(m){
  const FL = floorLoc();
  if(!FL) return '';
  const hold = (m.floor_holding || []);
  const bad  = (m.floor_unbalanced || []);
  const orph = (m.floor_orphans || []);
  const open_ = orph.filter(o => !o.fixed);
  const done_ = orph.filter(o => o.fixed);
  const units = hold.reduce((a, x) => a + x.units, 0);
  let out = '';

  const waiting = open_.filter(o => o.cause === 'awaiting_bay' &&
                                    !PAYLOAD.bays.every(b => (S.bays[b.n]||{}).closed));
  const stuck   = open_.filter(o => waiting.indexOf(o) < 0);
  if(waiting.length){
    const u = waiting.reduce((a,o)=>a+Number(o.units||0),0);
    out += '<div class="okbox"><b>⏳ '+waiting.length+' item'+(waiting.length===1?'':'s')+
      ' ('+n(u)+' units) are on the floor waiting for a bay you have not worked yet.</b>'+
      '<div class="sm" style="margin-top:4px">Nothing to do — they go on when you get there. '+
      'They only need sorting out if the shift ends with that bay untouched.</div>'+
      '<div class="sm dim" style="margin-top:6px">'+
      waiting.map(o => esc(o.sku)+' ×'+n(o.units)+' → '+esc(o.pallet||'?')).join('<br>')+
      '</div></div>';
  }

  if(stuck.length){
    out += '<div class="badbox"><b>⛔ '+stuck.length+' item'+(stuck.length===1?'':'s')+
      ' ended up at '+esc(FL)+' with nowhere to go.</b>'+
      '<div class="sm" style="margin-top:6px">These are real units. Finale will show them at '+
      '<b>'+esc(FL)+'</b> so nothing is lost — but that is a holding spot, not where they '+
      'belong. <b>Tell us what actually happened to each one</b> and it gets recorded '+
      'properly; leave it and someone has to come looking tomorrow.</div>'+

      stuck.map((o) => { const i = orph.indexOf(o); return ''+
        '<div class="ln" style="margin-top:10px;padding-top:8px;border-top:1px solid var(--line)">'+
          '<div><b>'+esc(o.sku)+'</b> ×'+n(o.units)+(o.lot?' · lot '+esc(o.lot):'')+'</div>'+

          '<div class="sm dim">came off <b>'+esc(o.origin)+'</b>'+
            (o.pallet ? ' · card <b>'+esc(o.pallet)+'</b>' : '')+
            (o.bay ? ' · bay '+esc(o.bay) : '')+'</div>'+
          '<div class="sm" style="margin-top:2px">'+esc(o.why)+'</div>'+
          '<div class="row" style="margin-top:6px">'+
            '<button class="pri" onclick="fixOrphan('+i+',\'moved\')">It went here →</button>'+
            '<button class="warn" onclick="fixOrphan('+i+',\'lost\')">It is lost</button>'+
          '</div>'+
        '</div>'; }).join('')+
      '</div>';
  }
  if(done_.length){
    out += '<div class="okbox"><b>✓ '+done_.length+' orphan'+(done_.length===1?'':'s')+
      ' sorted out.</b><div class="sm" style="margin-top:4px">'+
      done_.map(o => esc(o.sku)+' ×'+n(o.units)+' — '+
        (o.fixed.action === 'moved'
          ? 'went to <b>'+esc(o.fixed.to)+'</b>'
          : 'written off as <b>'+esc(o.fixed.reason)+'</b>')).join('<br>')+
      '<br><span class="dim">Tap an item again on the pallet it came from if that was wrong.'+
      '</span></div></div>';
  }

  if(bad.length){
    const worst = bad.slice().sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff)).slice(0,5);
    out += '<div class="badbox"><b>⛔ The '+esc(FL)+' numbers do not add up — '+bad.length+
      ' item'+(bad.length===1?'':'s')+'.</b>'+
      '<div class="sm" style="margin-top:6px">This is a fault in OUR figures, not in your '+
      'work, and there is nothing to fix here. ⛔ <b>Do not import the Finale file until '+
      'someone has looked at it</b> — show them this screen.<br>'+
      worst.map(x => esc(x.key)+': recorded '+n(x.net)+', should be '+n(x.expected)+
                     ' ('+(x.diff>0?'+':'')+n(x.diff)+')').join('<br>')+
      (bad.length > worst.length ? '<br>… and '+(bad.length-worst.length)+' more' : '')+
      '</div></div>';
  }

  if(units > 0.001 || hold.length){
    out += '<div class="'+(bad.length || open_.length ? 'warnbox' : 'okbox')+'"><b>'+n(units)+
      ' unit'+(Math.abs(units)===1?'':'s')+' across '+hold.length+' item'+
      (hold.length===1?'':'s')+' are recorded as sitting at '+esc(FL)+'.</b>'+
      '<div class="sm" style="margin-top:4px">'+
      (open_.length
        ? 'That includes the '+open_.length+' above. The rest is stock on pallets that are '+
          'still down, which is correct — it goes back to a real position when the bay is '+
          'put back.'
        : 'That is correct while pallets are still down. Finale shows the stock there, so '+
          'nobody has to go hunting for it and the next plan can see it.')+
      ' <b>Still on the floor CSV</b> below lists every line.</div></div>';
  } else if(!bad.length && !open_.length){
    out += '<div class="okbox"><b>Nothing left at '+esc(FL)+' — everything that came down '+
      'went back up or out to the floor.</b></div>';
  }

  const tmp = (typeof tempAll === 'function') ? tempAll() : [];
  if(tempLoc() && tmp.length){
    const tu = tmp.reduce((x, r) => x + r.qty, 0);
    out += '<div class="warnbox"><b>'+n(tu)+' unit'+(Math.abs(tu)===1?'':'s')+' across '+
      tmp.length+' item'+(tmp.length===1?'':'s')+' are owed but not found — sitting at '+
      esc(tempLoc())+'.</b>'+

function placeHomeless(pid){
  let bn = null;
  PAYLOAD.bays.forEach(b => {
    if((b.pallets||[]).some(p => p.pallet_id === pid) ||
       (b.putback||[]).some(p => p.pallet_id === pid)) bn = b.n;
  });
  if(bn == null) bn = ((S.new_pallets||{})[pid]||{}).bay_n;
  if(bn == null) bn = (PAYLOAD.bays[0]||{}).n;
  askActual(bn, pid);
}
function unplacedPallets(){
  const out = [];
  const homeless = pid => { const a = actualFor(pid);
    return !a || !a.loc || a.state === 'floor'; };    
  Object.keys(S.new_pallets || {}).forEach(pid => {
    if(homeless(pid)) out.push({pid, built: true, bay: (S.new_pallets[pid] || {}).bay || '',
                                from: (S.new_pallets[pid] || {}).split_from || ''});
  });

  Object.keys(S.putback_actual || {}).forEach(pid => {
    if(!(S.new_pallets || {})[pid] && homeless(pid))
      out.push({pid, built: false, bay: bayOfPallet(pid), from: ''});
  });

  PAYLOAD.bays.forEach(b => {
    if(!bayWorked(b)) return;                     
    if((S.bays[b.n] || {}).putback_done) return;  
    (b.pallets || []).forEach(p => {

      if(!palletCameDown(b, p)) return;
      const pid = p.pallet_id;
      if(!pid || !homeless(pid)) return;
      if(out.some(o => o.pid === pid)) return;
      out.push({pid, built: false, bay: b.bay || ('bay ' + b.n), from: '', came_down: true});
    });
  });

  Object.keys(S.split_contents || {}).forEach(pid => {           
    if(homeless(pid) && !out.some(o => o.pid === pid))
      out.push({pid, built: true, bay: bayOfPallet(pid),
                from: (S.split_contents[pid] || {}).from || ''});
  });
  return out;
}
function bayOfPallet(pid){
  for(const b of PAYLOAD.bays)
    for(const pb of (b.putback || [])) if(pb.pallet_id === pid) return b.bay || ('bay ' + b.n);
  return '';
}

function palletFinalLoc(pid){
  if(!pid) return null;
  const a = actualFor(pid);
  if(a && a.loc) return a.loc;
  if(a && a.state === 'floor') return '';        
  for(const b of PAYLOAD.bays)
    for(const pb of (b.putback || []))
      if(pb.pallet_id === pid) return pb.loc;
  return null;
}

function actualFor(pid){ return (S.putback_actual || {})[pid] || null; }

function bayWorked(b){
  const bs = S.bays[b.n] || {};
  if(bs.putback_done || bs.closed) return true;
  if((b.pallets || []).some(p2 => (p2.lines || []).some((l2, i2) =>
        (st(lid(b.n, p2.loc, l2, i2)) || {}).state))) return true;
   
  if((b.pallets || []).some(p2 => p2.pallet_id && actualFor(p2.pallet_id))) return true;
  if((b.putback  || []).some(pb => pb.pallet_id && actualFor(pb.pallet_id))) return true;
  return false;
}

function posOf(loc){
  const m = /-(\d+)$/.exec(String(loc || ''));
  return m ? Number(m[1]) : 0;
}
function deepestOpened(b){
  let d = 0;
  (b.pallets || []).forEach(p => {
    const touched = !!(S.pallets || {})[p.loc]
      || (p.pallet_id && actualFor(p.pallet_id))
      || (p.lines || []).some((l, i) => (st(lid(b.n, p.loc, l, i)) || {}).state);
    if(touched) d = Math.max(d, posOf(p.loc));
  });
  return d;
}
function palletCameDown(b, p){
  const bs = S.bays[b.n] || {};
   
  if(bs.putback_done) return true;
  if(p.pallet_id && actualFor(p.pallet_id)) return true;    
  if((S.pallets || {})[p.loc]) return true;                 
  if((p.lines || []).some((l, i) => (st(lid(b.n, p.loc, l, i)) || {}).state)) return true;
  return posOf(p.loc) < deepestOpened(b);    
}

function plannedLocFor(pid){
  for(const b of PAYLOAD.bays)
    for(const pb of (b.putback || []))
      if(pb.pallet_id === pid) return pb.loc;
  return '';
}

function moves(){
  const out = {transfers:[], adjustments:[], counts:[], missing:[], skipped:[],

               fullness:[], lane_room:[],

               pallet_moves:[],
                
               backstock: S.backstock ? [Object.assign({plan_date:PAYLOAD.plan_date}, S.backstock)] : []};
  PAYLOAD.bays.forEach(b => {
    (b.pallets || []).forEach(p => {
      const ps_ = S.pallets[p.loc] || {};
      if(!ps_.fullness) return;
      const bk = bucketOf(ps_.fullness);
      const deck = Number(p.deck_m3 || 0), ours = Number(p.est_m3 || 0);
      out.fullness.push({bay:b.bay, from_location:p.loc, pallet_id:p.pallet_id||'',
        goes_back_to:p.goes_back_to||'', spoil:!!p.spoil,
        crew_bucket:ps_.fullness, crew_pct:bk?bk.pct:null,
         
        mode:ps_.fullness_mode||'blind', crew_why:ps_.fullness_why||'',

        crew_why_note:ps_.fullness_note||'',
        model_m3:ours, deck_m3:deck,
        model_pct: deck>0 ? Math.round(100*ours/deck) : null,
        no_volume_skus:(p.no_volume||[]).join(' '),

        sku_lots:(p.lines||[]).filter(l=>l.kind!=='count')
                   .map(l=>l.sku+'@'+(l.lot||'-')+'x'+n(l.system_qty)).join(' '),
        ts:ps_.fullness_ts});
    });
    const bst = S.bays[b.n] || {};
    if(bst.lane_room){
      out.lane_room.push({bay:b.bay, answer:bst.lane_room,
        pallets_put_back:bst.lane_back,
        deepest_dug:b.deepest, pallets_down:b.down,
        ts:bst.lane_room_ts});
    }
  });
   
  PAYLOAD.bays.forEach(b => {
    (b.putback || []).forEach(pb => {
      const a = actualFor(pb.pallet_id);
      out.pallet_moves.push({bay:b.bay, pallet_id:pb.pallet_id,
        planned_location:pb.loc,

        actual_location: a ? (a.state === 'floor' ? '' : a.loc) : '',
        state: a ? a.state : 'planned',
        confirmed: !!a, deviated: !!(a && a.deviated), note: a ? (a.note||'') : '',
        built_by_crew:false, ts: a ? a.ts : ''});
    });
  });

  (S.temp_out || []).forEach(r => {
    const q = Number(r.qty || 0);
    if(!(q > 0) || !r.to || !tempLoc()) return;
    let lid_ = '';
    (PAYLOAD.temp_stock || []).forEach(x => {
      if(x.sku === r.sku && (x.lot || '') === (r.lot || '')) lid_ = x.lot_id || ''; });
    out.transfers.push({bay:'', from_location:tempLoc(), to_location:r.to,
      from_pallet_loc:'', onto_pallet:'', sku:r.sku, lot:r.lot || '',
      lot_id_hint:lid_, quantity:q, kind:'from_temp', planned_qty:0,
      why:'found and taken back out of '+tempLoc(), ts:r.ts});
  });
  Object.keys(S.new_pallets || {}).forEach(pid => {
    const np = S.new_pallets[pid], a = actualFor(pid) || {};
    out.pallet_moves.push({bay:np.bay||'', pallet_id:pid, planned_location:'',
      actual_location: a.state === 'floor' ? '' : (a.loc||''),
      state: a.state || 'unplaced', confirmed: !!a.state, deviated:true,
      note: np.split_from ? ('split from '+np.split_from) : 'built on the floor',
      built_by_crew:true, ts: a.ts || np.built_ts || ''});
  });

  const FLOOR = floorLoc();
  const floorPallets = new Set();           

  const floorPalletIds = new Set();
   
  const floorHandoff = {};

  const floorStranded = {};

  const tempReturned = {};

  const floorOrphans = [];
  const strand = (o) => {
    out.unresolved = out.unresolved || [];

    const urow = {bay:o.bay, from:o.origin, sku:o.sku, lot:o.lot || '', qty:o.units,
                  onto_pallet:o.pallet || '', why:o.why};
    out.unresolved.push(urow);
    if(!FLOOR) return;                        
    const k = o.sku + ' ' + (o.lot || '');
    floorStranded[k] = (floorStranded[k] || 0) + o.units;
    floorOrphans.push({sku:o.sku, lot:o.lot || '', units:o.units, why:o.why, cause:o.cause,
                       origin:o.origin, pallet:o.pallet || '', bay:o.bay,

                       _urow: urow,

                       handedOff: !!o.handedOff,

                       fixKey:o.sku + '|' + (o.lot || '') + '|' + o.origin + '|' +
                              (o.pallet || '') + '|' + (o.cause || '')});
  };
  const downQty = {};                       
  if(FLOOR) PAYLOAD.bays.forEach(b => {
    const bs = S.bays[b.n] || {};
    if(!bayWorked(b)) return;               
    (b.pallets || []).forEach(p => {

      if(!palletCameDown(b, p)) return;
      floorPallets.add(p.loc);
      if(p.pallet_id) floorPalletIds.add(p.pallet_id);

      const seen = {};
      (p.lines || []).forEach(l => {
        if(l.kind === 'count') return;
        const k = l.sku + ' ' + (l.lot || '');
        if(k in seen) return;
        seen[k] = true;
        const q = Number(l.system_qty || 0);
        if(!(q > 0)) return;
        downQty[p.loc + '|' + k] = q;
        out.transfers.push({from_location: p.loc, to_location: FLOOR,
          onto_pallet: p.pallet_id || '', sku: l.sku, lot: l.lot || '', quantity: q,
          planned_qty: '', approved_qty: '', as_planned: true, planned_pallet: '',
          took_from_sibling: '', sibling_line: '', on_floor: true,

          kind: 'pallet_down', spoil: !!p.spoil, bay: b.bay,
          ts: new Date().toISOString()});
      });
    });
  });

  PAYLOAD.bays.forEach(b => {

    const push = (p, l, i, key, loc) => {
      const id = lid(b.n, key, l, i), s = S.lines[id];
      if(!s) return;

      const shareCeiling = () => {
        let sib = 0;
        if (p && p.lines) p.lines.forEach((l2, i2) => {
          if (i2 === i) return;
          if (l2.sku !== l.sku || (l2.lot || '') !== (l.lot || '')) return;
          if (l2.kind !== 'take' && l2.kind !== 'aside') return;
          const s2 = S.lines[lid(b.n, key, l2, i2)];

          sib += sibShare(l2, s2);
        });

        const held = (p && b) ? onPallet(b, p, l.sku, l.lot) : Number(l.system_qty || 0);
        return Math.max(0, held - sib);
      };
      if(s.state === 'missing'){

        const ceiling = shareCeiling();
        const claimed = (s.baseline != null) ? Number(s.baseline) : Number(l.system_qty || 0);
        const dec = Math.min(claimed, ceiling);

        const postedAdj = (dec > 0.001 && s.reason &&
                           (PAYLOAD.shrink_reasons||[]).indexOf(s.reason) >= 0);
        out.missing.push({posted_adjustment:postedAdj,
          bay:b.bay, from:loc, sku:l.sku, lot:l.lot||'',
          planned_qty:l.planned_qty, system_qty:l.system_qty,
          sibling_took:(s.sibling_took != null ? s.sibling_took : 0),
          suggested_decrease:dec, note:s.reason||'not found',

          onto_pallet:(l.kind === 'aside' ? (l.onto_pallet||'') : ''),
          onto_bay:(l.kind === 'aside' ? (l.onto_bay||'') : ''), ts:s.ts});

        if (postedAdj) {
          out.adjustments.push({
            location: (FLOOR && floorPallets.has(loc)) ? FLOOR : loc,
            origin: loc, posted_at: (FLOOR && floorPallets.has(loc)) ? 'restock floor' : 'origin',
            sku: l.sku, lot: l.lot || '', change: -dec, direction: 'decrease',
            baseline: (s.baseline != null ? s.baseline : l.system_qty),

            clamped_from: (claimed - dec > 0.001 ? -claimed : undefined),
            sibling_took: (s.sibling_took != null ? s.sibling_took : 0),
            reason: s.reason, system_qty: l.system_qty, moved: 0,
            left_on_pallet: 0, not_here: true, ts: s.ts});
        } else if (dec > 0.001) {
          out.unresolved = out.unresolved || [];
          out.unresolved.push({bay:b.bay, from:loc, sku:l.sku, lot:l.lot || '', qty:dec, onto_pallet:'',
            why:'marked "not here at all" with no Finale reason code' +
                (s.reason ? ' ("'+s.reason+'" is not one of the accounting codes)' : '') +
                ' — re-open the line and choose one, or Finale is never told'});
        }
        return; }

      if(s.state === 'skipped'){ out.skipped.push({bay:b.bay, location:loc, sku:l.sku,
        lot:l.lot||'', kind:l.kind, planned_qty:l.planned_qty,
        approved_qty:(s.approved!=null?s.approved:l.planned_qty),

        onto_pallet:(l.kind === 'aside' ? (l.onto_pallet||'') : ''),
        onto_bay:(l.kind === 'aside' ? (l.onto_bay||'') : ''),
        cross:!!l.cross,
        reason:s.reason||'', reason_source:s.reason_source||'', ts:s.ts}); return; }

      if(l.kind === 'count'){
        if(s.counted != null){

          out.counts.push({serial:l.serial, location:loc, sku:l.sku, lot:l.lot,
            final_location:(palletFinalLoc(p.pallet_id) || ''),
            onto_pallet:(p.pallet_id || ''),
            system_qty:l.system_qty, counted:s.counted, variance:s.variance, ts:s.ts});

          const cv = Number(s.variance || 0);
          if(Math.abs(cv) > 0.001){
            const camedown = (downQty[loc + '|' + l.sku + ' ' + (l.lot || '')] || 0) > 0;
            const at = (FLOOR && camedown) ? FLOOR : loc;
            const list = cv < 0 ? (PAYLOAD.shrink_reasons || []) : (PAYLOAD.found_reasons || []);
            if(s.count_reason && list.indexOf(s.count_reason) >= 0){
              out.adjustments.push({location: at, origin: loc,
                posted_at: at === FLOOR ? 'restock floor' : 'origin',
                sku: l.sku, lot: l.lot || '', change: cv,
                direction: cv < 0 ? 'decrease' : 'increase',
                baseline: l.system_qty, sibling_took: 0, reason: s.count_reason,
                system_qty: l.system_qty, moved: '', left_on_pallet: s.counted,

                from_count: true, serial: l.serial, counted: s.counted, ts: s.ts});
            } else {
              out.unresolved = out.unresolved || [];
              out.unresolved.push({bay:b.bay, from:loc, sku:l.sku, lot:l.lot || '', qty:cv, onto_pallet:'',
                why:'counted ' + n(s.counted) + ' against Finale\'s ' + n(l.system_qty) +
                    ' with no accounting reason' +
                    (s.count_reason ? ' ("'+s.count_reason+'" is not one of the codes)' : '') +
                    ' — re-open the count and choose one, or the variance is never posted'});
            }
          }
        }
        return;
      }
      const act = s.actual != null ? s.actual : null;
      if(act != null && act > 0){

        const parts = (s.placements && s.placements.length)
          ? s.placements
          : [{pallet: (l.kind === 'aside' ? (l.onto_pallet||'') : ''), qty: act, deviated:false}];
        parts.forEach(pt => {
          if(!(pt.qty > 0)) return;

          const rawDest = pt.location ? pt.location
                        : (l.kind === 'take') ? (l.dest || '')
                                              : (palletFinalLoc(pt.pallet) || '');

          const pdest = (rawDest && rawDest !== tempLoc() && !/^F[123]/.test(rawDest)
                         && (l.kind === 'take' || pt.location)) ? '' : rawDest;

          const fromFloor = (key !== 'ORPHAN') && floorPallets.has(loc);
          const src = fromFloor ? FLOOR : loc;

          const pdest_forced = !!(l.kind === 'aside' && pt.pallet && actualFor(pt.pallet));
          if(!pdest){

            if(l.kind === 'take'){

              floorHandoff[loc + '|' + l.sku + ' ' + (l.lot || '')] =
                (floorHandoff[loc + '|' + l.sku + ' ' + (l.lot || '')] || 0) + pt.qty;
              strand({bay:b.bay, origin:loc, sku:l.sku, lot:l.lot||'', units:pt.qty,
                pallet:'', cause:'no_f1_home', handedOff:true,
                why: rawDest
                  ? 'the plan sends this to "' + rawDest + '", which is not a real F1 spot — '+
                    'this SKU has no home on the floor. Scan where you actually put it.'
                  : 'the plan names no destination for this pick — scan where you put it'});
              return;
            }
            const pa = actualFor(pt.pallet);
            strand({bay:b.bay, origin:loc, sku:l.sku, lot:l.lot||'', units:pt.qty,
              pallet:pt.pallet||'', handedOff:true,
              cause: pt.floor ? 'loose' : (pa && pa.state === 'floor') ? 'pallet_down'
                                                                      : 'no_position',
              why: pt.floor
                     ? 'the crew put this part nowhere — it is loose on the floor'
                   : (pa && pa.state === 'floor')
                     ? 'it was carried onto pallet '+(pt.pallet||'?')+', which never went '+
                       'back up — so it is standing on the floor on that pallet'
                     : 'it was carried onto pallet '+(pt.pallet||'?')+', and nobody recorded '+
                       'where that pallet ended up'});

            if(fromFloor){

              floorHandoff[loc + '|' + l.sku + ' ' + (l.lot || '')] =
                (floorHandoff[loc + '|' + l.sku + ' ' + (l.lot || '')] || 0) + pt.qty;
              return;
            }
          }

          if(l.kind === 'aside' && fromFloor && pt.pallet &&
             !floorPalletIds.has(pt.pallet) && !pdest_forced){
            strand({bay:b.bay, origin:loc, sku:l.sku, lot:l.lot||'', units:pt.qty,
              pallet:pt.pallet, cause:'awaiting_bay', handedOff:true,
              why:'set aside for pallet ' + pt.pallet +
                  (l.onto_bay ? ' in bay ' + l.onto_bay : '') + ', which has not been ' +
                  'worked yet — the stock is on the restock floor waiting for it'});
            floorHandoff[loc + '|' + l.sku + ' ' + (l.lot || '')] =
              (floorHandoff[loc + '|' + l.sku + ' ' + (l.lot || '')] || 0) + pt.qty;
            return;
          }

          if(l.kind === 'aside' && fromFloor && pt.pallet &&
             arrivedTooLate(pt.pallet, s.done_ts || s.ts)){
            strand({bay:b.bay, origin:loc, sku:l.sku, lot:l.lot||'', units:pt.qty,
              pallet:pt.pallet, cause:'receiver_already_up', handedOff:true,
              why:'set aside for pallet ' + pt.pallet + ', but that pallet had already gone '+
                  'back up before this was recorded — the stock is on the restock floor'});
            floorHandoff[loc + '|' + l.sku + ' ' + (l.lot || '')] =
              (floorHandoff[loc + '|' + l.sku + ' ' + (l.lot || '')] || 0) + pt.qty;
            return;
          }
          if(l.kind === 'aside' && fromFloor && pt.pallet &&
             floorPalletIds.has(pt.pallet)){

            floorHandoff[loc + '|' + l.sku + ' ' + (l.lot || '')] =
              (floorHandoff[loc + '|' + l.sku + ' ' + (l.lot || '')] || 0) + pt.qty;
            return;
          }
          out.transfers.push({from_location: src,
            to_location: pdest,
            on_floor_src: fromFloor,

            from_pallet_loc: loc,
            onto_pallet: l.kind === 'aside' ? (pt.pallet||'') : '',
            sku:l.sku, lot:l.lot||'', quantity:pt.qty,
            planned_qty:l.planned_qty, approved_qty:(s.approved!=null?s.approved:l.planned_qty),

            as_planned: !pt.deviated,
            planned_pallet: l.kind === 'aside' ? (l.onto_pallet||'') : '',
             
            took_from_sibling: s.took_from_sibling || '',
            sibling_line: s.sibling_line || '',
            kind:l.kind, bay:b.bay, ts:s.ts});
        });
      }

      const backRaw = Number(s.from_temp || 0);
      if(backRaw > 0.001 && tempLoc()){
        const backTo = adjLoc(p, l, !(S.bays[b.n]||{}).putback_done,
                              FLOOR && floorPallets.has(loc)) || loc;
         
        const backLot = (s.from_temp_lot != null) ? s.from_temp_lot : (l.lot || '');
        out.transfers.push({bay:b.bay, from_location:tempLoc(), to_location:backTo,
          from_pallet_loc:'', onto_pallet:(p&&p.pallet_id)||'', sku:l.sku, lot:backLot,
          quantity:backRaw, kind:'from_temp', planned_qty:l.planned_qty,
          matched_line_lot:(backLot === (l.lot||'') ? undefined : (l.lot||'')),
          why:'turned up here — taken back out of '+tempLoc(), ts:s.ts});

        if(FLOOR && backTo === FLOOR){

          const tk = loc + '|' + l.sku + ' ' + (backLot || '');
          tempReturned[tk] = (tempReturned[tk] || 0) + backRaw;
        }
      }
      const parkRaw = Number(s.to_temp || 0);
      const park = parkRaw > 0 ? Math.min(parkRaw, shareCeiling()) : 0;
      if(park > 0.001 && FLOOR && tempLoc()){
        out.transfers.push({bay:b.bay, from_location:FLOOR, to_location:tempLoc(),
          from_pallet_loc:loc, onto_pallet:'', sku:l.sku, lot:l.lot||'',
          quantity:park, kind:'to_temp', planned_qty:l.planned_qty,
          why:'owed but not found on '+(p&&p.pallet_id||loc)+' — parked until it turns up',
          clamped_from:(Math.abs(parkRaw - park) > 0.001 ? parkRaw : undefined),
          ts:s.ts});
      }

      const rawAdj = Number(s.adjustment || 0);
      const adjOut = rawAdj < 0 ? -Math.min(-rawAdj, shareCeiling()) : rawAdj;
      if(adjOut && Math.abs(adjOut) > 0.001){

        const shrinkAt = (FLOOR && floorPallets.has(loc)) ? FLOOR : loc;
        out.adjustments.push({location: (adjOut > 0

                                         ? (adjLoc(p, l, !(S.bays[b.n]||{}).putback_done,
                                                    FLOOR && floorPallets.has(loc)) || loc)
                                         : shrinkAt),

          origin: loc,

          posted_at: ((adjOut > 0
                         ? (adjLoc(p, l, !(S.bays[b.n]||{}).putback_done,
                                   FLOOR && floorPallets.has(loc)) || loc)
                         : shrinkAt) === FLOOR
                      ? 'restock floor'
                      : (adjOut > 0 ? 'final position' : 'origin')),
          sku:l.sku, lot:l.lot||'',
          change:adjOut, direction:adjOut<0?'decrease':'increase',

          clamped_from:(Math.abs(rawAdj - adjOut) > 0.001 ? rawAdj : undefined),
          baseline:(s.baseline != null ? s.baseline : l.system_qty),
          sibling_took:(s.sibling_took != null ? s.sibling_took : 0),
          reason:s.reason||'', system_qty:l.system_qty,
          moved:(s.actual!=null?s.actual:0), left_on_pallet:(s.left!=null?s.left:''), ts:s.ts});
      }
    };
    b.pallets.forEach(p => p.lines.forEach((l,i) => push(p, l, i, p.loc, p.loc)));

    (b.orphan_pulls||[]).forEach((o,i) =>
      push(null, o, i, 'ORPHAN', o.from_location || 'ORPHAN'));
  });

  PAYLOAD.bays.forEach(b => {

    const bs = S.bays[b.n] || {};
    if(!bayWorked(b)) return;               
    const onFloor = !bs.putback_done;       
    (b.pallets || []).forEach(p => {

      if(!palletCameDown(b, p)) return;
      const origin = p.loc;
      const a = actualFor(p.pallet_id);
      const final = palletFinalLoc(p.pallet_id);

      const recordedHome = !!(a && a.loc && a.state !== 'floor');
      const key = (sk, lt) => sk + ' ' + (lt || '');

      const gone = {};
      out.transfers.forEach(t => {

        if (t.kind === 'pallet_down') return;

        const from = t.from_location;
        const mine = (from === origin) ||
                     (FLOOR && from === FLOOR && t.onto_pallet === p.pallet_id) ||
                     (FLOOR && from === FLOOR && t.from_pallet_loc === origin);
        if (mine)
          gone[key(t.sku, t.lot)] = (gone[key(t.sku, t.lot)] || 0) + Number(t.quantity || 0);
      });

      Object.keys(floorHandoff).forEach(kk => {
        const [oloc, sk] = kk.split('|');
        if (oloc === origin) gone[sk] = (gone[sk] || 0) + floorHandoff[kk];
      });

      Object.keys(tempReturned).forEach(kk => {
        const i = kk.indexOf('|');
        if (kk.slice(0, i) !== origin) return;
        const sk = kk.slice(i + 1);
        gone[sk] = (gone[sk] || 0) - tempReturned[kk];
      });
      (out.missing || []).forEach(m => {

        if (m.from === origin && !m.posted_adjustment)
          gone[key(m.sku, m.lot)] = (gone[key(m.sku, m.lot)] || 0) + Number(m.suggested_decrease || 0);
      });

      (out.adjustments || []).forEach(a => {
        if (!FLOOR || a.location !== FLOOR) return;
        if (a.origin !== origin) return;
        const ch = Number(a.change || 0);
        if (ch < 0) gone[key(a.sku, a.lot)] = (gone[key(a.sku, a.lot)] || 0) + (-ch);

        else if (a.from_count || a.posted_at === 'restock floor' ||
                 (FLOOR && a.location === FLOOR))
          gone[key(a.sku, a.lot)] = (gone[key(a.sku, a.lot)] || 0) + (-ch);
      });

      const onIt = {};
      (p.lines || []).forEach(l => {
        if (l.kind === 'count') return;
        const k = key(l.sku, l.lot);
        if (!(k in onIt)) onIt[k] = {sku: l.sku, lot: l.lot || '', qty: Number(l.system_qty || 0)};
      });

      if (FLOOR && p.pallet_id) {
        arrivalsFor(p.pallet_id).forEach(x => {
          if (x.gone) return;                        

          if (!x.state) return;                      

          if (x.tooLate) return;
          const q = Number(x.qty || 0);
          if (!(q > 0)) return;
          const k = key(x.sku, x.lot);
          if (onIt[k]) onIt[k].qty += q;             
          else onIt[k] = {sku: x.sku, lot: x.lot || '', qty: q, arrived: true};
        });
      }

      const splitTo = {};
      Object.keys(S.split_contents || {}).forEach(newPid => {
        const rec = S.split_contents[newPid];
        if (!rec || rec.from !== p.pallet_id) return;

        (rec.items || []).forEach(x => {
          const kk = key(x.sku, x.lot);
          (splitTo[kk] = splitTo[kk] || []).push(
            {pid: newPid, qty: (x.qty == null ? Infinity : Number(x.qty))});
        });
      });

      const stillDown = {};
      const _ld = (S.left_down || {})[p.pallet_id];
      ((_ld && _ld.items) || []).forEach(x => {
        const kk = key(x.sku, x.lot);
        stillDown[kk] = (stillDown[kk] || 0) + Number(x.qty || 0);
      });

      Object.keys(onIt).forEach(k => {
        const it = onIt[k];
        let left = Math.round((it.qty - (gone[k] || 0)) * 1000) / 1000;
        if (left <= 0.001) return;
        const downQ = Math.min(left, stillDown[k] || 0);
        if (downQ > 0.001) {
          strand({bay: b.bay, origin: origin, sku: it.sku, lot: it.lot || '', units: downQ,
                  pallet: p.pallet_id, cause: 'did_not_fit', handedOff: false,
                  why: 'you said this would not fit back on ' + (p.pallet_id || 'the pallet') +
                       ' (' + origin + ') and is still on the restock floor — say where it ' +
                       'ended up, or it stays recorded at F1-Restock'});
          left = Math.round((left - downQ) * 1000) / 1000;
          if (left <= 0.001) return;
        }

        const sp = splitTo[k];
        if (sp && sp.length) {

          let pool = left;
          sp.forEach(part => {
            const toOther = Math.min(pool, part.qty);
            if (!(toOther > 0.001)) return;
            pool = Math.round((pool - toOther) * 1000) / 1000;
            const otherPid = part.pid;
            const oa = actualFor(otherPid), ofin = palletFinalLoc(otherPid);
            if (oa && oa.state === 'floor') {
              strand({bay:b.bay, origin:origin, sku:it.sku, lot:it.lot||'', units:toOther,
                pallet:otherPid, cause:'pallet_down',
                why:'it went onto ' + otherPid + ' when this pallet was split, and ' +
                    otherPid + ' never went back up'});
            } else if (!ofin) {
              strand({bay:b.bay, origin:origin, sku:it.sku, lot:it.lot||'', units:toOther,
                pallet:otherPid, cause:'no_position',
                why:'it went onto ' + otherPid + ' when this pallet was split, and nobody '+
                    'recorded where ' + otherPid + ' ended up'});
            } else if (ofin === ((FLOOR && floorPallets.has(origin)) ? FLOOR : origin)) {

            } else {
              out.transfers.push({
                from_location: (FLOOR && floorPallets.has(origin)) ? FLOOR : origin,
                on_floor_src: floorPallets.has(origin),
                from_pallet_loc: origin,
                to_location: ofin,
                onto_pallet: otherPid, sku: it.sku, lot: it.lot, quantity: toOther,
                planned_qty: '', approved_qty: '', as_planned: false,
                planned_pallet: p.pallet_id || '', took_from_sibling: '', sibling_line: '',
                kind: 'pallet_move', split_from: p.pallet_id || '', spoil: !!p.spoil,
                bay: b.bay, ts: (oa && oa.ts) || new Date().toISOString()});
            }
          });

          const rest = Math.round(pool * 1000) / 1000;
          const restDest = (onFloor && !recordedHome) ? (floorLoc() || final) : final;
          if (rest > 0.001 && (!onFloor || recordedHome)) {
            if (!restDest) {
              strand({bay:b.bay, origin:origin, sku:it.sku, lot:it.lot||'', units:rest,
                pallet:p.pallet_id || '', cause:'no_position',
                why:'the part left on ' + (p.pallet_id||'this pallet') + ' after the split '+
                    'has nowhere recorded to go'});
            } else if (restDest === ((FLOOR && floorPallets.has(origin)) ? FLOOR : origin)) {
               
            } else {
              out.transfers.push({
                from_location: (FLOOR && floorPallets.has(origin)) ? FLOOR : origin,
                on_floor_src: floorPallets.has(origin),
                from_pallet_loc: origin,
                to_location: restDest,
                onto_pallet: p.pallet_id || '', sku: it.sku, lot: it.lot, quantity: rest,
                planned_qty: '', approved_qty: '', as_planned: !(a && a.deviated),
                planned_pallet: '', took_from_sibling: '', sibling_line: '',
                kind: 'pallet_move', spoil: !!p.spoil, bay: b.bay,
                ts: (a && a.ts) || new Date().toISOString()});
            }
          }
          return;
        }

        if (a && a.state === 'floor') {
          strand({bay:b.bay, origin:origin, sku:it.sku, lot:it.lot||'', units:left,
            pallet:p.pallet_id || '', cause:'pallet_down',
            why:'pallet ' + (p.pallet_id||'?') + ' never went back up — this stock is '+
                'standing on it, wherever the crew set it down'});
          return;
        }

        const dest = (onFloor && !recordedHome) ? (floorLoc() || final) : final;
        if (!dest) {
          strand({bay:b.bay, origin:origin, sku:it.sku, lot:it.lot||'', units:left,
            pallet:p.pallet_id || '', cause:'no_position',
            why:'nobody recorded where pallet ' + (p.pallet_id||'?') + ' ended up, so this '+
                'stock has no home'});
          return;
        }

        if (!floorPallets.has(origin) && final === origin) return;

        const src = (FLOOR && floorPallets.has(origin)) ? FLOOR : origin;

        if (dest === src) return;
        if (onFloor && !recordedHome) return;    
        out.transfers.push({from_location: src,

          from_pallet_loc: origin,
          to_location: dest,
          on_floor: onFloor,         
          onto_pallet: p.pallet_id || '',
          sku: it.sku, lot: it.lot, quantity: left,
          planned_qty: '', approved_qty: '',
          as_planned: !(a && a.deviated),
          planned_pallet: '', took_from_sibling: '', sibling_line: '',

          kind: 'pallet_move', spoil: !!p.spoil, bay: b.bay,
          ts: (a && a.ts) || new Date().toISOString()});
      });
    });
  });

  const down = [], rest = [];
  out.transfers.forEach(t => (t.kind === 'pallet_down' ? down : rest).push(t));
  out.transfers = down.concat(rest);

  (PAYLOAD.shifted_pallets || []).forEach(sp => {
    const bay = PAYLOAD.bays.find(b => (b.bay || '') === sp.lane);
    if(!bay) return;
    if(!((S.bays[bay.n] || {}).putback_done)) return;    

    const deviated = (bay.putback || []).some(pb => {
      const a2 = actualFor(pb.pallet_id);
      return a2 && a2.loc && a2.loc !== pb.loc;
    }) || Object.keys(S.new_pallets || {}).some(q =>
            ((S.new_pallets[q] || {}).bay_n === bay.n));
    if(deviated) return;
    const from = sp.lane + '-' + sp.from_position;
    const to   = sp.lane + '-' + sp.to_position;
    if(from === to) return;
    const q = Number(sp.units || 0);
    if(!(q > 0)) return;
    out.transfers.push({from_location: from, to_location: to,
      from_pallet_loc: from, onto_pallet: '',
      sku: sp.sku, lot: sp.lot || '', quantity: q,
      planned_qty: '', approved_qty: '', as_planned: true, planned_pallet: '',
      took_from_sibling: '', sibling_line: '',

      kind: 'lane_shift', untouched: true, bay: sp.lane,
      ts: new Date().toISOString()});
  });

  if(FLOOR && floorOrphans.length){
    const fixes = S.floor_fix || {};

    const retireHandoff = (o, k) => {
      if(!o.handedOff) return;
      const hk = o.origin + '|' + k;
      if(!(hk in floorHandoff)) return;
      floorHandoff[hk] = Math.max(0, (floorHandoff[hk] || 0) - o.units);
    };
    floorOrphans.forEach(o => {
      const f = fixes[o.fixKey];
      if(!f) return;
      const k = o.sku + ' ' + (o.lot || '');

      if(f.action === 'moved' && f.to === FLOOR){
        return;
      }
      if(f.action === 'moved' && f.to){
        o.fixed = {action:'moved', to:f.to};
        out.transfers.push({from_location: FLOOR, to_location: f.to,
          from_pallet_loc: o.origin, onto_pallet: o.pallet || '',
          sku:o.sku, lot:o.lot || '', quantity:o.units,
          planned_qty:'', approved_qty:'', as_planned:false, planned_pallet:'',
          took_from_sibling:'', sibling_line:'', on_floor_src:true,

          kind:'orphan_placed', bay:o.bay, note:f.note || '',
          ts:f.ts || new Date().toISOString()});
        floorStranded[k] = (floorStranded[k] || 0) - o.units;
        retireHandoff(o, k);
      } else if(f.action === 'lost' && f.reason){
        o.fixed = {action:'lost', reason:f.reason};
         
        out.adjustments.push({location: FLOOR, origin: o.origin, posted_at:'restock floor',
          sku:o.sku, lot:o.lot || '', change: -o.units, direction:'decrease',
          baseline:o.units, sibling_took:0, reason:f.reason, system_qty:'',
          moved:'', left_on_pallet:'', orphan:true, note:f.note || '',
          ts:f.ts || new Date().toISOString()});
        floorStranded[k] = (floorStranded[k] || 0) - o.units;
        retireHandoff(o, k);
      }
    });

    const retracted = floorOrphans.filter(o => o.fixed && o._urow);
    if(retracted.length){
      const drop = new Set(retracted.map(o => o._urow));
      out.unresolved = (out.unresolved || []).filter(r => !drop.has(r));
    }
    floorOrphans.forEach(o => { delete o._urow; });
  }
  out.floor_orphans = floorOrphans;

  if(FLOOR){
    const net = {}, expected = {};
    const bump = (o, k, v) => { o[k] = (o[k] || 0) + v; };
    out.transfers.forEach(t => {
      const k = t.sku + ' ' + (t.lot || '');
      if(t.to_location === FLOOR) bump(net, k, Number(t.quantity || 0));
      if(t.from_location === FLOOR) bump(net, k, -Number(t.quantity || 0));
    });
    (out.adjustments || []).forEach(a => {
      if(a.location === FLOOR) bump(net, a.sku + ' ' + (a.lot || ''), Number(a.change || 0));
    });

    const residualCovered = new Set();

    PAYLOAD.bays.forEach(b => {
      (b.pallets || []).forEach(p => {
        if(!floorPallets.has(p.loc)) return;        
        residualCovered.add(p.loc);

        const arr = p.pallet_id
          ? arrivalsFor(p.pallet_id).filter(x => !x.gone && x.state && !x.tooLate) : [];
        const keySet = new Map();
        (p.lines || []).forEach(l => {
          if(l.kind === 'count') return;
          const k = l.sku + ' ' + (l.lot || '');
          if(!keySet.has(k)) keySet.set(k, Number(l.system_qty || 0));
        });
        arr.forEach(x => {
          const k = x.sku + ' ' + (x.lot || '');
          if(!keySet.has(k)) keySet.set(k, 0);      
        });
        keySet.forEach((base, k) => {
          let q = base;
          out.transfers.forEach(t => {
            if(t.kind === 'pallet_down') return;
            if((t.sku + ' ' + (t.lot || '')) !== k) return;
            if(t.from_pallet_loc === p.loc || t.from_location === p.loc)
              q -= Number(t.quantity || 0);
          });
          q -= (floorHandoff[p.loc + '|' + k] || 0);    

          q += (tempReturned[p.loc + '|' + k] || 0);
          arr.forEach(x => {
            if((x.sku + ' ' + (x.lot || '')) === k) q += Number(x.qty || 0);
          });
          (out.adjustments || []).forEach(a => {
            if((a.sku + ' ' + (a.lot || '')) === k && a.location === FLOOR &&
               a.origin === p.loc) q += Number(a.change || 0);
          });
          if(Math.abs(q) > 0.001) bump(expected, k, q);
        });
      });
    });

    floorOrphans.forEach(o => {
      if(o.fixed) return;                           

      if(!o.handedOff && residualCovered.has(o.origin)) return;
      bump(expected, o.sku + ' ' + (o.lot || ''), o.units);
    });
    const keys = new Set(Object.keys(net).concat(Object.keys(expected)));

  out.clamped = [];
  (out.adjustments || []).forEach(a => {
    if(a.clamped_from === undefined || a.clamped_from === null) return;
    out.clamped.push({sku:a.sku, lot:a.lot || '', origin:a.origin || '',
                      asked:Number(a.clamped_from), wrote:Number(a.change),
                      kind:'write-off'});
  });
  (out.transfers || []).forEach(t => {
    if(t.clamped_from === undefined || t.clamped_from === null) return;
    out.clamped.push({sku:t.sku, lot:t.lot || '', origin:t.from_pallet_loc || t.from_location || '',
                      asked:Number(t.clamped_from), wrote:Number(t.quantity),
                      kind:'parked in temp'});
  });

    out.floor_holding = Object.keys(net)
      .filter(k => Math.abs(net[k]) > 0.001)
      .map(k => ({key: k, units: Math.round(net[k] * 1000) / 1000}));
    out.floor_unbalanced = [...keys]
      .map(k => ({key: k, net: net[k] || 0, expected: expected[k] || 0,
                  diff: Math.round(((net[k] || 0) - (expected[k] || 0)) * 1000) / 1000}))

      .concat([...keys]
        .filter(k => (net[k] || 0) < -0.001)
        .map(k => ({key: k, net: net[k] || 0, expected: expected[k] || 0,
                    diff: Math.round((net[k] || 0) * 1000) / 1000,
                    negative_floor: true})))
      .filter(x => x.negative_floor || Math.abs(x.diff) > 0.001)
       
      .filter((x, i, all) => all.findIndex(y => y.key === x.key && !!y.negative_floor === !!x.negative_floor) === i)
      .sort((a, b) => (b.negative_floor ? 1 : 0) - (a.negative_floor ? 1 : 0));
  }

  const LOTIDS = PAYLOAD.lot_ids || {};

  (PAYLOAD.temp_stock || []).forEach(r => {
    const k = r.sku + '|' + (r.lot || '');
    if(!LOTIDS[k] && r.lot_id) LOTIDS[k] = r.lot_id;
  });
  ['transfers', 'adjustments', 'counts', 'pallet_moves', 'unresolved', 'fullness']
    .forEach(bucket => {
      (out[bucket] || []).forEach(r => {
        if(!r || !r.sku) return;
        const raw = LOTIDS[r.sku + '|' + (r.lot || '')];
        r.lot_id = (r.lot ? (raw || '') : '');
      });
    });
  return out;
}
function csv(rows){
  if(!rows.length) return '';

  const k = [];
  rows.forEach(r => Object.keys(r).forEach(x => { if(!k.includes(x)) k.push(x); }));
  const q = v => { v = v==null?'':String(v);
    return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  return k.join(',')+'\n'+rows.map(r=>k.map(x=>q(r[x])).join(',')).join('\n')+'\n';
}
function dl(which){
  const m = moves();
  let rows = which==='events' ? S.events : m[which];

  if(which === 'floor_holding'){
    rows = (m.floor_holding || []).map(x => {
      const i = x.key.lastIndexOf(' ');
      return {location: floorLoc(), sku: i > 0 ? x.key.slice(0, i) : x.key,
              lot: i > 0 ? x.key.slice(i + 1) : '', units: x.units};
    });
  }
  if(which==='events'){
    rows = S.events.map(e=>({ts:e.ts, kind:e.kind, bay:e.bay||'', pallet:e.pallet||'',
      line:e.line||'', actual:e.actual==null?'':e.actual, counted:e.counted==null?'':e.counted}));
  }
  if(!rows || !rows.length) return toast('Nothing to export in ' + which + '.');
  const blob = new Blob([csv(rows)], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'freezer_' + which + '_' + (PAYLOAD.plan_date||'') + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  ev('export', {what:which, rows:rows.length});
}

function deviceId(){
