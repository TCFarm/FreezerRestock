<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-status-bar-style" content="black">

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0b62c4">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%230b62c4'/%3E%3Ctext x='90' y='122' font-size='96' font-family='system-ui,sans-serif' font-weight='700' fill='white' text-anchor='middle'%3E%E2%9D%84%3C/text%3E%3C/svg%3E">
<style>

:root{
  --bg:#f4f6f8; --card:#ffffff; --line:#d5dde3; --ink:#101a1f; --dim:#5d707a;
  --take:#0b62c4; --aside:#8a5406; --count:#6b3fa0; --stay:#6d828c; --ok:#1c6b45; --bad:#a32d24;
  --onaccent:#ffffff;
  --tap:62px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1117; --card:#161b22; --line:#30363d; --ink:#e6edf3; --dim:#9198a1;
  --take:#2f81f7; --aside:#d29922; --count:#a371f7; --stay:#6e7681; --ok:#3fb950; --bad:#f85149;
  --onaccent:#04240f;
}}
:root[data-theme="dark"]{
  --bg:#0d1117; --card:#161b22; --line:#30363d; --ink:#e6edf3; --dim:#9198a1;
  --take:#2f81f7; --aside:#d29922; --count:#a371f7; --stay:#6e7681; --ok:#3fb950; --bad:#f85149;
  --onaccent:#04240f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
body{padding-bottom:96px}
.wrap{max-width:900px;margin:0 auto;padding:12px}
h1,h2,h3{margin:0 0 8px}
h1{font-size:20px}
button{font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);
  border-radius:12px;min-height:var(--tap);padding:12px 16px;cursor:pointer}
button:active{transform:scale(.985)}
button.big{width:100%;font-size:18px;font-weight:650}
button.pri{background:var(--take);border-color:var(--take);color:#fff}
button.ok{background:var(--ok);border-color:var(--ok);color:var(--onaccent)}
button.warn{background:var(--aside);border-color:var(--aside);color:#fff}
button.ghost{background:transparent}
button[disabled]{opacity:.4}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:8px 12px;display:flex;gap:8px;align-items:center}
.bar .grow{flex:1;min-width:0}
.bar b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar small{color:var(--dim);font-size:12px}

.bar button{min-height:48px;min-width:48px;padding:8px 10px;font-size:16px;border-radius:10px;
  margin-left:2px}
.prog{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--ok);width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;
  overflow:hidden}
.ph{display:flex;gap:10px;align-items:center;padding:14px;min-height:var(--tap);cursor:pointer}
.ph .grow{flex:1;min-width:0}
.ph b{font-size:17px}
.ph small{display:block;color:var(--dim);font-size:13px}
.body{border-top:1px solid var(--line);max-height:60vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch}
.grp{padding:6px 12px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--dim);background:var(--bg);border-top:1px solid var(--line);position:sticky;top:0}
.ln{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);
  min-height:var(--tap)}
.ln .grow{flex:1;min-width:0}
.ln .sku{font-weight:650;font-size:16px}
.ln .sub{color:var(--dim);font-size:12.5px;white-space:normal;overflow-wrap:anywhere}

.qty{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;min-width:58px;text-align:right}
.tag{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;white-space:nowrap}
.t-take{background:color-mix(in srgb,var(--take) 18%,transparent);color:var(--take)}
.t-aside{background:color-mix(in srgb,var(--aside) 18%,transparent);color:var(--aside)}
.t-count{background:color-mix(in srgb,var(--count) 18%,transparent);color:var(--count)}
.t-stay{background:color-mix(in srgb,var(--stay) 15%,transparent);color:var(--stay)}
.done{opacity:.45}
.done .qty{text-decoration:line-through}
.chip{display:inline-block;font-size:12px;padding:4px 9px;border-radius:999px;
  background:color-mix(in srgb,var(--stay) 15%,transparent);color:var(--dim);margin:0 6px 6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
.pad{padding:12px}
.dim{color:var(--dim)}
.sm{font-size:13px}
.warnbox{border:1px solid var(--aside);background:color-mix(in srgb,var(--aside) 12%,transparent);border-radius:12px;padding:12px;margin:10px 0}
.badbox{border:1px solid var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent);border-radius:12px;padding:12px;margin:10px 0}
.okbox{border:1px solid var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);border-radius:12px;padding:12px;margin:10px 0}

input,select,textarea{width:100%;background:var(--bg);color:var(--ink);
  border:2px solid var(--line);border-radius:10px;padding:14px;font:inherit;min-height:var(--tap)}
input[type=checkbox]{width:24px;min-height:24px;padding:0;}
input[type=number]{font-size:26px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;
  padding:0;width:min(560px,94vw);max-height:88vh}
dialog::backdrop{background:#000b}
.dh{padding:14px;border-bottom:1px solid var(--line);font-weight:700}
.db{padding:14px;overflow-y:auto;max-height:60vh}
.df{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}

.df>*{flex:1}
.foot{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--bg) 95%,transparent);border-top:1px solid var(--line);z-index:30}
.foot .wrap{padding:0}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.num{text-align:right;font-variant-numeric:tabular-nums}
#breakveil{position:fixed;inset:0;background:#000000f0;z-index:100;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:24px}
#breakveil.on{display:flex}
</style>
</head>
<body>
<div id="breakveil">
  <div style="font-size:56px">☕</div>
  <h1 style="font-size:26px">On break</h1>
  <p class="dim" style="max-width:340px">The screen is inactive so nothing you lean on gets
  recorded. Your work is saved.</p>
  <p class="dim" id="breakclock" style="font-variant-numeric:tabular-nums;font-size:20px"></p>
  <button class="big ok" style="max-width:320px" onclick="endBreak()">Back to work</button>
</div>

<div class="bar">
  <div class="grow">
    <b id="hdr">Freezer restock</b>
    <small id="sub"></small>
    <div class="prog"><i id="progbar"></i></div>
  </div>
  <button class="ghost" id="navprev" onclick="goBay(-1)" title="Previous bay">‹</button>
  <button class="ghost" id="navnext" onclick="goBay(1)" title="Next bay">›</button>
  <button class="ghost" onclick="startBreak()" title="Break">☕</button>
  <button class="ghost" onclick="openFinish()" title="Finish &amp; export">⇪</button>
</div>

<div class="wrap" id="app"></div>

<div class="foot"><div class="wrap"><button class="big pri" id="mainbtn"></button></div></div>

<dialog id="dlg"><form method="dialog">
  <div class="dh" id="dlgh"></div><div class="db" id="dlgb"></div>
  <div class="df" id="dlgf"></div>
</form></dialog>

<script>
"use strict";

const CFG = {"entra":{"client_id":"4a5939ef-bb89-4629-8a95-007509bb11a5","tenant_id":"c0f23c54-f515-4e2e-8aef-d3afb1ae34d0"},"sharepoint":{"hostname":"tcfarm0.sharepoint.com","site_path":"/sites/ClaudeAgents","list_name":"FreezerRestock","doc_folder":"FreezerRestock"}};

let BUILD = '146205d2441e';

let VER_ARRIVED = (function(){
  try{
    const q = new URLSearchParams(location.search);
    if(!q.has('v') || q.has('code') || q.has('state') || q.has('error')) return null;
    const v = q.get('v'); q.delete('v');
    const rest = q.toString();
    history.replaceState(null, '', location.pathname + (rest ? '?' + rest : '') + location.hash);
    return v;
  }catch(e){ return null; }
})();
let PAYLOAD = null;                       
 
let OFF_FOR = null, OFF_SIG = null;
let KEY = 'freezer.exec.pending';         
const CACHE_KEY = 'freezer.plan.cache';
const TOK_KEY   = 'freezer.tok';

const AUTHZ = () => `https://login.microsoftonline.com/${CFG.entra.tenant_id}/oauth2/v2.0`;
const GRAPH = 'https://graph.microsoft.com/v1.0';
const REDIRECT = () => location.origin + location.pathname;   

function b64u(buf){
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function sha256(str){
  return b64u(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)));
}
function tokStore(v){
  try{ if(v === undefined) return JSON.parse(localStorage.getItem(TOK_KEY) || 'null');
       if(v === null) localStorage.removeItem(TOK_KEY);
       else { localStorage.setItem(TOK_KEY, JSON.stringify(v)); clearAutoSignIn(); }
     }catch(e){ return null; }
}
function haveToken(){
  const t = tokStore();
  return !!(t && t.access_token && Date.now() < (t.exp || 0) - 60000);
}
function canRefresh(){ const t = tokStore(); return !!(t && t.refresh_token); }

function expireAccess(){
  const t = tokStore();
  if(t && t.refresh_token){ t.exp = 0; t.access_token = ''; tokStore(t); } else tokStore(null);
}
async function ensureToken(){
  if(haveToken()) return true;
  if(!canRefresh()) return false;
  try{
    const t = tokStore();
    const body = new URLSearchParams({
      client_id: CFG.entra.client_id, grant_type: 'refresh_token',
      refresh_token: t.refresh_token,
      scope: 'https://graph.microsoft.com/Sites.ReadWrite.All offline_access openid profile'});

    let r;
    try{
      r = await fetch(`${AUTHZ()}/token`, {
        method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:body});
    }catch(netErr){ return false; }                   
    let j = {};
    try{ j = await r.json(); }catch(e){ return false; }
    if(!r.ok){
       
      if((r.status === 400 || r.status === 401) &&
         (!j.error || /invalid_grant|interaction_required|invalid_client/.test(String(j.error))))
        tokStore(null);
      return false;
    }
    j.exp = Date.now() + (Number(j.expires_in || 3600) * 1000);
    if(!j.refresh_token) j.refresh_token = t.refresh_token;   
    tokStore(j);
    return true;
  }catch(e){ return false; }
}

const VER_KEY = 'freezer.pkce';
const VER_TTL = 30 * 60 * 1000;           
function putVerifier(v){
  const blob = JSON.stringify({v: v, ts: Date.now()});
  let stored = false;
  try{ localStorage.setItem(VER_KEY, blob); stored = true; }catch(e){}
  try{ sessionStorage.setItem(VER_KEY, blob); stored = true; }catch(e){}
  return stored;
}
function takeVerifier(){
  let blob = null;
  try{ blob = localStorage.getItem(VER_KEY); }catch(e){}
  if(!blob){ try{ blob = sessionStorage.getItem(VER_KEY); }catch(e){} }

  if(!blob){ try{ const legacy = sessionStorage.getItem('fz.v');
                  if(legacy) blob = JSON.stringify({v: legacy, ts: Date.now()}); }catch(e){} }
  try{ localStorage.removeItem(VER_KEY); }catch(e){}
  try{ sessionStorage.removeItem(VER_KEY); sessionStorage.removeItem('fz.v'); }catch(e){}
  if(!blob) return '';
  try{
    const o = JSON.parse(blob);
    if(!o || !o.v) return '';
    if(Date.now() - Number(o.ts || 0) > VER_TTL) return '';
    return String(o.v);
  }catch(e){ return ''; }
}

async function signIn(){
  const verifier = b64u(crypto.getRandomValues(new Uint8Array(48)));

  if(!putVerifier(verifier))
    return renderGate('This browser is blocking storage, so sign-in cannot complete. '
                      + 'Turn off Private Browsing (or allow site data) and try again.');
  const q = new URLSearchParams({
    client_id: CFG.entra.client_id, response_type: 'code', redirect_uri: REDIRECT(),
    response_mode: 'query',
    scope: 'https://graph.microsoft.com/Sites.ReadWrite.All offline_access openid profile',
    code_challenge: await sha256(verifier), code_challenge_method: 'S256'});
  location.href = `${AUTHZ()}/authorize?${q}`;
}

async function completeSignIn(){
  const qs = new URLSearchParams(location.search);
  const code = qs.get('code');
  if(!code){
    
    if(qs.get('error')) throw new Error(qs.get('error_description') || qs.get('error'));
    return false;
  }
  const verifier = takeVerifier();

  if(!verifier){
    history.replaceState({}, '', location.pathname);
    throw new Error('Sign-in timed out on the way back from Microsoft — '
                    + 'nothing is lost, just sign in again.');
  }
  const body = new URLSearchParams({
    client_id: CFG.entra.client_id, grant_type: 'authorization_code', code: code,
    redirect_uri: REDIRECT(), code_verifier: verifier});
  const r = await fetch(`${AUTHZ()}/token`, {
    method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: body});
  const j = await r.json();
  history.replaceState({}, '', location.pathname);        
  if(!r.ok) throw new Error(j.error_description || j.error || ('token exchange HTTP ' + r.status));
  j.exp = Date.now() + (Number(j.expires_in || 3600) * 1000);
  tokStore(j);
  return true;
}

async function graph(path){
  const t = tokStore();
  if(!t) throw new Error('not signed in');
  const r = await fetch(GRAPH + path, {headers: {Authorization: 'Bearer ' + t.access_token}});
  if(r.status === 401){ expireAccess(); throw new Error('sign-in expired — sign in again'); }
  if(!r.ok) throw new Error(`Graph ${path} -> HTTP ${r.status}`);
  const ct = r.headers.get('content-type') || '';
  return ct.includes('json') ? r.json() : r.text();
}

async function fetchPlan(){
  const sp = CFG.sharepoint;
  const site = await graph(`/sites/${sp.hostname}:${sp.site_path}`);
  const txt = await graph(
    `/sites/${site.id}/drive/root:/${sp.doc_folder}/plan_latest.json:/content`);
  const p = (typeof txt === 'string') ? JSON.parse(txt) : txt;
  if(!p || !p.bays || !p.bays.length) throw new Error('the plan file has no bays');
  return p;                       
}

function acceptPlan(p){

  if(setPlan(p) === false) return false;
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(
        {fetched: new Date().toISOString(), plan: p})); }
  catch(e){ toast('⚠️ plan loaded but too large to cache — it will need signal again'); }
  return true;
}

function isDirty(){
  return !!(S.started || (S.events && S.events.length) ||
            Object.keys(S.lines || {}).length ||
            Object.keys(S.pallets || {}).length ||
            Object.keys(S.bays || {}).length || S.bay > 0);
}

const SYNC_EV = {synced:1, row_frozen:1, status_preserved:1, sync_failed:1, autosync:1};
function unsyncedCrewWork(){
  const sy = S.synced;
  const evs = S.events || [];
  const from = (sy && typeof sy.events === 'number') ? sy.events : 0;
  if(!sy || !sy.at) return hasRecordedWork(S) || evs.some(e => e && !META_EV[e.kind] && !SYNC_EV[e.kind]);
  return evs.slice(from).some(e => e && !META_EV[e.kind] && !SYNC_EV[e.kind]);
}
function unsyncedWork(){
  const sy = S.synced;
  if(!sy || !sy.at) return true;                        
  if(typeof sy.events === 'number')
    return (S.events || []).length > sy.events;         
  const evs = S.events || [];
  const last = evs.length ? (evs[evs.length - 1].ts || '') : '';
  return !!(last && last > sy.at);                      
}
function cachedPlan(){
  try{ const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
       return c && c.plan && c.plan.bays ? c : null; }catch(e){ return null; }
}

function setPlan(p){
  const prevPayload = PAYLOAD, prevKey = KEY, prevS = S;
  KEY = 'freezer.exec.' + (p.plan_date || 'x');
  S = load();

  if(prevPayload && prevPayload.bays && prevKey === KEY && sameDateRebuildHeld(prevPayload, p, S)){
    PAYLOAD = prevPayload; S = prevS;
    holdRebuild(p);
    return false;
  }

  const rk = rekeyForPlan(p, (prevPayload && prevKey === KEY) ? prevPayload : null);
  if(!rk.ok && prevPayload && prevPayload.bays){
    PAYLOAD = prevPayload; KEY = prevKey; S = prevS;
    S.events = S.events || [];
    S.events.push({ts:new Date().toISOString(), kind:'plan_switch_refused', to_built:p.built || '',
                   lanes:rk.lanes.join(',')});
    try{ writeLocal(); }catch(e){}
    banner('planswitch', '<b>⛔ The newer plan was NOT loaded.</b><div class="sm" style="margin-top:4px">'+
      'Work is recorded in ' + esc(rk.lanes.join(', ')) + ', and the new plan does not have ' +
      (rk.lanes.length === 1 ? 'that lane' : 'those lanes') + ' — switching would lose it. You are still on ' +
      'the plan you had; keep working and syncing. ⭐ Tell Jack.</div>');
    return false;
  }
  PAYLOAD = p;
  if(rk.apply) rk.apply();
  if(!rk.ok)                  
    banner('planswitch', '<b>⛔ Work is recorded in ' + esc(rk.lanes.join(', ')) + ', which this plan does not '+
      'have.</b><div class="sm" style="margin-top:4px">Tell Jack before going on.</div>');
  materialiseOffPlan();       
   
  if(S.bay_lane){ const bi = PAYLOAD.bays.findIndex(b => b.bay === S.bay_lane); if(bi >= 0) S.bay = bi; }
  if(S.bay >= PAYLOAD.bays.length) S.bay = Math.max(0, PAYLOAD.bays.length - 1);
  if(!S.plan_built && hasRecordedWork(S)) S.plan_built = p.built || '';
  const lanesWas = JSON.stringify(S.bay_lanes || null);
  noteBayLanes();

  if(Object.keys(rk.map || {}).length || (hasRecordedWork(S) && lanesWas !== JSON.stringify(S.bay_lanes)))
    try{ writeLocal(); }catch(e){}

  COMMITTED = undoSnapshotOf(S);
  UNDO.length = 0;
  renderUndoBar();
  claimOwner();           
  noteOpen();             
  scanStranded();
  resumeBreakIfOpen();
  return true;
}

function sameDateRebuildHeld(cur, p, sess){
  if(!cur || !p || (cur.plan_date || '') !== (p.plan_date || '')) return false;
  if(!p.built || !cur.built || p.built === cur.built) return false;
  return hasRecordedWork(sess);
}
let HELD_PLAN = null;
const HELD_HIDE_KEY = 'freezer.heldplan.hidden';
function holdRebuild(p){
  HELD_PLAN = p;
  PENDING_PLAN = null;               
  dropBanner('newplan');
  renderHeldPlan();
}
function heldClosedOut(){ return !!(S.finalize_requested && !unsyncedCrewWork()); }
function renderHeldPlan(){
  if(!HELD_PLAN) return dropBanner('heldplan');
  let hidden = '';
  try{ hidden = sessionStorage.getItem(HELD_HIDE_KEY) || ''; }catch(e){}
  if(hidden === (HELD_PLAN.built || '')) return dropBanner('heldplan');
  const closed = heldClosedOut();
  banner('heldplan',
    '<b>A newer version of today\'s plan (' + esc(HELD_PLAN.plan_date) + ') is ready — this tablet stays on the '
    + 'plan you started.</b><div class="sm" style="margin-top:4px">Your recorded work belongs to this plan, '
    + 'so keep working it. The newer version loads once this shift is <b>synced and closed</b> — finalized, or '
    + 'started over.</div>'
    + '<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">'
    + (closed ? '<button class="pri" style="min-height:48px" onclick="loadHeldRebuild()">Load the newer plan</button>' : '')
    + '<button class="ghost" style="min-height:48px" onclick="hideHeldPlan()">Hide this</button></div>', 'warnbox');
}
 
function hideHeldPlan(){
  try{ sessionStorage.setItem(HELD_HIDE_KEY, (HELD_PLAN && HELD_PLAN.built) || ''); }catch(e){}
  dropBanner('heldplan');
}
 
function loadHeldRebuild(){
  const p = HELD_PLAN;
  if(!p || !heldClosedOut()) return renderHeldPlan();
  dlg('Load the newer plan?',
    '<div class="okbox"><b>This shift is finalized and on SharePoint.</b><div class="sm" style="margin-top:4px">'+
    'Loading the newer version clears this iPad\'s copy of it, so the new plan starts empty.</div></div>',
    [{t:'Cancel', c:'ghost'},
     {t:'Load it', c:'pri', f:() => {
        S = blank();
        try{ localStorage.removeItem(KEY); }catch(e){}
        HELD_PLAN = null; dropBanner('heldplan');
        acceptPlan(p); save(); render(); toast('newer plan ' + p.plan_date + ' loaded'); }}]);
}
 
function noteBayLanes(){
  if(!PAYLOAD || !PAYLOAD.bays || !S) return;
  const m = {};
  PAYLOAD.bays.forEach(b => { if(b && b.n != null && b.bay) m[b.n] = b.bay; });
  S.bay_lanes = m;
}

function rekeyForPlan(p, prevPlan){
  const oldMap = Object.assign({}, S.bay_lanes || {});
  if(!S.bay_lanes && prevPlan) (prevPlan.bays || []).forEach(b => { if(b.n != null && b.n < 1000) oldMap[b.n] = b.bay; });
  const newN = {};
  (p.bays || []).forEach(b => { if(!b.off_plan_bay && b.bay) newN[b.bay] = Number(b.n); });
   
  const offLocs = new Set(Object.keys(S.unplanned || {}).map(k => (S.unplanned[k] || {}).loc));
  const state = {};                   
  const mark = (n_, planned) => { n_ = Number(n_); if(!(n_ > 0) || n_ >= 1000) return;
    state[n_] = state[n_] || {planned:false}; if(planned) state[n_].planned = true; };
  Object.keys(S.lines || {}).forEach(k => { const i = k.indexOf('|'); const n_ = k.slice(0, i);
    const loc = k.slice(i + 1).split('|')[0]; mark(n_, !offLocs.has(loc)); });
  Object.keys(S.bays || {}).forEach(k => { if(Object.keys(S.bays[k] || {}).length) mark(k, true); });
  Object.keys(S.opened || {}).forEach(k => mark(k.slice(0, k.indexOf('|')), true));    
  Object.keys(S.load_order || {}).forEach(k => mark(k, true));
  Object.keys(S.unplanned || {}).forEach(k => mark((S.unplanned[k] || {}).bay, false));
  Object.keys(S.new_pallets || {}).forEach(k => mark((S.new_pallets[k] || {}).bay_n, true));
  Object.keys(S.adhoc_counts || {}).forEach(k => { const c = S.adhoc_counts[k] || {}; mark(c.bay, !offLocs.has(c.loc)); });
  (S.lot_fix || []).forEach(x => x && mark(x.bay, !offLocs.has(x.loc)));
  Object.keys(S.deck_freed || {}).forEach(k => { const d = S.deck_freed[k] || {}; mark(d.bay, !offLocs.has(d.loc)); });
  const map = {}, refuse = [];
  Object.keys(state).forEach(k => {
    const n_ = Number(k), lane = oldMap[n_];
    if(!lane){ return; }                                    
    const to = newN[lane];
    if(to == null){ if(state[n_].planned) refuse.push(lane); return; }    
    if(to !== n_) map[n_] = to;
  });
   
  Object.keys(map).forEach(k => { const to = map[k];
    if(state[to] && !(to in map) && !oldMap[to]) refuse.push(oldMap[k]); });
  const ok = !refuse.length;
  const apply = () => {
    if(!Object.keys(map).length) return;
    const mv = n_ => (Number(n_) in map) ? map[Number(n_)] : Number(n_);
    const L = {};
    Object.keys(S.lines || {}).forEach(k => { const i = k.indexOf('|');
      const n_ = Number(k.slice(0, i)); L[((n_ in map) ? map[n_] : k.slice(0, i)) + k.slice(i)] = S.lines[k]; });
    S.lines = L;
     
    const OP = {};
    Object.keys(S.opened || {}).forEach(k => { const i = k.indexOf('|');
      const n_ = Number(k.slice(0, i)); OP[((n_ in map) ? map[n_] : k.slice(0, i)) + k.slice(i)] = S.opened[k]; });
    S.opened = OP;
    const B = {}; Object.keys(S.bays || {}).forEach(k => { B[mv(k)] = S.bays[k]; }); S.bays = B;
    const O = {}; Object.keys(S.load_order || {}).forEach(k => { O[mv(k)] = S.load_order[k]; }); S.load_order = O;
    Object.keys(S.unplanned || {}).forEach(k => { const u = S.unplanned[k]; if(u && u.bay < 1000) u.bay = mv(u.bay); });
    Object.keys(S.new_pallets || {}).forEach(k => { const x = S.new_pallets[k]; if(x && x.bay_n != null) x.bay_n = mv(x.bay_n); });
    Object.keys(S.adhoc_counts || {}).forEach(k => { const c = S.adhoc_counts[k]; if(c && c.bay < 1000) c.bay = mv(c.bay); });
    (S.lot_fix || []).forEach(x => { if(x && x.bay < 1000) x.bay = mv(x.bay); });
    Object.keys(S.deck_freed || {}).forEach(k => { const d = S.deck_freed[k]; if(d && d.bay < 1000) d.bay = mv(d.bay); });
    S.events = S.events || [];
    S.events.push({ts:new Date().toISOString(), kind:'bays_rekeyed',
                   moved:Object.keys(map).map(k => oldMap[k] + ' ' + k + '→' + map[k]).join('; ')});

    const nm = {}; Object.keys(oldMap).forEach(k => { if(Number(k) >= 1000) nm[k] = oldMap[k]; });
    (p.bays || []).forEach(b => { if(!b.off_plan_bay && b.bay) nm[b.n] = b.bay; });
    S.bay_lanes = nm;
    try{ writeLocal(); }catch(e){}
  };
  return {ok:ok, lanes:[...new Set(refuse)], map:map, apply:apply};
}

const OWNER_ID = 'w' + Math.random().toString(36).slice(2, 9);
const OWNER_FRESH_MS = 45000;
let TWO_WIN_TOLD = false, OWNER_TIMER = null;
function ownerKey(){ return KEY + '.owner'; }
function readOwner(){
  try{ return JSON.parse(localStorage.getItem(ownerKey()) || 'null'); }catch(e){ return null; }
}
function touchOwner(){
  try{ localStorage.setItem(ownerKey(), JSON.stringify({id: OWNER_ID, at: Date.now()})); }
  catch(e){   }
}
function releaseOwner(){
  try{ const o = readOwner(); if(o && o.id === OWNER_ID) localStorage.removeItem(ownerKey()); }
  catch(e){}
}
function renderTwoWin(){
  if(document.getElementById('twowin') && !document.getElementById('twowin').hidden) return;
  banner('twowin',
    '<b>⛔ This plan is open in another window.</b>'
    + '<div class="sm" style="margin-top:4px">Both windows save the whole shift, so whichever '
    + 'one saves last <b>erases what the other recorded</b> — including where pallets went. '
    + 'Close one of them now, and work in the other.</div>');
}
function claimOwner(){
  const prev = readOwner();
  const foreignLive = prev && prev.id !== OWNER_ID && (Date.now() - (prev.at || 0)) < OWNER_FRESH_MS;
  touchOwner();
  if(foreignLive){
    renderTwoWin();

    const wasAt = prev.at || 0;
    setTimeout(() => {
      const now = readOwner();
      if(!TWO_WIN_TOLD && (!now || now.id === OWNER_ID || (now.at || 0) <= wasAt)){
        dropBanner('twowin'); touchOwner();
      }
    }, 4000);
  }
  if(OWNER_TIMER) clearInterval(OWNER_TIMER);
  OWNER_TIMER = setInterval(touchOwner, 15000);
}
window.addEventListener('storage', e => {
  if(!e || e.key !== ownerKey()) return;

  if(!e.newValue){ TWO_WIN_TOLD = false; dropBanner('twowin'); return; }
  let o = null; try{ o = JSON.parse(e.newValue); }catch(err){ return; }
  if(!o || o.id === OWNER_ID) return;
  renderTwoWin();

  if(!TWO_WIN_TOLD){ TWO_WIN_TOLD = true; touchOwner(); }
});

function strandedRecords(){
  const out = [];
  let keys = [];
  try{ keys = Object.keys(localStorage); }catch(e){ return out; }
  keys.forEach(k => {
    if(k.indexOf('freezer.exec.') !== 0) return;
    if(k === KEY) return;
     
    if(/\.(owner|probe)$/.test(k) || k.indexOf('.rescue.') >= 0) return;
    let o = null;
    try{ o = JSON.parse(localStorage.getItem(k) || 'null'); }
    catch(e){ out.push({key: k, plan: k.slice(13), lines: null, unreadable: true}); return; }
    if(!o || typeof o !== 'object') return;
    const lines = Object.keys(o.lines || {}).length;
    const work = lines || Object.keys(o.bays || {}).length
                       || Object.keys(o.putback_actual || {}).length
                       || (o.events || []).length;
    if(!work) return;                        
    out.push({key: k, plan: k.slice(13), lines: lines,

              synced: (o.synced && typeof o.synced.at === 'string') ? o.synced.at : null});
  });
  return out;
}
function scanStranded(){
  const st = strandedRecords();
  if(!st.length) return dropBanner('stranded');

  const unsent = st.filter(r => !r.synced || r.unreadable);
  banner('stranded',
    '<b>' + (unsent.length
      ? '⚠️ There is unsent work on this iPad for '
        + (unsent.length === 1 ? 'another plan' : unsent.length + ' other plans')
      : '⭐ This iPad is still holding an earlier shift') + '.</b>'
    + st.map(r => '<div class="sm" style="margin-top:4px">Plan <b>' + esc(r.plan) + '</b> — '
        + (r.unreadable ? 'could not be read'
                        : r.lines + ' line(s) recorded, '
                          + (r.synced ? 'last sent ' + esc(String(r.synced).slice(0, 16))
                                      : '<b>never sent</b>'))
        + ' <button class="ghost" style="min-height:44px;margin-left:6px" '
        + 'onclick="sendStranded(' + JSON.stringify(r.key).replace(/"/g, '&quot;')
        + ', this)">Send it</button></div>').join('')
    + '<div class="sm dim" style="margin-top:4px">It is not part of today\'s shift and will '
    + 'not sync on its own. ⛔ Do not clear this iPad until it has been sent.</div>',
    'warnbox');
}
async function sendStranded(k, b){
  let raw = null;
  try{ raw = localStorage.getItem(k); }catch(e){}
  if(!raw) return toast('⛔ it is not there any more');
  if(b){ b.disabled = true; b.textContent = 'Sending…'; }
  try{
    const n = await uploadRaw('stranded_' + k.slice(13) + '_' + deviceId() + '_'
                              + Date.now() + '.json', raw);
    if(b){ b.textContent = 'Sent ✓'; }
    toast('✅ sent — ' + n);
  }catch(e){
    if(b){ b.disabled = false; b.textContent = 'Send it'; }
    dlg('Could not send it', '<div class="badbox">' + esc(String(e.message || e)) + '</div>'
      + '<p class="sm dim">It is still on this iPad. Try again in signal.</p>',
      [{t: 'OK', c: 'pri'}]);
  }
}

let SW_STATE = 'unknown';         

let SHELL_CACHED = null;         
async function probeShellCache(){
  try{
    if(!('caches' in window)) { SHELL_CACHED = false; return; }
    const hit = await caches.match('./index.html', {ignoreSearch:true})
             || await caches.match('./', {ignoreSearch:true});
    SHELL_CACHED = !!hit;
  }catch(e){ SHELL_CACHED = false; }
  renderOfflineBadge();
}
function offlineReady(){ return SW_STATE === 'ready' && SHELL_CACHED === true; }

function registerSW(){
  if(!('serviceWorker' in navigator)){ SW_STATE = 'unsupported'; return; }

  if(location.protocol !== 'https:' && location.hostname !== 'localhost'){
    SW_STATE = 'unsupported'; return;
  }
  SW_STATE = navigator.serviceWorker.controller ? 'ready' : 'installing';
   
  navigator.serviceWorker.register('./sw.js', {updateViaCache:'none'}).then(reg => {
    SW_REG = reg;
    if(navigator.serviceWorker.controller) SW_STATE = 'ready';
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      if(!w) return;
      w.addEventListener('statechange', () => {
        if(w.state === 'activated'){ SW_STATE = 'ready'; SHELL_CACHED = null;
                                     renderOfflineBadge(); }
      });
    });
    renderOfflineBadge();
  }).catch(() => { SW_STATE = 'failed'; renderOfflineBadge(); });
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    SW_STATE = 'ready'; SHELL_CACHED = null; renderOfflineBadge();

    checkVersion('sw');
  });
}

let SW_REG = null;
let VER_REMOTE = null;             
const VER_TRY_KEY = 'freezer.ver.tried';
const VER_EVERY_MS = 5 * 60 * 1000;
 
let VER_STORE = () => sessionStorage;
function verTried(){ try{ return VER_STORE().getItem(VER_TRY_KEY) || ''; }catch(e){ return ''; } }
function verSetTried(b){ try{ if(b) VER_STORE().setItem(VER_TRY_KEY, b); else VER_STORE().removeItem(VER_TRY_KEY); }catch(e){} }
 
function verSafeMoment(){
  if(document.querySelector && document.querySelector('dialog[open]')) return false;
  const a = document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName || '')) return false;
  const sb = document.getElementById && document.getElementById('storagebad');
  if(sb && !sb.hidden) return false;
  if(WRITE_LOCK || saveFailed) return false;
  try{ const q = new URLSearchParams(location.search);
       if(q.has('code') || q.has('state') || q.has('error')) return false; }catch(e){ return false; }
  return true;
}
function reloadToBuild(b){
  if(!b) return;
  verSetTried(b);
  try{ writeLocal(); }catch(e){}
  VER_NAV(location.pathname + '?v=' + encodeURIComponent(b));
}

let VER_NAV = u => location.replace(u);
function renderVersionBanner(remote, arriving){

  const el = banner('newbuild',
    '<div style="display:flex;align-items:center;gap:8px">'+
    '<div class="sm" style="flex:1;line-height:1.25"><b>'+(arriving ? '⏳ Update still arriving — try again in a minute'
                                                                   : '⬆️ New version available')+'</b></div>'+
    '<button class="pri" id="nb-go" style="min-height:44px;padding:0 14px" onclick="reloadToBuild(VER_REMOTE)">'+
      (arriving ? 'Try again' : 'Reload')+'</button>'+
    '<button class="ghost" aria-label="Later" style="min-height:44px;min-width:44px;padding:0" '+
      'onclick="dropBanner(\'newbuild\')">✕</button></div>', 'warnbox');
   
  if(el){ const bar = document.querySelector('.bar');
           el.style.position = 'sticky'; el.style.zIndex = '19';      
           el.style.top = ((bar && bar.offsetHeight) || 0) + 'px';
           el.style.padding = '4px 10px';
           if(el.firstChild && el.firstChild.style) el.firstChild.style.padding = '4px 8px'; }
}
 
async function checkVersion(why){
  if(!BUILD) return 'unstamped';
  try{ if(SW_REG && SW_REG.update) SW_REG.update().catch(() => {}); }catch(e){}
  let v = null;
  try{
    const r = await fetch('./version.json?t=' + Date.now(), {cache:'no-store'});
    if(!r || !r.ok) return 'unreachable';
    v = await r.json();
  }catch(e){ return 'unreachable'; }               
  const remote = v && typeof v.build === 'string' ? v.build.trim() : '';
  if(!remote || !/^[0-9a-f]{6,64}$/i.test(remote)) return 'unreadable';
  VER_REMOTE = remote;
  if(remote === BUILD){ if(verTried() === remote) verSetTried(''); dropBanner('newbuild'); return 'current'; }

  if(verTried() === remote || (VER_ARRIVED && VER_ARRIVED === remote)){ renderVersionBanner(remote, true); return 'arriving'; }
  if((why === 'boot' || why === 'visible') && verSafeMoment()){ reloadToBuild(remote); return 'reload'; }
  renderVersionBanner(remote, false);
  return 'banner';
}
function startVersionWatch(){
  checkVersion('boot');
  setInterval(() => { if(document.visibilityState === 'visible') checkVersion('interval'); }, VER_EVERY_MS);
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible') checkVersion('visible'); });
  window.addEventListener('online', () => checkVersion('online'));
}

function renderOfflineBadge(){
  const el = document.getElementById('offbadge');
  if(!el) return;
  const cached = !!cachedPlan();
  if(SHELL_CACHED === null) probeShellCache();     
  if(offlineReady() && cached){
    el.className = 'okbox sm';
    el.innerHTML = '✓ <b>Saved on this device.</b> This will open in the freezer with no signal.';
  }else if(SW_STATE === 'ready' && cached && SHELL_CACHED === false){

    el.className = 'warnbox sm';
    el.innerHTML = '⚠️ <b>The plan is saved but the app itself is not.</b> Reload once on '+
      'wifi before you go in — the page needs a signal to open until this clears.';
  }else if(SW_STATE === 'unsupported'){
    el.className = 'warnbox sm';
    el.innerHTML = '⚠️ <b>This browser cannot save the app offline.</b> Open it from the ' +
      'home-screen icon (Share → Add to Home Screen) while you still have wifi.';
  }else if(!cached){
    el.className = 'warnbox sm';
    el.innerHTML = '⚠️ <b>No plan saved on this device yet.</b> Sign in here, on wifi, ' +
      'before you go in — there is nothing to open in the freezer until you do.';
  }else{
    el.className = 'warnbox sm';
    el.innerHTML = '⏳ <b>Saving the app for offline use…</b> Stay on wifi for a moment. ' +
      'The plan itself is already saved.';
  }
}

const AUTO_KEY = 'freezer.autosignin';
function clearAutoSignIn(){ try{ sessionStorage.removeItem(AUTO_KEY); }catch(e){} }
function autoSignInOK(){
  if(cachedPlan()) return false;
  if(navigator.onLine === false) return false;
  try{
    const n = Number(sessionStorage.getItem(AUTO_KEY) || 0);
    if(n >= 2) return false;
    sessionStorage.setItem(AUTO_KEY, String(n + 1));
    return true;
  }catch(e){ return false; }   
}

async function boot(){
  registerSW();
  startVersionWatch();      
  try{
    if(new URLSearchParams(location.search).has('code') ||
       new URLSearchParams(location.search).has('error')){
      await completeSignIn();
    }
  }catch(e){ return renderGate('Sign-in failed: ' + e.message); }

  const c = cachedPlan();
  if(c){ setPlan(c.plan); render();

         ensureToken().then(ok => {
           if(ok){ dropBanner('staleplan'); refreshPlanQuietly(); reconcileOnBoot(); return; }
           renderNotSignedIn(c);
         });
         return; }
  if(!(await ensureToken())){

    if(autoSignInOK()){ renderGate(null, true); return signIn(); }
    return renderGate();
  }
  renderGate(null, true);
  try{ const p = await fetchPlan(); acceptPlan(p); render(); reconcileOnBoot(); }
  catch(e){ renderGate('Could not load the plan: ' + e.message); }
}

async function doPlanSwitch(from, to, done, bays){
  const p = PENDING_PLAN;
  if(!p || p.plan_date !== to) return;       

  ev('newer_plan_switch', {from: from, to: to, lines: done, bays: bays});
  save();

  if(!(await syncNow(false))){

    banner('newplan',
      '<b>⛔ Not switched — the sync did not go through.</b>'
      + '<div class="sm" style="margin-top:4px">You are still on <b>' + esc(from) + '</b> and '
      + 'nothing has been lost. Get back into signal and tap it again.</div>'
      + '<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">'
      + '<button class="pri" id="np-go" style="min-height:48px" '
      + 'onclick="switchToPendingPlan()">Try again</button></div>');
    return;
  }

  PENDING_PLAN = null;
  dropBanner('newplan');
  dropBanner('reconcile');        

  if(!acceptPlan(p)){ render(); return; }    
  HELD_PLAN = null; dropBanner('heldplan');
  ev('plan_started_after_switch', {from: from});
  save();
  render();

  RECONCILED = false;
  SERVER_REC = null;
  reconcileOnBoot();
  scanStranded();                 
  dlg('Now on plan ' + esc(to),
    '<div class="okbox"><b>Your ' + esc(from) + ' work is on SharePoint.</b>'
    + '<div class="sm" style="margin-top:4px">It is still on this iPad too, and the app will '

let RESCUED = null;       
let WRITE_LOCK = null;    

function rescueRecord(raw, why){
  const stamp = new Date().toISOString().replace(/[^0-9]/g, '').slice(0, 14);

  let k = KEY + '.rescue.' + stamp, n = 0;
  try{ while(localStorage.getItem(k) !== null && n < 50) k = KEY + '.rescue.' + stamp + '-' + (++n); }
  catch(e){   }
  try{
    localStorage.setItem(k, raw);
    if(localStorage.getItem(k) !== raw) throw new Error('read-back mismatch');
  }catch(e){
    WRITE_LOCK = 'an earlier record for this plan could not be read, and there is no room on '
               + 'this device to keep it safe. Writing anything now would destroy it.';
    blockStorage(why + ' — and the copy failed: ' + (e.message || e), false, raw);
    return null;
  }
  RESCUED = {key: k, why: why, raw: raw};
  try{ renderRescueBar(); }catch(e){}
  return k;
}

function load(){
  let raw = null;
  try{ raw = localStorage.getItem(KEY); }catch(e){ return blank(); }
  if(!raw) return blank();
  let o = null, why = '';
  try{ o = JSON.parse(raw); }
  catch(e){ why = 'the saved record is not readable JSON (' + (e.message || e) + ')'; }
  if(!why){
    if(!o || typeof o !== 'object') why = 'the saved record is not a session';
    else if(o.v !== 2) why = 'the saved record is version ' + JSON.stringify(o.v)
                           + ' and this build of the app reads version 2';
  }
  if(why){ rescueRecord(raw, why); return blank(); }

  o.putback_actual = o.putback_actual || {};
  o.new_pallets = o.new_pallets || {};
  o.split_contents = o.split_contents || {};
  o.floor_fix = o.floor_fix || {};
  o.left_down = o.left_down || {};
  o.temp_out = o.temp_out || [];
  return o;
}

              + 'before that. Your timings and the record of what you tapped are kept.')) return;

function isFinished(s){ return !!(s && TERMINAL.indexOf(s.state) >= 0); }

function palletSettled(p){ return !!((S.pallets[(p && p.loc) || p] || {}).settled); }
function lineSettled(bn, p, l, i){
  if(palletSettled(p)) return true;
  const s = S.lines[lid(bn, p.loc, l, i)];
  return !!(s && s.state === 'settled');
}

function pileSettled(b, p, sku, lot){
  if(palletSettled(p)) return true;
  return (p.lines || []).some((l, i) =>
    l.kind !== 'count' && l.sku === sku && (l.lot || '') === (lot || '') &&
    (S.lines[lid(b.n, p.loc, l, i)] || {}).state === 'settled');
}

function settleBlockers(bn, p, l, i){
  const out = [];
  const one = (l2, i2) => {
    const s2 = S.lines[lid(bn, p.loc, l2, i2)];
    if(!s2) return;
    const moved = Number(s2.actual || 0);
    if(s2.state === 'done' && moved > 0)
      out.push(l2.kind + ' of ' + moved + ' ' + l2.sku + ' you recorded as carried');
    else if((s2.placements || []).length)
      out.push(l2.sku + ' has ' + s2.placements.length + ' recorded placement(s)');
    else if(s2.state === 'missing')
      out.push(l2.sku + ' is recorded as NOT THERE, which is the opposite claim');
    else if(Number(s2.adjustment || 0))
      out.push(l2.sku + ' carries a stock correction of ' + s2.adjustment);
    else if(s2.counted != null)
      out.push(l2.sku + ' has a recorded count of ' + s2.counted);
  };
  if(l) one(l, i);
  else (p.lines || []).forEach((l2, i2) => { if(l2.kind !== 'count') one(l2, i2); });
  return out;
}

function settleLine(id, why){
  const parts = String(id || '').split('|');
  const bn = Number(parts[0]), loc = parts[1];
  const b = PAYLOAD.bays.find(x => x.n === bn);
  const p = b && (b.pallets || []).find(x => x.loc === loc);
  if(!b || !p) return {ok:false, why:'that line is not on a pallet in this plan'};
  let idx = -1, ln = null;
  (p.lines || []).forEach((l2, i2) => { if(lid(bn, loc, l2, i2) === id){ idx = i2; ln = l2; } });
  if(!ln) return {ok:false, why:'that line is not in this plan'};

  const blockers = [];
  (p.lines || []).forEach((l2, i2) => {
    if(l2.kind !== 'count' && l2.sku === ln.sku && (l2.lot || '') === (ln.lot || ''))
      settleBlockers(bn, p, l2, i2).forEach(x => blockers.push(x));
  });
  if(blockers.length) return {ok:false, blockers:blockers,
    why:'⛔ this line already records work: ' + blockers.join('; ') +
        '. "Finale is already right" and "I moved it" cannot both be true — clear the '+
        'recorded work first, or leave it as recorded.'};
  if(!String(why || '').trim())
    return {ok:false, why:'⛔ say why Finale is already right — a settle with no reason is '+
                          'indistinguishable from a skip, and the two mean opposite things'};
  setLine(id, {state:'settled', settled_why:String(why).trim(), as_planned:false});
  ev('line_settled', {bay:bn, pallet:p.pallet_id||'', loc:loc, sku:ln.sku,
                      lot:ln.lot||'', why:String(why).trim()});
  return {ok:true};
}

let MOVES_CACHE = null, MOVES_CACHE_ON = 0;
function withMovesCache(f){
  MOVES_CACHE_ON++;
  try{ return f(); } finally { if(--MOVES_CACHE_ON === 0) MOVES_CACHE = null; }
}
function movesForRead(){
  if(MOVES_CACHE_ON && MOVES_CACHE) return MOVES_CACHE;
  const m = moves();
  if(MOVES_CACHE_ON) MOVES_CACHE = m;
  return m;
}
function pileLeft(b, p, sku, lot, exceptId){
  if(!b || !p) return 0;
  let m = null;
  if(exceptId && S.lines[exceptId]){
    const had = S.lines[exceptId];
    delete S.lines[exceptId];
    try{ m = moves(); }catch(e){ m = null; } finally { S.lines[exceptId] = had; }
  } else {
    try{ m = movesForRead(); }catch(e){ m = null; }
  }
  const plKey = p.pallet_id || p.loc, P = m && m._pile;
  if(P && P.cover[plKey]){
    const v = Number((P.piles[plKey] || {})[sku + ' ' + (lot || '')] || 0);
    return Math.max(0, Math.round(v * 1000) / 1000);
  }
  return Math.max(0, netPileQty(p.loc, sku, lot || '', onPallet(b, p, sku, lot)));
}

function palletNow(p){
  let m = null;
  try{ m = movesForRead(); }catch(e){ m = null; }
  const plKey = p && (p.pallet_id || p.loc), P = m && m._pile;
  if(!(P && P.cover[plKey])) return null;
  return P.piles[plKey] || {};
}
function askMoveInstead(id){
  const f = find(id); if(!f) return;
  const l = f.l;
  const cap = onPallet(f.b, f.p, l.sku, l.lot);
  const others = palletChoices(f.b.n, f.p.pallet_id || '');
  const sPrev = st(id) || {};

  const recorded = implicitParts(l, sPrev);
  const plannedOnly = recorded.length > 0 && recorded.every(pt => pt.planned);
  const movedAlready = recorded.reduce((t, pt) => t + Number(pt.qty || 0), 0);

  const leftReplace = movedAlready > 0 ? Math.min(movedAlready, pileLeft(f.b, f.p, l.sku, l.lot, id))
                                       : pileLeft(f.b, f.p, l.sku, l.lot, id);
  const leftAdd = pileLeft(f.b, f.p, l.sku, l.lot);                 
  const dest_ = pt => pt.location || (pt.pallet ? pt.pallet : (pt.planned && l.kind === 'take' ? (l.dest || 'F1') : '?'));
  dlg('I moved it somewhere else',
    '<p><b>'+esc(l.sku)+'</b>'+(l.lot?' · lot '+esc(l.lot):'')+' — <b>'+n(cap)+
      '</b> on this pallet'+(leftAdd < cap - 0.001 ? ', <b>'+n(leftAdd)+'</b> still on it by what is recorded' : '')+'.</p>'+
    (recorded.length
      ? '<div class="okbox sm"><b>Already recorded:</b> '+recorded.map(pt => n(pt.qty)+' → '+
          esc(dest_(pt))+(pt.planned ? ' (as planned)' : '')).join(', ')+

        '<div style="margin-top:4px">⭐ What you record now <b>replaces</b> that'+(plannedOnly
          ? ' — the planned move becomes what you say here' : '')+'. Tick below only if you <b>also</b> moved some.</div>'+
        '<label style="display:block;min-height:44px;padding:8px 0"><input type="checkbox" id="mi5"> '+
        'keep those — I <b>also</b> moved some to another place</label></div>' : '')+
    '<p class="sm dim">⭐ Say what you actually did and it still reaches Finale. '+
    '⛔ Skipping it would lose the work — Finale would keep this stock where it is not.</p>'+
    '<label class="sm">How many did you move</label>'+ qtyField('mi1', n(leftReplace))+
    '<label class="sm" style="margin-top:10px">Where did it go</label>'+
    '<select id="mi2">'+
      '<optgroup label="into a spot on the floor">'+
      f1Choices().map(x => '<option value="@'+esc(x)+'">'+esc(x)+'</option>').join('')+
      '</optgroup>'+
      (others.filter(o => !o.other).length ? '<optgroup label="onto another pallet in this bay">'+
        others.filter(o => !o.other).map(o => '<option value="'+esc(o.id)+'">'+esc(o.id)+' · '+esc(o.why)+
          (o.spoil?' ⚠️ spoil':'')+'</option>').join('')+'</optgroup>' : '')+
       
      (others.filter(o => o.other).length ? '<optgroup label="onto a pallet in another bay">'+
        others.filter(o => o.other).map(o => '<option value="'+esc(o.id)+'">'+esc(o.id)+' · '+esc(o.why)+
          '</option>').join('')+'</optgroup>' : '')+
      (tempLoc() ? '<optgroup label="we owe it but cannot find it">'+
        '<option value="@'+esc(tempLoc())+'">'+esc(tempLoc())+
        ' — park it until it turns up</option></optgroup>' : '')+
      allLocOptgroups('@', f1Choices().concat([tempLoc(), floorLoc()]))+
    '</select>'+
    '<label class="sm dim" style="margin-top:10px">Why did it not go where the plan said?</label>'+
    '<input id="mi3" type="text" maxlength="140" autocomplete="off" '+
      'placeholder="e.g. no room on the destination">',
    [{t:'Cancel',c:'ghost'},
     {t:'Record what I did',c:'pri',f:()=>{
        const q = readQty('mi1');
        if(q === null){ toast('⛔ how many did you move?'); return false; }
        const r = moveInstead(id, q, $('#mi2').value, ($('#mi3').value||'').trim(),
                              {add: !!($('#mi5') && $('#mi5').checked)});

function askLoadOrder(bayN){
  const b = PAYLOAD.bays.find(x => x.n === bayN); if(!b) return;
  const rec = (S.load_order || {})[bayN];
   
  let order = ((rec && rec.order && !staleLoadOrder(bayN) && rec.order.slice()) ||
              (b.putback || []).map(x => x.pallet_id).filter(Boolean))
                .filter(x => !palletFreed(x));
  if(order.length < 2)
    return dlg('Only one pallet goes back', '<p class="sm dim">There is no order to change.</p>',
               [{t:'OK',c:'ghost'}]);
  const draw = () => {
    const n_ = order.length;
    return order.map((pid, i) =>
      '<div class="ln"><span class="tag '+(n_ - i === 1 ? 't-take' : 't-stay')+'">'+(i+1)+
        '</span><div class="grow"><div class="sku">'+esc(cardOf(pid) || pid)+'</div>'+
        '<div class="sub">ends up at <b>'+esc(b.bay)+'-'+(n_ - i)+'</b>'+
        (n_ - i === 1 ? ' — the FRONT' : '')+'</div></div>'+
        '<button '+(i===0?'disabled':'')+' onclick="__lo('+bayN+','+i+',-1)">▲</button>'+
        '<button '+(i===n_-1?'disabled':'')+' onclick="__lo('+bayN+','+i+',1)">▼</button>'+
      '</div>').join('');
  };
  window.__lo = (bn, i, d) => {
    const j = i + d;
    if(j < 0 || j >= order.length) return;
    const t = order[i]; order[i] = order[j]; order[j] = t;
    const box = $('#lobox'); if(box) box.innerHTML = draw();
  };
  dlg('What order did you actually load them?',
    '<p class="sm dim">⭐ First in the list = <b>pushed in FIRST</b> = ends up deepest. The '+
    'LAST one you push in sits at the front. ⛔ This is what decides every position in the '+
    'lane, so if you loaded them differently it matters.</p>'+
    '<div id="lobox">'+draw()+'</div>',
    [{t:'Cancel',c:'ghost'},
     {t:'That is the order',c:'pri',f:()=>{
        const r = recordLoadOrder(bayN, order);
        if(!r.ok){ toast(r.why); return false; }
        toast(r.changed ? 'Recorded — the positions follow the order you loaded'
                        : 'Same as planned — nothing changed');
        render();
      }}]);
}

function parkedSiblings(f, l){
  const ids = [];
  if(f && f.p) (f.p.lines || []).forEach((l2, i2) => {
    if(i2 === f.i || l2.sku !== l.sku || (l2.lot || '') !== (l.lot || '')) return;
    if(l2.kind !== 'take' && l2.kind !== 'aside') return;
    const id2 = lid(f.b.n, f.p.loc, l2, i2), s2 = st(id2);
    if(s2 && s2.parked_not_here) ids.push(id2);
  });
  return ids;
}
function unparkSiblings(ids){
  let reopened = 0;
  (ids || []).forEach(id2 => {
    const s2 = st(id2) || {};
    if(Number(s2.actual || 0) > 0.001) { setLine(id2, {parked_not_here:undefined}); return; }
    setLine(id2, {state:undefined, actual:undefined, adjustment:undefined, to_temp:undefined,
      temp_sku:undefined, temp_lot:undefined, pile_adj:undefined, reason:undefined,
      direction:undefined, parked_not_here:undefined});
    reopened++;
  });
  if(reopened) setTimeout(() => toast('⚠️ ' + reopened + ' other line' + (reopened===1?'':'s') +
    ' of this pile had been marked "not here" — answer ' + (reopened===1?'it':'them') + ' again'), 400);
  return reopened;
}

function tookFrom(id, actualLoc, why){
  const f = find(id);
  if(!f) return {ok:false, why:'that line is not in this plan'};
  const loc = String(actualLoc || '').trim();
  if(!loc) return {ok:false, why:'⛔ which pallet was it actually on?'};
  if(loc === f.p.loc) return {ok:false, why:'⛔ that is the pallet the plan already names.'};
  const hit = findPalletAt(loc);
  const other = hit && hit.p, un = null;
  if(!other)
    return {ok:false, why:'⛔ ' + loc + ' is not a pallet in this plan. ⭐ If you brought it '+
                          'down and it was not in the plan, record that first — it needs a '+
                          'card of its own.'};
   
  if(palletFreed(other)) return {ok:false, why:'⛔ ' + (other.pallet_id || loc) + ' is marked as an emptied deck that does not go back — nothing can be put on it. Un-mark the deck first.'};
  if(hit.b.n !== f.b.n && !palletCameDown(hit.b, other))
    return {ok:false, why:'⛔ ' + loc + ' is still in the rack — a pile cannot be on a pallet that '+
                          'has not come down. If the stock is at that spot, say "at another spot".'};
  if(!String(why || '').trim())
    return {ok:false, why:'⛔ say what happened — this is the signal that the plan had this '+
                          'pile in the wrong place, and nothing else carries it'};

  const off = pileCarriedBySiblings(f.b, f.p, f.l.sku, f.l.lot, id);
  if(off.units > 0.001){
    const pid = other.pallet_id || loc;
    return {ok:false, why:'⛔ ' + off.what.join(', ') + ' already recorded OFF ' + (f.p.pallet_id || f.p.loc) +
      ' for this pile, so the whole pile cannot have been on ' + pid + '. If extra were on ' + pid +
      ', open ' + pid + ' and use "⊕ Found something not on the list" — that records a MOVE from where '+
      'Finale holds it.'};
  }
  setLine(id, {from_actual:loc, from_actual_why:String(why).trim()});
  ev('took_from_other_pallet', {line:id, bay:f.b.n, planned:f.p.loc, actual:loc,
                                sku:f.l.sku, lot:f.l.lot || '', why:String(why).trim()});
  return {ok:true,
           
          note:'Recorded. ⭐ Finale still takes this stock out of ' + f.p.loc + ', because '+
               'that is where Finale believes it is — what changes is that the leftover goes '+
               'back up on ' + (other ? (other.pallet_id || loc) : loc) +
               '. ⛔ If Finale is also WRONG about where this pile lives, record that '+
               'separately.'};
}

function pileCarriedBySiblings(b, p, sku, lot, exceptId){
  let units = 0; const what = [];
  (p.lines || []).forEach((l, i) => {
    if(l.kind === 'count' || l.sku !== sku || (l.lot || '') !== (lot || '')) return;
    const id_ = lid(b.n, p.loc, l, i);
    if(id_ === exceptId) return;
    const s_ = S.lines[id_] || {};
    if(s_.state !== 'done') return;
    const q = Number(s_.actual || 0) + Number(s_.to_temp || 0);
    if((l.kind === 'take' || l.kind === 'aside' || s_.did_different) && q > 0.001){
      units += q;
      what.push(n(q) + (s_.did_different ? ' moved' : l.kind === 'take' ? ' taken' : ' set aside'));
    }
  });
  return {units:units, what:what};
}
 
function pileClaim(b, p, sku, lot){
  let out = null;
  (p.lines || []).forEach((l, i) => {
    if(l.kind === 'count' || l.sku !== sku || (l.lot || '') !== (lot || '')) return;
    const id_ = lid(b.n, p.loc, l, i), s_ = S.lines[id_] || {};
    if(s_.from_actual){ const h = findPalletAt(s_.from_actual);
      out = {id:id_, loc:s_.from_actual, pid:(h && h.p.pallet_id) || s_.from_actual}; }
  });
  return out;
}
 
function undoTookFrom(id){
  const f = find(id); if(!f) return;

  ev('took_from_other_pallet_undone', {line:id, was:was});
  toast('Undone — ' + f.l.sku + ' is back on ' + (f.p.pallet_id || f.p.loc));
  try{ const d = document.getElementById('dlg'); if(d && d.open) d.close(); }catch(e){}
