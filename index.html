function palletFinalLoc(pid){
  if(!pid) return null;
  if(palletFreed(pid)) return '';      

  const pushed = pushedFinalLoc(pid);
  if(pushed) return pushed;
  const a = actualFor(pid);
  if(a && a.loc) return a.loc;
  if(a && a.state === 'floor') return '';        

  const lop = loadOrderPos(pid);
  if(lop) return lop;
  const der = laneDerivedLoc(pid);
  if(der) return der;
  for(const b of PAYLOAD.bays)
    for(const pb of (b.putback || []))
      if(pb.pallet_id === pid) return pb.loc;
  return null;
}

function laneDerivedLoc(pid){
  for(const b of PAYLOAD.bays){
    const pbs = (b.putback || []).filter(x => x.pallet_id);
    if(!pbs.some(x => x.pallet_id === pid)) continue;
    const lane = b.bay || '';
    const dep = loc => { const s = String(loc || '');
      if(s.indexOf(lane + '-') !== 0) return 0;
      const r = s.slice(lane.length + 1); return /^\d+$/.test(r) ? Number(r) : 0; };
    const planned = pbs.filter(x => dep(x.loc) > 0);
    const named = {}, gone = new Set();
    let deviated = false, extra = 0;
    planned.forEach(x => {
      const a = actualFor(x.pallet_id);

      if(palletFreed(x.pallet_id)){ deviated = true; gone.add(x.pallet_id); return; }
      if(a && a.loc){ deviated = true;
        if(dep(a.loc)) named[x.pallet_id] = dep(a.loc); else gone.add(x.pallet_id); }
      else if(a && a.state === 'floor'){ deviated = true; gone.add(x.pallet_id); }
    });
     
    Object.keys(S.putback_actual || {}).forEach(k => {
      if(planned.some(x => x.pallet_id === k)) return;
      const a = actualFor(k);
      if(a && a.loc && dep(a.loc)){ named[k] = dep(a.loc); deviated = true; extra++; }
    });

    if(pbs.some(x => x.off_plan && !palletFreed(x.pallet_id))) deviated = true;
    if(!deviated) return '';                             
    const back = planned.filter(x => !gone.has(x.pallet_id));
    const N = back.length + extra;
    const taken = new Set(Object.values(named));
    const free = [];
    for(let d = N; d >= 1; d--) if(!taken.has(d)) free.push(d);         
    const unnamed = back.filter(x => !(x.pallet_id in named))
                        .sort((x, y) => dep(y.loc) - dep(x.loc));
    if(unnamed.length > free.length) return '';          
    const i = unnamed.findIndex(x => x.pallet_id === pid);
    if(i >= 0) return lane + '-' + free[i];
    return '';
  }
  return '';
}

function actualFor(pid){ return (S.putback_actual || {})[pid] || null; }

function bayWorked(b){
  const bs = S.bays[b.n] || {};
  if(bs.putback_done || bs.closed) return true;
   
  if((b.pallets || []).some(p2 => p2.off_plan)) return true;
  if((b.pallets || []).some(p2 => (p2.lines || []).some((l2, i2) =>
        (st(lid(b.n, p2.loc, l2, i2)) || {}).state))) return true;
   
  if((b.pallets || []).some(p2 => p2.pallet_id && actualFor(p2.pallet_id))) return true;
  if((b.putback  || []).some(pb => pb.pallet_id && actualFor(pb.pallet_id))) return true;
  return false;
}

function posOf(loc){
  const m = /-(\d+)$/.exec(String(loc || ''));
  return m ? Number(m[1]) : 0;
}
function deepestOpened(b){
  let d = 0;
  (b.pallets || []).forEach(p => {
    const touched = !!p.off_plan || !!(S.pallets || {})[p.loc]
      || (p.pallet_id && actualFor(p.pallet_id))
      || (p.lines || []).some((l, i) => (st(lid(b.n, p.loc, l, i)) || {}).state);
    if(touched) d = Math.max(d, posOf(p.loc));
  });
  return d;
}

function downedPalletAt(loc){
  for(const b of PAYLOAD.bays)
    for(const p of (b.pallets || []))
      if(p.loc === loc && palletCameDown(b, p) && !palletSettled(p)) return {b:b, p:p};
  return null;
}
function palletCameDown(b, p){
  if(p.off_plan) return true;        
  const bs = S.bays[b.n] || {};
   
  if(bs.putback_done) return true;
  if(p.pallet_id && actualFor(p.pallet_id)) return true;    
  if((S.pallets || {})[p.loc]) return true;                 
  if((p.lines || []).some((l, i) => (st(lid(b.n, p.loc, l, i)) || {}).state)) return true;
  return posOf(p.loc) < deepestOpened(b);    
}

function plannedLocFor(pid){
  for(const b of PAYLOAD.bays)
    for(const pb of (b.putback || []))
      if(pb.pallet_id === pid) return pb.loc;
  return '';
}

function moves(){

  const FLOOR = floorLoc();

            why: 'not here at all: Finale believed ' + n(l.system_qty) + ' on ' +
                 ((p && (p.pallet_id || p.loc)) || loc) + ', and ' + n(dec) +
                 ' of it is unaccounted for once everything carried off it is counted',

            clamped_from: (claimed - dec > 0.001 ? -claimed : undefined),
            sibling_took: (s.sibling_took != null ? s.sibling_took : 0),
            reason: s.reason, system_qty: l.system_qty, moved: 0,
            left_on_pallet: 0, not_here: true, ts: s.ts});
        } else if (dec > 0.001) {
          out.unresolved = out.unresolved || [];
          out.unresolved.push({bay:b.bay, from:loc, sku:l.sku, lot:l.lot || '', qty:dec, onto_pallet:'',
            why:'marked "not here at all" with no Finale reason code' +
                (s.reason ? ' ("'+s.reason+'" is not one of the accounting codes)' : '') +
                ' — re-open the line and choose one, or Finale is never told'});
        }
        return; }

      if(s.state === 'skipped'){ out.skipped.push({bay:b.bay, location:loc, sku:l.sku,
        lot:l.lot||'', kind:l.kind, planned_qty:l.planned_qty,
        approved_qty:(s.approved!=null?s.approved:l.planned_qty),

        onto_pallet:(l.kind === 'aside' ? (l.onto_pallet||'') : ''),
        onto_bay:(l.kind === 'aside' ? (l.onto_bay||'') : ''),
        cross:!!l.cross,
        reason:s.reason||'', reason_source:s.reason_source||'', ts:s.ts}); return; }

      if(l.kind === 'count'){
         
        const cf = countFigures(b, p, l, s);
        if(cf){

          out.counts.push({serial:l.serial, location:loc, sku:l.sku, lot:l.lot,
            final_location:(palletFinalLoc(p.pallet_id) || ''),
            onto_pallet:(p.pallet_id || ''),
            system_qty:l.system_qty, counted:cf.counted, variance:cf.variance, ts:s.ts,
            answer:(s.answer || 'unknown'),

            counted_basis:cf.basis,
            ...(cf.basis === 'left' ? {counted_left:cf.left, counted_carried:Math.round((cf.counted - cf.left) * 1000) / 1000} : {})});

          const cv = Number(cf.variance || 0);
          if(Math.abs(cv) > 0.001){
            const camedown = (downQty[loc + '|' + l.sku + ' ' + (l.lot || '')] || 0) > 0;
            const at = (FLOOR && camedown) ? FLOOR : loc;
            const list = cv < 0 ? (PAYLOAD.shrink_reasons || []) : (PAYLOAD.found_reasons || []);
            if(s.count_reason && list.indexOf(s.count_reason) >= 0){
              out.adjustments.push({location: at, origin: loc,
                posted_at: at === FLOOR ? 'restock floor' : 'origin',
                sku: l.sku, lot: l.lot || '', change: cv,
                direction: cv < 0 ? 'decrease' : 'increase',
                baseline: l.system_qty, sibling_took: 0, reason: s.count_reason,
                system_qty: l.system_qty, moved: '', left_on_pallet: cf.counted,

                from_count: true, serial: l.serial, counted: cf.counted, ts: s.ts});
            } else {
              out.unresolved = out.unresolved || [];
              out.unresolved.push({bay:b.bay, from:loc, sku:l.sku, lot:l.lot || '', qty:cv, onto_pallet:'',
                why:'counted ' + n(cf.counted) + ' against Finale\'s ' + n(l.system_qty) +
                    ' with no accounting reason' +
                    (s.count_reason ? ' ("'+s.count_reason+'" is not one of the codes)' : '') +
                    ' — re-open the count and choose one, or the variance is never posted'});
            }
          }
        }
        return;
      }
      const act = s.actual != null ? s.actual : null;
      if(act != null && act > 0){

        const parts = (s.placements && s.placements.length)
          ? s.placements
          : [{pallet: (l.kind === 'aside' ? (l.onto_pallet||'') : ''), qty: act, deviated:false}];
        parts.forEach(pt => {
          if(!(pt.qty > 0)) return;

          const asideLike = (l.kind === 'aside') || !!(s.did_different && pt.pallet);

          const rawDest = pt.location ? pt.location
                        : (l.kind === 'take' && !pt.pallet) ? (l.dest || '')
                                                            : (palletFinalLoc(pt.pallet) || '');

          const pdest = (rawDest && rawDest !== tempLoc() && !/^F[123]/.test(rawDest)
                         && (l.kind === 'take' || pt.location)) ? '' : rawDest;

          const fromFloor = (key !== 'ORPHAN') && floorPallets.has(loc);
          const src = fromFloor ? FLOOR : loc;

          const pdest_forced = !!(asideLike && pt.pallet && actualFor(pt.pallet));

          if(!pdest && asideLike && fromFloor && pt.pallet && floorPalletIds.has(pt.pallet) &&
             !arrivedTooLate(pt.pallet, pt.ts || s.done_ts || s.ts)){    
            floorHandoff[(pileOnPallet(b, p, l.sku, l.lot) || loc) + '|' + l.sku + ' ' + (l.lot || '')] =
              (floorHandoff[(pileOnPallet(b, p, l.sku, l.lot) || loc) + '|' + l.sku + ' ' + (l.lot || '')] || 0) + pt.qty;
            return;
          }
          if(!pdest){

            if(l.kind === 'take' && !pt.pallet){

              floorHandoff[(pileOnPallet(b, p, l.sku, l.lot) || loc) + '|' + l.sku + ' ' + (l.lot || '')] =
                (floorHandoff[(pileOnPallet(b, p, l.sku, l.lot) || loc) + '|' + l.sku + ' ' + (l.lot || '')] || 0) + pt.qty;
              strand({bay:b.bay, origin:loc, sku:l.sku, lot:l.lot||'', units:pt.qty,
                pallet:'', cause:'no_f1_home', handedOff:true,
                why: rawDest
                  ? 'the plan sends this to "' + rawDest + '", which is not a real F1 spot — '+
                    'this SKU has no home on the floor. Scan where you actually put it.'
                  : 'the plan names no destination for this pick — scan where you put it'});
              return;
            }
            const pa = actualFor(pt.pallet);
            strand({bay:b.bay, origin:loc, sku:l.sku, lot:l.lot||'', units:pt.qty,
              pallet:pt.pallet||'', handedOff:true,
              cause: pt.floor ? 'loose' : (pa && pa.state === 'floor') ? 'pallet_down'
                                                                      : 'no_position',
              why: pt.floor
                     ? 'the crew put this part nowhere — it is loose on the floor'
                   : (pa && pa.state === 'floor')
                     ? 'it was carried onto pallet '+(pt.pallet||'?')+', which never went '+
                       'back up — so it is standing on the floor on that pallet'
                     : 'it was carried onto pallet '+(pt.pallet||'?')+', and nobody recorded '+
                       'where that pallet ended up'});

            if(fromFloor){

              floorHandoff[(pileOnPallet(b, p, l.sku, l.lot) || loc) + '|' + l.sku + ' ' + (l.lot || '')] =
                (floorHandoff[(pileOnPallet(b, p, l.sku, l.lot) || loc) + '|' + l.sku + ' ' + (l.lot || '')] || 0) + pt.qty;
              return;
            }
          }

          if(asideLike && fromFloor && pt.pallet &&
             !floorPalletIds.has(pt.pallet) && !pdest_forced){
            strand({bay:b.bay, origin:loc, sku:l.sku, lot:l.lot||'', units:pt.qty,
              pallet:pt.pallet, cause:'awaiting_bay', handedOff:true,
              why:'set aside for pallet ' + pt.pallet +
                  (l.onto_bay ? ' in bay ' + l.onto_bay : '') + ', which has not been ' +
                  'worked yet — the stock is on the restock floor waiting for it'});
            floorHandoff[(pileOnPallet(b, p, l.sku, l.lot) || loc) + '|' + l.sku + ' ' + (l.lot || '')] =
              (floorHandoff[(pileOnPallet(b, p, l.sku, l.lot) || loc) + '|' + l.sku + ' ' + (l.lot || '')] || 0) + pt.qty;
            return;
          }

          if(asideLike && fromFloor && pt.pallet &&
             arrivedTooLate(pt.pallet, pt.ts || s.done_ts || s.ts)){    
            strand({bay:b.bay, origin:loc, sku:l.sku, lot:l.lot||'', units:pt.qty,
              pallet:pt.pallet, cause:'receiver_already_up', handedOff:true,
              why:'set aside for pallet ' + pt.pallet + ', but that pallet had already gone '+
                  'back up before this was recorded — the stock is on the restock floor'});
            floorHandoff[(pileOnPallet(b, p, l.sku, l.lot) || loc) + '|' + l.sku + ' ' + (l.lot || '')] =
              (floorHandoff[(pileOnPallet(b, p, l.sku, l.lot) || loc) + '|' + l.sku + ' ' + (l.lot || '')] || 0) + pt.qty;
            return;
          }
          if(asideLike && fromFloor && pt.pallet &&
             floorPalletIds.has(pt.pallet)){

            floorHandoff[(pileOnPallet(b, p, l.sku, l.lot) || loc) + '|' + l.sku + ' ' + (l.lot || '')] =
              (floorHandoff[(pileOnPallet(b, p, l.sku, l.lot) || loc) + '|' + l.sku + ' ' + (l.lot || '')] || 0) + pt.qty;
            return;
          }

          if(src === pdest && FLOOR && pdest === FLOOR){
            floorHandoff[(pileOnPallet(b, p, l.sku, l.lot) || loc) + '|' + l.sku + ' ' + (l.lot || '')] =
              (floorHandoff[(pileOnPallet(b, p, l.sku, l.lot) || loc) + '|' + l.sku + ' ' + (l.lot || '')] || 0) + pt.qty;
            FLOOR_KEPT.push({sku:l.sku, lot:l.lot || '', units:pt.qty});
            return;
          }
          out.transfers.push({from_location: src,
            to_location: pdest,
            on_floor_src: fromFloor,

            from_pallet_loc: (s.from_actual || pileOnPallet(b, p, l.sku, l.lot) || loc),

            onto_pallet: (s.did_different ? (pt.pallet || '')
                                          : (l.kind === 'aside' ? (pt.pallet||'') : '')),
            sku:l.sku, lot:l.lot||'', quantity:pt.qty,
            planned_qty:l.planned_qty, approved_qty:(s.approved!=null?s.approved:l.planned_qty),

            as_planned: !pt.deviated,
            planned_pallet: l.kind === 'aside' ? (l.onto_pallet||'') : '',
             
            took_from_sibling: s.took_from_sibling || '',
            sibling_line: s.sibling_line || '',
            kind:(s.did_different ? (pt.pallet ? 'aside' : 'take') : l.kind),

            why_different: s.did_different ? (s.why_different || '') : '',
            bay:b.bay, ts:s.ts});
        });
      }

      const backRaw = Number(s.from_temp || 0);
      if(backRaw > 0.001 && tempLoc()){
        const backTo = adjLoc(p, l, !(S.bays[b.n]||{}).putback_done,
                              FLOOR && floorPallets.has(loc)) || loc;
         
        const backLot = (s.from_temp_lot != null) ? s.from_temp_lot : (l.lot || '');
        out.transfers.push({bay:b.bay, from_location:tempLoc(), to_location:backTo,
          from_pallet_loc:'', onto_pallet:(p&&p.pallet_id)||'', sku:l.sku, lot:backLot,
          quantity:backRaw, kind:'from_temp', planned_qty:l.planned_qty,
          matched_line_lot:(backLot === (l.lot||'') ? undefined : (l.lot||'')),
          why:'turned up here — taken back out of '+tempLoc(), ts:s.ts});

        if(FLOOR && backTo === FLOOR){

          const tk = loc + '|' + l.sku + ' ' + (backLot || '');
          tempReturned[tk] = (tempReturned[tk] || 0) + backRaw;
        }
      }
      const parkRaw = Number(s.to_temp || 0);
      const park = parkRaw > 0 ? Math.min(parkRaw, shareCeiling()) : 0;
      if(park > 0.001 && FLOOR && tempLoc()){
        out.transfers.push({bay:b.bay, from_location:FLOOR, to_location:tempLoc(),
          from_pallet_loc:loc, onto_pallet:'', sku:l.sku, lot:l.lot||'',
          quantity:park, kind:'to_temp', planned_qty:l.planned_qty,
          why:'owed but not found on '+(p&&p.pallet_id||loc)+' — parked until it turns up',
          clamped_from:(Math.abs(parkRaw - park) > 0.001 ? parkRaw : undefined),
          ts:s.ts});
      }

      const rawAdj = Number(s.adjustment || 0);
      const adjOut = rawAdj < 0 ? -Math.min(-rawAdj, shareCeiling()) : rawAdj;
      if(adjOut && Math.abs(adjOut) > 0.001){

        const shrinkAt = (FLOOR && floorPallets.has(loc)) ? FLOOR : loc;
        out.adjustments.push({location: (adjOut > 0

                                         ? (adjLoc(p, l, !(S.bays[b.n]||{}).putback_done,
                                                    FLOOR && floorPallets.has(loc)) || loc)
                                         : shrinkAt),

          origin: loc,

          posted_at: ((adjOut > 0
                         ? (adjLoc(p, l, !(S.bays[b.n]||{}).putback_done,
                                   FLOOR && floorPallets.has(loc)) || loc)
                         : shrinkAt) === FLOOR
                      ? 'restock floor'
                      : (adjOut > 0 ? 'final position' : 'origin')),
          sku:l.sku, lot:l.lot||'',
          change:adjOut, direction:adjOut<0?'decrease':'increase',

          clamped_from:(Math.abs(rawAdj - adjOut) > 0.001 ? rawAdj : undefined),
          baseline:(s.baseline != null ? s.baseline : l.system_qty),
          sibling_took:(s.sibling_took != null ? s.sibling_took : 0),

          why:s.adj_why||'', reason:s.reason||'', system_qty:l.system_qty,
          moved:(s.actual!=null?s.actual:0), left_on_pallet:(s.left!=null?s.left:''), ts:s.ts});
      }
    };
    b.pallets.forEach(p => p.lines.forEach((l,i) => push(p, l, i, p.loc, p.loc)));

    (b.orphan_pulls||[]).forEach((o,i) =>
      push(null, o, i, 'ORPHAN', o.from_location || 'ORPHAN'));
  });

  (S.found_here || []).forEach(fh => {

    const camedown = (downQty[fh.loc + '|' + fh.sku + ' ' + (fh.lot || '')] || 0) > 0 ||
                     !!downedPalletAt(fh.loc);
    const at = (FLOOR && camedown) ? FLOOR : fh.loc;
    out.adjustments.push({location:at, origin:fh.loc,
      posted_at: at === FLOOR ? 'restock floor' : 'origin',
      sku:fh.sku, lot:fh.lot || '', change:Number(fh.qty || 0), direction:'increase',
      baseline:0, sibling_took:0, reason:fh.reason,
      system_qty:0, moved:'', left_on_pallet:'',

      from_count:true, found_here:true, why:fh.why || '', ts:fh.ts,

      lot_new: fh.lot_new ? true : undefined, lot_source: fh.lot_new ? (fh.lot_source || 'typed') : undefined});
  });

  (S.found_moves || []).forEach(fm => {

    const dFrom = FLOOR ? downedPalletAt(fm.from) : null;

    const dTo   = FLOOR ? fmDest(fm) : null;
    const fFrom = dFrom ? FLOOR : fm.from, fTo = dTo ? FLOOR : fm.to;
    if(fFrom === fTo) return;           
    out.transfers.push({from_location:fFrom, to_location:fTo, onto_pallet:dTo ? (dTo.p.pallet_id||'') : '',
      from_pallet_loc: dFrom ? fm.from : '', found_to_pallet_loc: dTo ? dTo.p.loc : '',
      sku:fm.sku, lot:fm.lot || '', quantity:Number(fm.qty || 0),
      planned_qty:'', approved_qty:'', as_planned:false, planned_pallet:'',
      took_from_sibling:'', sibling_line:'', bay:'', spoil:false,
      kind:'found_move', why_different:fm.why || '', ts:fm.ts});
  });

  Object.keys(S.adhoc_counts || {}).forEach(k => {
    const c = S.adhoc_counts[k];
    if(c.counted == null) return;               
    const b = PAYLOAD.bays.find(x => x.n === c.bay);
    const p = b && (b.pallets || []).find(x => x.loc === c.loc);
    out.counts.push({serial:c.serial, location:c.loc, sku:c.sku, lot:c.lot || '',
      final_location:(p ? (palletFinalLoc(p.pallet_id) || '') : ''),
      onto_pallet:(p ? (p.pallet_id || '') : ''),
      system_qty:c.system_qty, counted:c.counted, variance:c.variance,
      ad_hoc:true, why:c.why || '', ts:c.ts, answer:'typed'});
    const cv = Number(c.variance || 0);
    if(Math.abs(cv) <= 0.001) return;
    const list = cv < 0 ? (PAYLOAD.shrink_reasons || []) : (PAYLOAD.found_reasons || []);
    if(!(c.reason && list.indexOf(c.reason) >= 0)){
      out.unresolved = out.unresolved || [];
      out.unresolved.push({bay:c.bay_name || '', from:c.loc, sku:c.sku, lot:c.lot || '',
        qty:cv, onto_pallet:c.pallet_id || '',
        why:'ad-hoc count ' + c.serial + ' found ' + n(c.counted) + ' against Finale\u2019s ' +
            n(c.system_qty) + ' with no accounting reason — the variance is never posted'});
      return;
    }
    const camedown = (downQty[c.loc + '|' + c.sku + ' ' + (c.lot || '')] || 0) > 0;
    const at = (FLOOR && camedown) ? FLOOR : c.loc;
    out.adjustments.push({location:at, origin:c.loc,
      posted_at: at === FLOOR ? 'restock floor' : 'origin',
      sku:c.sku, lot:c.lot || '', change:cv,
      direction: cv < 0 ? 'decrease' : 'increase',
      baseline:c.system_qty, sibling_took:0, reason:c.reason,
      system_qty:c.system_qty, moved:'', left_on_pallet:c.counted,
      from_count:true, ad_hoc:true, serial:c.serial, counted:c.counted, ts:c.ts});
  });

  PAYLOAD.bays.forEach(b => {

    const bs = S.bays[b.n] || {};
    if(!bayWorked(b)) return;               
    const onFloor = !bs.putback_done;       
    (b.pallets || []).forEach(p => {

      if(!palletCameDown(b, p)) return;

      if(palletSettled(p)) return;
      const origin = p.loc;
      const a = actualFor(p.pallet_id);
      const final = palletFinalLoc(p.pallet_id);

      const recordedHome = !!(a && a.loc && a.state !== 'floor');
      const key = (sk, lt) => sk + ' ' + (lt || '');

      if(!out._pile) Object.defineProperty(out, '_pile', {value:{cover:{}, piles:{}}, enumerable:false});
      out._pile.cover[p.pallet_id || p.loc] = true;

      const gone = {};

      const extraOn = {};
      out.transfers.forEach(t => {

        if (t.kind === 'pallet_down') return;

        const from = t.from_location;
        const mine = (from === origin) ||
                     (FLOOR && from === FLOOR && t.onto_pallet === p.pallet_id) ||
                     (FLOOR && from === FLOOR && t.from_pallet_loc === origin);
        if (mine)
          gone[key(t.sku, t.lot)] = (gone[key(t.sku, t.lot)] || 0) + Number(t.quantity || 0);
      });

      Object.keys(floorHandoff).forEach(kk => {
        const [oloc, sk] = kk.split('|');
        if (oloc === origin) gone[sk] = (gone[sk] || 0) + floorHandoff[kk];
      });

      Object.keys(tempReturned).forEach(kk => {
        const i = kk.indexOf('|');
        if (kk.slice(0, i) !== origin) return;
        const sk = kk.slice(i + 1);
        gone[sk] = (gone[sk] || 0) - tempReturned[kk];
      });
      (out.missing || []).forEach(m => {

        if (m.from === origin && !m.posted_adjustment)
          gone[key(m.sku, m.lot)] = (gone[key(m.sku, m.lot)] || 0) + Number(m.suggested_decrease || 0);
      });

      (out.adjustments || []).forEach(a => {
        if (!FLOOR || a.location !== FLOOR) return;
        if (a.origin !== origin) return;
        const ch = Number(a.change || 0);
        if (ch < 0) gone[key(a.sku, a.lot)] = (gone[key(a.sku, a.lot)] || 0) + (-ch);

        else if (a.from_count || a.posted_at === 'restock floor' ||
                 (FLOOR && a.location === FLOOR)){
          gone[key(a.sku, a.lot)] = (gone[key(a.sku, a.lot)] || 0) + (-ch);
          if (ch > 0) extraOn[key(a.sku, a.lot)] = {sku: a.sku, lot: a.lot || ''};
        }
      });

      (S.found_moves || []).forEach(fm => {
        if (!FLOOR) return;
        const kk = key(fm.sku, fm.lot);
        if (fmOnto(fm, p)){                        
          gone[kk] = (gone[kk] || 0) - Number(fm.qty || 0);
          extraOn[kk] = {sku: fm.sku, lot: fm.lot || ''};
        }

        if (fm.from === origin && fmDest(fm))
          gone[kk] = (gone[kk] || 0) + Number(fm.qty || 0);
      });

      const onIt = {};
      (p.lines || []).forEach(l => {
        if (l.kind === 'count') return;
        const k = key(l.sku, l.lot);

        if (pileSettled(b, p, l.sku, l.lot)) return;

        if (pileOnPallet(b, p, l.sku, l.lot)) return;
        if (!(k in onIt)) onIt[k] = {sku: l.sku, lot: l.lot || '', qty: Number(l.system_qty || 0)};
      });

      pilesClaimedBy(b, p).forEach(x => {
        const k = key(x.sku, x.lot);
        if (k in onIt) onIt[k].qty += x.qty;
        else onIt[k] = {sku: x.sku, lot: x.lot, qty: x.qty, claimed_from: x.from};
      });

      if (FLOOR && p.pallet_id) {
        arrivalsFor(p.pallet_id).forEach(x => {
          if (x.gone) return;                        

          if (!x.state) return;                      

          if (x.tooLate) return;
          const q = Number(x.qty || 0);
          if (!(q > 0)) return;
          const k = key(x.sku, x.lot);
          if (onIt[k]) onIt[k].qty += q;             
          else onIt[k] = {sku: x.sku, lot: x.lot || '', qty: q, arrived: true};
        });
      }
      Object.keys(extraOn).forEach(k => {
        if (!(k in onIt)) onIt[k] = {sku: extraOn[k].sku, lot: extraOn[k].lot, qty: 0, found: true};
      });

      const splitTo = {};
      Object.keys(S.split_contents || {}).forEach(newPid => {
        const rec = S.split_contents[newPid];
        if (!rec || rec.from !== p.pallet_id) return;

        (rec.items || []).forEach(x => {
          const kk = key(x.sku, x.lot);
          (splitTo[kk] = splitTo[kk] || []).push(
            {pid: newPid, qty: (x.qty == null ? Infinity : Number(x.qty))});
        });
      });

      const stillDown = {};
      const _ld = (S.left_down || {})[p.pallet_id];
      ((_ld && _ld.items) || []).forEach(x => {
        const kk = key(x.sku, x.lot);
        stillDown[kk] = (stillDown[kk] || 0) + Number(x.qty || 0);
      });

      Object.keys(onIt).forEach(k => {
        const it = onIt[k];
        let left = Math.round((it.qty - (gone[k] || 0)) * 1000) / 1000;
        if (left <= 0.001) return;

        const plKey = p.pallet_id || p.loc;
        out.pallet_left = out.pallet_left || {};
        out.pallet_left[plKey] = (out.pallet_left[plKey] || 0) + left;
        const pk_ = out._pile.piles[plKey] = out._pile.piles[plKey] || {};
        pk_[k] = Math.round(((pk_[k] || 0) + left) * 1000) / 1000;
        const bookOff = q_ => { pk_[k] = Math.round((pk_[k] - q_) * 1000) / 1000; out.pallet_left[plKey] =
          Math.round((out.pallet_left[plKey] - q_) * 1000) / 1000; };
        const downQ = Math.min(left, stillDown[k] || 0);

            } else if (!ofin) {

                pallet:otherPid, cause:'no_position',
                why:'it went onto ' + otherPid + ' when this pallet was split, and nobody '+
                    'recorded where ' + otherPid + ' ended up'});
            } else if (ofin === ((FLOOR && floorPallets.has(origin)) ? FLOOR : origin)) {

            } else {
              out.transfers.push({
                from_location: (FLOOR && floorPallets.has(origin)) ? FLOOR : origin,
                on_floor_src: floorPallets.has(origin),
                from_pallet_loc: origin,

                kind: 'pallet_move', split_from: p.pallet_id || '', spoil: !!p.spoil,

          if (rest > 0.001 && (!onFloor || recordedHome)) {

            } else if (restDest === ((FLOOR && floorPallets.has(origin)) ? FLOOR : origin)) {
               
            } else {

  const down = [], park = [], rest = [];
  out.transfers.forEach(t => (t.kind === 'pallet_down' ? down

  out.transfers = down.concat(park, rest);

  const shiftSeen = new Set();
  (PAYLOAD.shifted_pallets || []).forEach(sp => {

  PAYLOAD.bays.forEach(bay => {

  {

        const held = new Set(r.piles.map(x => x.sku + '|' + (x.lot || '')));
        const extra = foundIntoOnly(lane + '-' + r.pos, held)
                        .map(x => Object.assign({extra_find:true}, x));
        r.piles.concat(extra).forEach(x => {
        const from = lane + '-' + r.pos, to = lane + '-' + (r.pos + N);

        const q = x.extra_find ? Number(x.qty || 0) : netPileQty(from, x.sku, x.lot || '', x.qty);
        if(!(q > 0)) return;
        out.transfers.push({from_location: from, to_location: to,
          from_pallet_loc: from, onto_pallet: '',
          sku: x.sku, lot: x.lot || '', quantity: q,
          planned_qty: '', approved_qty: '', as_planned: false, planned_pallet: '',
          took_from_sibling: '', sibling_line: '',
          kind: 'lane_shift', untouched: true, pushed_by: who.join(','), bay: lane,
          ts: new Date().toISOString()});
        });
      });

    });
  }

  if(FLOOR && floorOrphans.length){
    const fixes = S.floor_fix || {};

    const retireHandoff = (o, k) => {
      if(!o.handedOff) return;

    };
    floorOrphans.forEach(o => {
      const f = fixes[o.fixKey];
      if(!f) return;
      const k = o.sku + ' ' + (o.lot || '');

      if(f.action === 'moved' && f.to === FLOOR){
        return;
      }
      if(f.action === 'moved' && f.to){
        o.fixed = {action:'moved', to:f.to};
        out.transfers.push({from_location: FLOOR, to_location: f.to,
          from_pallet_loc: o.origin, onto_pallet: o.pallet || '',
          sku:o.sku, lot:o.lot || '', quantity:o.units,
          planned_qty:'', approved_qty:'', as_planned:false, planned_pallet:'',
          took_from_sibling:'', sibling_line:'', on_floor_src:true,

          kind:'orphan_placed', bay:o.bay, note:f.note || '',
          ts:f.ts || new Date().toISOString()});
        floorStranded[k] = (floorStranded[k] || 0) - o.units;
        retireHandoff(o, k);
      } else if(f.action === 'lost' && f.reason){
        o.fixed = {action:'lost', reason:f.reason};
         
        out.adjustments.push({location: FLOOR, origin: o.origin, posted_at:'restock floor',
          sku:o.sku, lot:o.lot || '', change: -o.units, direction:'decrease',
          baseline:o.units, sibling_took:0, reason:f.reason, system_qty:'',

          ts:f.ts || new Date().toISOString()});
        floorStranded[k] = (floorStranded[k] || 0) - o.units;
        retireHandoff(o, k);
      }
    });

    const retracted = floorOrphans.filter(o => o.fixed && o._urow);
    if(retracted.length){
      const drop = new Set(retracted.map(o => o._urow));
      out.unresolved = (out.unresolved || []).filter(r => !drop.has(r));

    floorOrphans.forEach(o => { delete o._urow; });
  }
  out.floor_orphans = floorOrphans;

  if(FLOOR){
    const net = {}, expected = {};
    const bump = (o, k, v) => { o[k] = (o[k] || 0) + v; };
    out.transfers.forEach(t => {
      const k = t.sku + ' ' + (t.lot || '');
      if(t.to_location === FLOOR) bump(net, k, Number(t.quantity || 0));
      if(t.from_location === FLOOR) bump(net, k, -Number(t.quantity || 0));
    });
    (out.adjustments || []).forEach(a => {
      if(a.location === FLOOR) bump(net, a.sku + ' ' + (a.lot || ''), Number(a.change || 0));
    });

    const residualCovered = new Set();

    PAYLOAD.bays.forEach(b => {
      (b.pallets || []).forEach(p => {
        if(!floorPallets.has(p.loc)) return;        
        residualCovered.add(p.loc);

        const arr = p.pallet_id
          ? arrivalsFor(p.pallet_id).filter(x => !x.gone && x.state && !x.tooLate) : [];
        const keySet = new Map();
        (p.lines || []).forEach(l => {
          if(l.kind === 'count') return;

          if(pileSettled(b, p, l.sku, l.lot)) return;

          if(pileOnPallet(b, p, l.sku, l.lot)) return;
          const k = l.sku + ' ' + (l.lot || '');
          if(!keySet.has(k)) keySet.set(k, Number(l.system_qty || 0));
        });

        pilesClaimedBy(b, p).forEach(x => {
          const k = x.sku + ' ' + (x.lot || '');
          keySet.set(k, (keySet.has(k) ? keySet.get(k) : 0) + x.qty);
        });
        arr.forEach(x => {
          const k = x.sku + ' ' + (x.lot || '');
          if(!keySet.has(k)) keySet.set(k, 0);      
        });
         
        (S.found_moves || []).forEach(fm => { if(!fmOnto(fm, p)) return;
          const k = fm.sku + ' ' + (fm.lot || ''); if(!keySet.has(k)) keySet.set(k, 0); });
        (out.adjustments || []).forEach(a => { if(a.location !== FLOOR || a.origin !== p.loc) return;
          const k = a.sku + ' ' + (a.lot || ''); if(!keySet.has(k)) keySet.set(k, 0); });
        keySet.forEach((base, k) => {

          out.transfers.forEach(t => {

          q -= (floorHandoff[p.loc + '|' + k] || 0);    

          q += (tempReturned[p.loc + '|' + k] || 0);

          (S.found_moves || []).forEach(fm => {

            if (fmOnto(fm, p)) q += Number(fm.qty || 0);

          arr.forEach(x => {

          (out.adjustments || []).forEach(a => {
            if((a.sku + ' ' + (a.lot || '')) === k && a.location === FLOOR &&
               a.origin === p.loc) q += Number(a.change || 0);

        });

    });

    floorOrphans.forEach(o => {
      if(o.fixed) return;                           

      if(!o.handedOff && residualCovered.has(o.origin)) return;

        PAYLOAD.bays.forEach(bb => (bb.pallets || []).forEach(pp => {

                          x.sku === o.sku && (x.lot || '') === (o.lot || ''));
        if(recv && recv !== o.origin && residualCovered.has(recv) && counted) return;
      }
      bump(expected, o.sku + ' ' + (o.lot || ''), o.units);
    });
     
    FLOOR_KEPT.forEach(x => bump(expected, x.sku + ' ' + (x.lot || ''), x.units));
    const keys = new Set(Object.keys(net).concat(Object.keys(expected)));

  out.clamped = [];
  (out.adjustments || []).forEach(a => {
    if(a.clamped_from === undefined || a.clamped_from === null) return;
    out.clamped.push({sku:a.sku, lot:a.lot || '', origin:a.origin || '',
                      asked:Number(a.clamped_from), wrote:Number(a.change),
                      kind:'write-off'});
  });
  (out.transfers || []).forEach(t => {
    if(t.clamped_from === undefined || t.clamped_from === null) return;
    out.clamped.push({sku:t.sku, lot:t.lot || '', origin:t.from_pallet_loc || t.from_location || '',
                      asked:Number(t.clamped_from), wrote:Number(t.quantity),
                      kind:'parked in temp'});
  });

    out.floor_holding = Object.keys(net)
      .filter(k => Math.abs(net[k]) > 0.001)
      .map(k => ({key: k, units: Math.round(net[k] * 1000) / 1000}));
    out.floor_unbalanced = [...keys]
      .map(k => ({key: k, net: net[k] || 0, expected: expected[k] || 0,
                  diff: Math.round(((net[k] || 0) - (expected[k] || 0)) * 1000) / 1000}))

      .concat([...keys]
        .filter(k => (net[k] || 0) < -0.001)
        .map(k => ({key: k, net: net[k] || 0, expected: expected[k] || 0,
                    diff: Math.round((net[k] || 0) * 1000) / 1000,
                    negative_floor: true})))
      .filter(x => x.negative_floor || Math.abs(x.diff) > 0.001)
       
      .filter((x, i, all) => all.findIndex(y => y.key === x.key && !!y.negative_floor === !!x.negative_floor) === i)
      .sort((a, b) => (b.negative_floor ? 1 : 0) - (a.negative_floor ? 1 : 0));
  }

  out.lot_changes = []; out.lot_changes_unapplied = [];
  const FLR = floorLoc();
  (S.lot_fix || []).forEach(fx => {
    if(!fx || !fx.confirmed || fx.by !== 'crew') return;

    const bS = PAYLOAD.bays.find(x => x.n === fx.bay);
    const pS = bS && (bS.pallets || []).find(q => q.loc === fx.loc);
    if(bS && pS && (palletSettled(pS) || pileSettled(bS, pS, fx.sku, fx.from_lot || ''))){
      out.lot_changes_unapplied.push({sku:fx.sku, from_lot:fx.from_lot, to_lot:fx.to_lot, bay:fx.bay,
        loc:fx.loc, qty:fx.qty || '', why:'this pile was marked "leave it — Finale is right", so '+
        'this lot correction is not sent (if it was sent earlier, Finale already has it); '+
        'otherwise fix the lot in Finale by hand'});
      return;
    }
    const up = {};

    (out.transfers || []).forEach(t => {
      if(t.sku !== fx.sku || (t.lot || '') !== (fx.from_lot || '')) return;
      if(t.from_location !== FLR || !/^F[23]-/.test(t.to_location || '')) return;
      const mine = t.from_pallet_loc ? t.from_pallet_loc === fx.loc : t.onto_pallet === fx.pallet_id;
      if(mine) up[t.to_location] = (up[t.to_location] || 0) + Number(t.quantity || 0);
    });
    const came = downedPalletAt(fx.loc);
    if(!Object.keys(up).length && !came){
      const b_ = PAYLOAD.bays.find(x => x.n === fx.bay);
      const p_ = b_ && (b_.pallets || []).find(q => q.loc === fx.loc);

      let q_ = 0;
      if(p_) (p_.lines || []).forEach(l => { if(l.sku === fx.sku && (l.lot || '') === (fx.from_lot || ''))
        q_ = Math.max(q_, Number(l.system_qty || 0)); });
      if(q_ > 0) up[fx.loc] = q_;
    }

    (out.adjustments || []).forEach(a => {
      if(a.sku !== fx.sku || (a.lot || '') !== (fx.from_lot || '')) return;
      if((a.origin || a.location) !== fx.loc || !/^F[23]-/.test(a.location || '')) return;
      if(up[a.location] === undefined && Number(a.change) < 0) return;
      up[a.location] = (up[a.location] || 0) + Number(a.change || 0);
    });
    let want = Number(fx.qty) > 0 ? Number(fx.qty) : Infinity;
    const keys = Object.keys(up).filter(k => up[k] > 0.0005).sort();
    if(!keys.length){
      out.lot_changes_unapplied.push({sku:fx.sku, from_lot:fx.from_lot, to_lot:fx.to_lot, bay:fx.bay,
        loc:fx.loc, qty:fx.qty || '', why:'none of it went back up into reserve from this pallet '+
        '(taken to the floor faces, or the pallet is still down), so there is no pile to relabel'});
      return;
    }

    const toFace = (out.transfers || []).some(t => t.sku === fx.sku &&
      (t.lot || '') === (fx.from_lot || '') && t.from_location === FLR &&
      t.from_pallet_loc === fx.loc && !/^F[23]-/.test(t.to_location || '') &&
      t.kind !== 'to_temp' &&      
      Number(t.quantity || 0) > 0);
    if(isFinite(want) && toFace){
      out.lot_changes_unapplied.push({sku:fx.sku, from_lot:fx.from_lot, to_lot:fx.to_lot, bay:fx.bay,
        loc:fx.loc, qty:want, why:'part of this pile also went to the floor faces — we cannot tell '+
        'whether those boxes are in the rack or on the face; fix that lot in Finale by hand'});
      return;
    }

    if(isFinite(want) && keys.length > 1 && want < keys.reduce((t, k) => t + up[k], 0) - 0.0005){
      out.lot_changes_unapplied.push({sku:fx.sku, from_lot:fx.from_lot, to_lot:fx.to_lot, bay:fx.bay,
        loc:fx.loc, qty:want, why:'part of this pile went to ' + keys.join(' and ') +
        ' — we cannot tell which place holds those boxes; fix that lot in Finale by hand'});
      return;
    }
    const asked = want;
    keys.forEach(k => { if(want <= 0.0005) return;
      const q = Math.min(up[k], want); want -= q;
      out.lot_changes.push({location:k, origin:fx.loc, pallet:fx.pallet_id,
        sku:fx.sku, from_lot:fx.from_lot || '', to_lot:fx.to_lot, quantity:q,
        to_new:!!fx.to_new, by:'crew', confirmed_ts:fx.ts}); });
    if(isFinite(asked) && want > 0.0005)
      out.lot_changes_unapplied.push({sku:fx.sku, from_lot:fx.from_lot, to_lot:fx.to_lot, bay:fx.bay,
        loc:fx.loc, qty:want, why:'only ' + n(asked - want) + ' of the ' + n(asked) +
        ' went back up into reserve; the other ' + n(want) + ' cannot be relabelled here'});
  });
  const LOTIDS = PAYLOAD.lot_ids || {};

  (PAYLOAD.temp_stock || []).forEach(r => {
    const k = r.sku + '|' + (r.lot || '');
    if(!LOTIDS[k] && r.lot_id) LOTIDS[k] = r.lot_id;
  });

  const NEWLOT = {};
  (S.found_here || []).forEach(fh => { if(fh.lot_new && fh.lot) NEWLOT[fh.sku + '|' + fh.lot] = fh.lot; });
  (S.lot_fix || []).forEach(fx => { if(fx.to_new && fx.to_lot) NEWLOT[fx.sku + '|' + fx.to_lot] = fx.to_lot; });
  ['transfers', 'adjustments', 'counts', 'pallet_moves', 'unresolved', 'fullness']
    .forEach(bucket => {
      (out[bucket] || []).forEach(r => {
        if(!r || !r.sku) return;
        const k = r.sku + '|' + (r.lot || '');
        const raw = LOTIDS[k] || NEWLOT[k];
        r.lot_id = (r.lot ? (raw || '') : '');
        if(NEWLOT[k] && !LOTIDS[k]) r.lot_new = true;
      });
    });
  out.lot_changes.forEach(r => {
    r.from_lot_id = r.from_lot ? (LOTIDS[r.sku + '|' + r.from_lot] || '') : '';
    r.to_lot_id = LOTIDS[r.sku + '|' + r.to_lot] || NEWLOT[r.sku + '|' + r.to_lot] || '';
  });
  return out;
}
function csv(rows){
  if(!rows.length) return '';

  const k = [];
  rows.forEach(r => Object.keys(r).forEach(x => { if(!k.includes(x)) k.push(x); }));
  const q = v => { v = v==null?'':String(v);
    return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  return k.join(',')+'\n'+rows.map(r=>k.map(x=>q(r[x])).join(',')).join('\n')+'\n';
}
function dl(which){

  if(['transfers', 'adjustments', 'lot_changes'].indexOf(which) >= 0 && offPlanConflicts().length)
    return toast('⛔ ' + offPlanConflicts().map(offPlanConflictText).join(' · ') +
                 ' — tell Jack before exporting stock moves.');
  const m = moves();
  let rows = which==='events' ? S.events : m[which];

  if(which === 'floor_holding'){
    rows = (m.floor_holding || []).map(x => {
      const i = x.key.lastIndexOf(' ');
      return {location: floorLoc(), sku: i > 0 ? x.key.slice(0, i) : x.key,
              lot: i > 0 ? x.key.slice(i + 1) : '', units: x.units};
    });
  }
  if(which==='events'){
    rows = S.events.map(e=>({ts:e.ts, kind:e.kind, bay:e.bay||'', pallet:e.pallet||'',
      line:e.line||'', actual:e.actual==null?'':e.actual, counted:e.counted==null?'':e.counted}));
  }
  if(!rows || !rows.length) return toast('Nothing to export in ' + which + '.');
  const blob = new Blob([csv(rows)], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'freezer_' + which + '_' + (PAYLOAD.plan_date||'') + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  ev('export', {what:which, rows:rows.length});
}

async function graphWrite(path, body, method){
  const t = tokStore();
  if(!t) throw new Error('not signed in');
  const r = await fetch(GRAPH + path, {
    method: method || 'POST',
    headers: {Authorization: 'Bearer ' + t.access_token, 'Content-Type': 'application/json'},
    body: JSON.stringify(body)});
  if(r.status === 401){ expireAccess(); throw new Error('sign-in expired — sign in again'); }
  const j = await r.json().catch(() => null);
  if(!r.ok) throw new Error((j && (j.error||{}).message) || `HTTP ${r.status}`);
  return j;                                   
}

const META_EV = {app_open:1, boot_reconcile:1, boot_restore:1, storage_persist:1};
 
const EXTRA_STORES = ['unplanned', 'found_moves', 'found_here', 'load_order', 'adhoc_counts',
                      'finalize_requested', 'lot_fix', 'lane_push', 'deck_freed',
                      'card_high',    
                      'bay_lanes'];  

function workEvents(o){
  return (((o && o.events) || [])).filter(e => e && !META_EV[e.kind]);
}
function recordAge(o){
  const w = workEvents(o), last = w.length ? w[w.length-1] : null;
  return {n: w.length, ts: last ? String(last.ts || '') : '',
          lines: Object.keys((o && o.lines) || {}).length,
          bays: Object.values((o && o.bays) || {}).filter(x => x && x.closed).length};
}

function hasRecordedWork(o){
  if(!o) return false;
  if(Object.keys(o.lines || {}).length) return true;
  if(Object.values(o.bays || {}).some(x => x && (x.closed || x.putback_done))) return true;

  return ['putback_actual','new_pallets','split_contents','floor_fix','left_down','opened',
          'unplanned','load_order','adhoc_counts','lane_push','deck_freed']
    .some(k => Object.keys(o[k] || {}).length) || (o.temp_out || []).length > 0 ||
    (o.found_moves || []).length > 0 || (o.found_here || []).length > 0 ||
    (o.lot_fix || []).length > 0;
}

function isPrefix(a, b){
  const A = workEvents(a), B = workEvents(b);
  if(A.length > B.length) return false;
  for(let i = 0; i < A.length; i++){
    if(String(A[i].ts || '')   !== String(B[i].ts || ''))   return false;
    if(String(A[i].kind || '') !== String(B[i].kind || '')) return false;
  }
  return true;
}

async function fetchRecord(){
  const sp = CFG.sharepoint;
  const site = await graph(`/sites/${sp.hostname}:${sp.site_path}`);
  const t = tokStore();
  if(!t) throw new Error('not signed in');
  const r = await fetch(
    `${GRAPH}/sites/${site.id}/drive/root:/${sp.doc_folder}/${sessionFile()}:/content`,
    {headers: {Authorization: 'Bearer ' + t.access_token}});
  if(r.status === 404) return null;
  if(!r.ok) throw new Error('record download HTTP ' + r.status);
  const o = await r.json();
  if(!o || typeof o !== 'object') throw new Error('the record on the server is not a session');
  return o;
}

function classifyRecords(names){
  const dev = deviceId(), stamp = planStamp(), me = sessionFile();
  const pre = `session_${PAYLOAD.plan_date}_`;
  const out = {mine_other_build: [], same_build_other_device: [], other: []};
  names.filter(f => f && f.name && f.name.indexOf(pre) === 0 && f.name !== me)
       .forEach(f => {

    const body = f.name.slice(pre.length).replace(/\.json$/, '');
    const cut = body.lastIndexOf('_');
    const d = cut < 0 ? body : body.slice(0, cut);
    const st = cut < 0 ? '' : body.slice(cut + 1);
    const rec = {name: f.name, at: f.lastModifiedDateTime || '', device: d, stamp: st};
    if(d === dev) out.mine_other_build.push(rec);
    else if(st === stamp) out.same_build_other_device.push(rec);
    else out.other.push(rec);
  });
  return out;
}

  const kids = await graph(`/sites/${site.id}/drive/root:/${sp.doc_folder}:/children`
                         + `?$select=name,lastModifiedDateTime&$top=999`);

let RECONCILED = false;
let SERVER_REC = null;           

async function reconcileOnBoot(){
  if(RECONCILED) return;
  RECONCILED = true;

  if(WRITE_LOCK) return;
  const key0 = KEY, before = recordAge(S);
  let rec = null;
  try{ rec = await fetchRecord(); }
  catch(e){

    ev('boot_reconcile', {result:'unreachable', why:String((e && e.message) || e)});
    save();
    return;
  }

  if(KEY !== key0) return;                                   
  const now = recordAge(S);
  if(now.n !== before.n || now.lines !== before.lines) return;

  if(!rec){

    let cls = {mine_other_build:[], same_build_other_device:[], other:[]};
    try{ cls = await listRecords(); }catch(e){}
    const near = cls.same_build_other_device, far = cls.mine_other_build.concat(cls.other);
    ev('boot_reconcile', {result: (near.length ? 'other_device_same_build'
                                 : far.length ? 'other_build_only' : 'no_server_copy'),
                          local: now.n,
                          candidates: near.concat(far).map(x => x.name)});
    save();
    if(!hasRecordedWork(S) && near.length){

      OFFER = near.sort((a,b) => String(b.at).localeCompare(String(a.at)))[0];
      renderAdoptOffer(OFFER, near.length);
    } else if(!hasRecordedWork(S) && far.length){
      banner('reconcile',
        '<b>⚠️ There is a record for this pull day on SharePoint, but it was recorded against '
        + 'a different version of the plan.</b>'
        + '<div class="sm" style="margin-top:4px">It has <b>not</b> been brought back — the two '
        + 'versions do not have the same lines, and merging them would quietly reconcile work '
        + 'that was never the same work.</div>'
        + '<div class="sm dim" style="margin-top:4px">' + esc(far.map(x => x.name).join(', '))
        + '</div>'
        + '<div class="sm" style="margin-top:6px">⛔ Tell Jack before you re-do anything — that '
        + 'record is safe and a person can say which lines still apply.</div>');
    }
    if(hasRecordedWork(S)) syncNow(true);    
    return;
  }
  const there = recordAge(rec);

  if(!hasRecordedWork(S) && hasRecordedWork(rec)){
    applyServerRecord(rec, 'restored');
    return;
  }
  if(there.n <= now.n){
     
    ev('boot_reconcile', {result:'local_current', local:now.n, server:there.n});
    save();
    if(there.n < now.n) syncNow(true);       
    return;
  }

  SERVER_REC = rec;
  if(isPrefix(S, rec)){

    ev('boot_reconcile', {result:'server_ahead_ask', local:now.n, server:there.n});
    save();
    renderRestoreOffer(now, there);
    return;
  }

  const kept = stashLocal('fork');
  ev('boot_reconcile', {result:'diverged', local:now.n, server:there.n, kept:kept || ''});
  save();
  try{ uploadRaw('fork_' + PAYLOAD.plan_date + '_' + deviceId() + '_' + Date.now() + '.json',
                 JSON.stringify(S)); }catch(e){}
  banner('reconcile',
    '<b>⛔ This tablet and the server disagree about this shift.</b>'
    + '<div class="sm" style="margin-top:4px">Each one holds taps the other does not — '
    + 'this tablet <b>' + now.n + '</b>, the server <b>' + there.n + '</b>. <b>Nothing has '
    + 'been changed or deleted.</b> You are working the copy on this tablet.</div>'
    + '<div class="sm dim" style="margin-top:4px">Both copies have been kept. ⛔ Do not clear '
    + 'this iPad — tell Jack, and the two will be sorted out at the import.</div>');
}

function stashLocal(tag){
  const stamp = new Date().toISOString().replace(/[^0-9]/g, '').slice(0, 14);
  const k = KEY + '.rescue.' + tag + '-' + stamp;
  try{
    const raw = JSON.stringify(S);
    localStorage.setItem(k, raw);
    if(localStorage.getItem(k) !== raw) throw new Error('read-back mismatch');
    return k;
  }catch(e){ return ''; }
}

function applyServerRecord(rec, how){

  const recBuilt = String((rec && rec.plan_built) || ''), curBuilt = String((PAYLOAD && PAYLOAD.built) || '');
  const recDate = String((rec && rec.plan_date) || '');
  if((recBuilt && curBuilt && recBuilt !== curBuilt) || (recDate && PAYLOAD && recDate !== PAYLOAD.plan_date)){
    ev('boot_reconcile', {result:'other_build_not_applied', how:how, rec_built:recBuilt, plan_built:curBuilt});
    save();
    banner('reconcile', '<b>⚠️ There is a record of this shift on SharePoint, but it was recorded against a '
      + 'different version of the plan — it has NOT been brought back.</b><div class="sm" style="margin-top:4px">'
      + 'Record plan ' + esc(recDate) + ' built ' + esc(recBuilt || '?') + '; this tablet is on built '
      + esc(curBuilt || '?') + '. The two versions do not have the same pallets, so applying it would '
      + 'quietly put that work on the wrong ones.</div><div class="sm" style="margin-top:6px">⛔ Tell Jack '
      + 'before you re-do anything — that record is safe on SharePoint.</div>');
    return false;
  }

  const kept = stashLocal(how);
  if(!kept && hasRecordedWork(S)){
    banner('reconcile', '<b>⛔ There is a fuller record of this shift on the server, and no '
      + 'room on this iPad to keep the local copy safe first.</b><div class="sm" '
      + 'style="margin-top:4px">Nothing has been changed. Tell Jack — this needs a person.</div>');
    return;
  }
  const o = blank();

  ['started','finished','bay','screen','opened','lines','pallets','bays','putback_actual',
   'new_pallets','split_contents','left_down','temp_out','floor_fix','events','breaks',
   'backstock','stopped_early'].concat(EXTRA_STORES)
    .forEach(k => { if(rec[k] !== undefined && rec[k] !== null) o[k] = rec[k]; });
  const age = recordAge(o);
  S = o;                                      
  COMMITTED = undoSnapshotOf(S);
  writeLocal();                               
  ev('boot_restore', {from:'sharepoint', how:how, lines:age.lines, events:age.n,
                      bays_closed:age.bays, kept:kept || ''});
  save();

  UNDO.length = 0;
  renderUndoBar();
  banner('reconcile',
    '<b>✓ Your earlier work came back from SharePoint.</b>'
    + '<div class="sm" style="margin-top:4px">This tablet had lost it — iPads clear an app\'s '
    + 'storage after about a week. Restored: <b>' + age.lines + '</b> recorded line'
    + (age.lines===1?'':'s') + ' · <b>' + age.bays + '</b> bay'
    + (age.bays===1?'':'s') + ' closed'
    + (age.ts ? ' · last tap ' + esc(localHM(age.ts)) : '') + '.</div>'
    + '<div style="margin-top:8px"><button class="ghost" style="min-height:44px" '
    + 'onclick="dropBanner(\'reconcile\')">Got it</button></div>', 'okbox');
  render();
}

function renderRestoreOffer(local, there){
  if(!SERVER_REC) return dropBanner('reconcile');
  banner('reconcile',
    '<b>⚠️ SharePoint has more of this shift than this tablet does.</b>'
    + '<div class="sm" style="margin-top:4px">This tablet: <b>' + local.lines
    + '</b> line' + (local.lines===1?'':'s') + ' · <b>' + local.bays + '</b> bay'
    + (local.bays===1?'':'s') + ' closed. On the server: <b>' + there.lines
    + '</b> line' + (there.lines===1?'':'s') + ' · <b>' + there.bays + '</b> bay'
    + (there.bays===1?'':'s') + ' closed'
    + (there.ts ? ', last tap ' + esc(localHM(there.ts)) : '') + '.</div>'
    + '<div class="sm" style="margin-top:6px">⭐ Everything on this tablet is also on the '
    + 'server, so bringing it back <b>loses nothing</b> — and the copy on this tablet is '
    + 'kept either way.</div>'
    + '<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">'
    + '<button class="pri" style="min-height:48px" onclick="acceptRestore()">'
    + 'Bring back the fuller one</button>'
    + '<button class="ghost" style="min-height:48px" onclick="declineRestore()">'
    + 'Keep what is on this tablet</button></div>', 'warnbox');
}
function acceptRestore(){
  if(!SERVER_REC) return dropBanner('reconcile');
  const rec = SERVER_REC; SERVER_REC = null;

  if(!isPrefix(S, rec) || recordAge(rec).n <= recordAge(S).n){
    dropBanner('reconcile');
    return toast('⚠️ this tablet has moved on since — keeping what is here');
  }
  applyServerRecord(rec, 'accepted');
}
function declineRestore(){
  SERVER_REC = null;
  dropBanner('reconcile');
  ev('boot_reconcile', {result:'declined_restore'});
  save();

  syncNow(true);
}

let OFFER = null;
function renderAdoptOffer(f, n){
  if(!f) return dropBanner('reconcile');
  const when = f.at ? localHM(f.at) : '';
  banner('reconcile',
    '<b>⚠️ Nothing is recorded on this iPad, but SharePoint has a shift for today\'s plan.</b>'
    + '<div class="sm" style="margin-top:4px">It was synced by a tablet this one does not '
    + 'recognise' + (when ? ', last at <b>' + esc(when) + '</b>' : '') + '. That is what an '
    + 'iPad looks like after it clears an app\'s storage — <b>it is probably this one</b> — '
    + 'but it could also be someone else working right now.</div>'
    + '<div class="sm" style="margin-top:6px">⭐ <b>Is anyone else using the app today?</b> '
    + 'If not, bring it back. If they are, leave it alone and tell Jack — two tablets on one '
    + 'record overwrite each other.</div>'
    + (n > 1 ? '<div class="sm dim" style="margin-top:4px">' + n + ' records match; the newest '
             + 'is offered.</div>' : '')
    + '<div class="sm dim" style="margin-top:4px">' + esc(f.name) + '</div>'
    + '<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">'
    + '<button class="pri" style="min-height:48px" onclick="adoptOffer()">'
    + 'Nobody else — bring it back</button>'
    + '<button class="ghost" style="min-height:48px" onclick="declineOffer()">'
    + 'Leave it alone</button></div>', 'warnbox');
}
async function adoptOffer(){
  const f = OFFER; if(!f) return dropBanner('reconcile');
  OFFER = null;
  if(hasRecordedWork(S)){ dropBanner('reconcile');
    return toast('⚠️ work has been recorded here since — keeping it'); }
  let rec = null;
  try{ rec = await fetchNamed(f.name); }
  catch(e){ return banner('reconcile', '<b>⛔ Could not download it — ' + esc(String(e.message||e))
    + '</b><div class="sm" style="margin-top:4px">Nothing has changed. Get back into signal and '
    + 'tap it again.</div>'); }

  try{ localStorage.setItem('freezer.device', f.device); }catch(e){}
  applyServerRecord(rec, 'adopted');
}
function declineOffer(){
  OFFER = null;
  dropBanner('reconcile');
  ev('boot_reconcile', {result:'declined_adopt'});
  save();
}

function buildRecord(m, movesErr, conflicts){

  if(conflicts === undefined){
    try{ conflicts = offPlanConflicts(); }
    catch(e){ conflicts = []; movesErr = movesErr || ('off-plan conflicts could not be derived: ' +
                                                       String((e && e.message) || e)); }
  }
  let cs = [];
  try{ cs = (conflicts || []).map(c => ({loc:c.loc, cards:[c.pallet_id, c.planned_pallet].filter(Boolean),
                                         why:offPlanConflictText(c)})); }
  catch(e){ cs = []; movesErr = movesErr || ('off-plan conflicts could not be described: ' +
                                             String((e && e.message) || e)); }
  return {schema: 1, plan_date: PAYLOAD.plan_date, device: deviceId(),

                 plan_built: (PAYLOAD.built || ''),

                 qty_basis: 'units',

                 pull_day: (PAYLOAD.pull_day || ''),

                 title: (PAYLOAD.title || ''),
                 synced_at: new Date().toISOString(),
                 started: S.started, finished: S.finished || null,
                 bay: S.bay, screen: S.screen,
                 lines: S.lines, pallets: S.pallets, bays: S.bays,
                 events: S.events, breaks: S.breaks,

                 putback_actual: S.putback_actual, new_pallets: S.new_pallets,
                 split_contents: S.split_contents, floor_fix: S.floor_fix,

                 left_down: S.left_down, temp_out: S.temp_out,

                 ...Object.fromEntries(EXTRA_STORES.map(k => [k, S[k] === undefined ? null : S[k]])),
                 stopped_early: S.stopped_early || null,
                 backstock: S.backstock || null, opened: S.opened,

                 moves_error: movesErr || null,
                 moves: movesErr ? null : m,

                 ...(cs.length ? {off_plan_conflicts: cs} : {})};
}
async function syncNow(quiet){
  if(SYNCING) return false;                
  SYNCING = true;
  let fileLanded = false;
  const btn = quiet ? null : $('#mainbtn');
  const was = btn ? btn.textContent : '';
  if(btn){ btn.textContent = 'Syncing…'; btn.disabled = true; }
  try{

    if(!(await ensureToken())){ if(quiet) return false;

      if(canRefresh()){ toast('No signal — nothing lost. Sync again when you are back on wifi.');
                        return false; }
      await signIn(); return false; }
    const sp = CFG.sharepoint;
    const site = await graph(`/sites/${sp.hostname}:${sp.site_path}`);

    let m = null, movesErr = '', conflicts = [];

    try{ m = moves(); conflicts = offPlanConflicts(); }
    catch(e){
      movesErr = String((e && e.message) || e);
      m = {transfers: [], adjustments: [], counts: [], skipped: [], missing: []};
      conflicts = [];
    }

    const rec = buildRecord(m, movesErr, conflicts);
    const fname = sessionFile();
    const t = tokStore();
    const up = await fetch(
      `${GRAPH}/sites/${site.id}/drive/root:/${sp.doc_folder}/${fname}:/content`,
      {method: 'PUT', headers: {Authorization: 'Bearer ' + t.access_token,
                                'Content-Type': 'application/json'},
       body: JSON.stringify(rec)});
    if(!up.ok) throw new Error(`record upload HTTP ${up.status}`);
    const upj = await up.json();
    fileLanded = true;      

    const lists = await graph(`/sites/${site.id}/lists?$select=displayName,id`);
    const lst = (lists.value || []).find(x => x.displayName === sp.list_name);
    if(!lst) throw new Error(`list "${sp.list_name}" not found on ${sp.site_path}`);

    const HANDLED = ['take','aside','orphan_placed','to_temp','from_temp'];
    const units = m.transfers.reduce((t2,x) =>
      t2 + (HANDLED.indexOf(String(x.kind||'')) >= 0 ? Number(x.quantity||0) : 0), 0);
    const fields = {
      Title: sessionKey(), PlanDate: PAYLOAD.plan_date, Device: deviceId(),

      Status: (!movesErr && allBaysClosed()) ? 'complete' : 'in_progress',
      StartedAt: S.started || new Date().toISOString(),
      FinishedAt: (!movesErr && allBaysClosed()) ? new Date().toISOString() : null,
      Transfers: m.transfers.length, UnitsMoved: Math.round(units),
      Corrections: m.adjustments.length, Counts: m.counts.length,
      Skipped: m.skipped.length, NotFound: m.missing.length,
      RecordFile: `${sp.doc_folder}/${fname}`,

      PlanTitle: (PAYLOAD.title || '').slice(0, 250),
      PlanFile: `${sp.doc_folder}/plan_latest.json`};

    const q = encodeURIComponent(`fields/Title eq '${sessionKey()}'`);
    let hit = null;
    try{
      const found = await graph(
        `/sites/${site.id}/lists/${lst.id}/items?$expand=fields&$filter=${q}&$top=5`);
      hit = (found.value || [])[0] || null;
    }catch(e){
      
      const found = await graph(
        `/sites/${site.id}/lists/${lst.id}/items?$expand=fields&$top=999`);
      const all = (found.value || []).filter(i => (i.fields||{}).Title === sessionKey());
      hit = all[0] || null;
      if((found.value || []).length >= 999)
        toast('⚠️ the session list is large — ask for the Title column to be indexed');
    }

    const cur = hit ? String(((hit.fields) || {}).Status || '').trim().toLowerCase() : '';
    const want = String(fields.Status || '').trim().toLowerCase();
    const frozen = (cur === 'reconciled');
    let rowFields = fields;
    if(hit && cur === 'draft' && want !== cur){
      rowFields = {};
      Object.keys(fields).forEach(k => { if(k !== 'Status') rowFields[k] = fields[k]; });
      ev('status_preserved', {was: cur, not_written: fields.Status});
    }
    let ack;
    if(hit && frozen){
       
      ev('row_frozen', {was: cur, fields_not_written: Object.keys(fields).length});
      ack = {skipped: 'reconciled'};
    }
    else if(hit){ ack = await graphWrite(
        `/sites/${site.id}/lists/${lst.id}/items/${hit.id}/fields`, rowFields, 'PATCH'); }
    else   { ack = await graphWrite(
        `/sites/${site.id}/lists/${lst.id}/items`, {fields: fields}, 'POST'); }
    if(!ack) throw new Error('the list write returned no acknowledgement');

    S.synced = {at: new Date().toISOString(), file: upj.name,
                transfers: m.transfers.length, counts: m.counts.length,
                moves_error: movesErr || null};
    ev(movesErr ? 'synced_facts_only' : 'synced',
       {file: upj.name, transfers: m.transfers.length, why: movesErr || undefined});

    S.synced.events = (S.events || []).length;
    save(); render();
    if(movesErr){

      dlg('Your work is saved — but the export is broken',
        '<div class="okbox"><b>Everything you recorded has been sent to SharePoint.</b> '
        + 'It is safe; nothing is lost.</div>'
        + '<div class="badbox"><b>⛔ The app could not work out the Finale moves from it.</b>'
        + '<div class="sm" style="margin-top:6px">' + esc(movesErr) + '</div></div>'
        + '<p class="sm dim">Carry on recording — the facts keep saving normally. Tell Jack '
        + 'today: the import file has to be rebuilt from the record rather than from here.</p>',
        [{t: 'OK', c: 'pri'}]);
    }
    else if(!quiet) toast(`✅ synced — ${m.transfers.length} transfer(s), ${m.counts.length} count(s)`);

    return true;
  }catch(e){
    ev('sync_failed', {why: String(e.message || e)});
    save();

    if(quiet) return false;
    dlg('Sync failed', '<div class="badbox"><b>'+
      (fileLanded ? 'The record file was saved, but the session row was NOT updated.'
                  : 'Nothing was sent.')+
      '</b><div class="sm" style="margin-top:6px">'+esc(String(e.message || e))+'</div></div>'+
      '<p class="sm dim">Your work is still saved on this iPad. Get back in signal and try '+
      'again — ⛔ do not start another session for this plan until this succeeds.</p>',
      [{t:'OK', c:'pri'}]);
    return false;
  }finally{ SYNCING = false; if(btn){ btn.disabled = false; btn.textContent = was; } }
}

let SYNCING = false;
let LAST_AUTOSYNC = 0;
const AUTOSYNC_MS = 5 * 60 * 1000;        

function autoSyncTick(){
  try{
    if(!S || !S.started) return;                        
    if(!unsyncedCrewWork()) return;                     
    if(Date.now() - LAST_AUTOSYNC < AUTOSYNC_MS) return;
    if(!tokStore()) return;                             
    LAST_AUTOSYNC = Date.now();
    syncNow(true);
  }catch(e){   }
}
setInterval(autoSyncTick, 60 * 1000);

const FLUSH_FLOOR_MS = 30 * 1000;
function flushSoon(){
  if(Date.now() - LAST_AUTOSYNC < FLUSH_FLOOR_MS) return;
  LAST_AUTOSYNC = 0;                   
  autoSyncTick();
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden') flushSoon();
});
window.addEventListener('online', flushSoon);

function notePersisted(ok){
  PERSISTED = !!ok;
  try{
    if(!OPEN_NOTED) return;         
    ev('storage_persist', {granted: PERSISTED});
    saveQuiet();           
  }catch(e){}
}

let OPEN_NOTED = false;
function noteOpen(){
  if(OPEN_NOTED) return;                  
  OPEN_NOTED = true;
  try{
    ev('app_open', {
      lines:  Object.keys(S.lines  || {}).length,
      events: (S.events || []).length,
      bays_closed: Object.values(S.bays || {}).filter(x => x && x.closed).length,
      started: !!S.started,
      persisted: PERSISTED,
      rescued: !!(typeof RESCUED !== 'undefined' && RESCUED),
      build: (PAYLOAD && PAYLOAD.built) || ''
    });
    saveQuiet();           
  }catch(e){}                             
}

function localHM(ts){ try{ const d = new Date(ts); return isNaN(d) ? '?' :
  d.toTimeString().slice(0,5); }catch(e){ return '?'; } }
function localDay(ts){ try{ const d = new Date(ts); if(isNaN(d)) return '?';
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+
         String(d.getDate()).padStart(2,'0'); }catch(e){ return '?'; } }
function heldLine(){
  const nl = Object.keys(S.lines || {}).length;
  const nb = Object.values(S.bays || {}).filter(x => x && x.closed).length;
  const tb = (PAYLOAD.bays || []).length;
  const hhmm = t => { try{ return new Date(t).toTimeString().slice(0,5); }catch(e){ return '?'; } };
  const saved  = LAST_WRITE ? hhmm(LAST_WRITE) : '—';
  const synced = S.synced ? hhmm(S.synced.at || S.synced) : 'not yet';
  return '<div class="sm dim" style="padding:6px 2px 10px">' +
    'This tablet is holding <b>' + nl + '</b> recorded line' + (nl===1?'':'s') +
    ' · <b>' + nb + ' of ' + tb + '</b> bays closed' +
    ' · saved ' + saved + ' · synced ' + esc(synced) +
    '</div>';
}

function closedBox(b){
  const bs = S.bays[b.n] || {};
  if(!bs.closed) return '';
  const hhmm = t => { try{ return new Date(t).toTimeString().slice(0,5); }catch(e){ return ''; } };
  let done = 0, skipped = 0, missing = 0, counted = 0;
  b.pallets.forEach(p => p.lines.forEach((l,i) => {
    if(!isActionable(l)) return;          
    const s = st(lid(b.n, p.loc, l, i)) || {};
    if(s.state === 'skipped') skipped++;
    else if(s.state === 'missing') missing++;
    else if(s.state === 'done'){ done++; if(l.kind === 'count') counted++; }
  }));
  const bits = ['<b>' + done + '</b> line' + (done===1?'':'s') + ' recorded'];
  if(counted)  bits.push('<b>' + counted + '</b> counted');
  if(skipped)  bits.push('<b>' + skipped + '</b> skipped');
  if(missing)  bits.push('<b>' + missing + '</b> not there');
  bits.push(bs.putback_done
    ? 'putback confirmed' + (bs.putback_ts ? ' ' + hhmm(bs.putback_ts) : '')
    : '⚠️ <b>no putback recorded</b>');
  return '<div class="okbox" style="margin-bottom:12px"><b>✓ This bay is already closed'
    + (bs.closed_ts ? ' — ' + hhmm(bs.closed_ts) : '') + '.</b>'
    + '<div class="sm" style="margin-top:4px">' + bits.join(' · ') + '</div>'
    + '<div class="sm dim" style="margin-top:6px">Nothing here needs doing again. '
    + 'You can still tap a line to correct it.</div></div>';
}

function dlg(title, bodyHtml, buttons, after){
  const d = $('#dlg');
  $('#dlgh').textContent = title; $('#dlgb').innerHTML = bodyHtml;
  const f = $('#dlgf'); f.innerHTML = '';

  if(!d._noSubmit){
    d._noSubmit = true;
    d.querySelector('form').addEventListener('submit', e => e.preventDefault());
  }
  buttons.forEach(b => {
    const el = document.createElement('button');
    el.type = 'button';
    el.textContent = b.t; el.className = b.c || '';

    el.onclick = (e) => { e.preventDefault();
      if(!b.f){ stopCam(); d.close(); dlgClosed(); return; }       

      if(b.f() !== false){ stopCam(); d.close(); dlgClosed(); } };
    f.appendChild(el);
  });
  stopCam();                     
   
  if(!d._retWired){ d._retWired = true; d.addEventListener('cancel', () => dlgClosed()); }

  if(!d.open) d.showModal();
  if(after) after();
}

window.addEventListener('load', () => {
  const probe = probeStorage();
  STORAGE_OK = probe.ok;
  if(!STORAGE_OK){ blockStorage(probe.why, false); return; }   

  try{
    if(navigator.storage && navigator.storage.persist)
      navigator.storage.persist().then(notePersisted).catch(() => {});
  }catch(e){}
  keepAwake();
  boot();
});

function flushLocal(){

  writeLocal();
}
window.addEventListener('pagehide', () => { flushLocal(); releaseOwner(); });
window.addEventListener('beforeunload', () => { flushLocal(); releaseOwner(); });

document.addEventListener('visibilitychange', flushLocal);
</script>
