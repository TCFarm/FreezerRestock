}
function laneRoom(nn, ans, backN){
  const b = PAYLOAD.bays.find(x => x.n === nn);
  S.bays[nn] = Object.assign(S.bays[nn]||{}, {lane_room: ans, lane_back: backN,
                                              lane_room_ts: new Date().toISOString()});
  ev('lane_room', {bay: b ? b.bay : '', answer: ans, pallets_back: backN});
  save(); render();
}

const FULL_BUCKETS = [
  {k:'empty',    pct:0,   t:'Empty',      d:'nothing on it'},
  {k:'quarter',  pct:25,  t:'¼ full',     d:'lots of room'},
  {k:'half',     pct:50,  t:'½ full',     d:'room for more'},
  {k:'three_q',  pct:75,  t:'¾ full',     d:'a bit of room'},
  {k:'full',     pct:95,  t:'FULL',       d:'nothing else fits'},
  {k:'over',     pct:120, t:'OVERFULL',   d:'⛔ would not all fit — say what is left over'},
];

function adjLoc(p){
  if(!p) return '';
  return palletFinalLoc(p.pallet_id) || p.goes_back_to || p.loc || '';
}

function cardOf(x){
  if(!x) return '';
  if(typeof x === 'object') return x.card || x.pallet_id || '';
  for(const b of PAYLOAD.bays){
    for(const p of (b.pallets||[])) if(p.pallet_id === x) return p.card || x;
    for(const pb of (b.putback||[])) if(pb.pallet_id === x) return pb.card || x;
  }
  return x;                       
}

function palletLabel(p){
  if(!p) return 'the pallet';
  return p.pallet_id ? ('pallet ' + cardOf(p)) : (p.loc || 'the pallet');
}

function bucketOf(k){ return FULL_BUCKETS.find(x => x.k === k) || null; }

function nearestBucket(pct){
  if(pct == null) return null;
  let best = FULL_BUCKETS[0];
  FULL_BUCKETS.forEach(x => { if(Math.abs(x.pct - pct) < Math.abs(best.pct - pct)) best = x; });
  return best;
}

function askFullness(bayN, loc){
  const b = PAYLOAD.bays.find(x => x.n === bayN);
  const p = b && b.pallets.find(x => x.loc === loc);
  if(!p) return;
  const deck = Number(p.deck_m3 || 0), ours = Number(p.est_m3 || 0);
  const ourPct = deck > 0 ? Math.round(100 * ours / deck) : null;
  const nov = (p.no_volume || []);
  const title = (cardOf(p) || loc);

  if(ourPct == null || nov.length){
    return askFullnessBlind(bayN, loc, title, nov, ourPct);
  }
  const guess = nearestBucket(ourPct);
  dlg('Does this look about right?',
    '<div class="okbox" style="text-align:center;padding:14px 10px">'+
      '<div class="sm dim">We think '+esc(title)+' is about</div>'+
      '<div style="font-size:34px;font-weight:700;line-height:1.1;margin:4px 0">'+ourPct+'%</div>'+
      '<div class="sm dim">full — '+esc(guess.t)+', '+esc(guess.d)+'</div>'+
    '</div>'+
    '<p class="sm dim" style="margin-top:10px">If it looks about right, that is all we need.</p>',
    [{t:'✓ Yep, about right', c:'pri', f:()=>setFullness(bayN, loc, guess.k, 'confirmed', ourPct)},
     {t:'No — it is not', c:'warn', f:()=>{
        setTimeout(()=>askFullnessBlind(bayN, loc, title, nov, ourPct, true), 0); }},
     {t:'Skip', c:'ghost'}]);
}

function askFullnessBlind(bayN, loc, title, nov, ourPct, correcting){
  const prev = (S.pallets[loc] || {}).fullness || '';
  dlg(correcting ? 'What is it really?' : 'How full is ' + title + ' now it is loaded?',
    (correcting
      ? '<p class="sm dim">Thanks — that is the useful answer. Roughly, then:</p>'
      : '<p class="sm dim">We have no size on file for '+
        (nov && nov.length ? esc(nov.slice(0,3).join(', ')) : 'this one')+
        ', so we cannot even guess. Your eyeball is the only reading there is.</p>')+
    '<div id="fullbtns">'+
      FULL_BUCKETS.map(x =>
        '<button type="button" class="big '+(prev===x.k?'ok':'')+'" style="margin-bottom:8px;'+
        'text-align:left;min-height:62px" onclick="setFullness('+bayN+',\''+esc(loc)+'\',\''+
        x.k+'\',\''+(correcting?'corrected':'blind')+'\','+(ourPct==null?'null':ourPct)+')">'+
        '<b>'+x.t+'</b><div class="sm" style="font-weight:400;opacity:.8">'+x.d+'</div></button>'
      ).join('')+
    '</div>',
    [{t:'Not now', c:'ghost'}]);
}

function setFullness(bayN, loc, k, mode, ourPct){
  const b = PAYLOAD.bays.find(x => x.n === bayN);
  const p = b && b.pallets.find(x => x.loc === loc);
  const ps_ = S.pallets[loc] = S.pallets[loc] || {};
  ps_.fullness = k;
  ps_.fullness_mode = mode || 'blind';
  ps_.fullness_ts = new Date().toISOString();
  ev('fullness', {bay: b ? b.bay : '', pallet: p ? p.pallet_id : loc, bucket: k, mode: ps_.fullness_mode});
  save();
  const bk = bucketOf(k);

  if(ps_.fullness_mode === 'confirmed'){ toast('✓ ' + bk.t + ' — thanks'); render(); return; }

  const gap = (ourPct == null) ? null : bk.pct - ourPct;
  setTimeout(() => dlg('Recorded as ' + bk.t,
    (ourPct == null
      ? '<p class="dim">Nothing to compare it to — yours is the only reading, which makes it '+
        'one of the most useful answers in the whole session.</p>'
      : '<div class="warnbox"><b>We said '+ourPct+'%, you said '+bk.pct+'%.</b>'+
        '<div class="sm" style="margin-top:6px">That is what we are looking for. '+
        '<b>If you know why, it saves us guessing:</b></div>'+
        '<select id="fwhy" style="margin-top:8px">'+
          '<option value="">— skip, no idea —</option>'+
          '<option value="loose">boxes are loose / lots of air in the box</option>'+
          '<option value="dense">packed tighter than it looks</option>'+
          '<option value="stack_height">could not stack it as high here</option>'+
          '<option value="wrong_contents">what is on it is not what the app listed</option>'+
          '<option value="part_elsewhere">part of this pallet is somewhere else</option>'+
          '<option value="other">something else</option></select></div>')+
    (k === 'over'
      ? '<div class="warnbox sm" style="margin-top:10px"><b>⛔ Do not force it.</b> Leave '+
        'what will not fit on the floor and tell us at the end — a pallet crammed past its '+
        'deck is how stock ends up in a place Finale cannot see.</div>' : ''),
    [{t:'OK', c:'pri', f:()=>{
       const w = $('#fwhy');
       if(w && w.value){ ps_.fullness_why = w.value; save();
                         ev('fullness_why', {pallet:p?p.pallet_id:loc, why:w.value}); }
    }}]), 0);
  render();
}

function knownLocations(){
  if(window.__LOCS) return window.__LOCS;
  const set = new Set();
  PAYLOAD.bays.forEach(b => {
    (b.pallets || []).forEach(p => { if(p.loc) set.add(p.loc);
                                     if(p.goes_back_to) set.add(p.goes_back_to); });
    (b.putback || []).forEach(pb => { if(pb.loc) set.add(pb.loc); });
    (b.pallets || []).forEach(p => (p.lines || []).forEach(l => { if(l.dest) set.add(l.dest); }));
    (b.orphan_pulls || []).forEach(o => { if(o.dest) set.add(o.dest);
                                          if(o.from_location) set.add(o.from_location); });
  });
  window.__LOCS = set;
  return set;
}

function normLoc(raw){
  return String(raw || '').trim().toUpperCase().replace(/\s+/g, '');
}
 
function scanField(id){
  return '<label class="sm" style="margin-top:2px">Scan the placard <span class="dim">'+
    '(or pick it below)</span></label>'+
    '<input id="'+id+'" autocomplete="off" autocapitalize="characters" spellcheck="false" '+
    'placeholder="scan or type, e.g. F2-A-03-2" style="font-size:17px">'+
    '<div id="'+id+'msg" class="sm dim" style="margin:4px 0 10px"></div>';
}
function wireScan(id, selId){
  const inp = $('#'+id), sel = $('#'+selId), msg = $('#'+id+'msg');
  if(!inp || !sel) return;
  const apply = () => {
    const v = normLoc(inp.value);
    if(!v){ msg.textContent = ''; return; }
    const opt = [...sel.options].find(o => normLoc(o.value) === v);
    if(opt){ sel.value = opt.value;
      msg.innerHTML = '✓ <b>'+esc(opt.value)+'</b>'; return; }
    if(knownLocations().has(v)){

      const o = document.createElement('option');
      o.value = v; o.textContent = v + ' — scanned, outside this lane';
      sel.appendChild(o); sel.value = v;
      msg.innerHTML = '✓ <b>'+esc(v)+'</b> — that is not in this lane, which is fine if it '+
        'is where you put it.';
      return;
    }
    const o = document.createElement('option');
    o.value = v; o.textContent = v + ' — scanned (not in this plan)';
    sel.appendChild(o); sel.value = v;
    msg.innerHTML = '⚠️ <b>'+esc(v)+'</b> is not a location we have seen in this plan. '+
      'We will record it exactly as scanned — check it is right.';
  };

  inp.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); e.stopPropagation(); apply(); }
  });
  inp.addEventListener('change', apply);
  inp.addEventListener('blur', apply);
  setTimeout(() => { try{ inp.focus(); }catch(e){} }, 30);
}

function palletChoices(bayN, exclude){

  const b = PAYLOAD.bays.find(x => x.n === bayN) || {};
  const seen = {}, out = [];
  (b.pallets || []).forEach(p => { if(p.pallet_id && p.pallet_id !== exclude && !seen[p.pallet_id]){
    seen[p.pallet_id] = 1; out.push({id:p.pallet_id, why:'came down from '+p.loc, spoil:!!p.spoil}); } });
  (b.putback || []).forEach(pb => { if(pb.pallet_id && pb.pallet_id !== exclude && !seen[pb.pallet_id]){
    seen[pb.pallet_id] = 1; out.push({id:pb.pallet_id, why:'goes to '+pb.loc}); } });
  Object.keys(S.new_pallets || {}).forEach(k => { if(k !== exclude && !seen[k]){
    seen[k] = 1; out.push({id:k, why:'you built this one', built:true}); } });
  return out;
}

function laneOf(pid, bayN){
  const planned = plannedLocFor(pid);
  if(planned){ const m = String(planned).match(/^(.*)-\d+$/); if(m) return m[1]; }
  const b = PAYLOAD.bays.find(x => x.n === bayN);
  return b ? b.bay : '';
}
function lanePositions(pid, bayN){
  const lane = laneOf(pid, bayN);
  if(!lane) return [];
  const b = PAYLOAD.bays.find(x => x.bay === lane);
  const depth = b ? Math.max(Number(b.depth || 0), (b.putback || []).length,
                             Number(b.deepest || 0)) : 0;
  const out = [];
  for(let i = 1; i <= Math.max(depth, 1); i++) out.push(lane + '-' + i);
  return out;
}

function askSplit(id){
  const f = find(id); if(!f) return;
  const l = f.l, st = S.lines[id] || {};
  const total = st.actual != null ? st.actual : l.planned_qty;
  const want = l.onto_pallet || '';
  const others = palletChoices(f.b.n, want);
  dlg('Where did the ' + n(total) + ' actually go?',
    '<p class="sm dim">We asked for all of it on <b>' + esc(want || 'one pallet') + '</b>. If it '+
    'would not fit, say what really happened — the split is what Finale gets told, and it is '+
    'how we learn that this pallet space is smaller than we think.</p>'+
    '<label class="sm">On <b>' + esc(want || 'the planned pallet') + '</b></label>'+
    qtyField('sp1', total)+
    '<label class="sm" style="margin-top:10px">The rest went on</label>'+
    '<select id="sp2">'+
      '<option value="">— nowhere, the rest is still on the floor —</option>'+
      others.map(o => '<option value="'+esc(o.id)+'">'+esc(o.id)+' · '+esc(o.why)+
                      (o.spoil?' ⚠️ spoil':'')+'</option>').join('')+
      '<option value="__new__">a NEW pallet I built</option>'+
    '</select>'+
    '<div id="spnew" hidden><label class="sm" style="margin-top:8px">Which P- card did you '+
      'put on it?</label><input id="spcard" inputmode="numeric" placeholder="e.g. 12"></div>'+
    '<div id="spmsg" class="sm dim" style="margin-top:8px"></div>',
    [{t:'Cancel', c:'ghost'},
     {t:'Record the split', c:'pri', f:()=>{
        const a = readQty('sp1');
        if(a == null) return toast('⛔ how many went on the planned pallet?') && false;
        if(a > total + 0.001) return toast('⛔ that is more than the '+n(total)+' you moved') && false;
        const rest = Math.round((total - a) * 1000) / 1000;
        let dest = $('#sp2').value;
        if(rest <= 0.001){
          setLine(id, {placements:[{pallet:want, qty:a, deviated:false}]});
          ev('split_recorded', {line:id, parts:1}); render(); return;
        }
        if(dest === '__new__'){
          const cn = ($('#spcard').value || '').trim().replace(/^P-?/i,'');
          if(!/^\d{1,3}$/.test(cn)) return toast('⛔ the card number off the laminated card') && false;
          dest = 'P-' + cn;
          S.new_pallets[dest] = {bay: f.b.bay, bay_n: f.b.n, built_ts: new Date().toISOString()};
        }
        const parts = [{pallet:want, qty:a, deviated:false}];
        parts.push({pallet:dest || '', qty:rest, deviated:true,
                    floor: !dest});
        setLine(id, {placements:parts});
        ev('split_recorded', {line:id, parts:parts.length, overflow:rest, onto:dest||'FLOOR'});
        render();

        if(dest && S.new_pallets[dest] && !actualFor(dest)) setTimeout(()=>askActual(f.b.n, dest), 0);
     }}],
    ()=>{
      const sel = $('#sp2'), nw = $('#spnew'), msg = $('#spmsg');
      const upd = () => {
        nw.hidden = sel.value !== '__new__';
        const a = Number($('#sp1').value) || 0;
        const rest = Math.round((total - a) * 1000) / 1000;
        msg.innerHTML = rest <= 0.001
          ? 'All ' + n(total) + ' on ' + esc(want) + ' — nothing to split.'
          : '<b>' + n(rest) + '</b> goes ' + (sel.value === '__new__' ? 'on the new pallet'
              : sel.value ? 'on ' + esc(sel.value) : '<span style="color:var(--bad)">nowhere — '+
                'it stays on the floor and someone must deal with it</span>') + '.';
      };
      sel.addEventListener('change', upd);
      $('#sp1').addEventListener('input', upd); upd();
    });
}

function askActual(bayN, pid){
  const b = PAYLOAD.bays.find(x => x.n === bayN); if(!b) return;
  const planned = plannedLocFor(pid);
  const built = !!(S.new_pallets || {})[pid];
  const pos = lanePositions(pid, bayN);
  const prev = actualFor(pid) || {};
  dlg((built ? 'Where did you put ' : 'Where did ') + esc(cardOf(pid)) + (built ? '?' : ' actually go?'),
    (planned ? '<p class="sm dim">The plan said <b>'+esc(planned)+'</b>. If it went somewhere '+
       'else that is fine — we just need the real position, because next week is planned '+
       'against it and the placard on the pallet is what gets scanned.</p>'
     : '<p class="sm dim">You built this pallet, so there is no plan for it. Tell us where it '+
       'went and it becomes a real position like any other.</p>')+
    scanField('pascan')+
    '<label class="sm">Position it went into</label>'+
    '<select id="pa">'+
      (planned ? '<option value="'+esc(planned)+'"'+(!prev.loc||prev.loc===planned?' selected':'')+
                 '>'+esc(planned)+' — as planned</option>' : '')+
      pos.filter(x => x !== planned).map(x =>
        '<option value="'+esc(x)+'"'+(prev.loc===x?' selected':'')+'>'+esc(x)+'</option>').join('')+
      '<option value="__floor__"'+(prev.state==='floor'?' selected':'')+
        '>⛔ it is still on the floor</option>'+
    '</select>'+
    '<label class="sm" style="margin-top:10px">Anything different about it?</label>'+
    '<select id="pan">'+
      '<option value="">nothing — one pallet, as it came down</option>'+
      '<option value="split">⚠️ I had to split it into more than one pallet</option>'+
      '<option value="rebuilt">I rebuilt/restacked it to make it fit</option>'+
      '<option value="short">some of it would not fit and is still down</option>'+
    '</select>'+
    '<div id="panote" class="sm dim" style="margin-top:8px"></div>',
    [{t:'Cancel', c:'ghost'},
     {t:'Record it', c:'pri', f:()=>{
        const v = $('#pa').value, note = $('#pan').value;
        const rec = (v === '__floor__')
          ? {state:'floor', loc:'', note:note, planned:planned, ts:new Date().toISOString()}
          : {state:'placed', loc:v, note:note, planned:planned, ts:new Date().toISOString()};
        rec.deviated = (v !== planned) || !!note;
        S.putback_actual[pid] = rec;
        ev('putback_actual', {pallet:pid, loc:rec.loc || 'FLOOR', planned:planned, note:note});
        save(); render();
        if(note === 'split') setTimeout(()=>askSecondPallet(bayN, pid), 0);
     }}],
    ()=>{
      wireScan('pascan', 'pa');
      const sel = $('#pan'), m = $('#panote');
      const upd = () => { m.textContent = sel.value === 'split'
        ? 'We will ask for the second pallet next — it needs its own card and its own position.'
        : sel.value === 'short'
        ? 'Say so at the end of the bay too, so nobody goes looking for it next week.' : ''; };
      sel.addEventListener('change', upd); upd();
    });
}

        'style="width:24px;height:24px;flex:0 0 auto" '+
        'data-sku="'+esc(l.sku)+'" data-lot="'+esc(l.lot||'')+'" data-max="'+n(l.system_qty)+'">'+
      '<label for="'+rid+'" class="grow" style="cursor:pointer"><b>'+esc(l.sku)+'</b>'+
        (l.lot ? ' <span class="dim sm">lot '+esc(l.lot)+'</span>'
               : ' <span class="dim sm">no lot</span>')+
        '<div class="sm dim">'+n(l.system_qty)+' on it</div></label>'+

        'value="'+n(l.system_qty)+'" style="width:78px;text-align:center;font-size:16px">'+
      '</div>');
  });
  return rows.length
    ? '<div style="max-height:250px;overflow-y:auto">'+rows.join('')+'</div>'+
      '<div class="sm dim" style="margin-top:6px">Tick what moved. If only part of it went, '+
      'change the number.</div>'
    : '<div class="sm dim">nothing left on it to move</div>';
}

function askSecondPallet(bayN, fromPid){

      pos.map(x => '<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')+

    '<div style="margin-top:14px"><label class="sm"><b>Which items went on this one?</b> '+
      '<span class="dim">Tick everything you carried across.</span></label>'+

    [{t:'Skip', c:'ghost'},
     {t:'Record it', c:'pri', f:()=>{

        if(!/^\d{1,3}$/.test(cn)) return toast('⛔ the card number off the laminated card') && false;
        const pid = 'P-' + cn, v = $('#s2pos').value;
        const took = [];
        let badq = null;
        [...document.querySelectorAll('.splititem:checked')].forEach(c => {
          const box = document.querySelector('.splitqty[data-for="'+c.id+'"]');
          const raw = box ? String(box.value).trim() : '';
          const max = Number(c.dataset.max || 0);
          const q = raw === '' ? max : Number(raw);
          if(!isFinite(q) || q <= 0 || q > max + 0.001){ badq = c.dataset.sku; return; }
          took.push({sku: c.dataset.sku, lot: c.dataset.lot || '', qty: q});
        });
        if(badq) return toast('⛔ check the quantity on ' + badq) && false;
        S.new_pallets[pid] = {bay:b.bay, bay_n:bayN, split_from:fromPid,
                              built_ts:new Date().toISOString()};
        S.putback_actual[pid] = {state: v === '__floor__' ? 'floor' : 'placed',
                                 loc: v === '__floor__' ? '' : v, note:'split_from_'+fromPid,
                                 planned:'', deviated:true, ts:new Date().toISOString()};

        S.split_contents = S.split_contents || {};
        S.split_contents[pid] = {from: fromPid, items: took};
        ev('pallet_split', {from:fromPid, to:pid, loc:v, items:took.length});
        save(); render();
        if(!took.length) toast('Recorded — but nothing was ticked, so all the stock still '+
                               'counts as being on ' + fromPid);
     }}], ()=>{ wireScan('s2scan','s2pos'); wireSplitQty(); });
}

function palletFinalLoc(pid){
  if(!pid) return null;
  const a = actualFor(pid);
  if(a && a.loc) return a.loc;
  if(a && a.state === 'floor') return '';        
  for(const b of PAYLOAD.bays)
    for(const pb of (b.putback || []))
      if(pb.pallet_id === pid) return pb.loc;
  return null;
}

function actualFor(pid){ return (S.putback_actual || {})[pid] || null; }
function plannedLocFor(pid){
  for(const b of PAYLOAD.bays)
    for(const pb of (b.putback || []))
      if(pb.pallet_id === pid) return pb.loc;
  return '';
}

function moves(){
  const out = {transfers:[], adjustments:[], counts:[], missing:[], skipped:[],

               fullness:[], lane_room:[],

               pallet_moves:[],
                
               backstock: S.backstock ? [Object.assign({plan_date:PAYLOAD.plan_date}, S.backstock)] : []};
  PAYLOAD.bays.forEach(b => {
    (b.pallets || []).forEach(p => {
      const ps_ = S.pallets[p.loc] || {};
      if(!ps_.fullness) return;
      const bk = bucketOf(ps_.fullness);
      const deck = Number(p.deck_m3 || 0), ours = Number(p.est_m3 || 0);
      out.fullness.push({bay:b.bay, from_location:p.loc, pallet_id:p.pallet_id||'',
        goes_back_to:p.goes_back_to||'', spoil:!!p.spoil,
        crew_bucket:ps_.fullness, crew_pct:bk?bk.pct:null,
         
        mode:ps_.fullness_mode||'blind', crew_why:ps_.fullness_why||'',
        model_m3:ours, deck_m3:deck,
        model_pct: deck>0 ? Math.round(100*ours/deck) : null,
        no_volume_skus:(p.no_volume||[]).join(' '),

        sku_lots:(p.lines||[]).filter(l=>l.kind!=='count')
                   .map(l=>l.sku+'@'+(l.lot||'-')+'x'+n(l.system_qty)).join(' '),
        ts:ps_.fullness_ts});
    });
    const bst = S.bays[b.n] || {};
    if(bst.lane_room){
      out.lane_room.push({bay:b.bay, answer:bst.lane_room,
        pallets_put_back:bst.lane_back,
        deepest_dug:b.deepest, pallets_down:b.down,
        ts:bst.lane_room_ts});
    }
  });
   
  PAYLOAD.bays.forEach(b => {
    (b.putback || []).forEach(pb => {
      const a = actualFor(pb.pallet_id);
      out.pallet_moves.push({bay:b.bay, pallet_id:pb.pallet_id,
        planned_location:pb.loc,
        actual_location: a ? (a.state === 'floor' ? '' : a.loc) : pb.loc,
        state: a ? a.state : 'planned',
        confirmed: !!a, deviated: !!(a && a.deviated), note: a ? (a.note||'') : '',
        built_by_crew:false, ts: a ? a.ts : ''});
    });
  });
  Object.keys(S.new_pallets || {}).forEach(pid => {
    const np = S.new_pallets[pid], a = actualFor(pid) || {};
    out.pallet_moves.push({bay:np.bay||'', pallet_id:pid, planned_location:'',
      actual_location: a.state === 'floor' ? '' : (a.loc||''),
      state: a.state || 'unplaced', confirmed: !!a.state, deviated:true,
      note: np.split_from ? ('split from '+np.split_from) : 'built on the floor',
      built_by_crew:true, ts: a.ts || np.built_ts || ''});
  });
  PAYLOAD.bays.forEach(b => {

    const push = (p, l, i, key, loc) => {
      const id = lid(b.n, key, l, i), s = S.lines[id];
      if(!s) return;
      if(s.state === 'missing'){

        const dec = (s.baseline != null) ? s.baseline : l.system_qty;
        out.missing.push({bay:b.bay, from:loc, sku:l.sku, lot:l.lot||'',
          planned_qty:l.planned_qty, system_qty:l.system_qty,
          sibling_took:(s.sibling_took != null ? s.sibling_took : 0),
          suggested_decrease:dec, note:s.reason||'not found',

          onto_pallet:(l.kind === 'aside' ? (l.onto_pallet||'') : ''),
          onto_bay:(l.kind === 'aside' ? (l.onto_bay||'') : ''), ts:s.ts});
        return; }

      if(s.state === 'skipped'){ out.skipped.push({bay:b.bay, location:loc, sku:l.sku,
        lot:l.lot||'', kind:l.kind, planned_qty:l.planned_qty,
        approved_qty:(s.approved!=null?s.approved:l.planned_qty),

        onto_pallet:(l.kind === 'aside' ? (l.onto_pallet||'') : ''),
        onto_bay:(l.kind === 'aside' ? (l.onto_bay||'') : ''),
        cross:!!l.cross,
        reason:s.reason||'', ts:s.ts}); return; }
      if(l.kind === 'count' && s.counted != null){
        out.counts.push({serial:l.serial, location:loc, sku:l.sku, lot:l.lot,
          system_qty:l.system_qty, counted:s.counted, variance:s.variance, ts:s.ts});
        return;
      }
      const act = s.actual != null ? s.actual : null;
      if(act != null && act > 0){

        const parts = (s.placements && s.placements.length)
          ? s.placements
          : [{pallet: (l.kind === 'aside' ? (l.onto_pallet||'') : ''), qty: act, deviated:false}];
        parts.forEach(pt => {
          if(!(pt.qty > 0)) return;
          const pdest = (l.kind === 'take') ? (l.dest || '')
                                            : (palletFinalLoc(pt.pallet) || '');
          if(!pdest){

            const pa = actualFor(pt.pallet);
            out.unresolved = out.unresolved || [];
            out.unresolved.push({bay:b.bay, from:loc, sku:l.sku, qty:pt.qty,
              onto_pallet:pt.pallet||'',
              why: pt.floor
                     ? 'the crew put this part nowhere — it is loose on the floor'
                   : (pa && pa.state === 'floor')
                     ? 'the crew could not put pallet '+(pt.pallet||'?')+' back up — it is '+
                       'still on the floor, so this stock has not moved anywhere yet'
                   : 'the receiving pallet has no final position in the putback list'});
          }
          out.transfers.push({from_location:loc,
            to_location: pdest,
            onto_pallet: l.kind === 'aside' ? (pt.pallet||'') : '',
            sku:l.sku, lot:l.lot||'', quantity:pt.qty,
            planned_qty:l.planned_qty, approved_qty:(s.approved!=null?s.approved:l.planned_qty),

            as_planned: !pt.deviated,
            planned_pallet: l.kind === 'aside' ? (l.onto_pallet||'') : '',
             
            took_from_sibling: s.took_from_sibling || '',
            sibling_line: s.sibling_line || '',
            kind:l.kind, bay:b.bay, ts:s.ts});
        });
      }
      if(s.adjustment && Math.abs(s.adjustment) > 0.001){

        out.adjustments.push({location: (s.adjustment > 0 ? (adjLoc(p) || loc) : loc),

          origin: loc, posted_at: (s.adjustment > 0 ? 'final position' : 'origin'),
          sku:l.sku, lot:l.lot||'',
          change:s.adjustment, direction:s.adjustment<0?'decrease':'increase',
          baseline:(s.baseline != null ? s.baseline : l.system_qty),
          sibling_took:(s.sibling_took != null ? s.sibling_took : 0),
          reason:s.reason||'', system_qty:l.system_qty,
          moved:(s.actual!=null?s.actual:0), left_on_pallet:(s.left!=null?s.left:''), ts:s.ts});
      }
    };
    b.pallets.forEach(p => p.lines.forEach((l,i) => push(p, l, i, p.loc, p.loc)));

    (b.orphan_pulls||[]).forEach((o,i) =>
      push(null, o, i, 'ORPHAN', o.from_location || 'ORPHAN'));
  });

  PAYLOAD.bays.forEach(b => {
    (b.pallets || []).forEach(p => {
      const origin = p.loc;
      const a = actualFor(p.pallet_id);
      const final = palletFinalLoc(p.pallet_id);
      const key = (sk, lt) => sk + ' ' + (lt || '');

      const gone = {};
      out.transfers.forEach(t => {
        if (t.from_location === origin)
          gone[key(t.sku, t.lot)] = (gone[key(t.sku, t.lot)] || 0) + Number(t.quantity || 0);
      });
      (out.missing || []).forEach(m => {
        if (m.from === origin)
          gone[key(m.sku, m.lot)] = (gone[key(m.sku, m.lot)] || 0) + Number(m.suggested_decrease || 0);
      });

      const onIt = {};
      (p.lines || []).forEach(l => {
        if (l.kind === 'count') return;
        const k = key(l.sku, l.lot);
        if (!(k in onIt)) onIt[k] = {sku: l.sku, lot: l.lot || '', qty: Number(l.system_qty || 0)};
      });

      const splitTo = {};
      Object.keys(S.split_contents || {}).forEach(newPid => {
        const rec = S.split_contents[newPid];
        if (!rec || rec.from !== p.pallet_id) return;

        (rec.items || []).forEach(x => {
          const kk = key(x.sku, x.lot);
          splitTo[kk] = splitTo[kk] || {pid: newPid, qty: 0};
          splitTo[kk].qty += (x.qty == null ? Infinity : Number(x.qty));
        });
      });

      Object.keys(onIt).forEach(k => {
        const it = onIt[k];
        const left = Math.round((it.qty - (gone[k] || 0)) * 1000) / 1000;
        if (left <= 0.001) return;

        const sp = splitTo[k];
        if (sp) {
          const otherPid = sp.pid;
          const toOther = Math.min(left, sp.qty);
          const rest = Math.round((left - toOther) * 1000) / 1000;
          const oa = actualFor(otherPid), ofin = palletFinalLoc(otherPid);
          if (oa && oa.state === 'floor') {
            out.unresolved = out.unresolved || [];
            out.unresolved.push({bay: b.bay, from: origin, sku: it.sku, qty: toOther,
              onto_pallet: otherPid,
              why: 'moved onto ' + otherPid + ' when the pallet was split, and ' + otherPid +
                   ' is still on the floor'});
          } else if (!ofin) {
            out.unresolved = out.unresolved || [];
            out.unresolved.push({bay: b.bay, from: origin, sku: it.sku, qty: toOther,
              onto_pallet: otherPid,
              why: 'moved onto ' + otherPid + ' when the pallet was split, but ' + otherPid +
                   ' has no recorded position'});
          } else if (ofin !== origin && toOther > 0.001) {
            out.transfers.push({from_location: origin, to_location: ofin,
              onto_pallet: otherPid, sku: it.sku, lot: it.lot, quantity: toOther,
              planned_qty: '', approved_qty: '', as_planned: false,
              planned_pallet: p.pallet_id || '', took_from_sibling: '', sibling_line: '',
              kind: 'pallet_move', split_from: p.pallet_id || '', spoil: !!p.spoil,
              bay: b.bay, ts: (oa && oa.ts) || new Date().toISOString()});
          }

          if (rest > 0.001 && final && final !== origin) {
            out.transfers.push({from_location: origin, to_location: final,
              onto_pallet: p.pallet_id || '', sku: it.sku, lot: it.lot, quantity: rest,
              planned_qty: '', approved_qty: '', as_planned: !(a && a.deviated),
              planned_pallet: '', took_from_sibling: '', sibling_line: '',
              kind: 'pallet_move', spoil: !!p.spoil, bay: b.bay,
              ts: (a && a.ts) || new Date().toISOString()});
          }
          return;
        }

        if (a && a.state === 'floor') {
          out.unresolved = out.unresolved || [];
          out.unresolved.push({bay: b.bay, from: origin, sku: it.sku, qty: left,
            onto_pallet: p.pallet_id || '',
            why: 'the pallet is still on the floor - this stock has not gone anywhere yet'});
          return;
        }
        if (!final) {
          out.unresolved = out.unresolved || [];
          out.unresolved.push({bay: b.bay, from: origin, sku: it.sku, qty: left,
            onto_pallet: p.pallet_id || '',
            why: 'the pallet has no final position, so its remaining stock cannot be moved'});
          return;
        }

        if (final === origin) return;

        out.transfers.push({from_location: origin, to_location: final,
          onto_pallet: p.pallet_id || '',
          sku: it.sku, lot: it.lot, quantity: left,
          planned_qty: '', approved_qty: '',
          as_planned: !(a && a.deviated),
          planned_pallet: '', took_from_sibling: '', sibling_line: '',

          kind: 'pallet_move', spoil: !!p.spoil, bay: b.bay,
          ts: (a && a.ts) || new Date().toISOString()});
      });
    });
  });
  return out;
}
function csv(rows){
  if(!rows.length) return '';

  const k = [];
  rows.forEach(r => Object.keys(r).forEach(x => { if(!k.includes(x)) k.push(x); }));
  const q = v => { v = v==null?'':String(v);
    return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  return k.join(',')+'\n'+rows.map(r=>k.map(x=>q(r[x])).join(',')).join('\n')+'\n';
}
function dl(which){
  const m = moves();
  let rows = which==='events' ? S.events : m[which];
  if(which==='events'){
    rows = S.events.map(e=>({ts:e.ts, kind:e.kind, bay:e.bay||'', pallet:e.pallet||'',
      line:e.line||'', actual:e.actual==null?'':e.actual, counted:e.counted==null?'':e.counted}));
  }
  if(!rows || !rows.length) return toast('Nothing to export in ' + which + '.');
  const blob = new Blob([csv(rows)], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'freezer_' + which + '_' + (PAYLOAD.plan_date||'') + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  ev('export', {what:which, rows:rows.length});
}

function deviceId(){
  let d = null;
  try{ d = localStorage.getItem('freezer.device'); }catch(e){}
  if(!d){ d = 'ipad-' + Math.random().toString(36).slice(2,8);
          try{ localStorage.setItem('freezer.device', d); }catch(e){} }
  return d;
}
function sessionKey(){ return `${PAYLOAD.plan_date}_${deviceId()}`; }
function allBaysClosed(){
  return PAYLOAD.bays.every(b => (S.bays[b.n]||{}).closed);
}

async function graphWrite(path, body, method){
  const t = tokStore();
  if(!t) throw new Error('not signed in');
  const r = await fetch(GRAPH + path, {
    method: method || 'POST',
    headers: {Authorization: 'Bearer ' + t.access_token, 'Content-Type': 'application/json'},
    body: JSON.stringify(body)});
  if(r.status === 401){ tokStore(null); throw new Error('sign-in expired — sign in again'); }
  const j = await r.json().catch(() => null);
  if(!r.ok) throw new Error((j && (j.error||{}).message) || `HTTP ${r.status}`);
  return j;                                   
}

async function syncNow(){
  let fileLanded = false;
  const btn = $('#mainbtn');
  const was = btn ? btn.textContent : '';
  if(btn){ btn.textContent = 'Syncing…'; btn.disabled = true; }
  try{
    if(!(await ensureToken())){ await signIn(); return; }   
    const sp = CFG.sharepoint;
    const site = await graph(`/sites/${sp.hostname}:${sp.site_path}`);
    const m = moves();

    const rec = {schema: 1, plan_date: PAYLOAD.plan_date, device: deviceId(),
                 synced_at: new Date().toISOString(),
                 started: S.started, bay: S.bay, screen: S.screen,
                 lines: S.lines, pallets: S.pallets, bays: S.bays,
                 events: S.events, breaks: S.breaks, moves: m};
    const fname = `session_${sessionKey()}.json`;
    const t = tokStore();
    const up = await fetch(
      `${GRAPH}/sites/${site.id}/drive/root:/${sp.doc_folder}/${fname}:/content`,
      {method: 'PUT', headers: {Authorization: 'Bearer ' + t.access_token,
                                'Content-Type': 'application/json'},
       body: JSON.stringify(rec)});
    if(!up.ok) throw new Error(`record upload HTTP ${up.status}`);
    const upj = await up.json();
    fileLanded = true;      

    const lists = await graph(`/sites/${site.id}/lists?$select=displayName,id`);
    const lst = (lists.value || []).find(x => x.displayName === sp.list_name);
    if(!lst) throw new Error(`list "${sp.list_name}" not found on ${sp.site_path}`);
    const units = m.transfers.reduce((t2,x) => t2 + Number(x.quantity||0), 0);
    const fields = {
      Title: sessionKey(), PlanDate: PAYLOAD.plan_date, Device: deviceId(),

      Status: allBaysClosed() ? 'complete' : 'in_progress',
      StartedAt: S.started || new Date().toISOString(),
      FinishedAt: allBaysClosed() ? new Date().toISOString() : null,
      Transfers: m.transfers.length, UnitsMoved: Math.round(units),
      Corrections: m.adjustments.length, Counts: m.counts.length,
      Skipped: m.skipped.length, NotFound: m.missing.length,
      RecordFile: `${sp.doc_folder}/${fname}`,
      PlanFile: `${sp.doc_folder}/plan_latest.json`};

    const q = encodeURIComponent(`fields/Title eq '${sessionKey()}'`);
    let hit = null;
    try{
      const found = await graph(
        `/sites/${site.id}/lists/${lst.id}/items?$expand=fields&$filter=${q}&$top=5`);
      hit = (found.value || [])[0] || null;
    }catch(e){
      
      const found = await graph(
        `/sites/${site.id}/lists/${lst.id}/items?$expand=fields&$top=999`);
      const all = (found.value || []).filter(i => (i.fields||{}).Title === sessionKey());
      hit = all[0] || null;
      if((found.value || []).length >= 999)
        toast('⚠️ the session list is large — ask for the Title column to be indexed');
    }
    let ack;
    if(hit){ ack = await graphWrite(
        `/sites/${site.id}/lists/${lst.id}/items/${hit.id}/fields`, fields, 'PATCH'); }
    else   { ack = await graphWrite(
        `/sites/${site.id}/lists/${lst.id}/items`, {fields: fields}, 'POST'); }
    if(!ack) throw new Error('the list write returned no acknowledgement');

    S.synced = {at: new Date().toISOString(), file: upj.name,
                transfers: m.transfers.length, counts: m.counts.length};
    ev('synced', {file: upj.name, transfers: m.transfers.length});
    save(); render();
    toast(`✅ synced — ${m.transfers.length} transfer(s), ${m.counts.length} count(s)`);
  }catch(e){
    ev('sync_failed', {why: String(e.message || e)});
    save();

    dlg('Sync failed', '<div class="badbox"><b>'+
      (fileLanded ? 'The record file was saved, but the session row was NOT updated.'
                  : 'Nothing was sent.')+
      '</b><div class="sm" style="margin-top:6px">'+esc(String(e.message || e))+'</div></div>'+
      '<p class="sm dim">Your work is still saved on this iPad. Get back in signal and try '+
      'again — ⛔ do not start another session for this plan until this succeeds.</p>',
      [{t:'OK', c:'pri'}]);
  }finally{ if(btn){ btn.disabled = false; btn.textContent = was; } }
}

function dlg(title, bodyHtml, buttons, after){
  const d = $('#dlg');
  $('#dlgh').textContent = title; $('#dlgb').innerHTML = bodyHtml;
  const f = $('#dlgf'); f.innerHTML = '';
  buttons.forEach(b => {
    const el = document.createElement('button');
    el.textContent = b.t; el.className = b.c || '';

    el.onclick = (e) => { if(b.f){ e.preventDefault(); if(b.f() !== false) d.close(); } };
    f.appendChild(el);
  });
  d.showModal(); if(after) after();
}

window.addEventListener('load', () => {
  const probe = probeStorage();
  STORAGE_OK = probe.ok;
  if(!STORAGE_OK){ blockStorage(probe.why, false); return; }   
  keepAwake();
  boot();
});
window.addEventListener('beforeunload', () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} });
</script>
