        'corrected in Finale.</p>'+
        '<div class="sm" style="margin:10px 0">'+
          left.slice(0,10).map(x=>'• <b>'+esc(x.l.sku)+'</b> <span class="dim">'+
            esc(x.l.kind)+' · '+esc(x.loc)+'</span>').join('<br>')+
          (left.length>10?'<br><span class="dim">…and '+(left.length-10)+' more</span>':'')+
        '</div>'+
        whyPicker(),
        [{t:'Go back',c:'ghost'},
         {t:'Record and close',c:'warn',f:()=>{
            const r = whyRead(); if(r === false) return false;
            left.forEach(x => skipLine(x.id, r.why, r.typed));
            settleStays();
            b.pallets.forEach(p => { S.pallets[p.loc] =
              Object.assign(S.pallets[p.loc]||{}, {done:true, open:false}); });
            ev('bay_closed_incomplete', {bay:b.bay, skipped:left.length,
                                         why:r.why, typed:r.typed});
            save(); advance(); }}], whyWire);
    };
  }
}

function pallet(b, p){
  const ps = S.pallets[p.loc] || {};

  const open = !!ps.open;
  const groups = {};
  p.lines.forEach((l,i) => { (groups[l.kind] = groups[l.kind] || []).push({l:l, i:i}); });
  const counts = ORDER.filter(k=>groups[k]).map(k => groups[k].length + ' ' +
      (k==='take'?'to floor':k==='aside'?'set aside':k==='count'?'to count':'stay')).join(' · ');

  const todo = p.lines.filter(x => isActionable(x)).length;
  const seen = new Map();
  p.lines.forEach(x => {
    const k = (x.sku||'') + '|' + (x.lot||'');
    if(!seen.has(k)) seen.set(k, Number(x.system_qty||0));
  });
  let units = [...seen.values()].reduce((t,v) => t + v, 0), skus = seen.size;

  const now_ = palletNow(p);
  if(now_){
    const ks = Object.keys(now_).filter(k => Number(now_[k]) > 0.001);
    skus = ks.length; units = ks.reduce((t, k) => t + Number(now_[k]), 0);
  }
   
  const head = palletFreed(p) ? 'deck freed — it does not go back'
             : (todo ? todo + ' to do' : 'nothing to do') + ' · ' + skus +
               ' SKU on it' + (now_ ? ' now' : '') + ' · ' + n(Math.round(units * 1000) / 1000) + ' units';

  let h = '<div class="card"><div class="ph" onclick="togglePallet(\''+p.loc+'\')">'+
    '<span class="tag '+(ps.done?'t-stay':'t-take')+'">'+(ps.done?'✓':'pos '+p.pos)+'</span>'+
    '<div class="grow"><b>'+esc(p.loc)+'</b>'+
      (p.pallet_id ? ' <span class="tag t-count">card '+esc(cardOf(p))+'</span>' : '')+
      (p.off_plan ? ' <span class="pill">not in the plan</span>' : '')+
      (palletFreed(p) ? ' <span class="pill">deck freed</span>' : '')+
      '<small><b>'+esc(head)+'</b></small>'+
      '<small>'+esc(palletFreed(p) ? '' : counts)+

      (p.spoil ? ' · <b>' + (function(){ const pc = placardOf(b, p);
          if(pc.k === 'freed') return 'SPOIL — deck freed, it does not go back';
          if(pc.k === 'floor') return 'SPOIL — left on the floor';
          return pc.loc && pc.loc !== p.loc
            ? 'SPOIL — nothing to take, but it does NOT go back here → placard ' + esc(pc.loc)
            : 'SPOIL — nothing to take, goes straight back'; })() + '</b>' : '')+'</small></div>'+
    '<span class="dim">'+(open?'▾':'▸')+'</span></div>';
  if(open){

    const arriving = arrivalsFor(p.pallet_id);
    const coming = arriving.filter(x => !x.gone);

    const xd = (b.cross_in || []).filter(m => m.onto_pallet === p.pallet_id && m.dest_over_deck);
    if(arriving.length){
      h += '<div class="pad" style="border-top:1px solid var(--line);padding-bottom:0">'+
        (xd.length ? '<div class="warnbox" style="margin:0 0 8px;border-color:var(--bad)">'+
          '<b>⚠️ This pallet may not hold all of it.</b><div class="sm" style="margin-top:4px">'+
          'Estimated <b>'+xd[0].dest_total_m3.toFixed(2)+' m³</b> once everything is on, '+
          'against a <b>'+xd[0].dest_deck_m3.toFixed(2)+' m³</b> deck. Load what fits, '+
          'oldest lots first. ⛔ Do NOT force it — leave the remainder on the floor and '+
          'record it, so the next plan knows where the stock actually is.</div></div>' : '')+
        '<div class="warnbox" style="margin:0 0 10px"><b>⊕ '+coming.length+
        ' goes ON this pallet before it goes back up</b>'+
        (arriving.length !== coming.length
          ? '<div class="sm dim" style="margin-top:2px">('+
            (arriving.length - coming.length)+' more was planned and is not coming — below)</div>'
          : '')+
        arriving.map(arrivalLine).join('')+
        '</div></div>';
    }
     
    if(p.off_plan)
      h += '<div class="pad" style="border-top:1px solid var(--line);padding-bottom:0">'+
        '<div class="warnbox" style="margin:0 0 10px"><b>You brought this one down — it was not '+
        'in the plan.</b><div class="sm" style="margin-top:4px">'+esc(p.why_off_plan || '')+
        '</div><div class="sm dim" style="margin-top:4px">Finale lists what is on it below. '+
        'Move things on or off it exactly as on any other pallet. '+(function(){ const pc = placardOf(b, p);
          return pc.k === 'freed' ? 'Its deck is marked as emptied — it does not go back.'
               : pc.k === 'floor' ? 'It is recorded as staying on the floor.'
               : 'If it goes back up it gets the placard <b>'+esc(pc.loc || p.loc)+'</b> unless you say it went elsewhere.'; })()+
        '</div></div></div>';

    (function(){
      const also = [];
      (S.found_moves || []).forEach(fm => { if(fmOnto(fm, p))        
        also.push(esc(fm.sku)+(fm.lot?' · lot '+esc(fm.lot):'')+' ×'+n(fm.qty)+
                  ' <span class="dim">— location fix, Finale had it at '+esc(fm.from)+'</span>'); });
      pilesClaimedBy(b, p).forEach(x => {
        also.push(esc(x.sku)+(x.lot?' · lot '+esc(x.lot):'')+' ×'+n(x.qty)+
                  ' <span class="dim">— was really on this pallet (Finale had it on '+esc(x.from)+')</span>'); });
      if(also.length)
        h += '<div class="pad" style="border-top:1px solid var(--line);padding-bottom:0">'+
          '<div class="okbox" style="margin:0 0 10px"><b>Also on this pallet now</b>'+
          also.map(x => '<div class="sm" style="margin-top:4px">• '+x+'</div>').join('')+

          '<div class="sm dim" style="margin-top:4px">'+esc(palletFateWords(b, p))+'</div></div></div>';
    })();
    if(palletFreed(p))
      h += '<div class="pad" style="border-top:1px solid var(--line);padding-bottom:0">'+
        '<div class="'+(rollWords(b).charAt(0) === '⛔' ? 'badbox' : 'okbox')+'" style="margin:0 0 10px">'+
        '<b>⛔ Emptied — this deck does NOT go back.</b>'+
        '<div class="sm" style="margin-top:4px">'+esc(rollWords(b))+'</div></div></div>';
     
    if(p.pallet_id && !palletFreed(p)){

      h += '<div class="pad" style="border-top:1px solid var(--line);padding-bottom:0">'+
        '<div class="okbox" style="margin:0 0 10px"><b>① Put temporary card '+
        esc(cardOf(p))+' on this pallet now.</b>'+
        '<div class="sm dim" style="margin-top:4px">It came from '+esc(p.loc)+'. '+
        (function(){ const pc = placardOf(b, p);
          if(pc.k === 'floor') return '⚠️ <b>It is recorded as staying on the restock floor</b> — it gets '+
            'no placard until it goes back up.';
          return pc.loc
            ? 'When it goes back up it gets the Finale placard <b>'+esc(pc.loc)+'</b> '+
              '— that may not be where it came from.'+(pc.planned && pc.planned !== pc.loc
                ? ' <span class="dim">(the plan said '+esc(pc.planned)+')</span>' : '')
            : '⛔ <b>This one does NOT go back up</b> — everything moves off it and the deck '+
              'is freed. Leave it empty.'; })()+
        '</div></div></div>';
    }
    h += '<div class="body">';
    ORDER.forEach(k => {
      if(!groups[k]) return;
      h += '<div class="grp">'+esc(LABEL[k])+' — '+groups[k].length+'</div>';
      groups[k].forEach(g => { h += line(b, p, g.l, g.i); });
    });
    h += '</div><div class="pad row">'+
      '<button class="ok" onclick="allAsPlanned(\''+p.loc+'\')">✓ All as planned</button>'+

      (groups.count ? (() => {
         const left = groups.count.filter(g => !isFinished(st(lid(b.n, p.loc, g.l, g.i)))).length;
         return left ? '<button onclick="chainCounts(\''+p.loc+'\')">⊙ Count these '+left+
                       '</button>'
                     : '<button disabled>⊙ '+groups.count.length+' counted</button>';
       })() : '')+
      '<button onclick="skipRest(\''+p.loc+'\')">↷ Skip the rest</button>'+

      (palletFreed(p) ? '' :
      '<button onclick="askAdhocCount(\''+p.loc+'\')">⊙ Count something else</button>'+
      '<button onclick="askFound(\''+p.loc+'\')">⊕ Found something not on the list</button>')+
       
      (palletFreed(p) ? '' : '<button onclick="askLotFix(\''+p.loc+'\')">✎ The lot on a box is different</button>')+

      (palletFreed(p) ? '' : '<button onclick="askCheckPallet(\''+p.loc+'\')">☑ Check what is on it</button>')+
      '<button onclick="askFreeDeck(\''+p.loc+'\')">'+(palletFreed(p)
        ? '✂ Deck freed — undo?' : '✂ Emptied — the deck does not go back')+'</button>'+
      (p.off_plan ? '<button class="ghost" onclick="undoOffPlanUI(\''+p.loc+'\')">'+
        '↶ I did not bring this one down</button>' : '')+
      '<button class="ghost" onclick="askSettlePallet(\''+p.loc+'\')">⊘ '+
        (palletSettled(p) ? 'Left alone — undo?' : 'Leave this pallet alone')+'</button>'+
      '</div>';
  }
  return h + '</div>';
}

function line(b, p, l, i){
  const id = lid(b.n, p.loc, l, i), s = st(id);
  const done = isFinished(s);
  const skipped = s && s.state === 'skipped';
  const q = s && s.actual != null ? s.actual
          : (s && s.approved != null ? s.approved : l.planned_qty);

  const sysTxt = n(l.system_qty);     
  let sub = '';
  if(l.kind === 'take')  sub = '→ ' + esc(l.dest || 'F1');

  if(l.kind === 'aside') sub = '→ pallet ' + esc(l.onto_card || cardOf(l.onto_pallet)) +
                               (l.cross
                                 ? ' in <b>bay '+l.onto_bay+' · '+esc(l.onto_lane||'')+
                                   '</b> — keep it on the floor until then'
                                 : (l.onto_bay!==b.n?' (bay '+l.onto_bay+')':'')) +
                               (l.after_take?' · the REMAINDER after the pick':'') + ' · do NOT reload here';
  if(l.kind === 'count') sub = 'serial ' + esc(l.serial) + ' · system says ' + n(l.system_qty);
  if(l.kind === 'stay'){
     
    const lf = pileLeft(b, p, l.sku, l.lot), was = onPallet(b, p, l.sku, l.lot);
    sub = lf <= 0.001 ? '0 left — nothing to reload'
        : (lf < was - 0.001 ? n(lf) + ' left — reload those' : 'reload as it was');
  }
  const note = s && s.reason ? ' · <b style="color:var(--aside)">'+esc(s.reason||'')+'</b>' : '';
  const mark = skipped ? '↷' : (s && (s.state === 'missing' || s.parked_not_here)) ? '∅' : '✓';
  return '<div class="ln '+(done?'done':'')+'">'+
    '<span class="tag t-'+l.kind+'">'+(done?mark:l.kind==='take'?'▼':l.kind==='aside'?'⇢':l.kind==='count'?'⊙':'—')+'</span>'+
    '<div class="grow" onclick="openLine(\''+id+'\')">'+
      '<div class="sku">'+esc(l.sku)+(l.lot?' <span class="dim sm">'+esc(l.lot)+'</span>':'')+
        ' <span class="dim sm">· '+sysTxt+' on this pallet</span></div>'+
      '<div class="sub">'+esc(l.desc||'')+'</div>'+

      (p.off_plan && !l.lot && l.kind === 'stay'
        ? ((s && s.lot_attached) || l.lot_attached

            ? '<div class="sub">box says lot <b>'+esc((s && s.lot_attached) || l.lot_attached)+
              '</b> · Finale still has <b>no lot</b> — to change Finale, use <b>✎ The lot on a '+
              'box is different</b> (it asks twice)</div>'
            : '<div class="sub"><b style="color:var(--aside)">NO LOT</b> <button class="ghost" '+
              'onclick="askAttachLot(\''+esc(p.loc)+'\',\''+esc(l.sku)+'\')">add it</button></div>') : '')+
      '<div class="sub">'+sub+note+'</div>'+
       
      (function(){ if(l.kind === 'count') return '';
        const rt = pileRecordText(b, p, l, i);
        return rt ? '<div class="sub" style="color:var(--aside)"><b>recorded:</b> '+esc(rt)+'</div>' : ''; })()+
      '</div>'+
    (l.kind==='stay'||l.kind==='count' ? '' : '<div class="qty">'+n(q)+'</div>')+
    (l.kind==='count' ? '<button onclick="doCount(\''+id+'\')">'+(done?mark:'Count')+'</button>'
                      : '<button onclick="openLine(\''+id+'\')">'+(done?mark:'…')+'</button>')+
    '</div>';
}

function togglePallet(loc){
  const ps = S.pallets[loc] = S.pallets[loc] || {};

  ps.open = !ps.open;
  Object.keys(S.pallets).forEach(k => { if(k !== loc) S.pallets[k].open = false; });
  if(ps.open) ev('pallet_open', {pallet:loc}); else ev('pallet_close', {pallet:loc});
  save(); render();
}
function allAsPlanned(loc){
  const f = PAYLOAD.bays[S.bay].pallets.find(p => p.loc === loc);
  if(palletSettled(f)){ toast('⛔ this pallet is recorded as “leave it alone” — undo that first');
                        return; }
  f.lines.forEach((l,i) => {
    const id = lid(PAYLOAD.bays[S.bay].n, loc, l, i);
    if(l.kind === 'count') return;        
     
    if(pileSettled(PAYLOAD.bays[S.bay], f, l.sku, l.lot || '')) return;
    const s = st(id);
    if(isFinished(s)) return;

    if(!isActionable(l)){ setLine(id, {state:'done', as_planned:true, no_action:true}); return; }
    setLine(id, {state:'done', actual: (s && s.approved!=null) ? s.approved : l.planned_qty,
                 as_planned:true});
  });
  ev('all_as_planned', {pallet:loc});

  const bb = PAYLOAD.bays[S.bay];
  let ask = null;
  f.lines.forEach((l, i) => {
    if(ask || (l.kind !== 'take' && l.kind !== 'aside')) return;
    const tal = pileTally(bb, f, l.sku, l.lot);
    const want = tal.over ? tal.over : (tal.short ? -tal.short : 0);
    if(Math.abs(want) < 0.001) return;
    const carried = tal.lines.reduce((s_, id2) => { const x = st(id2) || {};
      return s_ + (x.pile_adj ? (Number(x.adjustment || 0) - Number(x.to_temp || 0) +
                                 Number(x.from_temp || 0)) : 0); }, 0);
    if(Math.abs(carried - want) > 0.001) ask = tal.lines[tal.lines.length - 1];
  });
  if(ask) setTimeout(() => { toast('⚠️ one pile does not add up — say what happened to the '+
                                   'difference'); openLine(ask); }, 0);
  const left = f.lines.filter((l,i) => l.kind==='count' &&
      !(st(lid(PAYLOAD.bays[S.bay].n,loc,l,i))||{}).state).length;
  if(left){ toast(left + ' cycle count(s) still to do on this pallet'); }
  else { S.pallets[loc] = Object.assign(S.pallets[loc]||{}, {done:true, open:false}); }
  save(); render();
}
function maybeDone(loc){
  const f = PAYLOAD.bays[S.bay].pallets.find(p => p.loc === loc);
  const all = f.lines.every((l,i) => { const s = st(lid(PAYLOAD.bays[S.bay].n,loc,l,i));
    return isFinished(s); });
  if(all){ S.pallets[loc] = Object.assign(S.pallets[loc]||{}, {done:true, open:false}); }
  save();
}

function refuseIfSettled(f){
  if(!f || !f.p || !f.l || f.l.kind === 'count') return false;
  if(!pileSettled(f.b, f.p, f.l.sku, f.l.lot || '')) return false;
  const whole = palletSettled(f.p);
  dlg('This was left alone',
    '<p>'+(whole ? 'The whole pallet <b>'+esc(f.p.pallet_id || f.p.loc)+'</b>'
                 : '<b>'+esc(f.l.sku)+(f.l.lot?' · lot '+esc(f.l.lot):'')+'</b> on this pallet')+
    ' is recorded as <b>“leave it alone — Finale is already right”</b>.</p>'+
    '<p class="sm dim">⛔ So nothing can be recorded as moved here — the two cannot both be '+
    'true. '+(whole ? 'Use “Undo — put it back in the plan” on the pallet first.'
                    : 'Tap ↶ Undo to take the “leave it alone” back first.')+'</p>',
    whole ? [{t:'OK',c:'ghost'}]
          : [{t:'OK',c:'ghost'},

             {t:'Put it back in the plan',c:'warn',f:()=>{ unsettlePile(f); render(); }}]);
  return true;
}
function unsettlePile(f){
  (f.p.lines || []).forEach((l2, i2) => {
    if(l2.kind === 'count' || l2.sku !== f.l.sku || (l2.lot || '') !== (f.l.lot || '')) return;
    const id2 = lid(f.b.n, f.p.loc, l2, i2), s2 = st(id2);
    if(s2 && s2.state === 'settled') setLine(id2, {state:undefined, settled_why:undefined});
  });
  ev('line_unsettled', {bay:f.b.n, loc:f.p.loc, sku:f.l.sku, lot:f.l.lot || ''});
}
function openLine(id, opts){
  const f = find(id); if(!f) return;
   
  const missing = Number((opts && opts.missing) || 0);
  if(refuseIfSettled(f)) return;
  const l = f.l, s = st(id) || {};

  if(l.kind === 'count'){ doCount(id, []); return; }

  const prev = s || {};

  const planned = (prev.state !== 'skipped' && prev.state !== 'missing' && prev.actual != null)
                ? prev.actual
                : (s.approved != null ? s.approved : l.planned_qty);
  if(l.kind === 'stay'){
    const prevStay = s || {};
    return dlg('Stays — ' + l.sku + (l.lot ? ' · lot ' + l.lot : ''),
      '<p class="dim">Nothing to do: reload this exactly as it was.</p>'+
      '<p class="sm dim">Finale says <b>'+n(l.system_qty)+'</b> on this pallet. If that is wrong, '+
      'correct it — a pallet that is already open is the cheapest time to fix a count.</p>'+
      (missing > 0 ? '<div class="warnbox sm">You said <b>'+n(missing)+'</b> are missing — so this '+
        'starts at what is really on the pallet. Pick the reason to write them off.</div>' : '')+
      '<label class="sm dim">Actually on the pallet</label>'+
      qtyField('q1', n(missing > 0 ? Math.max(0, onPallet(f.b, f.p, l.sku, l.lot) - missing)
                                   : (prevStay.left != null ? prevStay.left : l.system_qty)))+
      '<div id="scalc" class="sm dim" style="margin-top:8px">Change the number to record a '+
      'correction.</div>',
      [{t:'Cancel',c:'ghost'},

       {t:'⊘ Leave it alone',c:'ghost',f:()=>{ setTimeout(()=>askSettleLine(id),0); }},

       {t:'⇢ I moved it',c:'',f:()=>{ setTimeout(()=>askMoveInstead(id),0); }},
       {t:'⇱ Different pallet',c:'ghost',f:()=>{ setTimeout(()=>askTookFrom(id),0); }},
       {t:'Correct the count',c:'warn',f:()=>{
          const v=readQty('q1');
          if(v===null){ toast('⛔ not a quantity'); return false; }
          const adj = v - onPallet(f.b, f.p, l.sku, l.lot);    

          if(Math.abs(adj) < 0.001){
            setLine(id,{state:'done', as_planned:true});
            ev('line_done',{line:id}); maybeDone(f.p.loc); render(); return; }

          const sel = $('#sreason');
          if(!sel || sel.value === '__none__'){
            toast('⛔ pick a reason — this is a Finale stock correction');
            return false; }
          setLine(id,{state:'done', left:v, adjustment:adj, corrected:true,
                      reason:sel.value, direction: adj<0 ? 'shrink' : 'found'});
          ev('qty_corrected',{line:id, was:l.system_qty, now:v, adjustment:adj});
          maybeDone(f.p.loc); render(); }},
       {t:'It is right',c:'ok',f:()=>{ setLine(id,{state:'done', as_planned:true});
          ev('line_done',{line:id}); maybeDone(f.p.loc); render(); }}],
      () => {
        const upd = () => {
          const v = Number($('#q1').value) || 0,
                adj = v - onPallet(f.b, f.p, l.sku, l.lot);      
          const c = $('#scalc'); if(!c) return;
          if(Math.abs(adj) < 0.001){
            c.innerHTML = 'No change — this will just confirm the count.'; return; }
          const list = adj < 0 ? PAYLOAD.shrink_reasons : PAYLOAD.found_reasons;

          const ph = list.length > 1
            ? '<option value="__none__" selected>— choose a reason —</option>' : '';
          c.innerHTML = '<div class="warnbox"><b>'+(adj<0?'Short by '+n(-adj)
                          :'Found '+n(adj)+' extra')+'</b>'+

            '<div class="sm dim" style="margin:6px 0">A Finale '+
            (adj<0?'decrease':'increase')+' at '+
            esc(adjLoc(f.p, l, !(S.bays[f.b.n]||{}).putback_done, floorDown(f.p))
                || (f.p?f.p.loc:'this pallet'))+'.</div>'+
            '<select id="sreason">'+ph+list.map(r=>'<option value="'+esc(r)+'">'+
              esc(r)+
              '</option>').join('')+'</select></div>';
        };
        const e = $('#q1'); if(e) e.addEventListener('input', upd);
        upd();
      });
  }

  const sib = f.p ? f.p.lines.find((x,ix) =>
        ix !== f.i && x.sku === l.sku && (x.lot||'') === (l.lot||'') &&
        (x.kind === 'take' || x.kind === 'aside')) : null;
  const tal0 = pileTally(f.b, f.p, l.sku, l.lot);
  const verb = l.kind === 'take' ? 'moved to ' + (l.dest||'F1') : 'set aside onto ' + l.onto_pallet;

  dlg(l.sku + (l.lot ? ' · lot ' + l.lot : ' · no lot') + ' — planned ' + n(planned),

    (function(){ const c = pileClaim(f.b, f.p, l.sku, l.lot);
      if(!c || c.id === id) return '';
      return '<div class="badbox sm" style="margin-bottom:8px">⛔ <b>This pile was recorded as really being on '+
        esc(c.pid)+'</b> — all '+n(l.system_qty)+' of this lot go back up on '+esc(c.pid)+', not on '+
        esc(f.p.pallet_id || f.p.loc)+'. Taking some off '+esc(f.p.pallet_id || f.p.loc)+' says the opposite.'+
        '<div style="margin-top:6px">If it was on this pallet after all, undo that first. If EXTRA were on '+
        esc(c.pid)+', open '+esc(c.pid)+' and use <b>⊕ Found something not on the list</b>.</div>'+
        '<div style="margin-top:6px"><button type="button" class="warn" style="min-height:44px" '+
        'onclick="undoTookFrom(\''+esc(c.id)+'\')">No — it was on '+esc(f.p.pallet_id || f.p.loc)+' after all</button></div></div>'; })()+
    (prev.state === 'missing'

const SKIP_WHY = [
  'ran out of time',
  'pallets had to go back up',
  'no room on the destination',
  'too heavy / awkward',
  'doing it later today',
];
const WHY_OTHER = '__type_it';
function whyPicker(){
  return '<label class="sm dim">Why?</label>'+
    '<select id="skw">'+
      SKIP_WHY.map(r => '<option value="'+esc(r)+'">'+esc(r)+'</option>').join('')+
      '<option value="'+WHY_OTHER+'">something else — let me type it</option>'+
    '</select>'+
    '<div id="skwo" style="display:none;margin-top:10px">'+
      '<label class="sm dim">In your own words — what stopped it?</label>'+
      '<input id="skwt" type="text" maxlength="140" autocomplete="off" '+
        'placeholder="e.g. the pallet was shrink-wrapped to the rack">'+
    '</div>';
}

function whyWire(){
  const s = $('#skw'), box = $('#skwo'), t = $('#skwt');
  if(!s || !box) return;
  s.onchange = () => {
    const other = (s.value === WHY_OTHER);
    box.style.display = other ? '' : 'none';
    if(other && t) t.focus();
  };
}

function whyRead(){
  const s = $('#skw');
  if(!s) return {why:'skipped', typed:false};
  if(s.value !== WHY_OTHER) return {why:s.value, typed:false};
  const t = $('#skwt'), v = ((t && t.value) || '').trim();
  if(!v){ toast('⛔ Type what stopped it — or pick one of the reasons above.');
          if(t) t.focus(); return false; }
  return {why:v, typed:true};
}

function skipLine(id, bulk, typed){
  const f = find(id); if(!f) return;
  const done = () => { if(!bulk){ maybeDone(f.p ? f.p.loc : ''); render(); } };

  if(bulk){ setLine(id, {state:'skipped', actual:0, reason:bulk,
                         reason_source:(typed ? 'typed' : 'picked')});
            ev('line_skipped',{line:id, why:bulk, typed:!!typed}); return; }
  dlg('Skip ' + f.l.sku + '?',
    '<p class="dim">This records that you DID NOT do it — not that the stock is missing. '+
    'Nothing will be transferred and Finale will not be corrected.</p>'+
    whyPicker(),
    [{t:'Cancel',c:'ghost'},
     {t:'Skip it',c:'warn',f:()=>{ const r = whyRead(); if(r === false) return false;
        setLine(id,{state:'skipped', actual:0, reason:r.why,
                    reason_source:(r.typed ? 'typed' : 'picked')});
        ev('line_skipped',{line:id, why:r.why, typed:r.typed}); done(); }}], whyWire);
}

function skipRest(loc){
  const b = PAYLOAD.bays[S.bay];
  const p = b.pallets.find(x => x.loc === loc);
  const left = [];
  p.lines.forEach((l,i) => { const id = lid(b.n, loc, l, i);
    if(isFinished(st(id))) return;
    if(isActionable(l)) left.push({id:id, l:l});
    else setLine(id, {state:'done', as_planned:true, no_action:true});  
  });
  if(!left.length){
    S.pallets[loc] = Object.assign(S.pallets[loc]||{}, {done:true, open:false});
    save(); render();
    return toast('Nothing left to do on this pallet.');
  }
  dlg('Skip the rest of ' + loc + '?',
    '<p class="dim">'+left.length+' line(s) will be recorded as NOT DONE. The pallet still '+
    'goes back up — this only says the work on it did not happen.</p>'+
    '<div class="sm dim" style="margin:8px 0">'+
      left.slice(0,8).map(x=>'• '+esc(x.l.sku)+' <span class="dim">('+esc(x.l.kind)+')</span>').join('<br>')+
      (left.length>8?'<br>…and '+(left.length-8)+' more':'')+'</div>'+
    whyPicker(),
    [{t:'Cancel',c:'ghost'},
     {t:'Skip '+left.length,c:'warn',f:()=>{ const r = whyRead(); if(r === false) return false;
        left.forEach(x => skipLine(x.id, r.why, r.typed));
        S.pallets[loc] = Object.assign(S.pallets[loc]||{}, {done:true, open:false});
        ev('pallet_skipped',{pallet:loc, lines:left.length, why:r.why, typed:r.typed});
        save(); render(); }}], whyWire);
}
function orphanDone(id, took){
  const f = find(id);
  setLine(id, took ? {state:'done', actual:f.l.planned_qty} : {state:'missing', actual:0, reason:'not found'});
  ev(took?'line_done':'line_missing', {line:id, orphan:true}); render();
}

function orphanMissing(id){
  const f = find(id); if(!f) return;
  const l = f.l, prev = (S.lines[id] || {});
  const list = PAYLOAD.shrink_reasons || [];
  const ph = list.length > 1 ? '<option value="__none__" selected>— choose a reason —</option>' : '';
  dlg('Not here at all — ' + l.sku + (l.lot ? ' · lot ' + l.lot : ''),
    '<div class="badbox"><b>This says Finale is wrong about all '+n(l.system_qty || l.planned_qty)+
      '.</b><div class="sm" style="margin-top:6px">It writes a stock decrease, so it needs the '+
      'accounting code you would choose yourself. If you simply ran out of time, close the '+
      'card instead — that is a different fact and it corrects nothing.</div></div>'+
    '<label class="sm dim" style="margin-top:10px">Reason</label>'+
    '<select id="orsn">'+ph+list.map(r=>'<option value="'+esc(r)+'"'+
      (r===prev.reason?' selected':'')+'>'+esc(r)+'</option>').join('')+'</select>',
    [{t:'Cancel', c:'ghost'},
     {t:'Record it as missing', c:'warn', f:()=>{
        const sel = $('#orsn');

          return toast('⛔ pick a reason — it becomes a Finale accounting code');

        ev('line_missing', {line:id, orphan:true, reason:sel.value});

function chainCounts(loc){
  const b = PAYLOAD.bays[S.bay];
  const p = b.pallets.find(x => x.loc === loc);
  const q = [];
  p.lines.forEach((l,i)=>{ if(l.kind==='count'){ const id=lid(b.n,loc,l,i);
    if(!(st(id)||{}).state) q.push(id); } });
  if(!q.length) return toast('All counted on this pallet.');
  doCount(q[0], q.slice(1));
}

function pileCarriedOff(b, p, sku, lot){
  const r = pileCarriedBySiblings(b, p, sku, lot, null);
  (S.found_moves || []).forEach(fm => {
    if(fm.from === p.loc && fm.sku === sku && (fm.lot || '') === (lot || '') && Number(fm.qty) > 0){
      r.units += Number(fm.qty); r.what.push(n(fm.qty) + ' moved by a location fix'); } });
  r.units = Math.round(r.units * 1000) / 1000;
  return r;
}

function pileCarriedBefore(b, p, sku, lot, atTs){
  const r = {pre:0, post:0, flags:[]};
  const at = String(atTs || '');
  const add = (q, when, words) => { if(!(q > 0.001)) return;
    if(at && String(when || '') > at){ r.post += q; r.flags.push(n(q) + ' ' + words + ' AFTER the count'); }
    else r.pre += q; };
  (p.lines || []).forEach((l, i) => {
    if(l.kind === 'count' || l.sku !== sku || (l.lot || '') !== (lot || '')) return;
    const s_ = S.lines[lid(b.n, p.loc, l, i)] || {};
    if(s_.state !== 'done') return;
    if(!(l.kind === 'take' || l.kind === 'aside' || s_.did_different)) return;
    const words = s_.did_different ? 'moved' : l.kind === 'take' ? 'taken' : 'set aside';
    const when = s_.done_ts || s_.ts || '';
    const parts = (s_.placements || []).filter(pt => Number(pt.qty || 0) > 0);
    if(parts.length && parts.some(pt => pt.ts)){
      parts.forEach(pt => add(Number(pt.qty), pt.ts || when, words));
      add(Number(s_.to_temp || 0), when, 'parked');
    } else add(Number(s_.actual || 0) + Number(s_.to_temp || 0), when, words);
    if(at && String(when) <= at && String(s_.ts || '') > at)
      r.flags.push('the ' + l.kind + ' line was changed after the count');
  });
  (S.found_moves || []).forEach(fm => {
    if(fm.from === p.loc && fm.sku === sku && (fm.lot || '') === (lot || ''))
      add(Number(fm.qty), fm.ts, 'moved by a location fix'); });
  r.pre = Math.round(r.pre * 1000) / 1000; r.post = Math.round(r.post * 1000) / 1000;
  return r;
}
function countFigures(b, p, l, s_){
  if(!s_ || s_.counted == null && s_.counted_left == null) return null;
  const sys = Number(l.system_qty || 0);
  if(s_.counted_basis === 'left' && s_.counted_left != null){
    const cb = pileCarriedBefore(b, p, l.sku, l.lot, s_.counted_ts || s_.done_ts || s_.ts);
    const tot = Math.round((Number(s_.counted_left) + cb.pre) * 1000) / 1000;
    return {counted:tot, variance:Math.round((tot - sys) * 1000) / 1000, basis:'left', left:Number(s_.counted_left),
            flags:cb.flags};
  }
  const c = Number(s_.counted);
  return {counted:c, variance:(s_.variance != null ? Number(s_.variance) : Math.round((c - sys) * 1000) / 1000),
          basis:s_.counted_basis || 'total', left:null};
}
function doCount(id, rest){
  const f = find(id); if(!f) return;
  const l = f.l;
  const prevC = st(id) || {};

  const carried = pileCarriedOff(f.b, f.p, l.sku, l.lot);
  const hasCarry = carried.units > 0.001;
  const prevBasis = prevC.counted_basis || '';
  const prevShown = prevC.counted == null ? '' : n(prevBasis === 'left' && prevC.counted_left != null ? prevC.counted_left : prevC.counted);
  const basisOf = () => { const r_ = document.querySelector && document.querySelector('input[name="cbasis"]:checked');
                          return r_ ? r_.value : ''; };
  const totalOf = v => (v == null) ? null : (basisOf() === 'left' ? Math.round((v + carried.units) * 1000) / 1000 : v);
  dlg('Count ' + l.sku + (l.lot ? ' · lot ' + l.lot : ''),
    '<p class="sm dim">'+esc(l.desc||'')+'<br>Serial <b>'+esc(l.serial)+'</b> · on '+esc(f.p.loc)+
    '<br>Finale says <b>'+n(l.system_qty)+'</b>.</p>'+
    (hasCarry
      ? '<div class="warnbox sm"><b>You took '+n(carried.units)+' off this pile</b> ('+esc(carried.what.join(', '))+
        '). Which did you count?'+
        '<label style="display:block;min-height:44px;padding:8px 0"><input type="radio" name="cbasis" value="total"'+
        (prevBasis === 'total' ? ' checked' : '')+'> I counted <b>everything that was on it</b> (before that)</label>'+
        '<label style="display:block;min-height:44px;padding:8px 0"><input type="radio" name="cbasis" value="left"'+
        (prevBasis === 'left' ? ' checked' : '')+'> I counted what was <b>LEFT</b> after that</label></div>'+
        '<label class="sm">How many did you count</label>'

      : '<label class="sm">How many were on this pallet <b>altogether</b> — before anything was '+
        'taken off</label>')+
    qtyField('cq', prevShown)+
    '<div id="ctot" class="sm dim"></div>'+

    '<div id="cvar"></div>'+
    (rest && rest.length ? '<p class="sm dim" style="margin-top:8px">'+rest.length+' more on this pallet after this one.</p>' : ''),
    [{t:'Cancel',c:'ghost'},

     {t:'Matches',c:'ok',f:()=>{ setLine(id,{state:'done', counted:l.system_qty, variance:0,
                                             count_reason:undefined, answer:'matched',
                                             counted_basis:(hasCarry ? 'total' : undefined), counted_left:undefined,
                                             counted_ts:new Date().toISOString()});
        ev('count_recorded',{line:id, counted:l.system_qty, variance:0, answer:'matched'});
        maybeDone(f.p.loc); render(); if(rest&&rest.length) setTimeout(()=>doCount(rest[0],rest.slice(1)),260); }},
     {t:'Save count',c:'pri',f:()=>{ const typed=readQty('cq');
        if(typed===null) return toast('⛔ enter the counted quantity');
        if(hasCarry && !basisOf()) return toast('⛔ say whether you counted everything, or what was LEFT after the '+n(carried.units)+' taken off');
        const v = totalOf(typed);
        const vr = Math.round((v - Number(l.system_qty)) * 1000) / 1000;
        let rsn;
        if(Math.abs(vr) > 0.001){
          const sel = $('#crsn');
          if(!sel || sel.value === '__none__')
            return toast('⛔ pick a reason — a count variance is a real Finale stock change');
          rsn = sel.value;
        }
        const basis = hasCarry ? basisOf() : undefined;

        setLine(id,{state:'done', counted:v, variance:vr, count_reason:rsn, answer:'typed',
                    counted_basis:basis, counted_left:(basis === 'left' ? typed : undefined),
                    counted_carried:undefined, counted_ts:new Date().toISOString()});
        ev('count_recorded',{line:id, counted:v, variance:vr, reason:rsn||'', answer:'typed',
                             basis:basis || '', counted_left:(basis === 'left' ? typed : undefined)});
        maybeDone(f.p.loc); render(); if(rest&&rest.length) setTimeout(()=>doCount(rest[0],rest.slice(1)),260); }}],
    ()=>{
      const upd = () => {
        const c = $('#cvar'); if(!c) return;
        const typed = readQty('cq');
        const v = totalOf(typed);
        const tot = $('#ctot');
        if(tot) tot.innerHTML = (hasCarry && basisOf() === 'left' && typed != null)
          ? 'So <b>'+n(v)+'</b> were on it altogether ('+n(typed)+' left + '+n(carried.units)+' taken off).' : '';
        const vr = (v == null) ? 0 : Math.round((v - Number(l.system_qty)) * 1000) / 1000;
        if(Math.abs(vr) <= 0.001 || (hasCarry && !basisOf())){ c.innerHTML = ''; return; }
        const list = vr < 0 ? (PAYLOAD.shrink_reasons || []) : (PAYLOAD.found_reasons || []);
        const cur = $('#crsn') ? $('#crsn').value : '';

        const ph = list.length > 1
          ? '<option value="__none__"'+(cur&&cur!=='__none__'?'':' selected')+'>— choose a reason —</option>' : '';
        c.innerHTML = '<div class="warnbox" style="margin-top:10px"><b>'+
          (vr < 0 ? 'Short by ' + n(-vr) : 'Found ' + n(vr) + ' extra')+'</b>'+
          '<div class="sm dim" style="margin:6px 0">Finale says '+n(l.system_qty)+'. This is a '+
          'real stock change, so it needs a reason code — the count is what corrects the books.</div>'+
          '<select id="crsn">'+ph+list.map(r=>'<option value="'+esc(r)+'"'+
            (r===cur?' selected':'')+'>'+esc(r)+'</option>').join('')+'</select></div>';
      };
      setTimeout(()=>{ const e=$('#cq'); if(e){ e.focus(); e.addEventListener('input', upd); }
        [].slice.call(document.querySelectorAll('input[name="cbasis"]')).forEach(r_ => r_.addEventListener('change', upd));
        upd(); }, 80);
    });
}

function bayHasWork(nn){
  const b = PAYLOAD.bays.find(x => x.n === nn);
  if(!b) return false;
   
  if((b.pallets||[]).some(p => p.off_plan)) return true;
  return (b.pallets||[]).some(p => (p.lines||[]).some((l,i) =>
    (st(lid(nn, p.loc, l, i)) || {}).state));
}
function putbackDone(nn){

  if(!bayHasWork(nn) && !(S.bays[nn]||{}).putback_done){
    if(!confirm('Nothing has been recorded in this bay.\n\nConfirming the putback tells '+
                'Finale every pallet here came down and went back — which changes their '+
                'locations. If you did not work this bay, tap Cancel.\n\nConfirm anyway?'))
      return;
  }

  if(staleLoadOrder(nn)){
    const bb_ = PAYLOAD.bays.find(x => x.n === nn) || {};
    const shown = goingBackInto(bb_);       
    const r_ = recordLoadOrder(nn, shown);
    if(!r_.ok) toast(r_.why);
  }
  const was = (S.bays[nn]||{}).putback_ts;
  S.bays[nn] = Object.assign(S.bays[nn]||{},
                             {putback_done:true, putback_ts: was || new Date().toISOString()});
  ev('putback_done', {bay: PAYLOAD.bays.find(b=>b.n===nn).bay}); save();
  askLaneRoom(nn);          
  render();
}

function askLaneRoom(nn){
  const b = PAYLOAD.bays.find(x => x.n === nn);
  if(!b) return;
  const st_ = S.bays[nn] || {};
  if(st_.lane_room) return;                 

  const backN = (b.putback || []).filter(pb => {
    if(palletFreed(pb.pallet_id)) return false;      
    const a_ = actualFor(pb.pallet_id);
    if(!a_ || !a_.loc) return true;                  
    return a_.loc.indexOf(b.bay + '-') === 0;        
  }).length + Object.keys(S.new_pallets || {}).filter(q => {
    const a_ = actualFor(q);
    return a_ && a_.loc && a_.loc.indexOf(b.bay + '-') === 0;
  }).length;
  setTimeout(() => dlg('One question about ' + b.bay,
    '<p>You have just put <b>'+backN+'</b> pallet'+(backN===1?'':'s')+' back into '+
    esc(b.bay)+'.</p>'+
    '<p class="sm dim">Finale can only ever see positions that hold stock, so it cannot '+
    'tell us whether a lane is genuinely full. You can.</p>'+
    '<p><b>Could another pallet fit in this lane right now?</b></p>',
    [{t:'No — it is full', c:'', f:()=>laneRoom(nn,'full',backN)},
     {t:'Yes — room for 1', c:'', f:()=>laneRoom(nn,'one',backN)},
     {t:'Yes — room for 2+', c:'', f:()=>laneRoom(nn,'two_plus',backN)},
     {t:'Not sure', c:'ghost', f:()=>laneRoom(nn,'unsure',backN)}]), 0);
}
function laneRoom(nn, ans, backN){
  const b = PAYLOAD.bays.find(x => x.n === nn);
  S.bays[nn] = Object.assign(S.bays[nn]||{}, {lane_room: ans, lane_back: backN,
                                              lane_room_ts: new Date().toISOString()});

function floorDown(p){
  if(!p || !floorLoc()) return false;
  if(p.off_plan) return true;
  const bs = PAYLOAD.bays.find(b => (b.pallets||[]).some(x => x.loc === p.loc));
  if(!bs) return false;
  const st_ = S.bays[bs.n] || {};
  return !!(st_.putback_done || st_.closed) ||
    (bs.pallets||[]).some(p2 => (p2.lines||[]).some((l2,i2) =>
      (st(lid(bs.n, p2.loc, l2, i2)) || {}).state));
}
function adjLoc(p, line, onFloor, cameDown){
  if(!p) return '';

  if(onFloor && floorLoc()) return floorLoc();
  if(cameDown && floorLoc() && line &&
     (line.kind === 'take' || line.kind === 'aside')) return floorLoc();
  return palletFinalLoc(p.pallet_id) || p.goes_back_to || p.loc || '';
}

function cardInUse(pid){
  if(!pid) return '';
  let hit = '';
  PAYLOAD.bays.forEach(b => (b.pallets || []).forEach(p => {
    if(p.pallet_id !== pid) return;
     
    hit = p.off_plan ? pid + ' was already given to the pallet you brought down from ' + p.loc
                     : 'the plan already uses ' + pid + ' for the pallet at ' + p.loc + ' in bay ' + b.bay;
  }));
  if(!hit && (S.new_pallets || {})[pid])
    hit = pid + ' was already given to a pallet built earlier in this job';

  if(!hit) Object.keys(S.unplanned || {}).forEach(k => {
    if(((S.unplanned[k] || {}).pallet_id) === pid)
      hit = pid + ' was already given to the pallet you brought down from ' + k; });
  return hit;
}
function nextFreeCard(extra){
  const used = new Set();
   
  (extra ? [...extra] : []).forEach(c => { const m = /^P-(\d+)$/.exec(c); if(m) used.add(Number(m[1])); });
  PAYLOAD.bays.forEach(b => (b.pallets || []).forEach(p => {
    const m = /^P-(\d+)$/.exec(p.pallet_id || ''); if(m) used.add(Number(m[1]));
  }));
  Object.keys(S.new_pallets || {}).forEach(k => {
    const m = /^P-(\d+)$/.exec(k); if(m) used.add(Number(m[1]));
  });
  Object.keys(S.unplanned || {}).forEach(k => {
    const m = /^P-(\d+)$/.exec(((S.unplanned[k] || {}).pallet_id) || ''); if(m) used.add(Number(m[1]));
  });

  let n = Math.max(1, Number(S.card_high || 0) + 1);
  while(used.has(n)) n++;
  return n;
}
 
function noteCard(pid){
  const m = /^P-(\d+)$/.exec(String(pid || ''));
  if(m && Number(m[1]) > Number(S.card_high || 0)) S.card_high = Number(m[1]);
}
function cardOf(x){
  if(!x) return '';
  if(typeof x === 'object') return x.card || x.pallet_id || '';
  for(const b of PAYLOAD.bays){
    for(const p of (b.pallets||[])) if(p.pallet_id === x) return p.card || x;
    for(const pb of (b.putback||[])) if(pb.pallet_id === x) return pb.card || x;
  }
  return x;                       
}

function palletLabel(p){
  if(!p) return 'the pallet';
  return p.pallet_id ? ('pallet ' + cardOf(p)) : (p.loc || 'the pallet');
}

function bucketOf(k){ return FULL_BUCKETS.find(x => x.k === k) || null; }

function nearestBucket(pct){
  if(pct == null) return null;
  let best = FULL_BUCKETS[0];
  FULL_BUCKETS.forEach(x => { if(Math.abs(x.pct - pct) < Math.abs(best.pct - pct)) best = x; });
  return best;
}

function askFullness(bayN, loc){
  const b = PAYLOAD.bays.find(x => x.n === bayN);
  const p = b && b.pallets.find(x => x.loc === loc);
  if(!p) return;
  const deck = Number(p.deck_m3 || 0);

  let ours = Number(p.est_m3 || 0);
  if(p.pallet_id && arrivalsFor(p.pallet_id).some(x => !x.gone && x.state)){
    PAYLOAD.bays.forEach(bb => (bb.cross_in || []).forEach(m => {
      if(m.onto_pallet === p.pallet_id && Number(m.dest_total_m3) > ours)
        ours = Number(m.dest_total_m3); }));
  }
  const ourPct = deck > 0 ? Math.round(100 * ours / deck) : null;
  const nov = (p.no_volume || []);
  const title = (cardOf(p) || loc);

  if(ourPct == null || nov.length){
    return askFullnessBlind(bayN, loc, title, nov, ourPct);
  }
  const guess = nearestBucket(ourPct);
  dlg('Does this look about right?',

      '<div class="sm dim">We think '+esc(title)+' is about</div>'+
      '<div style="font-size:34px;font-weight:700;line-height:1.1;margin:4px 0">'+ourPct+'%</div>'+
      '<div class="sm dim">full — '+esc(guess.t)+', '+esc(guess.d)+'</div>'+
    '</div>'+
    '<p class="sm dim" style="margin-top:10px">If it looks about right, that is all we need.</p>',
    [{t:'✓ Yep, about right', c:'pri', f:()=>setFullness(bayN, loc, guess.k, 'confirmed', ourPct)},
     {t:'No — it is not', c:'warn', f:()=>{
        setTimeout(()=>askFullnessBlind(bayN, loc, title, nov, ourPct, true), 0); }},
     {t:'Skip', c:'ghost'}]);

function tempPulled(sku, lot){
  let q = 0;

  (S.temp_out || []).forEach(r => {
    if(r.sku === sku && (r.lot || '') === (lot || '')) q += Number(r.qty || 0); });
  Object.keys(S.lines || {}).forEach(k => {
    const st_ = S.lines[k] || {};
    if(st_.temp_sku !== sku) return;
    if((st_.from_temp_lot != null ? st_.from_temp_lot : st_.temp_lot || '') !== (lot || '')) return;
    q += Number(st_.from_temp || 0);
  });
  return q;
}
function tempParkedHere(sku, lot){
  let q = 0;
  Object.keys(S.lines || {}).forEach(k => {
    const st_ = S.lines[k] || {};
    if(st_.temp_sku !== sku || (st_.temp_lot || '') !== (lot || '')) return;
    q += Number(st_.to_temp || 0);
  });
  return q;
}
function tempAvailable(sku, lot){
  let base = 0;
  (PAYLOAD.temp_stock || []).forEach(r => {
    if(r.sku === sku && (r.lot || '') === (lot || '')) base += Number(r.qty || 0); });
  return Math.round((base + tempParkedHere(sku, lot) - tempPulled(sku, lot)) * 1000) / 1000;
}

function tempLots(sku){
  const seen = {}, out = [];
  (PAYLOAD.temp_stock || []).forEach(r => { if(r.sku === sku) seen[r.lot || ''] = 1; });
  Object.keys(S.lines || {}).forEach(k => {
    const st_ = S.lines[k] || {};
    if(st_.temp_sku === sku && Number(st_.to_temp || 0) > 0) seen[st_.temp_lot || ''] = 1; });
  Object.keys(seen).forEach(lot => {
    const q = tempAvailable(sku, lot);
    if(q > 0.001) out.push({lot: lot, qty: q});
  });
  return out.sort((a, b) => b.qty - a.qty);
}
 
function tempAll(){
  const seen = {}, out = [];
  (PAYLOAD.temp_stock || []).forEach(r => { seen[r.sku + '␟' + (r.lot || '')] = r.desc || ''; });
  Object.keys(S.lines || {}).forEach(k => {
    const st_ = S.lines[k] || {};
    if(st_.temp_sku && Number(st_.to_temp || 0) > 0)
      seen[st_.temp_sku + '␟' + (st_.temp_lot || '')] = seen[st_.temp_sku + '␟' + (st_.temp_lot || '')] || ''; });
  Object.keys(seen).forEach(k => {
    const i = k.indexOf('␟'), sku = k.slice(0, i), lot = k.slice(i + 1);
    const q = tempAvailable(sku, lot);
    if(q > 0.001) out.push({sku: sku, lot: lot, qty: q, desc: seen[k]});
  });
  return out.sort((a, b) => b.qty - a.qty);
}

let ZXING_LOADING = null;
function loadZXing(){
  if(window.ZXing) return Promise.resolve(window.ZXing);
  if(ZXING_LOADING) return ZXING_LOADING;
  ZXING_LOADING = new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = './zxing.js';
    el.onload  = () => window.ZXing ? resolve(window.ZXing)
                                    : reject(new Error('zxing.js loaded but defined nothing'));
    el.onerror = () => { ZXING_LOADING = null;       
                         reject(new Error('could not load the barcode decoder')); };
    document.head.appendChild(el);
  });
  return ZXING_LOADING;
}

async function makeDetector(){
  if(nativeDetector()) return new BarcodeDetector();
  const Z = await loadZXing();
  const reader = new Z.MultiFormatReader();

  reader.setHints(new Map());
  const cv = document.createElement('canvas');
  return {
    detect: (video) => {
      const w = video.videoWidth, h = video.videoHeight;
      if(!w || !h) return [];                      

      const scale = Math.min(1, 640 / w);
      cv.width = Math.round(w * scale); cv.height = Math.round(h * scale);
      cv.getContext('2d').drawImage(video, 0, 0, cv.width, cv.height);
      const src = new Z.HTMLCanvasElementLuminanceSource(cv);
      const bmp = new Z.BinaryBitmap(new Z.HybridBinarizer(src));
      try{
        const r = reader.decode(bmp);
        return r ? [{rawValue: r.getText()}] : [];
      }catch(e){
        return [];                  
      }finally{
        reader.reset();             
      }
    }
  };
}

let CAM = null;                        

function stopCam(){
  const c = CAM; CAM = null;           
  if(!c) return;
  try{ if(c.box) c.box.hidden = true; }catch(e){}
  try{ if(c.stream) c.stream.getTracks().forEach(t => t.stop()); }catch(e){}
  try{ if(c.vid) c.vid.srcObject = null; }catch(e){}
}

(function(){ const d = document.getElementById('dlg');
             if(d){ d.addEventListener('close', stopCam);
                    d.addEventListener('cancel', stopCam); } })();

function startCam(id, onCode){
  const box = $('#'+id+'cambox'), vid = $('#'+id+'vid'), msg = $('#'+id+'msg');
  if(!box || !vid) return;
  stopCam();                           
  const token = {};                    
  const stopBtn = $('#'+id+'stop'); if(stopBtn) stopBtn.onclick = stopCam;

  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})
    .then(async st => {
       
      if(!document.body.contains(box)){ st.getTracks().forEach(t => t.stop()); return; }
      CAM = {stream: st, box: box, vid: vid, token: token};
      box.hidden = false; vid.srcObject = st;

      vid.play().catch(()=>{});

      setTimeout(() => {
        if(CAM && CAM.token === token && vid.readyState === 0 && msg)
          msg.innerHTML = '⚠️ The camera opened but is not sending a picture. '+
            'Scan with the handheld or pick the spot below.';
      }, 6000);

      if(!nativeDetector() && !window.ZXing && msg)
        msg.textContent = 'Getting the barcode reader ready…';
      let det;
      try{ det = await makeDetector(); }
      catch(e){

        stopCam();
        if(msg) msg.innerHTML = '⚠️ Could not load the barcode reader. '+
          'Scan with the handheld or pick the spot below.';
        return;
      }
      if(!CAM || CAM.token !== token) return;       
      if(msg && msg.textContent === 'Getting the barcode reader ready…') msg.textContent = '';
      const tick = async () => {
        if(!CAM || CAM.token !== token) return;       

        const dl = document.getElementById('dlg');
        if(!dl || !dl.open || !document.body.contains(vid)){ stopCam(); return; }
        let raw = null;
        try{
          const found = await det.detect(vid);
          if(found && found.length) raw = found[0].rawValue || '';
        }catch(e){   }

        if(raw){
          stopCam();
          const inp = $('#'+id); if(inp){ inp.value = raw;
            inp.dispatchEvent(new Event('change')); }
          if(onCode) onCode(raw);
          return;
        }
        setTimeout(tick, 220);
      };
      tick();
    })
    .catch(e => {

      if(msg) msg.innerHTML = '⚠️ Could not open the camera ('+esc(e.name||'blocked')+
        '). Scan with the handheld or pick the spot below.';
      try{ box.hidden = true; }catch(err){}
    });
}

function wireScan(id, selId){
  const inp = $('#'+id), sel = $('#'+selId), msg = $('#'+id+'msg');
  if(!inp || !sel) return;
  const apply = () => {
    const v = normLoc(inp.value);
    if(!v){ msg.textContent = ''; return; }
    const opt = [...sel.options].find(o => normLoc(o.value) === v);
    if(opt){ sel.value = opt.value;
      msg.innerHTML = '✓ <b>'+esc(opt.value)+'</b>'; return; }
    if(knownLocations().has(v)){

      const o = document.createElement('option');
      o.value = v; o.textContent = v + ' — scanned, outside this lane';
      sel.appendChild(o); sel.value = v;
      msg.innerHTML = '✓ <b>'+esc(v)+'</b> — that is not in this lane, which is fine if it '+
        'is where you put it.';
      return;
    }

    if(/^P-?\d+$/.test(v)){
      sel.value = '';
      msg.innerHTML = '⛔ <b>'+esc(v)+'</b> is the pallet\'s <b>temporary card</b>, not a '+
        'place. Scan the <b>Finale placard</b> instead — the laminated card with the rack '+
        'position on it, like <b>F2-A-03-2</b> — or pick the spot from the list below.';

      return;
    }
    const o = document.createElement('option');
    o.value = v; o.textContent = v + ' — scanned (not in this plan)';
    sel.appendChild(o); sel.value = v;
    msg.innerHTML = '⚠️ <b>'+esc(v)+'</b> is not a location we have seen in this plan. '+
      'We will record it exactly as scanned — check it is right.';
  };

  inp.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); e.stopPropagation(); apply(); }
  });
  inp.addEventListener('change', apply);
  inp.addEventListener('blur', apply);
  const cam = $('#'+id+'cam');
  if(cam) cam.onclick = () => startCam(id, apply);
  setTimeout(() => { try{ inp.focus(); }catch(e){} }, 30);
}

function palletChoices(bayN, exclude){

  const b = PAYLOAD.bays.find(x => x.n === bayN) || {};
  const seen = {}, out = [];
   
  (b.pallets || []).forEach(p => { if(p.pallet_id && p.pallet_id !== exclude && !seen[p.pallet_id]
                                      && palletOnFloor(b, p, true)){
    seen[p.pallet_id] = 1; out.push({id:p.pallet_id, why:'came down from '+p.loc, spoil:!!p.spoil}); } });

  (b.putback || []).forEach(pb => { if(pb.pallet_id && pb.pallet_id !== exclude && !seen[pb.pallet_id]
                                       && !palletFreed(pb.pallet_id) &&
                                       !(b.pallets || []).some(q => q.pallet_id === pb.pallet_id) &&
                                       (function(){ const h_ = palletById(pb.pallet_id);
                                         return h_ ? palletOnFloor(h_.b, h_.p, true)
                                                   : (!(S.bays[b.n] || {}).putback_done && builtOnFloor(pb.pallet_id)); })()){
    seen[pb.pallet_id] = 1; out.push({id:pb.pallet_id, why:'goes to '+pb.loc}); } });

  Object.keys(S.new_pallets || {}).forEach(k => {
    const np = S.new_pallets[k] || {};
    if(np.bay_n != null && np.bay_n !== bayN) return;
    if(!builtOnFloor(k)) return;           
    if(k !== exclude && !seen[k]){
      seen[k] = 1; out.push({id:k, why:'you built this one', built:true}); } });
  PAYLOAD.bays.forEach(ob => {
    if(ob.n === bayN) return;
    (ob.pallets || []).forEach(p => {
      if(!p.pallet_id || p.pallet_id === exclude || seen[p.pallet_id]) return;
      if(!palletOnFloor(ob, p)) return;
      seen[p.pallet_id] = 1;
      out.push({id:p.pallet_id, other:true, bay:ob.bay,
                why:'in ' + ob.bay + ' · came down from ' + p.loc + (p.off_plan ? ' (not in the plan)' : ''),
                spoil:!!p.spoil});
    });
  });
  Object.keys(S.new_pallets || {}).forEach(k => {
    const np = S.new_pallets[k] || {};
    if(np.bay_n != null && np.bay_n !== bayN && k !== exclude && !seen[k] && builtOnFloor(k)){
      seen[k] = 1; out.push({id:k, other:true, why:'built in ' + (np.bay || 'another bay'), built:true}); } });
  return out;
}

function laneOf(pid, bayN){
  const planned = plannedLocFor(pid);
  if(planned){ const m = String(planned).match(/^(.*)-\d+$/); if(m) return m[1]; }
  const b = PAYLOAD.bays.find(x => x.n === bayN);
  return b ? b.bay : '';
}
function lanePositions(pid, bayN){
  const lane = laneOf(pid, bayN);
  if(!lane) return [];
  const b = PAYLOAD.bays.find(x => x.bay === lane);
   
  const depth = b ? Math.max(Number(b.depth || 0), (b.putback || []).length,
                             Number(b.deepest || 0), Number((b.lane || {}).depth || 0)) : 0;
  const out = [];
  for(let i = 1; i <= Math.max(depth, 1); i++) out.push(lane + '-' + i);
  return out;
}

function pileMissingDecrease(b, p, l, i, key){
  if(!p || !p.lines) return Number(l.system_qty || 0);
  let earlier = false, movedOut = 0;
  p.lines.forEach((l2, i2) => {
    if(i2 === i) return;
    if(l2.sku !== l.sku || (l2.lot||'') !== (l.lot||'')) return;
    if(l2.kind !== 'take' && l2.kind !== 'aside') return;
    const s2 = S.lines[lid(b.n, key, l2, i2)] || {};
    if(s2.state === 'missing' && i2 < i) earlier = true;
    if(s2.state === 'done')  movedOut += Number(s2.actual || 0);

    if(s2.state === 'done') movedOut += Number(s2.to_temp || 0);
  });
  if(earlier) return 0;
  return Math.max(0, Math.round((onPallet(b, p, l.sku, l.lot) - movedOut) * 1000) / 1000);
}

function pileAdjFields(adj, tal, p, picked){
  const where = (p && (p.pallet_id || p.loc)) || 'this pallet';
  const sum = n(tal.movedOut) + ' recorded carried off ' + where + ' against ' +
              n(tal.system) + ' Finale believed was there' +
              (tal.lines.length > 1 ? ' across ' + tal.lines.length + ' lines on this pile' : '');
  if(adj > 0.001)
    return {reason:((PAYLOAD.found_reasons||['Found'])[0] || 'Found'), direction:'found',
            adj_why:'found during restock, auto-added from the moves: ' + sum +
                    ' — nobody counted the pallet, so the difference IS what was carried'};
  if(!picked || picked === '__none__') return null;
  return {reason:picked, direction:'shrink',
          adj_why:'short during restock: ' + sum + ', and the plan clears this pile, so there '+
                  'is no stay left for the shortfall to hide in'};
}

function pileTally(b, p, sku, lot, overrideId, overrideActual){
  const out = {system:0, plannedOut:0, plannedStay:0, movedOut:0, cleared:false,
               lines:[], pending:0, short:0, over:0};
  if(!b || !p) return out;
  out.system = onPallet(b, p, sku, lot);
  (p.lines || []).forEach((l, i) => {
    if(l.sku !== sku || (l.lot || '') !== (lot || '')) return;
    if(l.kind !== 'take' && l.kind !== 'aside') return;
    const id = lid(b.n, p.loc, l, i);
    const sRaw = st(id) || {};
    const planned = Number(l.planned_qty || 0);
    out.plannedOut += planned;
    out.lines.push(id);
     
    const isOverride = (overrideId && id === overrideId);
    const state = isOverride ? 'done' : sRaw.state;
    const act   = isOverride ? Number(overrideActual || 0)
                             : Number(sRaw.actual != null ? sRaw.actual : 0);

    if(state === 'done' && !isOverride && sRaw.rest_stays) out.restStays = true;
    if(state === 'done')          out.movedOut += act;
    else if(state === 'skipped')  {   }
    else if(state === 'missing')  {   }
    else                          out.pending++;
  });
  out.plannedStay = Math.max(0, out.system - out.plannedOut);

  out.cleared = out.plannedStay < 0.001 && !out.restStays;
  const r = x => Math.round(x * 1000) / 1000;
  if(!out.pending){
    if(out.cleared && out.movedOut < out.system - 0.001) out.short = r(out.system - out.movedOut);
    if(out.movedOut > out.system + 0.001)                out.over  = r(out.movedOut - out.system);
  }
  return out;
}

function pileBasis(b, p, l){
  const ah = (S.adhoc_counts || {})[p.loc + '|' + l.sku + '|' + (l.lot || '')];
  const planned = (p.lines || []).some((x, i) => x.kind === 'count' && x.sku === l.sku &&
    (x.lot || '') === (l.lot || '') && (st(lid(b.n, p.loc, x, i)) || {}).counted != null);
  return (planned || (ah && ah.counted != null)) ? 'You counted' : 'Finale says';
}
function onPallet(b, p, sku, lot){
  const base = (() => {
    for(const l of (p.lines || []))
      if(l.kind !== 'count' && l.sku === sku && (l.lot||'') === (lot||''))
        return Number(l.system_qty || 0);
    return 0;
  })();
  for(let i = 0; i < (p.lines||[]).length; i++){
    const l = p.lines[i];
    if(l.kind !== 'count' || l.sku !== sku || (l.lot||'') !== (lot||'')) continue;
    const cf = countFigures(b, p, l, st(lid(b.n, p.loc, l, i)));    
    if(cf) return cf.counted;
  }

  const ah = (S.adhoc_counts || {})[p.loc + '|' + sku + '|' + (lot || '')];
  if(ah && ah.counted != null) return Number(ah.counted);
  return base;
}
function splitPicker(pid){
  let pal = null, bay = null;
  PAYLOAD.bays.forEach(b => (b.pallets||[]).forEach(p => {
    if(p.pallet_id === pid){ pal = p; bay = b; } }));
  if(!pal) return '<div class="sm dim">nothing recorded on that pallet</div>';

  const seen = {}, items = [];
  (pal.lines || []).forEach(l => {
    if(l.kind === 'count') return;
    const k = l.sku + '␟' + (l.lot || '');
    if(seen[k]) return; seen[k] = 1;
    items.push({sku:l.sku, lot:l.lot || '', max: onPallet(bay, pal, l.sku, l.lot),
                note: n(l.system_qty) + ' on it'});
  });
  arrivalsFor(pid).forEach(x => {
    if(!x.state || x.gone || x.tooLate) return;
    const q = Number(x.qty || 0);
    if(!(q > 0)) return;
    const k = x.sku + '␟' + (x.lot || '');
    if(seen[k]){
      const it = items.find(i => i.sku === x.sku && (i.lot || '') === (x.lot || ''));
      it.max += q; it.note += ' + ' + n(q) + ' arrived';
    } else {
      seen[k] = 1;
      items.push({sku:x.sku, lot:x.lot || '', max:q,
                  note: n(q) + ' arrived from ' + x.from});
    }
  });
  const rows = items.map((it, ix) => {

    const rid = 'sp' + ix;
    return '<div style="display:flex;gap:10px;align-items:center;padding:9px 2px;'+
      'border-bottom:1px solid var(--line);min-height:48px">'+
      '<input type="checkbox" class="splititem" id="'+rid+'" '+
        'style="width:24px;height:24px;flex:0 0 auto" '+
        'data-sku="'+esc(it.sku)+'" data-lot="'+esc(it.lot)+
        '" data-max="'+n(it.max)+'">'+

      '<label for="'+rid+'" class="grow" style="cursor:pointer;min-height:44px;display:flex;'+
        'flex-direction:column;justify-content:center"><b>'+esc(it.sku)+'</b>'+
        (it.lot ? ' <span class="dim sm">lot '+esc(it.lot)+'</span>'
                : ' <span class="dim sm">no lot</span>')+
        '<div class="sm dim">'+esc(it.note)+'</div></label>'+
      '<input class="splitqty" data-for="'+rid+'" inputmode="numeric" disabled '+
        'value="'+n(it.max)+'" style="width:78px;text-align:center;font-size:16px">'+
      '</div>';
  });
  return rows.length
    ? '<div style="max-height:250px;overflow-y:auto">'+rows.join('')+'</div>'+
      '<div class="sm dim" style="margin-top:6px">Tick what moved. If only part of it went, '+
      'change the number.</div>'
    : '<div class="sm dim">nothing left on it to move</div>';
}

function undoSplit(fromPid, newPid){
  if(!confirm('Undo the split onto ' + newPid + '?\n\nEverything goes back onto ' + fromPid +
              ' and ' + newPid + ' stops existing.')) return;
  delete (S.split_contents || {})[newPid];
  delete (S.new_pallets || {})[newPid];
  delete (S.putback_actual || {})[newPid];
  delete (S.lane_push || {})[newPid];       

  let folded = 0;
  Object.keys(S.lines || {}).forEach(id => {
    const ln = S.lines[id];
    if(!ln || !ln.placements || !ln.placements.length) return;
    if(!ln.placements.some(x => x.pallet === newPid)) return;
    const back = ln.placements.filter(x => x.pallet === newPid)
                              .reduce((a,x) => a + Number(x.qty||0), 0);
    const rest = ln.placements.filter(x => x.pallet !== newPid);
    if(rest.length) rest[0].qty = Number(rest[0].qty||0) + back;
    ln.placements = rest.length ? rest : undefined;
    folded += back;
  });

  const src = (S.putback_actual || {})[fromPid];
  if(src && src.note === 'split'){ src.note = ''; src.deviated = (src.loc !== src.planned); }
  ev('split_undone', {from:fromPid, to:newPid});
  save();
  const d = document.querySelector('dialog[open]'); if(d) d.close();
  render();
  toast('✓ split undone — everything is back on ' + fromPid +
        (folded ? ' (' + n(folded) + ' units folded back)' : ''));
}

      '<div id="s2pushq"></div>'+

    '<div style="margin-top:14px"><label class="sm"><b>Which items went on this one?</b> '+
      '<span class="dim">Tick everything you carried across.</span></label>'+
      splitPicker(fromPid)+'</div>'+
    '<div class="sm dim" style="margin-top:8px">Only part of one item moved? Leave it '+
      'unticked here and use <b>“it did not all fit”</b> on that line instead.</div>',
    [{t:'Skip', c:'ghost'},
     {t:'Record it', c:'pri', f:()=>{
        const cn = ($('#s2card').value || '').trim().replace(/^P-?/i,'');
        if(!/^\d{1,3}$/.test(cn)) return toast('⛔ the card number off the laminated card');
        const pid = 'P-' + cn;
        const clash = cardInUse(pid);
        if(clash) return toast('⛔ ' + clash + ' — the next free card is P-' + nextFreeCard());
        const v = $('#s2pos').value;

        const clash2 = Object.keys(S.putback_actual || {}).find(q => q !== pid &&
                         ((S.putback_actual[q]||{}).loc === v)) ||
                       PAYLOAD.bays.reduce((acc, bb) => acc || (bb.putback||[]).find(pb =>
                         pb.pallet_id !== pid && pb.loc === v &&
                         !((S.putback_actual||{})[pb.pallet_id]||{}).loc), null);
        if(v && v !== floorLoc() && clash2){
          const other2 = typeof clash2 === 'string' ? clash2 : clash2.pallet_id;
          if(!confirm(v + ' is already ' + other2 + '\'s spot.\n\nTwo pallets cannot be in '+
                      'one position. Record it anyway?')) return false;
        }
        const took = [];
        let badq = null;
        [...document.querySelectorAll('.splititem:checked')].forEach(c => {
          const box = document.querySelector('.splitqty[data-for="'+c.id+'"]');
          const raw = box ? String(box.value).trim() : '';
          const max = Number(c.dataset.max || 0);
          const q = raw === '' ? max : Number(raw);
          if(!isFinite(q) || q <= 0 || q > max + 0.001){ badq = c.dataset.sku; return; }
          took.push({sku: c.dataset.sku, lot: c.dataset.lot || '', qty: q});
        });
        if(badq) return toast('⛔ check the quantity on ' + badq) && false;
        S.new_pallets[pid] = {bay:b.bay, bay_n:bayN, split_from:fromPid,
                              built_ts:new Date().toISOString()};
        noteCard(pid);
        if(!v) return toast('⛔ where did this one go?') && false;
        const pq2 = readPushQ('s2pushq', v, pid);
        if(!pq2.ok) return toast(pq2.why) && false;
        S.putback_actual[pid] = {state:'placed', loc:v, note:'split_from_'+fromPid,
                                 planned:'', deviated:true, ts:new Date().toISOString()};

        S.split_contents = S.split_contents || {};
        S.split_contents[pid] = {from: fromPid, items: took};
        ev('pallet_split', {from:fromPid, to:pid, loc:v, items:took.length});
        applyPushQ(pid, v, pq2.ans);     
        save(); render();
        if(!took.length) toast('Recorded — but nothing was ticked, so all the stock still '+
                               'counts as being on ' + fromPid);
     }}], ()=>{ wireScan('s2scan','s2pos'); wireSplitQty(); wirePushQ('s2pos', 's2pushq', null); });
}

function floorProblemRows(bad){
  const conflictKeys = new Set();
  (offPlanConflicts() || []).forEach(c => PAYLOAD.bays.forEach(b => (b.pallets || []).forEach(p => {
    if(p.loc !== c.loc) return;
    (p.lines || []).forEach(l => conflictKeys.add(l.sku + ' ' + (l.lot || ''))); })));
  const by = {};
  (bad || []).forEach(x => {
    if(conflictKeys.has(x.key)) return;
    const r = by[x.key] = by[x.key] || {key:x.key, net:x.net, expected:x.expected, diff:x.diff, negative:false};
    if(x.negative_floor) r.negative = true;
    else { r.net = x.net; r.expected = x.expected; r.diff = x.diff; }
  });
  return Object.keys(by).map(k => {
    const r = by[k], where = [], checks = [];
    PAYLOAD.bays.forEach(b => (b.pallets || []).forEach(p => {
      const ls = (p.lines || []).map((l, i) => ({l:l, i:i})).filter(o => (o.l.sku + ' ' + (o.l.lot || '')) === k);
      if(!ls.length) return;
      const touched = ls.some(o => (st(lid(b.n, p.loc, o.l, o.i)) || {}).state || (st(lid(b.n, p.loc, o.l, o.i)) || {}).from_actual);
      if(!touched && !palletCameDown(b, p)) return;
      where.push({loc:p.loc, card:cardOf(p)});
      const sku = ls[0].l.sku, lot = ls[0].l.lot || '';
      const c = pileClaim(b, p, sku, lot);
      if(c){ const off = pileCarriedBySiblings(b, p, sku, lot, c.id);
        if(off.units > 0.001) checks.push('a line of this pile says it was really on ' + c.pid + ', while ' +
          off.what.join(', ') + ' off ' + (p.pallet_id || p.loc) + ' — both cannot be true. Open ' +
          (p.pallet_id || p.loc) + ' and undo the "different pallet" answer if it was here after all.'); }
      ls.forEach(o => { if(o.l.kind !== 'count') return;
        const s_ = st(lid(b.n, p.loc, o.l, o.i)) || {};
        if(s_.counted == null || s_.counted_basis) return;     
        const car = pileCarriedOff(b, p, sku, lot);
        if(car.units > 0.001 && Number(s_.counted) < Number(o.l.system_qty) - 0.001)
          checks.push('the count of ' + n(s_.counted) + ' on ' + (p.pallet_id || p.loc) + ' may be what was LEFT after ' +
            n(car.units) + ' were taken off — reopen the count and say which you counted.'); });
    }));
    r.where = where; r.check = checks.join(' ');
    return r;
  }).sort((a, b) => (b.negative ? 1 : 0) - (a.negative ? 1 : 0) || Math.abs(b.diff) - Math.abs(a.diff));
}
 
function countRechecks(){
  const out = [];
  PAYLOAD.bays.forEach(b => (b.pallets || []).forEach(p => (p.lines || []).forEach((l, i) => {
    if(l.kind !== 'count') return;
    const cf = countFigures(b, p, l, st(lid(b.n, p.loc, l, i)));
    if(cf && cf.flags && cf.flags.length)
      out.push({sku:l.sku, lot:l.lot || '', loc:p.loc, card:cardOf(p) || p.loc, left:cf.left, flags:cf.flags});
  })));
  return out;
}

function placeHomeless(pid){
  let bn = null;
  PAYLOAD.bays.forEach(b => {
    if((b.pallets||[]).some(p => p.pallet_id === pid) ||
       (b.putback||[]).some(p => p.pallet_id === pid)) bn = b.n;
  });
  if(bn == null) bn = ((S.new_pallets||{})[pid]||{}).bay_n;
  if(bn == null) bn = (PAYLOAD.bays[0]||{}).n;
  askActual(bn, pid);
}
function unplacedPallets(){
  materialiseOffPlan();
  const out = [];

  const inConflict = pid => OFF_CONFLICTS.some(c => c.pallet_id === pid || c.planned_pallet === pid);
  const homeless = pid => { const a = actualFor(pid);
    return !a || !a.loc || a.state === 'floor'; };    
  Object.keys(S.new_pallets || {}).forEach(pid => {
    if(homeless(pid)) out.push({pid, built: true, bay: (S.new_pallets[pid] || {}).bay || '',
                                from: (S.new_pallets[pid] || {}).split_from || ''});
  });

  Object.keys(S.putback_actual || {}).forEach(pid => {
    if(!(S.new_pallets || {})[pid] && homeless(pid) && !inConflict(pid))
      out.push({pid, built: false, bay: bayOfPallet(pid), from: ''});
  });

  PAYLOAD.bays.forEach(b => {
    if(!bayWorked(b)) return;                     
     
    const stale = staleLoadOrder(b.n);
    if((S.bays[b.n] || {}).putback_done && !stale) return;  
    (b.pallets || []).forEach(p => {

      if(!palletCameDown(b, p)) return;
      const pid = p.pallet_id;
      if(!pid || !homeless(pid)) return;
      if(p.conflict || inConflict(pid)) return;
      if(out.some(o => o.pid === pid)) return;

      if(palletFreed(pid) && !(palletRemaining(p.loc).units > 0.001)) return;
      out.push({pid, built: false, bay: b.bay || ('bay ' + b.n), from: '', came_down: true,
                stale_order: stale ? b.n : undefined});
    });
  });

  Object.keys(S.split_contents || {}).forEach(pid => {           
    if(homeless(pid) && !out.some(o => o.pid === pid))
      out.push({pid, built: true, bay: bayOfPallet(pid),
                from: (S.split_contents[pid] || {}).from || ''});
  });
  return out;
}
function bayOfPallet(pid){
  for(const b of PAYLOAD.bays)
    for(const pb of (b.putback || [])) if(pb.pallet_id === pid) return b.bay || ('bay ' + b.n);
  return '';
}

  const homeless = unplacedPallets();
  const openBays = PAYLOAD.bays.filter(b => !(S.bays[b.n]||{}).closed).length;
  const warn = homeless.length
      ? '<div class="badbox"><b>⛔ '+homeless.length+' pallet'+(homeless.length===1?'':'s')+

        'shift ended here, not that everything got done.</div></div>'

  const stopping = !!(openBays || (jp.total - jp.done) || homeless.length);
  dlg(stopping ? 'Stopping for the day?' : 'Finished for the day?',
    warn +
    (stopping
      ? '<p class="sm">If you are done for the day and <b>not coming back to this</b>, say '+

          (openBays ? '<b>'+openBays+'</b> bay(s) not closed' : 'no open bays')+
          ' · <b>'+(jp.total - jp.done)+'</b> line(s) not done'+
          (homeless.length ? ' · <b>'+homeless.length+'</b> pallet(s) down with no '+
                             'recorded spot' : '')+
        '</div>'+
        whyPicker()
      : '<p class="sm">This stamps the time you stopped, so we can tell how long the job '+
        'actually took. It does not send anything on its own — sync after.</p>'),
    [{t:'Not yet'},
     {t: stopping ? '⛔ We are stopping — we did not finish' : '✓ Finished',
      c: stopping ? 'warn' : 'pri', f:()=>{

function laneOfLoc(loc){
  const m = /^(F[23]-[AE]-\d{2})-(\d+)$/.exec(String(loc || ''));
  return m ? {lane:m[1], pos:Number(m[2])} : null;
}
function laneInPlan(lane){ return PAYLOAD.bays.some(b => (b.bay || '') === lane); }

function downMaxPos(b){
  let m = 0;
  (b.pallets || []).forEach(p => { if(palletCameDown(b, p) && !palletSettled(p)) m = Math.max(m, Number(p.pos) || posOf(p.loc)); });
  return m;
}

function crewFreedExtra(b){
  let k = 0;
  (b.pallets || []).forEach(p => {
    if(!palletFreed(p) || !palletCameDown(b, p) || palletSettled(p)) return;
    if(p.off_plan) k++;
    else if((b.putback || []).some(x => !x.off_plan && x.pallet_id === p.pallet_id)) k++;
  });
  return k;
}

function netPileQty(fromLoc, sku, lot, qty){
  let q = Number(qty || 0);
  (S.found_moves || []).forEach(fm => {
    if(fm.sku !== sku || (fm.lot || '') !== (lot || '')) return;
    if(fm.from === fromLoc) q -= Number(fm.qty || 0);

    if(fm.to === fromLoc && !fmDest(fm)) q += Number(fm.qty || 0);
  });
  return Math.round(q * 1000) / 1000;
}

function resolvePlace(loc){
  if(!loc) return null;
  for(const b of PAYLOAD.bays)
    for(const p of (b.pallets || [])){
      if(!p.pallet_id || palletSettled(p) || palletFreed(p) || !palletCameDown(b, p)) continue;
      if(palletFinalLoc(p.pallet_id) === loc) return {b:b, p:p};
    }
  return null;
}
 
function palletById(pid){
  if(!pid) return null;
  for(const b of PAYLOAD.bays)
    for(const p of (b.pallets || [])) if(p.pallet_id === pid) return {b:b, p:p};
  return null;
}

function fmDest(fm){
  if(!fm || !fm.to) return null;
  if(fm.to_kind === 'pallet'){
    const h = palletById(fm.to_pallet);
    if(h && !palletSettled(h.p) && palletCameDown(h.b, h.p)) return h;
    return null;
  }

  if(fm.to_kind === 'place') return fm.to_rack_pallet ? downedPalletAt(fm.to) : resolvePlace(fm.to);
  return downedPalletAt(fm.to);
}
 
function fmOnto(fm, p){ const d = fmDest(fm); return !!(d && p && d.p === p); }

function foundIntoOnly(loc, held){
  const out = [], seen = new Set();
  (S.found_moves || []).forEach(fm => {
    if(fm.to !== loc) return;
    const k = fm.sku + '|' + (fm.lot || '');
    if(held.has(k) || seen.has(k)) return;
    seen.add(k);
    const q = netPileQty(loc, fm.sku, fm.lot || '', 0);
    if(q > 0) out.push({sku:fm.sku, lot:fm.lot || '', qty:q});
  });
  return out;
}

function laneDeviatedWhy(bay, lane){
  const pb = (bay.putback || []).find(pb_ => {
      const a2 = actualFor(pb_.pallet_id);
      return a2 && a2.loc && a2.loc !== pb_.loc;
    });
  if(pb) return (cardOf(pb.pallet_id) || pb.pallet_id) + ' went to ' + actualFor(pb.pallet_id).loc +
                ' instead of ' + pb.loc;
  const np = Object.keys(S.new_pallets || {}).find(q => ((S.new_pallets[q] || {}).bay_n === bay.n));
  if(np) return 'a new pallet (' + np + ') was built in this bay';

  const q = Object.keys(S.putback_actual || {}).find(q_ => {
    if((bay.putback || []).some(pb_ => pb_.pallet_id === q_)) return false;
    const a3 = actualFor(q_);
    return a3 && a3.state === 'placed' && (laneOfLoc(a3.loc) || {}).lane === lane;
  });
  if(q) return q + ' from elsewhere was put into this lane';
  return '';
}
function laneDeviated(bay, lane){ return !!laneDeviatedWhy(bay, lane); }

function laneCountChange(b){
  const out_ = [], into = [];
  (b.pallets || []).forEach(p => {
    if(!p.pallet_id || !palletCameDown(b, p) || palletSettled(p)) return;
     
    if(!p.off_plan && !(b.putback || []).some(x => x.pallet_id === p.pallet_id)) return;
    const c = cardOf(p) || p.pallet_id;
    if(palletFreed(p)){ out_.push(c + ' (an emptied deck)'); return; }
    const a = actualFor(p.pallet_id);
    if(a && (a.state === 'floor' || (a.loc && a.loc === floorLoc()))){ out_.push(c + ' was left on the floor'); return; }
    if(a && a.loc && (laneOfLoc(a.loc) || {}).lane !== b.bay){ out_.push(c + ' went to ' + a.loc); return; }
  });
  Object.keys(S.putback_actual || {}).forEach(q => {
    if((b.pallets || []).some(p => p.pallet_id === q) || (b.putback || []).some(x => x.pallet_id === q)) return;
    const a = actualFor(q);
    if(a && a.state === 'placed' && (laneOfLoc(a.loc) || {}).lane === b.bay) into.push((cardOf(q) || q) + ' was put in from elsewhere');
  });
  return {out:out_, into:into};
}

function palletsBehind(b){
  if(!b || !b.lane || !Array.isArray(b.lane.beyond)) return true;
  const d = downMaxPos(b);
  return b.lane.beyond.some(x => Number(x.pos) > d && (x.holds || []).length > 0);
}
function rollStatus(b){
  if(!b) return null;
  const planned = !b.off_plan_bay && (PAYLOAD.shifted_pallets || []).some(sp => sp.lane === b.bay);
  const freed = b.off_plan_bay ? (b.pallets || []).some(p => palletFreed(p)) : crewFreedExtra(b) > 0;
  const cc = laneCountChange(b);
  const changed = !!(cc.out.length || cc.into.length);
  if(!planned && !freed && !changed) return null;
   
  if(!planned && !palletsBehind(b)) return null;
  const desc = cc.out.concat(cc.into).join('; ');
  if(b.off_plan_bay){
     
    const net = cc.out.length - cc.into.length;
    if(net === 0) return null;
    return net > 0 ? {posts:true, why:'', planned:false, freed:freed, changed:true, what:desc}
                   : {posts:false, why:'more pallets went into this lane than came out of it (' + desc + ')',
                      planned:false, freed:freed, changed:true, what:desc};
  }

  const dev = laneDeviatedWhy(b, b.bay);
  const posts = !dev && (planned || crewFreedExtra(b) > 0);
  return {posts:posts, why:posts ? '' : (dev || desc), planned:planned, freed:freed, changed:changed, what:desc};
}
function rollWords(b){
  const r = rollStatus(b);
  if(!r) return '';
  return r.posts
    ? 'The pallets behind it that stayed in the rack change position, and are '+
      'moved in Finale when the putback is confirmed.'
    : '⛔ Finale\'s positions for the pallets behind it will NOT be updated automatically, because '+
      r.why + ' — fix them with 📍 Fix a location or tell Jack.';
}

function laneOpened(lane){
  return PAYLOAD.bays.some(b => (b.bay || '') === lane && bayWorked(b));
}
function laneDepth(lane){ return Number((PAYLOAD.lane_depths || {})[lane] || 0) || 6; }

function pilesAt(loc){
  const out = [];
  Object.keys(PAYLOAD.sku_homes || {}).forEach(k => {
    const i = k.indexOf('|');
    (PAYLOAD.sku_homes[k] || []).forEach(h => {
      if(h[0] === loc && Number(h[1]) > 0)
        out.push({sku:k.slice(0, i), lot:k.slice(i + 1), qty:Number(h[1])});
    });
  });
  return out;
}

function laneRun(lane){
  const run = [];
  for(let pos = 1; pos <= laneDepth(lane); pos++){
    const piles = pilesAt(lane + '-' + pos);
    if(!piles.length) break;
    run.push({pos:pos, piles:piles});
  }
  return run;
}

function lanePushes(lane){
  if(laneOpened(lane)) return [];
  return Object.keys(S.lane_push || {}).filter(q => {
    const lp = S.lane_push[q] || {}, a = actualFor(q);
    return lp.lane === lane && a && a.state === 'placed' && (laneOfLoc(a.loc) || {}).lane === lane;
  }).sort((a, b) => String(S.lane_push[a].ts).localeCompare(String(S.lane_push[b].ts)));
}
function pushedFinalLoc(pid){
  const lp = (S.lane_push || {})[pid];
  if(!lp) return null;
  const order = lanePushes(lp.lane);
  const k = order.indexOf(pid);
  return k < 0 ? null : lp.lane + '-' + (order.length - k);
}
function pushCheck(pid, lane){
  if(laneOpened(lane))
    return {ok:false, why:'⛔ ' + lane + ' was worked this shift — its putback records the order'};
  const already = lanePushes(lane).filter(q => q !== pid).length;
  const run = laneRun(lane);
  if(run.length + already + 1 > laneDepth(lane))
    return {ok:false, why:'⛔ Finale thinks ' + lane + ' already holds ' + (run.length + already) +
      ' pallet(s) and it is ' + laneDepth(lane) + ' deep, so one more cannot have pushed in. '+
      'Something does not add up — record "nothing else moved" and tell Jack.'};
  return {ok:true, run:run.length};
}
function recordLanePush(pid, lane){
  const c = pushCheck(pid, lane);
  if(!c.ok) return c;
  const prev = (S.lane_push || {})[pid];
  S.lane_push = Object.assign({}, S.lane_push || {});

  S.lane_push[pid] = {lane:lane, run:c.run,
                      ts:(prev && prev.lane === lane && prev.ts) || new Date().toISOString()};
  save(); ev('lane_push', {pallet:pid, lane:lane, pushed_back:c.run});
  return {ok:true, run:c.run};
}
function undoLanePush(pid){
  if(!(S.lane_push || {})[pid]) return {ok:false};
  S.lane_push = Object.assign({}, S.lane_push); delete S.lane_push[pid];
  save(); ev('lane_push_undone', {pallet:pid}); return {ok:true};
}

function pushNeeded(loc){
  const ll = laneOfLoc(loc);
  return !!(ll && !laneOpened(ll.lane));
}
function renderPushQ(boxId, loc, pid, prevAns){

function readPushQ(boxId, loc, pid){
