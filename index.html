<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Freezer restock</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0b62c4">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%230b62c4'/%3E%3Ctext x='90' y='122' font-size='96' font-family='system-ui,sans-serif' font-weight='700' fill='white' text-anchor='middle'%3E%E2%9D%84%3C/text%3E%3C/svg%3E">
<style>

:root{
  --bg:#f4f6f8; --card:#ffffff; --line:#d5dde3; --ink:#101a1f; --dim:#5d707a;
  --take:#0b62c4; --aside:#8a5406; --count:#6b3fa0; --stay:#6d828c; --ok:#1c6b45; --bad:#a32d24;
  --onaccent:#ffffff;
  --tap:62px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1117; --card:#161b22; --line:#30363d; --ink:#e6edf3; --dim:#9198a1;
  --take:#2f81f7; --aside:#d29922; --count:#a371f7; --stay:#6e7681; --ok:#3fb950; --bad:#f85149;
  --onaccent:#04240f;
}}
:root[data-theme="dark"]{
  --bg:#0d1117; --card:#161b22; --line:#30363d; --ink:#e6edf3; --dim:#9198a1;
  --take:#2f81f7; --aside:#d29922; --count:#a371f7; --stay:#6e7681; --ok:#3fb950; --bad:#f85149;
  --onaccent:#04240f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
body{padding-bottom:96px}
.wrap{max-width:900px;margin:0 auto;padding:12px}
h1,h2,h3{margin:0 0 8px}
h1{font-size:20px}
button{font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);
  border-radius:12px;min-height:var(--tap);padding:12px 16px;cursor:pointer}
button:active{transform:scale(.985)}
button.big{width:100%;font-size:18px;font-weight:650}
button.pri{background:var(--take);border-color:var(--take);color:#fff}
button.ok{background:var(--ok);border-color:var(--ok);color:var(--onaccent)}
button.warn{background:var(--aside);border-color:var(--aside);color:#fff}
button.ghost{background:transparent}
button[disabled]{opacity:.4}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:8px 12px;display:flex;gap:8px;align-items:center}
.bar .grow{flex:1;min-width:0}
.bar b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar small{color:var(--dim);font-size:12px}

.bar button{min-height:48px;min-width:48px;padding:8px 10px;font-size:16px;border-radius:10px;
  margin-left:2px}
.prog{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--ok);width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;
  overflow:hidden}
.ph{display:flex;gap:10px;align-items:center;padding:14px;min-height:var(--tap);cursor:pointer}
.ph .grow{flex:1;min-width:0}
.ph b{font-size:17px}
.ph small{display:block;color:var(--dim);font-size:13px}
.body{border-top:1px solid var(--line);max-height:60vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch}
.grp{padding:6px 12px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--dim);background:var(--bg);border-top:1px solid var(--line);position:sticky;top:0}
.ln{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);
  min-height:var(--tap)}
.ln .grow{flex:1;min-width:0}
.ln .sku{font-weight:650;font-size:16px}
.ln .sub{color:var(--dim);font-size:12.5px;white-space:normal;overflow-wrap:anywhere}

.qty{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;min-width:58px;text-align:right}
.tag{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;white-space:nowrap}
.t-take{background:color-mix(in srgb,var(--take) 18%,transparent);color:var(--take)}
.t-aside{background:color-mix(in srgb,var(--aside) 18%,transparent);color:var(--aside)}
.t-count{background:color-mix(in srgb,var(--count) 18%,transparent);color:var(--count)}
.t-stay{background:color-mix(in srgb,var(--stay) 15%,transparent);color:var(--stay)}
.done{opacity:.45}
.done .qty{text-decoration:line-through}
.chip{display:inline-block;font-size:12px;padding:4px 9px;border-radius:999px;
  background:color-mix(in srgb,var(--stay) 15%,transparent);color:var(--dim);margin:0 6px 6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
.pad{padding:12px}
.dim{color:var(--dim)}
.sm{font-size:13px}
.warnbox{border:1px solid var(--aside);background:color-mix(in srgb,var(--aside) 12%,transparent);border-radius:12px;padding:12px;margin:10px 0}
.badbox{border:1px solid var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent);border-radius:12px;padding:12px;margin:10px 0}
.okbox{border:1px solid var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);border-radius:12px;padding:12px;margin:10px 0}

input,select,textarea{width:100%;background:var(--bg);color:var(--ink);
  border:2px solid var(--line);border-radius:10px;padding:14px;font:inherit;min-height:var(--tap)}
input[type=checkbox]{width:24px;min-height:24px;padding:0;}
input[type=number]{font-size:26px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;
  padding:0;width:min(560px,94vw);max-height:88vh}
dialog::backdrop{background:#000b}
.dh{padding:14px;border-bottom:1px solid var(--line);font-weight:700}
.db{padding:14px;overflow-y:auto;max-height:60vh}
.df{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px}
.df>*{flex:1}
.foot{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--bg) 95%,transparent);border-top:1px solid var(--line);z-index:30}
.foot .wrap{padding:0}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.num{text-align:right;font-variant-numeric:tabular-nums}
#breakveil{position:fixed;inset:0;background:#000000f0;z-index:100;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:24px}
#breakveil.on{display:flex}
</style>
</head>
<body>
<div id="breakveil">
  <div style="font-size:56px">☕</div>
  <h1 style="font-size:26px">On break</h1>
  <p class="dim" style="max-width:340px">The screen is inactive so nothing you lean on gets
  recorded. Your work is saved.</p>
  <p class="dim" id="breakclock" style="font-variant-numeric:tabular-nums;font-size:20px"></p>
  <button class="big ok" style="max-width:320px" onclick="endBreak()">Back to work</button>
</div>

<div class="bar">
  <div class="grow">
    <b id="hdr">Freezer restock</b>
    <small id="sub"></small>
    <div class="prog"><i id="progbar"></i></div>
  </div>
  <button class="ghost" id="navprev" onclick="goBay(-1)" title="Previous bay">‹</button>
  <button class="ghost" id="navnext" onclick="goBay(1)" title="Next bay">›</button>
  <button class="ghost" onclick="startBreak()" title="Break">☕</button>
  <button class="ghost" onclick="openFinish()" title="Finish &amp; export">⇪</button>
</div>

<div class="wrap" id="app"></div>

<div class="foot"><div class="wrap"><button class="big pri" id="mainbtn"></button></div></div>

<dialog id="dlg"><form method="dialog">
  <div class="dh" id="dlgh"></div><div class="db" id="dlgb"></div>
  <div class="df" id="dlgf"></div>
</form></dialog>

<script>
"use strict";

const CFG = {"entra":{"client_id":"4a5939ef-bb89-4629-8a95-007509bb11a5","tenant_id":"c0f23c54-f515-4e2e-8aef-d3afb1ae34d0"},"sharepoint":{"hostname":"tcfarm0.sharepoint.com","site_path":"/sites/ClaudeAgents","list_name":"FreezerRestock","doc_folder":"FreezerRestock"}};
let PAYLOAD = null;                       
let KEY = 'freezer.exec.pending';         
const CACHE_KEY = 'freezer.plan.cache';
const TOK_KEY   = 'freezer.tok';

const AUTHZ = () => `https://login.microsoftonline.com/${CFG.entra.tenant_id}/oauth2/v2.0`;
const GRAPH = 'https://graph.microsoft.com/v1.0';
const REDIRECT = () => location.origin + location.pathname;   

function b64u(buf){
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function sha256(str){
  return b64u(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)));
}
function tokStore(v){
  try{ if(v === undefined) return JSON.parse(localStorage.getItem(TOK_KEY) || 'null');
       if(v === null) localStorage.removeItem(TOK_KEY);
       else { localStorage.setItem(TOK_KEY, JSON.stringify(v)); clearAutoSignIn(); }
     }catch(e){ return null; }
}
function haveToken(){
  const t = tokStore();
  return !!(t && t.access_token && Date.now() < (t.exp || 0) - 60000);
}
function canRefresh(){ const t = tokStore(); return !!(t && t.refresh_token); }

async function ensureToken(){
  if(haveToken()) return true;
  if(!canRefresh()) return false;
  try{
    const t = tokStore();
    const body = new URLSearchParams({
      client_id: CFG.entra.client_id, grant_type: 'refresh_token',
      refresh_token: t.refresh_token,
      scope: 'https://graph.microsoft.com/Sites.ReadWrite.All offline_access openid profile'});
    const r = await fetch(`${AUTHZ()}/token`, {
      method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:body});
    const j = await r.json();
    if(!r.ok) throw new Error(j.error_description || j.error || ('HTTP ' + r.status));
    j.exp = Date.now() + (Number(j.expires_in || 3600) * 1000);
    if(!j.refresh_token) j.refresh_token = t.refresh_token;   
    tokStore(j);
    return true;
  }catch(e){ tokStore(null); return false; }
}

async function signIn(){
  const verifier = b64u(crypto.getRandomValues(new Uint8Array(48)));
  sessionStorage.setItem('fz.v', verifier);
  const q = new URLSearchParams({
    client_id: CFG.entra.client_id, response_type: 'code', redirect_uri: REDIRECT(),
    response_mode: 'query',
    scope: 'https://graph.microsoft.com/Sites.ReadWrite.All offline_access openid profile',
    code_challenge: await sha256(verifier), code_challenge_method: 'S256'});
  location.href = `${AUTHZ()}/authorize?${q}`;
}

async function completeSignIn(){
  const qs = new URLSearchParams(location.search);
  const code = qs.get('code');
  if(!code){
    
    if(qs.get('error')) throw new Error(qs.get('error_description') || qs.get('error'));
    return false;
  }
  const verifier = sessionStorage.getItem('fz.v') || '';
  const body = new URLSearchParams({
    client_id: CFG.entra.client_id, grant_type: 'authorization_code', code: code,
    redirect_uri: REDIRECT(), code_verifier: verifier});
  const r = await fetch(`${AUTHZ()}/token`, {
    method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: body});
  const j = await r.json();
  history.replaceState({}, '', location.pathname);        
  if(!r.ok) throw new Error(j.error_description || j.error || ('token exchange HTTP ' + r.status));
  j.exp = Date.now() + (Number(j.expires_in || 3600) * 1000);
  tokStore(j);
  return true;
}

async function graph(path){
  const t = tokStore();
  if(!t) throw new Error('not signed in');
  const r = await fetch(GRAPH + path, {headers: {Authorization: 'Bearer ' + t.access_token}});
  if(r.status === 401){ tokStore(null); throw new Error('sign-in expired — sign in again'); }
  if(!r.ok) throw new Error(`Graph ${path} -> HTTP ${r.status}`);
  const ct = r.headers.get('content-type') || '';
  return ct.includes('json') ? r.json() : r.text();
}

async function fetchPlan(){
  const sp = CFG.sharepoint;
  const site = await graph(`/sites/${sp.hostname}:${sp.site_path}`);
  const txt = await graph(
    `/sites/${site.id}/drive/root:/${sp.doc_folder}/plan_latest.json:/content`);
  const p = (typeof txt === 'string') ? JSON.parse(txt) : txt;
  if(!p || !p.bays || !p.bays.length) throw new Error('the plan file has no bays');
  return p;                       
}

function acceptPlan(p){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(
        {fetched: new Date().toISOString(), plan: p})); }
  catch(e){ toast('⚠️ plan loaded but too large to cache — it will need signal again'); }
  setPlan(p);
}

function isDirty(){
  return !!(S.started || (S.events && S.events.length) ||
            Object.keys(S.lines || {}).length ||
            Object.keys(S.pallets || {}).length ||
            Object.keys(S.bays || {}).length || S.bay > 0);
}
function cachedPlan(){
  try{ const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
       return c && c.plan && c.plan.bays ? c : null; }catch(e){ return null; }
}

function setPlan(p){
  PAYLOAD = p;
  KEY = 'freezer.exec.' + (p.plan_date || 'x');
  S = load();

  COMMITTED = undoSnapshotOf(S);
  UNDO.length = 0;
  renderUndoBar();
  claimOwner();           
  noteOpen();             
  scanStranded();
}

const OWNER_ID = 'w' + Math.random().toString(36).slice(2, 9);
const OWNER_FRESH_MS = 45000;
let TWO_WIN_TOLD = false, OWNER_TIMER = null;
function ownerKey(){ return KEY + '.owner'; }
function readOwner(){
  try{ return JSON.parse(localStorage.getItem(ownerKey()) || 'null'); }catch(e){ return null; }
}
function touchOwner(){
  try{ localStorage.setItem(ownerKey(), JSON.stringify({id: OWNER_ID, at: Date.now()})); }
  catch(e){   }
}
function releaseOwner(){
  try{ const o = readOwner(); if(o && o.id === OWNER_ID) localStorage.removeItem(ownerKey()); }
  catch(e){}
}
function renderTwoWin(){
  if(document.getElementById('twowin') && !document.getElementById('twowin').hidden) return;
  banner('twowin',
    '<b>⛔ This plan is open in another window.</b>'
    + '<div class="sm" style="margin-top:4px">Both windows save the whole shift, so whichever '
    + 'one saves last <b>erases what the other recorded</b> — including where pallets went. '
    + 'Close one of them now, and work in the other.</div>');
}
function claimOwner(){
  const prev = readOwner();
  const foreignLive = prev && prev.id !== OWNER_ID && (Date.now() - (prev.at || 0)) < OWNER_FRESH_MS;
  touchOwner();
  if(foreignLive){
    renderTwoWin();

    const wasAt = prev.at || 0;
    setTimeout(() => {
      const now = readOwner();
      if(!TWO_WIN_TOLD && (!now || now.id === OWNER_ID || (now.at || 0) <= wasAt)){
        dropBanner('twowin'); touchOwner();
      }
    }, 4000);
  }
  if(OWNER_TIMER) clearInterval(OWNER_TIMER);
  OWNER_TIMER = setInterval(touchOwner, 15000);
}
window.addEventListener('storage', e => {
  if(!e || e.key !== ownerKey() || !e.newValue) return;
  let o = null; try{ o = JSON.parse(e.newValue); }catch(err){ return; }
  if(!o || o.id === OWNER_ID) return;
  renderTwoWin();

  if(!TWO_WIN_TOLD){ TWO_WIN_TOLD = true; touchOwner(); }
});

function strandedRecords(){
  const out = [];
  let keys = [];
  try{ keys = Object.keys(localStorage); }catch(e){ return out; }
  keys.forEach(k => {
    if(k.indexOf('freezer.exec.') !== 0) return;
    if(k === KEY) return;
     
    if(/\.(owner|probe)$/.test(k) || k.indexOf('.rescue.') >= 0) return;
    let o = null;
    try{ o = JSON.parse(localStorage.getItem(k) || 'null'); }
    catch(e){ out.push({key: k, plan: k.slice(13), lines: null, unreadable: true}); return; }
    if(!o || typeof o !== 'object') return;
    const lines = Object.keys(o.lines || {}).length;
    const work = lines || Object.keys(o.bays || {}).length
                       || Object.keys(o.putback_actual || {}).length
                       || (o.events || []).length;
    if(!work) return;                        
    out.push({key: k, plan: k.slice(13), lines: lines,
              synced: (o.synced && o.synced.at) || null});
  });
  return out;
}
function scanStranded(){
  const st = strandedRecords();
  if(!st.length) return dropBanner('stranded');
  banner('stranded',
    '<b>⚠️ There is unsent work on this iPad for '
    + (st.length === 1 ? 'another plan' : st.length + ' other plans') + '.</b>'
    + st.map(r => '<div class="sm" style="margin-top:4px">Plan <b>' + esc(r.plan) + '</b> — '
        + (r.unreadable ? 'could not be read'
                        : r.lines + ' line(s) recorded, '
                          + (r.synced ? 'last sent ' + esc(String(r.synced).slice(0, 16))
                                      : '<b>never sent</b>'))
        + ' <button class="ghost" style="min-height:44px;margin-left:6px" '
        + 'onclick="sendStranded(' + JSON.stringify(r.key).replace(/"/g, '&quot;')
        + ', this)">Send it</button></div>').join('')
    + '<div class="sm dim" style="margin-top:4px">It is not part of today\'s shift and will '
    + 'not sync on its own. ⛔ Do not clear this iPad until it has been sent.</div>',
    'warnbox');
}
async function sendStranded(k, b){
  let raw = null;
  try{ raw = localStorage.getItem(k); }catch(e){}
  if(!raw) return toast('⛔ it is not there any more');
  if(b){ b.disabled = true; b.textContent = 'Sending…'; }
  try{
    const n = await uploadRaw('stranded_' + k.slice(13) + '_' + deviceId() + '_'
                              + Date.now() + '.json', raw);
    if(b){ b.textContent = 'Sent ✓'; }
    toast('✅ sent — ' + n);
  }catch(e){
    if(b){ b.disabled = false; b.textContent = 'Send it'; }
    dlg('Could not send it', '<div class="badbox">' + esc(String(e.message || e)) + '</div>'
      + '<p class="sm dim">It is still on this iPad. Try again in signal.</p>',
      [{t: 'OK', c: 'pri'}]);
  }
}

const HOW_LINK = '<div class="sm" style="text-align:center;margin-top:14px">'+

  '<a href="./how.html" style="color:var(--take);text-decoration:underline;'+
  'display:inline-block;min-height:44px;'+
  'line-height:44px;padding:0 4px">How does this work?</a></div>';
function renderGate(msg, busy){

  try{ scanStranded(); }catch(e){}
  const c = cachedPlan();
  $('#hdr').textContent = 'Freezer restock';
  $('#sub').textContent = CFG.entra.client_id.startsWith('PASTE_')
      ? 'not configured yet' : 'sign in to load the plan';
  $('#progbar').style.width = '0%';
  navArrows();
  $('#app').innerHTML =
    (CFG.entra.client_id.startsWith('PASTE_')
      ? '<div class="badbox"><b>⛔ Not configured.</b> This build has no Entra client id yet, '+
        'so it cannot sign in. Rebuild once <code>config/freezer_app.json</code> has one.</div>'
      : '') +
    '<div class="card"><div class="pad">'+
      '<h2>Sign in to load the plan</h2>'+
      '<p class="dim">Nothing about the plan is stored in this page — it is fetched from '+
      'SharePoint after you sign in with your TC Farm account, then kept on this device so '+
      'the freezer does not need signal.</p>'+
      (msg ? '<div class="warnbox">'+esc(msg)+'</div>' : '')+
      (c ? '<div class="okbox">A plan for <b>'+esc(c.plan.plan_date)+'</b> is already on this '+
           'device (loaded '+esc(String(c.fetched).slice(0,16))+'). You can work offline.</div>' : '')+
      '<div id="offbadge" class="sm" style="margin-top:10px"></div>'+
    '</div></div>' + HOW_LINK;
  const btn = $('#mainbtn');
  if(c){
    btn.className = 'big ok'; btn.textContent = 'Work offline — open ' + c.plan.plan_date;
    btn.onclick = () => { setPlan(c.plan); S.screen = S.screen || 'review'; save(); render(); };
  } else {
    btn.className = 'big pri';
    btn.textContent = busy ? 'Loading…' : 'Sign in with Microsoft';
    btn.onclick = busy ? (()=>{}) : (() => signIn());
  }
}

let SW_STATE = 'unknown';         

let SHELL_CACHED = null;         
async function probeShellCache(){
  try{
    if(!('caches' in window)) { SHELL_CACHED = false; return; }
    const hit = await caches.match('./index.html', {ignoreSearch:true})
             || await caches.match('./', {ignoreSearch:true});
    SHELL_CACHED = !!hit;
  }catch(e){ SHELL_CACHED = false; }
  renderOfflineBadge();
}
function offlineReady(){ return SW_STATE === 'ready' && SHELL_CACHED === true; }

function registerSW(){
  if(!('serviceWorker' in navigator)){ SW_STATE = 'unsupported'; return; }

  if(location.protocol !== 'https:' && location.hostname !== 'localhost'){
    SW_STATE = 'unsupported'; return;
  }
  SW_STATE = navigator.serviceWorker.controller ? 'ready' : 'installing';
  navigator.serviceWorker.register('./sw.js').then(reg => {
    if(navigator.serviceWorker.controller) SW_STATE = 'ready';
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      if(!w) return;
      w.addEventListener('statechange', () => {
        if(w.state === 'activated'){ SW_STATE = 'ready'; SHELL_CACHED = null;
                                     renderOfflineBadge(); }
      });
    });
    renderOfflineBadge();
  }).catch(() => { SW_STATE = 'failed'; renderOfflineBadge(); });
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    SW_STATE = 'ready'; SHELL_CACHED = null; renderOfflineBadge();
  });
}

function renderOfflineBadge(){
  const el = document.getElementById('offbadge');
  if(!el) return;
  const cached = !!cachedPlan();
  if(SHELL_CACHED === null) probeShellCache();     
  if(offlineReady() && cached){
    el.className = 'okbox sm';
    el.innerHTML = '✓ <b>Saved on this device.</b> This will open in the freezer with no signal.';
  }else if(SW_STATE === 'ready' && cached && SHELL_CACHED === false){

    el.className = 'warnbox sm';
    el.innerHTML = '⚠️ <b>The plan is saved but the app itself is not.</b> Reload once on '+
      'wifi before you go in — the page needs a signal to open until this clears.';
  }else if(SW_STATE === 'unsupported'){
    el.className = 'warnbox sm';
    el.innerHTML = '⚠️ <b>This browser cannot save the app offline.</b> Open it from the ' +
      'home-screen icon (Share → Add to Home Screen) while you still have wifi.';
  }else if(!cached){
    el.className = 'warnbox sm';
    el.innerHTML = '⚠️ <b>No plan saved on this device yet.</b> Sign in here, on wifi, ' +
      'before you go in — there is nothing to open in the freezer until you do.';
  }else{
    el.className = 'warnbox sm';
    el.innerHTML = '⏳ <b>Saving the app for offline use…</b> Stay on wifi for a moment. ' +
      'The plan itself is already saved.';
  }
}

  if(navigator.onLine === false) return false;

async function boot(){
  registerSW();
  try{
    if(new URLSearchParams(location.search).has('code') ||
       new URLSearchParams(location.search).has('error')){
      await completeSignIn();
    }
  }catch(e){ return renderGate('Sign-in failed: ' + e.message); }

  const c = cachedPlan();
  if(c){ setPlan(c.plan); render();

         ensureToken().then(ok => { if(ok){ refreshPlanQuietly(); reconcileOnBoot(); } });
         return; }
  if(!(await ensureToken())){

    if(autoSignInOK()){ renderGate(null, true); return signIn(); }
    return renderGate();
  }
  renderGate(null, true);
  try{ const p = await fetchPlan(); acceptPlan(p); render(); reconcileOnBoot(); }
  catch(e){ renderGate('Could not load the plan: ' + e.message); }
}

let RESCUED = null;       
let WRITE_LOCK = null;    

function rescueRecord(raw, why){
  const stamp = new Date().toISOString().replace(/[^0-9]/g, '').slice(0, 14);

  let k = KEY + '.rescue.' + stamp, n = 0;
  try{ while(localStorage.getItem(k) !== null && n < 50) k = KEY + '.rescue.' + stamp + '-' + (++n); }
  catch(e){   }
  try{
    localStorage.setItem(k, raw);
    if(localStorage.getItem(k) !== raw) throw new Error('read-back mismatch');
  }catch(e){
    WRITE_LOCK = 'an earlier record for this plan could not be read, and there is no room on '
               + 'this device to keep it safe. Writing anything now would destroy it.';
    blockStorage(why + ' — and the copy failed: ' + (e.message || e), false, raw);
    return null;
  }
  RESCUED = {key: k, why: why, raw: raw};
  try{ renderRescueBar(); }catch(e){}
  return k;
}

function load(){
  let raw = null;
  try{ raw = localStorage.getItem(KEY); }catch(e){ return blank(); }
  if(!raw) return blank();
  let o = null, why = '';
  try{ o = JSON.parse(raw); }
  catch(e){ why = 'the saved record is not readable JSON (' + (e.message || e) + ')'; }
  if(!why){
    if(!o || typeof o !== 'object') why = 'the saved record is not a session';
    else if(o.v !== 2) why = 'the saved record is version ' + JSON.stringify(o.v)
                           + ' and this build of the app reads version 2';
  }
  if(why){ rescueRecord(raw, why); return blank(); }

  o.putback_actual = o.putback_actual || {};
  o.new_pallets = o.new_pallets || {};
  o.split_contents = o.split_contents || {};
  o.floor_fix = o.floor_fix || {};
  o.left_down = o.left_down || {};
  o.temp_out = o.temp_out || [];
  return o;
}

let saveT = null, saveFailed = false;
let PERSISTED = null;       

const UNDO = [];
const UNDO_MAX = 30;
let COMMITTED = null;    
 
const UNDO_KEEP = ['events', 'breaks', 'started'];

function undoSnapshotOf(st){
  const o = {};
  Object.keys(st).forEach(k => { if(UNDO_KEEP.indexOf(k) < 0) o[k] = st[k]; });
  return JSON.stringify(o);
}

const UNDO_WORDS = {
  line_done:'that line', count_recorded:'that count', qty_corrected:'that correction',
  all_as_planned:'all as planned', bay_close:'closing the bay',
  putback_done:'the putback', split_recorded:'that split', line_skipped:'that skip',
  pallet_placed:'where that pallet went', orphan_fixed:'that fix',
  temp_park:'parking it in temp', temp_return:'taking it out of temp',
  session_finished:'clocking out'};
function undoLabel(){
  const e = S.events && S.events.length ? S.events[S.events.length - 1] : null;
  if(!e) return 'the last change';
  const w = UNDO_WORDS[e.kind];
  if(!w) return 'the last change';
  return w + (e.sku ? ' (' + e.sku + ')' : '');
}

function save(){

  if(!saveT && COMMITTED !== null){
    UNDO.push({state: COMMITTED, label: 'the last change', ts: Date.now()});
    if(UNDO.length > UNDO_MAX) UNDO.shift();
    renderUndoBar();
  }

  writeLocal();
  if(saveT) clearTimeout(saveT);
  saveT = setTimeout(()=>{
    saveT = null;                        

    if(UNDO.length) UNDO[UNDO.length - 1].label = undoLabel();
    COMMITTED = undoSnapshotOf(S);
    renderUndoBar();
  }, 60);
}

let LAST_WRITE = 0;
function writeLocal(){

  if(WRITE_LOCK) return;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); saveFailed = false; touchOwner();
       LAST_WRITE = Date.now(); }
  catch(e){

    if(!saveFailed){
      saveFailed = true;

      try{ syncNow(true); }catch(e2){}
      blockStorage(e.message||String(e), true);
    }
  }
}
function undoLast(){
  if(!UNDO.length) return;
  const top = UNDO[UNDO.length - 1];
  if(!confirm('Undo ' + top.label + '?\n\nThis puts the app back exactly as it was just '
              + 'before that. Your timings and the record of what you tapped are kept.')) return;
  UNDO.pop();
  let o;
  try{ o = JSON.parse(top.state); }
  catch(e){                                          

    toast('⛔ could not undo — nothing was changed');
    return;
  }
  Object.keys(o).forEach(k => { S[k] = o[k]; });

  Object.keys(S).forEach(k => {
    if(UNDO_KEEP.indexOf(k) < 0 && !(k in o)) delete S[k];
  });
   
  S.events.push({ts:new Date().toISOString(), kind:'undo', what:top.label});
  COMMITTED = undoSnapshotOf(S);                      
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  renderUndoBar();
  render();
  toast('↶ undone — ' + top.label);
}

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n = x => (Math.round(Number(x||0)*100)/100);
const lid = (bay, loc, ln, i) => bay+'|'+loc+'|'+(ln.sku||ln.serial||'')+'|'+(ln.lot||'')+'|'+ln.kind+'|'+i;
function st(id){ return S.lines[id] || null; }

const TERMINAL = ['done', 'missing', 'skipped'];
function isFinished(s){ return !!(s && TERMINAL.indexOf(s.state) >= 0); }

const ACTIONABLE = ['take', 'aside', 'count'];
function isActionable(l){ return ACTIONABLE.indexOf(l.kind) >= 0; }

function arrivedTooLate(palletId, ts){
  if(!palletId || !ts) return false;

  const a_ = actualFor(palletId);
  if(a_ && a_.ts && a_.ts > ts) return false;
  const rb = PAYLOAD.bays.find(x => (x.pallets||[]).some(y => y.pallet_id === palletId) ||
                                    (x.putback||[]).some(y => y.pallet_id === palletId));
  if(!rb) return false;
  const rst = S.bays[rb.n] || {};
  return !!(rst.putback_done && rst.putback_ts && ts > rst.putback_ts);
}
function arrivalsFor(palletId){
  const out = [];
  if(!palletId) return out;
  PAYLOAD.bays.forEach(bb => bb.pallets.forEach(pp => pp.lines.forEach((l2, i2) => {
    if(l2.kind !== 'aside') return;
    const st_ = st(lid(bb.n, pp.loc, l2, i2)) || null;
    const state = st_ ? st_.state : null;
    const actual = (st_ && st_.actual != null) ? Number(st_.actual) : null;

    const parts = (st_ && st_.placements && st_.placements.length)
      ? st_.placements.filter(pt => Number(pt.qty || 0) > 0)
                      .map(pt => ({pallet: pt.pallet || '', qty: Number(pt.qty),
                                   deviated: !!pt.deviated, floor: !!pt.floor}))
      : [{pallet: l2.onto_pallet || '', deviated: false, floor: false,
          qty: (actual != null ? actual : Number(l2.planned_qty || 0))}];
    const tooLate = arrivedTooLate(palletId, st_ && (st_.done_ts || st_.ts));
    parts.forEach(pt => {
      if(pt.pallet !== palletId) return;
      out.push({sku:l2.sku, lot:l2.lot||'', planned:l2.planned_qty, tooLate:tooLate,
                qty:pt.qty,
                from:pp.loc, bay:bb.bay, n:bb.n, cross:!!l2.cross,

                deviated: pt.deviated || (l2.onto_pallet !== palletId),
                state:state, reason:(st_ && st_.reason) || '',
                 
                gone:(state === 'skipped' || state === 'missing'),
                short:(state === 'done' && actual != null &&
                       Math.abs(pt.qty - Number(l2.planned_qty || 0)) > 0.001)});
    });
  })));
  return out;
}
function arrivalLine(x){

  const head = '<b>'+esc(x.sku)+'</b> ×'+n(x.gone ? x.planned : x.qty)+
    (x.lot?' · lot '+esc(x.lot):'')+
    ' — set aside from '+esc(x.from)+(x.n !== S.bay + 1 ? ' in bay '+x.n+' ('+esc(x.bay)+')' : '')+
    (x.cross ? ' — cross-lane' : '');
  if(x.state === 'skipped')
    return '<div class="sm" style="margin-top:4px;opacity:.75"><s>'+head+'</s><br>'+
      '⛔ <b>SKIPPED in bay '+x.n+'</b>'+(x.reason?' — '+esc(x.reason):'')+
      '. It was never taken off, so do NOT go looking for it.</div>';
  if(x.state === 'missing')
    return '<div class="sm" style="margin-top:4px;opacity:.75"><s>'+head+'</s><br>'+
      '⛔ <b>NOT FOUND in bay '+x.n+'</b>. Nothing is coming.</div>';
  if(x.short)
    return '<div class="sm" style="margin-top:4px">'+head+'<br>'+
      '⚠️ <b>'+n(x.qty)+' actually came off</b>, not the planned '+n(x.planned)+'.</div>';
  if(!x.state)
    return '<div class="sm" style="margin-top:4px">'+head+
      ' <span class="dim">· bay '+x.n+' has not been worked yet</span></div>';
  return '<div class="sm" style="margin-top:4px">'+head+'</div>';
}

function bayTitle(bay, pct){ return pct + '% · ' + bay; }

const CORRECTION_FIELDS = ['left', 'adjustment', 'corrected', 'reason', 'direction',
                           'clamped_from', 'took_from_sibling', 'gave_to_sibling',
                           'baseline', 'sibling_took', 'not_here', 'posted_at'];
function setLine(id, patch){
  const had = S.lines[id];
  S.lines[id] = Object.assign({ts:new Date().toISOString()}, had||{}, patch);
  S.lines[id].ts = new Date().toISOString();

  if(patch && patch.as_planned === true){
    CORRECTION_FIELDS.forEach(k => { delete S.lines[id][k]; });

    delete S.lines[id].placements;
  }

  const term = ['done','missing','skipped'];
  if(term.indexOf(S.lines[id].state) >= 0 && !S.lines[id].done_ts)
    S.lines[id].done_ts = S.lines[id].ts;
  if(term.indexOf(S.lines[id].state) < 0) S.lines[id].done_ts = undefined;
  save();
}

function readQty(id){
  const el = $('#' + id);
  if(!el) return null;
  const raw = String(el.value == null ? '' : el.value).trim();
  if(raw === '') return null;
  const v = Number(raw);
  return (isFinite(v) && v >= 0) ? v : null;
}

function qtyField(id, val){

  return '<div style="margin-top:4px">'+
    '<input type="number" inputmode="numeric" id="'+id+'" value="'+val+'" '+
      'style="width:100%;font-size:30px;text-align:center;min-height:62px">'+
    '<div style="display:flex;gap:8px;margin-top:6px">'+
      '<button type="button" style="flex:1;font-size:26px;min-height:62px" '+
        'onclick="qtyStep(\''+id+'\',-1)">−</button>'+
      '<button type="button" style="flex:1;font-size:26px;min-height:62px" '+
        'onclick="qtyStep(\''+id+'\',1)">+</button>'+
    '</div></div>';
}
function qtyStep(id, dir){
  const el = $('#' + id); if(!el) return;
  const cur = Number(el.value) || 0;
  const step = cur >= 50 ? 5 : 1;
  el.value = String(Math.max(0, cur + dir * step));
  el.dispatchEvent(new Event('input'));       
}

function toast(m){
  const d = document.createElement('div');
  d.textContent = m;
  d.style.cssText = 'position:fixed;left:50%;bottom:110px;transform:translateX(-50%);'+
    'background:#22272e;border:1px solid #30363d;padding:12px 18px;border-radius:12px;'+
    'z-index:200;max-width:90vw;text-align:center';

  const dl = document.querySelector('dialog[open]');

  if(dl){
    const body = dl.querySelector('.db') || dl;
    let bar = body.querySelector('.dlgtoast');
    if(!bar){
      bar = document.createElement('div');
      bar.className = 'dlgtoast badbox';
      bar.style.cssText = 'margin:0 0 10px';
      body.insertBefore(bar, body.firstChild);
    }
    bar.textContent = m;
    if(bar.scrollIntoView) bar.scrollIntoView({block:'nearest'});
    clearTimeout(bar._t);
    bar._t = setTimeout(()=>{ if(bar.parentNode) bar.parentNode.removeChild(bar); }, 5000);
    return false;
  }
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), 3200);
  return false;                  
}

const ORDER = ['take','aside','count','stay'];
const LABEL = {take:'Take off', aside:'Set aside', count:'Cycle count', stay:'Stays — reload as it was'};

function navArrows(){
  const pv = $('#navprev'), nx = $('#navnext');
  const on = S.screen === 'bay';
  [pv,nx].forEach(el => { if(el) el.hidden = !on; });

  pv.disabled = S.bay <= 0;
  nx.disabled = S.bay >= PAYLOAD.bays.length - 1;
}

function render(){
  renderUndoBar();
  if(!PAYLOAD || !PAYLOAD.bays){ renderGate(); renderOfflineBadge(); return; }
  const a = $('#app');
  navArrows();

  if(S.screen === 'done')   return renderDone(a);
  renderBay(a);
}

function renderReview(a){
  const t = PAYLOAD.totals || {};
  const allLines = [];
  PAYLOAD.bays.forEach(b => {

    (b.orphan_pulls || []).forEach((o,i) =>
      allLines.push({b:b, p:{loc:o.from_location||'ORPHAN'}, l:o, id:lid(b.n,'ORPHAN',o,i)}));
  });
  const opened = allLines.filter(x => S.opened[x.id]).length;
  const takes = allLines.filter(x => x.l.kind === 'take');
  const asides = allLines.filter(x => x.l.kind === 'aside');

  let h = '<div id="offbadge" class="sm" style="margin:0 0 12px"></div>'+

    '<div class="badbox"><b>⛔ Record everything HERE — not in the Finale tablet app.</b>'+
    '<div class="sm" style="margin-top:4px">If a move goes in both, Finale counts it twice '+
    'and next week is planned against the wrong figure. ⛔ <b>Half here and half there is '+
    'worse than doing it all the old way</b> — if this app will not work, stop and tell Jack '+
    'rather than switching back partway. <a href="./how.html" style="color:inherit;'+
    'display:inline-block;min-height:44px;line-height:44px">How this '+
    'works →</a></div></div>'+
    heldLine()+
    '<div class="card"><div class="pad">'+
    '<h2>Is this week the right size?</h2><div>'+
    chip('Bays to open', t.bays) + chip('Pallets down', t.pallets_down) +
    chip('Units to the floor', Math.round(units)) +
    chip('Rearranging', asides.length + ' SKU') +
    chip('Retrieval', hrs(t.retrieval_min)) + chip('Counting', hrs(t.count_min)) +
    chip('SKU-lots to count', (PAYLOAD.bays.reduce((s,b)=>s+b.pallets.reduce((q,p)=>q+p.lines.filter(l=>l.kind==='count').length,0),0))) +
    '</div></div></div>';

  if(orph.length){
    h += '<div class="warnbox"><b>⚠️ '+orph.length+' planned pull(s) may have moved</b>'+
      '<div class="sm dim" style="margin-top:6px">The plan was built from an earlier snapshot. '+
      'These are still in the work list — take them if they are there, or mark not found.</div>'+
      orph.map(o=>'<div class="sm" style="margin-top:8px">• <b>'+esc(o.sku)+'</b> ×'+n(o.planned_qty)+
        ' from '+esc(o.from_location)+'</div>').join('')+'</div>';
  }

  h += section('To the floor — or we run out', takes, 'take');
  h += section('Rearranging for later — optional', asides, 'aside');

  a.innerHTML = h;

  const btn = $('#mainbtn');
  btn.textContent = opened === allLines.length && allLines.length
    ? 'Start bay 1' : 'Approve rest as planned · start bay 1';
  btn.onclick = () => {
    if(!S.started){ S.started = new Date().toISOString(); ev('session_start'); }
    S.screen = 'bay'; S.bay = 0; ev('bay_open', {bay: PAYLOAD.bays[0].bay}); save(); render();
  };
  $('#sub').textContent = opened + ' of ' + allLines.length + ' opened — the rest go in as planned';
}
function chip(k,v){ return '<span class="chip"><b>'+esc(v==null?'—':v)+'</b> '+esc(k)+'</span>'; }
function hrs(m){ return m ? (Math.round(Number(m)/6)/10) + ' h' : '—'; }
function section(title, rows, kind){
  if(!rows.length) return '';
  const sorted = rows.slice().sort((x,y)=>Number(y.l.planned_qty||0)-Number(x.l.planned_qty||0));
  return '<div class="card"><div class="pad"><h3>'+esc(title)+' <span class="dim sm">('+rows.length+')</span></h3></div>'+
    '<div class="body">'+sorted.map(x=>{
      const s = st(x.id); const q = s && s.approved!=null ? s.approved : x.l.planned_qty;
      const changed = s && s.approved!=null && Number(s.approved)!==Number(x.l.planned_qty);
      return '<div class="ln" onclick="openWhy(\''+x.id+'\')">'+
        '<span class="tag t-'+kind+'">'+(S.opened[x.id]?'✓':'?')+'</span>'+
        '<div class="grow"><div class="sku">'+esc(x.l.sku)+'</div>'+
        '<div class="sub">'+esc(x.l.desc||'')+' · '+esc(x.p.loc)+'</div></div>'+
        '<div class="qty" style="'+(changed?'color:var(--aside)':'')+'">'+n(q)+'</div></div>';
    }).join('')+'</div></div>';
}
function openWhy(id){
  const f = find(id); if(!f) return;
  const l = f.l, w = l.why || {};
  S.opened[id] = true; ev('review_open', {line:id}); save();
  const s = st(id); const cur = s && s.approved!=null ? s.approved : l.planned_qty;
  dlg('Why ' + l.sku + '?',
    '<table>'+
      row('On F1 now', w.on_f1_now) + row('Target', w.target) +
      row('Cover after this pull', w.cover_after ? w.cover_after+' wk' : '') +
      row('Source pallet', f.p ? f.p.loc : (l.from_location||'')) +
      row('Lot', l.lot) + row('On that pallet', l.system_qty) +
      row('Destination', l.dest) + row('FIFO note', w.fifo) +
      (l.kind==='aside' ? row('Goes onto pallet',
                              l.onto_pallet + ' (bay ' + l.onto_bay +
                              (l.cross ? ' · ' + (l.onto_lane||'') + ' — CROSS-LANE, a '
                                       + 'different bay later in the shift' : '') + ')') : '')+
    '</table>'+
    '<div style="margin-top:14px"><b>Approve a different amount?</b>'+
    '<div class="sm dim">Planned '+n(l.planned_qty)+'. Changing it here records your INTENT, '+
    'which is kept apart from what physically moves.</div>'+

    qtyField('apq', n(cur)) + '</div>',
    [{t:'Cancel', c:'ghost'},
     {t:'Save', c:'pri', f:()=>{
        const v = readQty('apq');
        if(v === null){ toast('⛔ not a quantity'); return false; }
        setLine(id, {approved:v, approved_explicitly:true});
        ev('approve', {line:id, approved:v}); render(); }}]);
}
function row(k,v){ return (v===''||v==null) ? '' : '<tr><td class="dim">'+esc(k)+'</td><td class="num">'+esc(v)+'</td></tr>'; }
function find(id){
  for(const b of PAYLOAD.bays){
    for(const p of b.pallets){
      for(let i=0;i<p.lines.length;i++) if(lid(b.n,p.loc,p.lines[i],i)===id) return {b:b,p:p,l:p.lines[i],i:i};
    }
    for(let i=0;i<(b.orphan_pulls||[]).length;i++){
      const o=b.orphan_pulls[i]; if(lid(b.n,'ORPHAN',o,i)===id) return {b:b,p:null,l:o,i:i};
    }
  }
  return null;
}

function jobProgress(){
  let done = 0, total = 0;
  PAYLOAD.bays.forEach(b => {
    b.pallets.forEach(p => p.lines.forEach((l,i) => {
      if(!isActionable(l)) return;
      total++;
      if(isFinished(st(lid(b.n, p.loc, l, i)))) done++;
    }));
    
    (b.orphan_pulls || []).forEach((o,i) => {
      total++;
      if(isFinished(st(lid(b.n, 'ORPHAN', o, i)))) done++;
    });
  });
  return {done: done, total: total, pct: total ? Math.round(done / total * 100) : 0};
}

function goBay(d){
  if(S.screen !== 'bay'){ S.screen = 'bay'; }
  const nx = S.bay + d;
  if(nx < 0 || nx >= PAYLOAD.bays.length) return;
  S.bay = nx;
  ev('bay_open', {bay: PAYLOAD.bays[nx].bay, via: 'nav'});
  save(); window.scrollTo(0,0); render();
}

function renderBay(a){
  const b = PAYLOAD.bays[S.bay];
  if(!b){ S.screen='done'; save(); return render(); }
  const jp = jobProgress();
  
  $('#hdr').textContent = bayTitle(b.bay, jp.pct);
  $('#hdr').title = 'Bay ' + b.bay + ' · ' + jp.pct + '% of the whole job';

  const gaps = b.deepest - b.pallets.length;
  $('#sub').textContent = 'Step ' + b.n + ' of ' + PAYLOAD.bays.length +
      ' · dig to position ' + b.deepest + ' · ' + b.pallets.length + ' pallets hold stock' +
      (gaps > 0 ? ' (' + gaps + ' position' + (gaps>1?'s are':' is') + ' empty)' : '') +
      ' · ' + (jp.total - jp.done) + ' of ' + jp.total + ' lines left overall';
  
  $('#progbar').style.width = jp.pct + '%';
  navArrows();

  let h = heldLine() + closedBox(b);
  if((b.orphan_pulls||[]).length){
    h += '<div class="warnbox"><b>⚠️ Planned here, but may have moved</b>' +
      (b.orphan_pulls||[]).map((o,i)=>{
        const id = lid(b.n,'ORPHAN',o,i), s = st(id);
        return '<div class="ln" style="border:0;padding-left:0">'+
          '<div class="grow"><div class="sku">'+esc(o.sku)+'</div>'+
          '<div class="sub">'+esc(o.from_location)+' → '+esc(o.dest)+'</div></div>'+
          '<div class="qty">'+n(o.planned_qty)+'</div>'+
          '<button onclick="orphanDone(\''+id+'\',true)" class="'+(s&&s.state==='done'?'ok':'')+'">Took it</button>'+
          '<button onclick="orphanMissing(\''+id+'\')" class="'+(s&&s.state==='missing'?'warn':'')+'">Not here</button>'+
          '</div>';
      }).join('') + '</div>';
  }

  b.pallets.forEach(p => { h += pallet(b, p); });
  h += putbackCard(b);
  a.innerHTML = h;

  const allDone = b.pallets.every(p => (S.pallets[p.loc]||{}).done);
  const pb = (S.bays[b.n]||{}).putback_done;
  const btn = $('#mainbtn');
  const wasClosed = !!(S.bays[b.n]||{}).closed;

  const advance = () => {
    ev('bay_close', {bay:b.bay});

    S.bays[b.n] = Object.assign(S.bays[b.n]||{},
                                {closed:true, closed_ts:new Date().toISOString()});
    S.bay++;
    if(S.bay >= PAYLOAD.bays.length) S.screen = 'done';
    else ev('bay_open', {bay:PAYLOAD.bays[S.bay].bay});
    save(); window.scrollTo(0,0); render();
  };
  const openLines = () => {
    const out = [];
    b.pallets.forEach(p => p.lines.forEach((l,i) => {
      const id = lid(b.n, p.loc, l, i);
      if(isActionable(l) && !isFinished(st(id))) out.push({id:id, l:l, loc:p.loc});
    }));

    (b.orphan_pulls || []).forEach((o,i) => {
      const id = lid(b.n, 'ORPHAN', o, i);
      if(!isFinished(st(id))) out.push({id:id, l:o, loc:o.from_location || 'ORPHAN'});
    });
    return out;
  };
  
  const settleStays = () => {
    b.pallets.forEach(p => p.lines.forEach((l,i) => {
      if(isActionable(l)) return;
      const id = lid(b.n, p.loc, l, i);
      if(!isFinished(st(id))) setLine(id, {state:'done', as_planned:true, no_action:true});
    }));
  };

  if(wasClosed){
    const nxt = S.bay + 1 < PAYLOAD.bays.length
              ? 'go to ' + PAYLOAD.bays[S.bay+1].bay : 'finish';
    btn.className = 'big ok';
    btn.textContent = 'Already closed · ' + nxt;
    btn.onclick = () => {
      S.bay++;
      if(S.bay >= PAYLOAD.bays.length) S.screen = 'done';
      else ev('bay_open', {bay:PAYLOAD.bays[S.bay].bay});
      save(); window.scrollTo(0,0); render();
    };
  } else if(!pb){
    const left = openLines().length;
    btn.className = 'big warn';
    btn.textContent = left ? 'Putback — ' + left + ' line(s) not done'
                           : 'Putback — load ' + b.putback.length + ' pallet(s) back';
    btn.onclick = () => { const c = document.getElementById('pbcard');
                          if(c) c.scrollIntoView({behavior:'smooth'}); };
  } else {
    const left = openLines();
    const nxt = S.bay + 1 < PAYLOAD.bays.length ? 'go to ' + PAYLOAD.bays[S.bay+1].bay : 'finish';
    btn.className = left.length ? 'big warn' : 'big ok';
    btn.textContent = left.length ? 'Close bay — ' + left.length + ' not done · ' + nxt
                                  : 'Close bay · ' + nxt;
    btn.onclick = () => {

      if(!left.length){ settleStays(); return advance(); }
      dlg('Close ' + b.bay + ' with ' + left.length + ' line(s) not done?',
        '<p class="dim">These will be recorded as <b>skipped</b> — we did not do them. '+
        '⛔ That is different from "the stock was not there", and nothing will be '+
        'corrected in Finale.</p>'+
        '<div class="sm" style="margin:10px 0">'+
          left.slice(0,10).map(x=>'• <b>'+esc(x.l.sku)+'</b> <span class="dim">'+
            esc(x.l.kind)+' · '+esc(x.loc)+'</span>').join('<br>')+
          (left.length>10?'<br><span class="dim">…and '+(left.length-10)+' more</span>':'')+
        '</div>'+
        whyPicker(),
        [{t:'Go back',c:'ghost'},
         {t:'Record and close',c:'warn',f:()=>{
            const r = whyRead(); if(r === false) return false;
            left.forEach(x => skipLine(x.id, r.why, r.typed));
            settleStays();
            b.pallets.forEach(p => { S.pallets[p.loc] =
              Object.assign(S.pallets[p.loc]||{}, {done:true, open:false}); });
            ev('bay_closed_incomplete', {bay:b.bay, skipped:left.length,
                                         why:r.why, typed:r.typed});
            save(); advance(); }}], whyWire);
    };
  }
}

function pallet(b, p){
  const ps = S.pallets[p.loc] || {};

  const open = !!ps.open;
  const groups = {};
  p.lines.forEach((l,i) => { (groups[l.kind] = groups[l.kind] || []).push({l:l, i:i}); });
  const counts = ORDER.filter(k=>groups[k]).map(k => groups[k].length + ' ' +
      (k==='take'?'to floor':k==='aside'?'set aside':k==='count'?'to count':'stay')).join(' · ');

  const todo = p.lines.filter(x => isActionable(x)).length;
  const seen = new Map();
  p.lines.forEach(x => {
    const k = (x.sku||'') + '|' + (x.lot||'');
    if(!seen.has(k)) seen.set(k, Number(x.system_qty||0));
  });
  const units = [...seen.values()].reduce((t,v) => t + v, 0);
  const head = (todo ? todo + ' to do' : 'nothing to do') + ' · ' + seen.size +
               ' SKU on it · ' + n(units) + ' units';

  let h = '<div class="card"><div class="ph" onclick="togglePallet(\''+p.loc+'\')">'+
    '<span class="tag '+(ps.done?'t-stay':'t-take')+'">'+(ps.done?'✓':'pos '+p.pos)+'</span>'+
    '<div class="grow"><b>'+esc(p.loc)+'</b>'+
      (p.pallet_id ? ' <span class="tag t-count">card '+esc(cardOf(p))+'</span>' : '')+
      '<small><b>'+esc(head)+'</b></small>'+
      '<small>'+esc(counts)+
      (p.spoil?' · <b>SPOIL — nothing to take, goes straight back</b>':'')+'</small></div>'+
    '<span class="dim">'+(open?'▾':'▸')+'</span></div>';
  if(open){

    const arriving = arrivalsFor(p.pallet_id);
    const coming = arriving.filter(x => !x.gone);

    const xd = (b.cross_in || []).filter(m => m.onto_pallet === p.pallet_id && m.dest_over_deck);
    if(arriving.length){
      h += '<div class="pad" style="border-top:1px solid var(--line);padding-bottom:0">'+
        (xd.length ? '<div class="warnbox" style="margin:0 0 8px;border-color:var(--bad)">'+
          '<b>⚠️ This pallet may not hold all of it.</b><div class="sm" style="margin-top:4px">'+
          'Estimated <b>'+xd[0].dest_total_m3.toFixed(2)+' m³</b> once everything is on, '+
          'against a <b>'+xd[0].dest_deck_m3.toFixed(2)+' m³</b> deck. Load what fits, '+
          'oldest lots first. ⛔ Do NOT force it — leave the remainder on the floor and '+
          'record it, so the next plan knows where the stock actually is.</div></div>' : '')+
        '<div class="warnbox" style="margin:0 0 10px"><b>⊕ '+coming.length+
        ' goes ON this pallet before it goes back up</b>'+
        (arriving.length !== coming.length
          ? '<div class="sm dim" style="margin-top:2px">('+
            (arriving.length - coming.length)+' more was planned and is not coming — below)</div>'
          : '')+
        arriving.map(arrivalLine).join('')+
        '</div></div>';
    }
    if(p.pallet_id){
      h += '<div class="pad" style="border-top:1px solid var(--line);padding-bottom:0">'+
        '<div class="okbox" style="margin:0 0 10px"><b>① Put temporary card '+
        esc(cardOf(p))+' on this pallet now.</b>'+
        '<div class="sm dim" style="margin-top:4px">It came from '+esc(p.loc)+'. '+
        (p.goes_back_to
          ? 'When it goes back up it gets the Finale placard <b>'+esc(p.goes_back_to)+'</b> '+
            '— that may not be where it came from.'
          : '⛔ <b>This one does NOT go back up</b> — everything moves off it and the deck '+
            'is freed. Leave it empty.')+
        '</div></div></div>';
    }
    h += '<div class="body">';
    ORDER.forEach(k => {
      if(!groups[k]) return;
      h += '<div class="grp">'+esc(LABEL[k])+' — '+groups[k].length+'</div>';
      groups[k].forEach(g => { h += line(b, p, g.l, g.i); });
    });
    h += '</div><div class="pad row">'+
      '<button class="ok" onclick="allAsPlanned(\''+p.loc+'\')">✓ All as planned</button>'+

      (groups.count ? (() => {
         const left = groups.count.filter(g => !isFinished(st(lid(b.n, p.loc, g.l, g.i)))).length;
         return left ? '<button onclick="chainCounts(\''+p.loc+'\')">⊙ Count these '+left+
                       '</button>'
                     : '<button disabled>⊙ '+groups.count.length+' counted</button>';
       })() : '')+
      '<button onclick="skipRest(\''+p.loc+'\')">↷ Skip the rest</button>'+
      '</div>';
  }
  return h + '</div>';
}

function line(b, p, l, i){
  const id = lid(b.n, p.loc, l, i), s = st(id);
  const done = isFinished(s);
  const skipped = s && s.state === 'skipped';
  const q = s && s.actual != null ? s.actual
          : (s && s.approved != null ? s.approved : l.planned_qty);

  const onPallet = n(l.system_qty);
  let sub = '';
  if(l.kind === 'take')  sub = '→ ' + esc(l.dest || 'F1');

  if(l.kind === 'aside') sub = '→ pallet ' + esc(l.onto_card || cardOf(l.onto_pallet)) +
                               (l.cross
                                 ? ' in <b>bay '+l.onto_bay+' · '+esc(l.onto_lane||'')+
                                   '</b> — keep it on the floor until then'
                                 : (l.onto_bay!==b.n?' (bay '+l.onto_bay+')':'')) +
                               (l.after_take?' · the REMAINDER after the pick':'') + ' · do NOT reload here';
  if(l.kind === 'count') sub = 'serial ' + esc(l.serial) + ' · system says ' + n(l.system_qty);
  if(l.kind === 'stay')  sub = 'reload as it was';
  const note = s && s.reason ? ' · <b style="color:var(--aside)">'+esc(s.reason||'')+'</b>' : '';
  const mark = skipped ? '↷' : (s && s.state === 'missing') ? '∅' : '✓';
  return '<div class="ln '+(done?'done':'')+'">'+
    '<span class="tag t-'+l.kind+'">'+(done?mark:l.kind==='take'?'▼':l.kind==='aside'?'⇢':l.kind==='count'?'⊙':'—')+'</span>'+
    '<div class="grow" onclick="openLine(\''+id+'\')">'+
      '<div class="sku">'+esc(l.sku)+(l.lot?' <span class="dim sm">'+esc(l.lot)+'</span>':'')+
        ' <span class="dim sm">· '+onPallet+' on this pallet</span></div>'+
      '<div class="sub">'+esc(l.desc||'')+'</div>'+
      '<div class="sub">'+sub+note+'</div></div>'+
    (l.kind==='stay'||l.kind==='count' ? '' : '<div class="qty">'+n(q)+'</div>')+
    (l.kind==='count' ? '<button onclick="doCount(\''+id+'\')">'+(done?mark:'Count')+'</button>'
                      : '<button onclick="openLine(\''+id+'\')">'+(done?mark:'…')+'</button>')+
    '</div>';
}

function togglePallet(loc){
  const ps = S.pallets[loc] = S.pallets[loc] || {};

  ps.open = !ps.open;
  Object.keys(S.pallets).forEach(k => { if(k !== loc) S.pallets[k].open = false; });
  if(ps.open) ev('pallet_open', {pallet:loc}); else ev('pallet_close', {pallet:loc});
  save(); render();
}
function allAsPlanned(loc){
  const f = PAYLOAD.bays[S.bay].pallets.find(p => p.loc === loc);
  f.lines.forEach((l,i) => {
    const id = lid(PAYLOAD.bays[S.bay].n, loc, l, i);
    if(l.kind === 'count') return;        
    const s = st(id);
    if(isFinished(s)) return;

    if(!isActionable(l)){ setLine(id, {state:'done', as_planned:true, no_action:true}); return; }
    setLine(id, {state:'done', actual: (s && s.approved!=null) ? s.approved : l.planned_qty,
                 as_planned:true});
  });
  ev('all_as_planned', {pallet:loc});
  const left = f.lines.filter((l,i) => l.kind==='count' &&
      !(st(lid(PAYLOAD.bays[S.bay].n,loc,l,i))||{}).state).length;
  if(left){ toast(left + ' cycle count(s) still to do on this pallet'); }
  else { S.pallets[loc] = Object.assign(S.pallets[loc]||{}, {done:true, open:false}); }
  save(); render();
}
function maybeDone(loc){
  const f = PAYLOAD.bays[S.bay].pallets.find(p => p.loc === loc);
  const all = f.lines.every((l,i) => { const s = st(lid(PAYLOAD.bays[S.bay].n,loc,l,i));
    return isFinished(s); });
  if(all){ S.pallets[loc] = Object.assign(S.pallets[loc]||{}, {done:true, open:false}); }
  save();
}

function openLine(id){
  const f = find(id); if(!f) return;
  const l = f.l, s = st(id) || {};

  if(l.kind === 'count'){ doCount(id, []); return; }

  const prev = s || {};

  const planned = (prev.state !== 'skipped' && prev.state !== 'missing' && prev.actual != null)
                ? prev.actual
                : (s.approved != null ? s.approved : l.planned_qty);
  if(l.kind === 'stay'){
    const prevStay = s || {};
    return dlg('Stays — ' + l.sku + (l.lot ? ' · lot ' + l.lot : ''),
      '<p class="dim">Nothing to do: reload this exactly as it was.</p>'+
      '<p class="sm dim">Finale says <b>'+n(l.system_qty)+'</b> on this pallet. If that is wrong, '+
      'correct it — a pallet that is already open is the cheapest time to fix a count.</p>'+
      '<label class="sm dim">Actually on the pallet</label>'+
      qtyField('q1', n(prevStay.left != null ? prevStay.left : l.system_qty))+
      '<div id="scalc" class="sm dim" style="margin-top:8px">Change the number to record a '+
      'correction.</div>',
      [{t:'Cancel',c:'ghost'},
       {t:'Correct the count',c:'warn',f:()=>{
          const v=readQty('q1');
          if(v===null){ toast('⛔ not a quantity'); return false; }
          const adj = v - onPallet(f.b, f.p, l.sku, l.lot);    

          if(Math.abs(adj) < 0.001){
            setLine(id,{state:'done', as_planned:true});
            ev('line_done',{line:id}); maybeDone(f.p.loc); render(); return; }

          const sel = $('#sreason');
          if(!sel || sel.value === '__none__'){
            toast('⛔ pick a reason — this is a Finale stock correction');
            return false; }
          setLine(id,{state:'done', left:v, adjustment:adj, corrected:true,
                      reason:sel.value, direction: adj<0 ? 'shrink' : 'found'});
          ev('qty_corrected',{line:id, was:l.system_qty, now:v, adjustment:adj});
          maybeDone(f.p.loc); render(); }},
       {t:'It is right',c:'ok',f:()=>{ setLine(id,{state:'done', as_planned:true});
          ev('line_done',{line:id}); maybeDone(f.p.loc); render(); }}],
      () => {
        const upd = () => {
          const v = Number($('#q1').value) || 0,
                adj = v - onPallet(f.b, f.p, l.sku, l.lot);      
          const c = $('#scalc'); if(!c) return;
          if(Math.abs(adj) < 0.001){
            c.innerHTML = 'No change — this will just confirm the count.'; return; }
          const list = adj < 0 ? PAYLOAD.shrink_reasons : PAYLOAD.found_reasons;

          const ph = list.length > 1
            ? '<option value="__none__" selected>— choose a reason —</option>' : '';
          c.innerHTML = '<div class="warnbox"><b>'+(adj<0?'Short by '+n(-adj)
                          :'Found '+n(adj)+' extra')+'</b>'+

            '<div class="sm dim" style="margin:6px 0">A Finale '+
            (adj<0?'decrease':'increase')+' at '+
            esc(adjLoc(f.p, l, !(S.bays[f.b.n]||{}).putback_done, floorDown(f.p))
                || (f.p?f.p.loc:'this pallet'))+'.</div>'+
            '<select id="sreason">'+ph+list.map(r=>'<option value="'+esc(r)+'">'+
              esc(r)+
              '</option>').join('')+'</select></div>';
        };
        const e = $('#q1'); if(e) e.addEventListener('input', upd);
        upd();
      });
  }

  const sib = f.p ? f.p.lines.find((x,ix) =>
        ix !== f.i && x.sku === l.sku && (x.lot||'') === (l.lot||'') &&
        (x.kind === 'take' || x.kind === 'aside')) : null;
  let sibTook = 0, sibId = null, sibMissing = false;
  if(sib){
    const si = f.p.lines.indexOf(sib);
    sibId = lid(f.b.n, f.p.loc, sib, si);
    const ss = st(sibId);

    sibMissing = !!(ss && ss.state === 'missing');

    sibTook = sibShare(sib, ss);
  }

  const baseline = Math.max(0, onPallet(f.b, f.p, l.sku, l.lot) - sibTook);
  const verb = l.kind === 'take' ? 'moved to ' + (l.dest||'F1') : 'set aside onto ' + l.onto_pallet;

  dlg(l.sku + (l.lot ? ' · lot ' + l.lot : ' · no lot') + ' — planned ' + n(planned),

    (prev.state === 'missing'
      ? '<div class="badbox sm" style="margin-bottom:8px">∅ <b>Recorded as NOT HERE AT ALL</b>'+
        (prev.reason ? ' — '+esc(prev.reason) : '')+
        '<div style="margin-top:4px">Saving a quantity here replaces that write-off with what '+
        'you enter.</div></div>'
      : prev.state === 'skipped'
      ? '<div class="warnbox sm" style="margin-bottom:8px">↷ <b>Recorded as SKIPPED</b>'+
        (prev.reason ? ' — '+esc(prev.reason) : '')+'</div>' : '')+
    (sib ? '<div class="okbox sm" style="margin-bottom:8px">⭐ <b>'+esc(l.sku)+'</b> is also '+
        (sib.kind === 'take' ? 'being taken to '+esc(sib.dest||'F1')
                             : 'being set aside onto '+esc(sib.onto_card || cardOf(sib.onto_pallet)))+
        ' — <b>'+n(sibTook)+'</b> units on the other line. '+
        'So this line is only about the <b>'+n(baseline)+'</b> that are not part of that.</div>' : '')+
    '<div class="row"><div><label class="sm dim">How many '+esc(verb)+'?</label>'+
      qtyField('q1', n(planned))+'</div>'+

      '<div><label class="sm dim">Of those '+n(baseline)+', how many are LEFT on '+
        esc(palletLabel(f.p))+'?</label>'+
      qtyField('q2', n(prev.left != null ? prev.left : Math.max(0, baseline - Number(planned))))+
      '</div></div>'+
    '<div class="sm dim" style="margin-top:8px">'+
    (sib ? 'Finale says <b>'+n(l.system_qty)+'</b> on this pallet, <b>'+n(sibTook)+
           '</b> of which is the other line — so <b>'+n(baseline)+'</b> belongs to this one. '
         : 'Finale says <b>'+n(l.system_qty)+'</b> was on this pallet. ')+
    'If moved + left does not equal that, we record the difference as a correction — '+
    'you do not have to work it out.</div>'+
    '<div id="calc" style="margin-top:10px"></div>',
    [{t:'Cancel',c:'ghost'},

     {t:'Not here at all',c:'',f:()=>{ setTimeout(() => dlg(
        'Not here at all — ' + l.sku + (l.lot ? ' · lot ' + l.lot : ''),
        '<div class="warnbox"><b>This says Finale is WRONG.</b><div class="sm" '+
        'style="margin-top:6px">Finale believes <b>'+n(l.system_qty)+'</b> of '+esc(l.sku)+
        (l.lot?' (lot '+esc(l.lot)+')':'')+' is on '+esc(f.p?f.p.loc:'this pallet')+
        (sib ? ', <b>'+n(sibTook)+'</b> of which is the other line — so this line is about '+
               'the <b>'+n(baseline)+'</b> that are not part of that' : '')+
        '. Recording this proposes a decrease of <b>'+n(baseline)+'</b>.</div></div>'+
        '<p class="sm dim">⛔ Not the same as <b>Skip</b> — skip means we did not do it and '+
        'Finale stays as it is.</p>'+

        '<label class="sm" style="margin-top:10px">Why is it not there? '+
        '<span class="dim">(this becomes the Finale code)</span></label>'+
        '<select id="nhr">'+
          ((PAYLOAD.shrink_reasons||[]).length > 1
            ? '<option value="__none__" selected>— choose a reason —</option>' : '')+
          (PAYLOAD.shrink_reasons||[]).map(x =>
            '<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')+
        '</select>',
        [{t:'Cancel',c:'ghost'},
         {t:'Yes — it is not there',c:'warn',f:()=>{
            const rsn = ($('#nhr')||{}).value;
            if(!rsn || rsn === '__none__')
              return toast('⛔ pick a reason — it becomes a Finale accounting code');
            setLine(id,{state:'missing', actual:0, reason:rsn,
                        baseline:baseline, sibling_took:sibTook});
            ev('line_missing',{line:id, reason:rsn}); maybeDone(f.p.loc); render(); }}]), 0); }},
      
     {t:'Skip',c:'',f:()=>{ setTimeout(() => skipLine(id), 0); }},
     {t:'Save',c:'pri',f:()=>{

        const mv=readQty('q1'), lf=readQty('q2');
        if(mv==null||lf==null) return toast('⛔ fill in both numbers');
        const adj = (mv + lf) - baseline;      

        if(mv === 0 && Math.abs(adj) < 0.001 && isActionable(l)){
          toast('nothing moved and nothing missing — recording this as NOT DONE');
          setTimeout(() => skipLine(id), 0);   
          return;
        }
        let adj2 = adj;
        const rl = $('#realloc');

        const realloc = (rl && rl.value === 'yes') ? adj : 0;
        if(realloc) adj2 = 0;

        if(realloc > 0 && sibId){
          const ss = st(sibId) || {};
          const had = Number(ss.actual != null ? ss.actual : sibTook) || 0;
          const now = Math.max(0, Math.round((had - realloc) * 1000) / 1000);

          const sprev = st(sibId) || {};
          let sPlace = sprev.placements;
          if(sPlace && sPlace.length){
            let owe = realloc;
            sPlace = sPlace.map(x => Object.assign({}, x)).reverse();
            for(const x of sPlace){
              if(owe <= 0) break;
              const cut = Math.min(owe, Number(x.qty||0));
              x.qty = Number(x.qty||0) - cut; owe -= cut;
            }
            sPlace = sPlace.reverse().filter(x => Number(x.qty||0) > 0.001);
            if(owe > 0.001){ sPlace = undefined;
              toast('⚠️ the other line was split — say again where its stock went'); }
          }
          setLine(sibId, {state:'done', actual:now, gave_to_sibling:realloc,
                          placements: sPlace,
                           
                          reason: (sprev.state === 'missing') ? undefined : sprev.reason,
                          was_missing: (sprev.state === 'missing') ? true : undefined,

                          reallocated:true,
                          as_planned:false});
          ev('reallocated', {from:sibId, to:id, units:realloc});
          toast('✓ ' + n(realloc) + ' moved from the other line — it now shows ' + n(now));
        }

        const qtyMoved = !prev || prev.actual == null ||
                         Math.abs(mv - Number(prev.actual)) > 0.001;
        const hadPlacements = !!(prev && prev.placements && prev.placements.length);

        const keepRealloc = !realloc && prev && prev.took_from_sibling &&
                            Math.abs(mv - (prev.actual != null ? prev.actual : mv)) < 0.001;
        const patch = {state:'done', actual:mv, left:lf, adjustment:adj2,
                       baseline:baseline, sibling_took:sibTook,
                       placements: qtyMoved ? undefined : prev.placements,
                       took_from_sibling: realloc || (keepRealloc ? prev.took_from_sibling : undefined),
                       sibling_line: realloc ? (sib.onto_pallet || sib.dest || '')
                                             : (keepRealloc ? prev.sibling_line : undefined)};

        if(Math.abs(adj2) <= 0.001){ patch.reason = undefined; patch.direction = undefined; }

        patch.to_temp = undefined; patch.from_temp = undefined;

        const ft = $('#fromtemp');
        if(adj2 > 0.001 && ft && ft.value !== '__no__' && tempLoc()){

          const tlot = ft.value;
          const avail = tempAvailable(l.sku, tlot);
          patch.from_temp = Math.round(Math.min(adj2, avail) * 1000) / 1000;
          patch.temp_sku = l.sku; patch.from_temp_lot = tlot;
          patch.adjustment = Math.round((adj2 - patch.from_temp) * 1000) / 1000;
          if(Math.abs(patch.adjustment) <= 0.001){
            patch.adjustment = 0; patch.reason = undefined; patch.direction = undefined; }
        }
        const sact = $('#shortact');
        if(adj2 < -0.001 && sact && sact.value === 'temp' && tempLoc()){
          patch.to_temp = Math.round(-adj2 * 1000) / 1000;

          patch.temp_sku = l.sku; patch.temp_lot = l.lot || '';
          patch.adjustment = 0; patch.reason = undefined; patch.direction = undefined;
        } else if(Math.abs(adj2) > 0.001){
          const sel = $('#rsn');
          if(sel && sel.value === '__none__'){
            toast('⛔ pick a reason — it becomes a Finale accounting code');
            return false;                      
          }
          patch.reason = sel ? sel.value : '';
          patch.direction = adj2 < 0 ? 'shrink' : 'found';
        }
        setLine(id, patch);
        if(hadPlacements && qtyMoved)
          toast('⚠️ the quantity changed — say again where it went');
        ev('line_done',{line:id, actual:mv, left:lf, adjustment:adj2, realloc:realloc||0,
                        cleared_placements:hadPlacements||undefined});
        if(realloc){
          const sp2 = st(sibId) || {};
          toast('Recorded — ' + n(realloc) + ' taken from the other line, no correction' +
                (sp2.was_missing ? ' ⚠️ and the other line is no longer marked "not here"'
                                 : ''));
        }
        maybeDone(f.p.loc); render(); }},

     ...((f.l.kind === 'aside') ? [{t:'Save — but it did not all fit', c:'', f:()=>{
        const mv = readQty('q1'), lf = readQty('q2');
        if(mv == null) return toast('⛔ how many did you move?') && false;
        const adj = (mv + (lf==null?0:lf)) - baseline;
        const patch = {state:'done', actual:mv, left:lf, adjustment:adj,
                       baseline:baseline, sibling_took:sibTook};
        if(Math.abs(adj) > 0.001){
          const sel = $('#rsn');
          if(sel && sel.value === '__none__'){
            toast('⛔ pick a reason — it becomes a Finale accounting code'); return false; }
          patch.reason = sel ? sel.value : '';
          patch.direction = adj < 0 ? 'shrink' : 'found';
        }
        setLine(id, patch);
        ev('line_done',{line:id, actual:mv, left:lf, adjustment:adj, didnt_fit:true});
        maybeDone(f.p.loc);
        setTimeout(()=>askSplit(id), 0);
     }}] : [])],
    ()=>{ 
      const upd = ()=>{
        const mv=Number($('#q1').value)||0, lf=Number($('#q2').value)||0;
        const adj=(mv+lf)-baseline; const c=$('#calc');
        if(Math.abs(adj)<0.001){ c.innerHTML='<div class="okbox sm">Adds up — nothing to correct.</div>'; return; }

            '<div class="okbox"><b>That is '+n(adj)+' more than this line\'s share.</b>'+
            '<div class="sm" style="margin:6px 0">Did you take it out of the other line — '+
            esc(l.sku)+' '+(sib.kind==='take' ? 'going to '+esc(sib.dest||'F1')
                                              : 'set aside onto '+esc(sib.onto_card || cardOf(sib.onto_pallet)))+
            ', which was down for <b>'+n(sibTook)+'</b>?</div>'+
            '<select id="realloc">'+

              '<option value="yes" selected>Yes — from the other line (no correction)</option>'+
              '<option value="no">No — there really was '+n(adj)+' more on the pallet</option>'+
            '</select></div>';
          return;
        }
        const list = adj<0 ? PAYLOAD.shrink_reasons : PAYLOAD.found_reasons;

        const ph = list.length > 1
          ? '<option value="__none__" selected>— choose a reason —</option>' : '';
        c.innerHTML = '<div class="warnbox"><b>'+(adj<0?'Short by '+n(-adj):'Found '+n(adj)+' extra')+'</b>'+

          '<div class="sm dim" style="margin:6px 0">We will record '+

          (adj<0
            ? 'a decrease at <b>'+esc(adjLoc(f.p, l, !(S.bays[f.b.n]||{}).putback_done,
                                              floorDown(f.p)) || (f.p?f.p.loc:'source'))+
              '</b> — where Finale believes it is now'
            : 'an increase at <b>'+esc(adjLoc(f.p, l, !(S.bays[f.b.n]||{}).putback_done,
                                              floorDown(f.p)) || (f.p?f.p.loc:'source'))+
              '</b> — where the extra stock physically is')+

          (adj > 0 && tempLoc() && tempLots(l.sku).length

                tempLots(l.sku).map(r =>
                  '<option value="'+esc(r.lot)+'"'+
                  ((r.lot || '') === (l.lot || '') ? ' selected' : '')+'>Yes — '+

                '<option value="__no__">No — this is genuinely extra stock</option>'+

            : '')+
          (adj < 0 && tempLoc()

              '<select id="shortact">'+

        const sa = $('#shortact'), rw = $('#rsnwrap');
        if(sa && rw) sa.onchange = () => { rw.hidden = (sa.value !== 'writeoff'); };
      };
      $('#q1').addEventListener('input',upd); $('#q2').addEventListener('input',upd); upd();
    });
}

const SKIP_WHY = [
  'ran out of time',
  'pallets had to go back up',
  'no room on the destination',
  'too heavy / awkward',
  'doing it later today',
];
const WHY_OTHER = '__type_it';
function whyPicker(){
  return '<label class="sm dim">Why?</label>'+
    '<select id="skw">'+
      SKIP_WHY.map(r => '<option value="'+esc(r)+'">'+esc(r)+'</option>').join('')+
      '<option value="'+WHY_OTHER+'">something else — let me type it</option>'+
    '</select>'+
    '<div id="skwo" style="display:none;margin-top:10px">'+
      '<label class="sm dim">In your own words — what stopped it?</label>'+
      '<input id="skwt" type="text" maxlength="140" autocomplete="off" '+
        'placeholder="e.g. the pallet was shrink-wrapped to the rack">'+
    '</div>';
}

function whyWire(){
  const s = $('#skw'), box = $('#skwo'), t = $('#skwt');
  if(!s || !box) return;
  s.onchange = () => {
    const other = (s.value === WHY_OTHER);
    box.style.display = other ? '' : 'none';
    if(other && t) t.focus();
  };
}

function whyRead(){
  const s = $('#skw');
  if(!s) return {why:'skipped', typed:false};
  if(s.value !== WHY_OTHER) return {why:s.value, typed:false};
  const t = $('#skwt'), v = ((t && t.value) || '').trim();
  if(!v){ toast('⛔ Type what stopped it — or pick one of the reasons above.');
          if(t) t.focus(); return false; }
  return {why:v, typed:true};
}

function skipLine(id, bulk, typed){
  const f = find(id); if(!f) return;
  const done = () => { if(!bulk){ maybeDone(f.p ? f.p.loc : ''); render(); } };

  if(bulk){ setLine(id, {state:'skipped', actual:0, reason:bulk,
                         reason_source:(typed ? 'typed' : 'picked')});
            ev('line_skipped',{line:id, why:bulk, typed:!!typed}); return; }
  dlg('Skip ' + f.l.sku + '?',
    '<p class="dim">This records that you DID NOT do it — not that the stock is missing. '+
    'Nothing will be transferred and Finale will not be corrected.</p>'+
    whyPicker(),
    [{t:'Cancel',c:'ghost'},
     {t:'Skip it',c:'warn',f:()=>{ const r = whyRead(); if(r === false) return false;
        setLine(id,{state:'skipped', actual:0, reason:r.why,
                    reason_source:(r.typed ? 'typed' : 'picked')});
        ev('line_skipped',{line:id, why:r.why, typed:r.typed}); done(); }}], whyWire);
}

function skipRest(loc){
  const b = PAYLOAD.bays[S.bay];
  const p = b.pallets.find(x => x.loc === loc);
  const left = [];
  p.lines.forEach((l,i) => { const id = lid(b.n, loc, l, i);
    if(isFinished(st(id))) return;
    if(isActionable(l)) left.push({id:id, l:l});
    else setLine(id, {state:'done', as_planned:true, no_action:true});  
  });
  if(!left.length){
    S.pallets[loc] = Object.assign(S.pallets[loc]||{}, {done:true, open:false});
    save(); render();
    return toast('Nothing left to do on this pallet.');
  }
  dlg('Skip the rest of ' + loc + '?',
    '<p class="dim">'+left.length+' line(s) will be recorded as NOT DONE. The pallet still '+
    'goes back up — this only says the work on it did not happen.</p>'+
    '<div class="sm dim" style="margin:8px 0">'+
      left.slice(0,8).map(x=>'• '+esc(x.l.sku)+' <span class="dim">('+esc(x.l.kind)+')</span>').join('<br>')+
      (left.length>8?'<br>…and '+(left.length-8)+' more':'')+'</div>'+
    whyPicker(),
    [{t:'Cancel',c:'ghost'},
     {t:'Skip '+left.length,c:'warn',f:()=>{ const r = whyRead(); if(r === false) return false;
        left.forEach(x => skipLine(x.id, r.why, r.typed));
        S.pallets[loc] = Object.assign(S.pallets[loc]||{}, {done:true, open:false});
        ev('pallet_skipped',{pallet:loc, lines:left.length, why:r.why, typed:r.typed});
        save(); render(); }}], whyWire);
}
function orphanDone(id, took){

function chainCounts(loc){
  const b = PAYLOAD.bays[S.bay];
  const p = b.pallets.find(x => x.loc === loc);
  const q = [];
  p.lines.forEach((l,i)=>{ if(l.kind==='count'){ const id=lid(b.n,loc,l,i);

function doCount(id, rest){
  const f = find(id); if(!f) return;
  const l = f.l;
  dlg('Count ' + l.sku + (l.lot ? ' · lot ' + l.lot : ''),
    '<p class="sm dim">'+esc(l.desc||'')+'<br>Serial <b>'+esc(l.serial)+'</b> · on '+esc(f.p.loc)+
    '<br>Finale says <b>'+n(l.system_qty)+'</b>.</p>'+
    '<label class="sm dim">Counted</label>'+
    qtyField('cq', (st(id)||{}).counted != null ? n((st(id)||{}).counted) : '')+

    '<div id="cvar"></div>'+
    (rest && rest.length ? '<p class="sm dim" style="margin-top:8px">'+rest.length+' more on this pallet after this one.</p>' : ''),
    [{t:'Cancel',c:'ghost'},
     {t:'Matches',c:'ok',f:()=>{ setLine(id,{state:'done', counted:l.system_qty, variance:0,
                                             count_reason:undefined});
        ev('count_recorded',{line:id, counted:l.system_qty, variance:0});
        maybeDone(f.p.loc); render(); if(rest&&rest.length) setTimeout(()=>doCount(rest[0],rest.slice(1)),260); }},
     {t:'Save count',c:'pri',f:()=>{ const v=readQty('cq');
        if(v===null) return toast('⛔ enter the counted quantity');
        const vr = Math.round((v - Number(l.system_qty)) * 1000) / 1000;
        let rsn;
        if(Math.abs(vr) > 0.001){
          const sel = $('#crsn');
          if(!sel || sel.value === '__none__')
            return toast('⛔ pick a reason — a count variance is a real Finale stock change');
          rsn = sel.value;
        }
        setLine(id,{state:'done', counted:v, variance:vr, count_reason:rsn});
        ev('count_recorded',{line:id, counted:v, variance:vr, reason:rsn||''});
        maybeDone(f.p.loc); render(); if(rest&&rest.length) setTimeout(()=>doCount(rest[0],rest.slice(1)),260); }}],
    ()=>{
      const upd = () => {
        const c = $('#cvar'); if(!c) return;
        const v = readQty('cq');
        const vr = (v == null) ? 0 : Math.round((v - Number(l.system_qty)) * 1000) / 1000;
        if(Math.abs(vr) <= 0.001){ c.innerHTML = ''; return; }
        const list = vr < 0 ? (PAYLOAD.shrink_reasons || []) : (PAYLOAD.found_reasons || []);
        const cur = $('#crsn') ? $('#crsn').value : '';

        const ph = list.length > 1
          ? '<option value="__none__"'+(cur&&cur!=='__none__'?'':' selected')+'>— choose a reason —</option>' : '';
        c.innerHTML = '<div class="warnbox" style="margin-top:10px"><b>'+
          (vr < 0 ? 'Short by ' + n(-vr) : 'Found ' + n(vr) + ' extra')+'</b>'+
          '<div class="sm dim" style="margin:6px 0">Finale says '+n(l.system_qty)+'. This is a '+
          'real stock change, so it needs a reason code — the count is what corrects the books.</div>'+
          '<select id="crsn">'+ph+list.map(r=>'<option value="'+esc(r)+'"'+
            (r===cur?' selected':'')+'>'+esc(r)+'</option>').join('')+'</select></div>';
      };
      setTimeout(()=>{ const e=$('#cq'); if(e){ e.focus(); e.addEventListener('input', upd); } upd(); }, 80);
    });
}
