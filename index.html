/* ---- the Finale writer -----------------------------------------------------
   ⛔ THE EXACT IMPORT SPEC IS STILL WITH JACK (blocking question 4), so these are
   the FIELDS the transactions need, in a flat CSV, not a validated Finale
   template. ⭐ Column names are kept literal and obvious so remapping is a rename,
   never a re-derivation. */
/* ⛔⛔ A `P-` CARD IS APP-ONLY AND MUST NEVER REACH FINALE AS A LOCATION.
   The export wrote `to_location: "PALLET P-18"` for all 32 set-asides — the temporary
   laminated card, which CLAUDE.md is explicit is NOT a Finale bin ("never make these real
   Finale locations — that manufactures precisely what F9-T5 became"). A Finale import would
   reject the row or post it against a location that does not exist.
   ⭐ The real destination IS known: the receiving pallet's FINAL position, derived by
   lane_packing and carried in the putback list. Resolve it. */
function palletFinalLoc(pid){
  if(!pid) return null;
  for(const b of PAYLOAD.bays)
    for(const pb of (b.putback || []))
      if(pb.pallet_id === pid) return pb.loc;
  return null;
}

function moves(){
  const out = {transfers:[], adjustments:[], counts:[], missing:[], skipped:[]};
  PAYLOAD.bays.forEach(b => {
    /* ⛔⛔ `loc` WAS DOING TWO JOBS AND I BROKE IT BY FIXING THE OTHER ONE.
       It is BOTH the key the UI stored state under AND the location we export. Orphan state
       is written under the literal key `'ORPHAN'`; when I changed this call to pass the real
       `from_location` (to stop exporting a fake Finale bin) the LOOKUP started missing, `s`
       came back undefined, and the row was silently dropped — the crew tapped "Took it", the
       bay closed clean, and 22 units left the rack with no export at all.
       ⭐ I traded a visible-wrong-location bug for SILENT STOCK LOSS, which is strictly
       worse. Two parameters now: `key` identifies the state, `loc` is what Finale is told. */
    const push = (p, l, i, key, loc) => {
      const id = lid(b.n, key, l, i), s = S.lines[id];
      if(!s) return;
      if(s.state === 'missing'){
        /* ⛔ `missing` MEANS FINALE IS WRONG, so the row has to be able to express the
           correction — it carried `planned` but NOT `system_qty`, and the correction is
           against what Finale believes is there, not against what we hoped to take. */
        out.missing.push({bay:b.bay, from:loc, sku:l.sku, lot:l.lot||'',
          planned_qty:l.planned_qty, system_qty:l.system_qty,
          suggested_decrease:l.system_qty, note:s.reason||'not found', ts:s.ts});
        return; }
      /* ⛔ SKIPPED IS NOT A TRANSFER AND NOT AN ADJUSTMENT — it is the absence of both,
         recorded on purpose. ⭐ It still leaves the planner a fact: this line was planned,
         reached, and deliberately not done. Objective 1 says a skipped TAKE is the one
         that can cost a stockout, so it carries the planned quantity and the reason. */
      if(s.state === 'skipped'){ out.skipped.push({bay:b.bay, location:loc, sku:l.sku,
        lot:l.lot||'', kind:l.kind, planned_qty:l.planned_qty,
        approved_qty:(s.approved!=null?s.approved:l.planned_qty),
        reason:s.reason||'', ts:s.ts}); return; }
      if(l.kind === 'count' && s.counted != null){
        out.counts.push({serial:l.serial, location:loc, sku:l.sku, lot:l.lot,
          system_qty:l.system_qty, counted:s.counted, variance:s.variance, ts:s.ts});
        return;
      }
      const act = s.actual != null ? s.actual : null;
      if(act != null && act > 0){
        const dest = l.kind === 'take' ? (l.dest || '')
                                       : (palletFinalLoc(l.onto_pallet) || '');
        if(!dest){
          // ⛔ never invent one. An unresolvable destination is a row a human must look at,
          // not a row to guess — and it is exported so it cannot be lost.
          out.unresolved = out.unresolved || [];
          out.unresolved.push({bay:b.bay, from:loc, sku:l.sku, qty:act,
            onto_pallet:l.onto_pallet||'',
            why:'the receiving pallet has no final position in the putback list'});
        }
        out.transfers.push({from_location:loc,
          to_location: dest,
          onto_pallet: l.kind === 'aside' ? (l.onto_pallet||'') : '',
          sku:l.sku, lot:l.lot||'', quantity:act,
          planned_qty:l.planned_qty, approved_qty:(s.approved!=null?s.approved:l.planned_qty),
          kind:l.kind, bay:b.bay, ts:s.ts});
      }
      if(s.adjustment && Math.abs(s.adjustment) > 0.001){
        out.adjustments.push({location:loc, sku:l.sku, lot:l.lot||'',
          change:s.adjustment, direction:s.adjustment<0?'decrease':'increase',
          reason:s.reason||'', system_qty:l.system_qty,
          moved:(s.actual!=null?s.actual:0), left_on_pallet:(s.left!=null?s.left:''), ts:s.ts});
      }
    };
    b.pallets.forEach(p => p.lines.forEach((l,i) => push(p, l, i, p.loc, p.loc)));
    /* ⛔ WAS `push(..., 'ORPHAN')`, so an orphan that WAS taken exported
       `from_location: "ORPHAN"` — a location Finale does not have. The real source is
       right there on the line. */
    // ⭐ keyed 'ORPHAN' (what the UI wrote), exported at its REAL source location
    (b.orphan_pulls||[]).forEach((o,i) =>
      push(null, o, i, 'ORPHAN', o.from_location || 'ORPHAN'));
  });
  return out;
}
function csv(rows){
  if(!rows.length) return '';
  const k = Object.keys(rows[0]);
  const q = v => { v = v==null?'':String(v);
    return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  return k.join(',')+'\n'+rows.map(r=>k.map(x=>q(r[x])).join(',')).join('\n')+'\n';
}
function dl(which){
  const m = moves();
  let rows = which==='events' ? S.events : m[which];
  if(which==='events'){
    rows = S.events.map(e=>({ts:e.ts, kind:e.kind, bay:e.bay||'', pallet:e.pallet||'',
      line:e.line||'', actual:e.actual==null?'':e.actual, counted:e.counted==null?'':e.counted}));
  }
  if(!rows || !rows.length) return toast('Nothing to export in ' + which + '.');
  const blob = new Blob([csv(rows)], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'freezer_' + which + '_' + (PAYLOAD.plan_date||'') + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  ev('export', {what:which, rows:rows.length});
}

/* ============================================================================
   SYNC — results back to SharePoint, as the signed-in user
   ⛔ A ROW COUNTS AS SAVED ONLY WHEN THE SERVER ACKNOWLEDGES IT. That is receiving's
   hardest-won rule and it applies unchanged: never show "sent" on a local write.
   ⭐ THE SPLIT MATCHES THE STORE: the full per-line record is ONE JSON FILE (a list would
   cross SharePoint's 5,000-item view threshold in ~14 weeks), and the LIST gets one small
   mutable row per session — the dashboard a human actually reads.
   ============================================================================ */
function deviceId(){
  let d = null;
  try{ d = localStorage.getItem('freezer.device'); }catch(e){}
  if(!d){ d = 'ipad-' + Math.random().toString(36).slice(2,8);
          try{ localStorage.setItem('freezer.device', d); }catch(e){} }
  return d;
}
function sessionKey(){ return `${PAYLOAD.plan_date}_${deviceId()}`; }
function allBaysClosed(){
  return PAYLOAD.bays.every(b => (S.bays[b.n]||{}).closed);
}

async function graphWrite(path, body, method){
  const t = tokStore();
  if(!t) throw new Error('not signed in');
  const r = await fetch(GRAPH + path, {
    method: method || 'POST',
    headers: {Authorization: 'Bearer ' + t.access_token, 'Content-Type': 'application/json'},
    body: JSON.stringify(body)});
  if(r.status === 401){ tokStore(null); throw new Error('sign-in expired — sign in again'); }
  const j = await r.json().catch(() => null);
  if(!r.ok) throw new Error((j && (j.error||{}).message) || `HTTP ${r.status}`);
  return j;                                   // ⭐ the acknowledgement, not a local guess
}

async function syncNow(){
  let fileLanded = false;
  const btn = $('#mainbtn');
  const was = btn ? btn.textContent : '';
  if(btn){ btn.textContent = 'Syncing…'; btn.disabled = true; }
  try{
    if(!(await ensureToken())){ await signIn(); return; }   // silent refresh, else redirect
    const sp = CFG.sharepoint;
    const site = await graph(`/sites/${sp.hostname}:${sp.site_path}`);
    const m = moves();

    // 1 · the FULL record — one file, overwritten each sync for this device
    const rec = {schema: 1, plan_date: PAYLOAD.plan_date, device: deviceId(),
                 synced_at: new Date().toISOString(),
                 started: S.started, bay: S.bay, screen: S.screen,
                 lines: S.lines, pallets: S.pallets, bays: S.bays,
                 events: S.events, breaks: S.breaks, moves: m};
    const fname = `session_${sessionKey()}.json`;
    const t = tokStore();
    const up = await fetch(
      `${GRAPH}/sites/${site.id}/drive/root:/${sp.doc_folder}/${fname}:/content`,
      {method: 'PUT', headers: {Authorization: 'Bearer ' + t.access_token,
                                'Content-Type': 'application/json'},
       body: JSON.stringify(rec)});
    if(!up.ok) throw new Error(`record upload HTTP ${up.status}`);
    const upj = await up.json();
    fileLanded = true;      // ⭐ so a later failure does not claim nothing was sent

    // 2 · the SESSION ROW — upsert by Title, so re-syncing updates rather than duplicating
    const lists = await graph(`/sites/${site.id}/lists?$select=displayName,id`);
    const lst = (lists.value || []).find(x => x.displayName === sp.list_name);
    if(!lst) throw new Error(`list "${sp.list_name}" not found on ${sp.site_path}`);
    const units = m.transfers.reduce((t2,x) => t2 + Number(x.quantity||0), 0);
    const fields = {
      Title: sessionKey(), PlanDate: PAYLOAD.plan_date, Device: deviceId(),
      // ⛔ WAS `S.screen === 'done'` — so tapping ⇪ then Sync marked the SharePoint session
      // COMPLETE with a FinishedAt while every line was still outstanding.
      Status: allBaysClosed() ? 'complete' : 'in_progress',
      StartedAt: S.started || new Date().toISOString(),
      FinishedAt: allBaysClosed() ? new Date().toISOString() : null,
      Transfers: m.transfers.length, UnitsMoved: Math.round(units),
      Corrections: m.adjustments.length, Counts: m.counts.length,
      Skipped: m.skipped.length, NotFound: m.missing.length,
      RecordFile: `${sp.doc_folder}/${fname}`,
      PlanFile: `${sp.doc_folder}/plan_latest.json`};
    /* ⛔ WAS AN UNFILTERED `$top=200` SCAN. Past 200 rows it returns the OLDEST 200, the
       match is never found, and every sync POSTs a NEW item — so the UI's promise
       "re-syncing updates the same session row" silently becomes false and each mid-shift
       sync adds a duplicate. ⭐ Filter server-side; `graph()` does not page. */
    const q = encodeURIComponent(`fields/Title eq '${sessionKey()}'`);
    let hit = null;
    try{
      const found = await graph(
        `/sites/${site.id}/lists/${lst.id}/items?$expand=fields&$filter=${q}&$top=5`);
      hit = (found.value || [])[0] || null;
    }catch(e){
      // an unindexed Title column can make Graph refuse the filter — fall back, but say so
      const found = await graph(
        `/sites/${site.id}/lists/${lst.id}/items?$expand=fields&$top=999`);
      const all = (found.value || []).filter(i => (i.fields||{}).Title === sessionKey());
      hit = all[0] || null;
      if((found.value || []).length >= 999)
        toast('⚠️ the session list is large — ask for the Title column to be indexed');
    }
    let ack;
    if(hit){ ack = await graphWrite(
        `/sites/${site.id}/lists/${lst.id}/items/${hit.id}/fields`, fields, 'PATCH'); }
    else   { ack = await graphWrite(
        `/sites/${site.id}/lists/${lst.id}/items`, {fields: fields}, 'POST'); }
    if(!ack) throw new Error('the list write returned no acknowledgement');

    S.synced = {at: new Date().toISOString(), file: upj.name,
                transfers: m.transfers.length, counts: m.counts.length};
    ev('synced', {file: upj.name, transfers: m.transfers.length});
    save(); render();
    toast(`✅ synced — ${m.transfers.length} transfer(s), ${m.counts.length} count(s)`);
  }catch(e){
    ev('sync_failed', {why: String(e.message || e)});
    save();
    // ⛔ FAIL LOUDLY. A sync that quietly did nothing is how a shift's work disappears.
    /* ⛔ THIS SAID "Nothing was sent" EVEN WHEN THE RECORD FILE HAD LANDED — the wrong
       direction for a rule this file states itself ("a row counts as saved only when the
       server acknowledges it"). Report what actually happened. */
    dlg('Sync failed', '<div class="badbox"><b>'+
      (fileLanded ? 'The record file was saved, but the session row was NOT updated.'
                  : 'Nothing was sent.')+
      '</b><div class="sm" style="margin-top:6px">'+esc(String(e.message || e))+'</div></div>'+
      '<p class="sm dim">Your work is still saved on this iPad. Get back in signal and try '+
      'again — ⛔ do not start another session for this plan until this succeeds.</p>',
      [{t:'OK', c:'pri'}]);
  }finally{ if(btn){ btn.disabled = false; btn.textContent = was; } }
}

/* ---- dialog ---------------------------------------------------------------- */
function dlg(title, bodyHtml, buttons, after){
  const d = $('#dlg');
  $('#dlgh').textContent = title; $('#dlgb').innerHTML = bodyHtml;
  const f = $('#dlgf'); f.innerHTML = '';
  buttons.forEach(b => {
    const el = document.createElement('button');
    el.textContent = b.t; el.className = b.c || '';
    /* ⛔⛔ `d.close()` USED TO RUN UNCONDITIONALLY AFTER THE HANDLER, so every
       `return toast('⛔ …')` READ like an abort and was not one: bad input closed the
       dialog and threw the entry away. ⭐ A handler returning exactly `false` now keeps
       the dialog open. ⛔ It also meant a handler that re-opened `dlg()` (Skip did) had
       its new dialog closed immediately — the crew tapped Skip and NOTHING was recorded,
       which is precisely the "we ran out of time" vs "nobody looked" distinction this app
       exists to preserve. */
    el.onclick = (e) => { if(b.f){ e.preventDefault(); if(b.f() !== false) d.close(); } };
    f.appendChild(el);
  });
  d.showModal(); if(after) after();
}

/* ---- boot ------------------------------------------------------------------ */
window.addEventListener('load', () => {
  const probe = probeStorage();
  STORAGE_OK = probe.ok;
  if(!STORAGE_OK){ blockStorage(probe.why, false); return; }   // refuse to start
  keepAwake();
  boot();
});
window.addEventListener('beforeunload', () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} });
</script>
