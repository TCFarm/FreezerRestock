function pileOnPallet(b, p, sku, lot){
   
  let moved = '';
  (p.lines || []).forEach((l, i) => {
    if(l.kind === 'count' || l.sku !== sku || (l.lot || '') !== (lot || '')) return;
    const st_ = S.lines[lid(b.n, p.loc, l, i)] || {};
    if(st_.from_actual) moved = st_.from_actual;
  });
  return moved;
}
 
function pilesClaimedBy(b, p){
  const out = [];

  PAYLOAD.bays.forEach(bq => (bq.pallets || []).forEach(q => {
    if(q.loc === p.loc) return;
    (q.lines || []).forEach((l, i) => {
      if(l.kind === 'count') return;
      const st_ = S.lines[lid(bq.n, q.loc, l, i)] || {};
      if(st_.from_actual !== p.loc) return;

      if(out.some(z => z.from === q.loc && z.sku === l.sku && (z.lot || '') === (l.lot || ''))) return;
      out.push({sku:l.sku, lot:l.lot || '', qty:Number(l.system_qty || 0), from:q.loc});
    });
  }));
  return out;
}

function implicitParts(l, s){
  s = s || {};
  if(s.placements && s.placements.length) return s.placements.map(pt => Object.assign({}, pt));
  if((l.kind === 'take' || l.kind === 'aside') && s.state === 'done' && Number(s.actual || 0) > 0.001)
    return [{pallet:(l.kind === 'aside' ? (l.onto_pallet || '') : ''), qty:Number(s.actual), deviated:false,
             planned:true}];
  return [];
}
function moveInstead(id, qty, dest, why, opts){
  const f = find(id);
  if(!f) return {ok:false, why:'that line is not in this plan'};
  const l = f.l;
  const q = Number(qty);
  if(!isFinite(q) || q <= 0) return {ok:false, why:'⛔ how many did you actually move?'};

  const prev = st(id) || {};
  const add = !!(opts && opts.add);
  const kept = add ? implicitParts(l, prev) : [];
  const already = kept.reduce((t, pt) => t + Number(pt.qty || 0), 0);

  const cap = add ? pileLeft(f.b, f.p, l.sku, l.lot) : pileLeft(f.b, f.p, l.sku, l.lot, id);
  if(q > cap + 0.001)
    return {ok:false, why:'⛔ that is more than the ' + n(cap) + ' still on this pallet by what is recorded' +
                          (already ? ' (you already recorded moving ' + n(already) + ')' : '')};
  if(!String(why || '').trim())
    return {ok:false, why:'⛔ say what happened — "I did something else" with no words is a '+
                          'skip wearing a better name'};
  const d = String(dest || '');
  if(!d) return {ok:false, why:'⛔ where did it actually go?'};
  if(f.p.pallet_id && d === f.p.pallet_id)
    return {ok:false, why:'⛔ that is the pallet it is already on'};

  if(d.charAt(0) !== '@' && palletFreed(d))
    return {ok:false, why:'⛔ ' + d + ' is marked as an emptied deck that does not go back — nothing can '+
                          'be put on it. Un-mark the deck first, or put it somewhere else.'};
  const place = d.charAt(0) === '@' ? {location:d.slice(1)} : {pallet:d};
  const parts = kept.map(pt => { const c = Object.assign({}, pt); delete c.planned; return c; });
  const same = parts.find(pt => (pt.pallet || '') === (place.pallet || '') &&
                                (pt.location || '') === (place.location || ''));

  if(same && !add) same.qty = Math.round((Number(same.qty) + q) * 1000) / 1000;
  else parts.push(Object.assign({qty:q, deviated:true, ts:new Date().toISOString()}, place));
  setLine(id, {state:'done', actual:Math.round((already + q) * 1000) / 1000,
               why_different:String(why).trim(), did_different:true, placements:parts});
  ev('moved_instead', {line:id, bay:f.b.n, pallet:f.p.pallet_id||'', sku:l.sku,
                       lot:l.lot||'', qty:q, to:d, why:String(why).trim(), added:add,
                       kept:kept.length || undefined});
  return {ok:true};
}

function unplannedPallets(){ return S.unplanned || {}; }

function palletFreed(x){
  const pid = (x && typeof x === 'object') ? x.pallet_id : x;
  return !!(pid && (S.deck_freed || {})[pid]);
}
 
function laneShapeOf(lane){
  const b = (PAYLOAD.bays || []).find(x => !x.off_plan_bay && x.bay === lane);
  if(b && b.lane && Number(b.lane.depth))
    return {depth:Number(b.lane.depth), beyond:b.lane.beyond || [], bay:b};
  const ol = (PAYLOAD.other_lanes || {})[lane];
  if(ol && Number(ol.depth)) return {depth:Number(ol.depth), beyond:ol.beyond || [], bay:null};
  return null;
}

function offPlanLanes(){
  const out = [];
  (PAYLOAD.bays || []).forEach(b => {
    if(b.off_plan_bay) return;
    if(/^F[23]-/.test(b.bay || '') && b.lane && Number(b.lane.depth)) out.push(b.bay);
  });
  Object.keys(PAYLOAD.other_lanes || {}).forEach(l => { if(out.indexOf(l) < 0) out.push(l); });
  return out.sort();
}

function laneSlots(lane){
  const sh = laneShapeOf(lane);
  if(!sh) return [];
  const out = [];
  for(let pos = 1; pos <= sh.depth; pos++){
    const loc = lane + '-' + pos;
    const un = (S.unplanned || {})[loc];
    const planned = sh.bay && (sh.bay.pallets || []).find(p => !p.off_plan && p.loc === loc);
    const beyond = sh.beyond.find(x => Number(x.pos) === pos);
    out.push({pos:pos, loc:loc,
              kind: planned ? 'planned' : un ? 'offplan' : beyond ? 'rack' : 'unknown',
              holds: planned ? (planned.lines || []).filter(l => l.kind !== 'count')
                                 .map(l => ({sku:l.sku, lot:l.lot || '', qty:l.system_qty, desc:l.desc || ''}))
                             : un ? (un.holds || []) : ((beyond || {}).holds || []),
              pallet: planned || null, un: un || null});
  }
  return out;
}

function syntheticBayN(lane){
  const un = S.unplanned || {};
  let mine = 0, top = 999;
  Object.keys(un).forEach(k => { const u = un[k] || {};
    if(u.bay >= 1000){ top = Math.max(top, Number(u.bay));
                       if(u.bay_name === lane) mine = Number(u.bay); } });
  return mine || (top + 1);
}

let OFF_CONFLICTS = [];
function offPlanConflicts(){ materialiseOffPlan(); return OFF_CONFLICTS.slice(); }
function rekeyOffPlan(u, newN){
  const oldN = Number(u.bay), loc = u.loc;
  if(oldN === newN) return false;
  const pre = oldN + '|' + loc + '|';
  Object.keys(S.lines || {}).forEach(k => {
    if(k.indexOf(pre) !== 0) return;
    const nk = newN + '|' + loc + '|' + k.slice(pre.length);
    if(!(nk in S.lines)) S.lines[nk] = S.lines[k];
    delete S.lines[k];
  });
   
  Object.keys(S.opened || {}).forEach(k => {
    if(k.indexOf(pre) !== 0) return;
    const nk = newN + '|' + loc + '|' + k.slice(pre.length);
    if(!(nk in S.opened)) S.opened[nk] = S.opened[k];
    delete S.opened[k];
  });
  Object.keys(S.adhoc_counts || {}).forEach(k => { const c = S.adhoc_counts[k];
    if(c && c.loc === loc && Number(c.bay) === oldN) c.bay = newN; });
  (S.lot_fix || []).forEach(x => { if(x && x.loc === loc && Number(x.bay) === oldN) x.bay = newN; });
  Object.keys(S.deck_freed || {}).forEach(k => { const d = S.deck_freed[k];
    if(d && d.loc === loc && Number(d.bay) === oldN) d.bay = newN; });
  u.bay = newN;
  return true;
}
function reconcileOffPlanStore(bays){
  const un = S.unplanned || {};
  const keys = Object.keys(un).filter(k => un[k] && un[k].loc);
  if(!keys.length){ OFF_CONFLICTS = []; return; }
  const planned = bays.filter(b => !b.off_plan_bay);
  const plannedN = new Set(planned.map(b => Number(b.n)));
  const conflicts = [], moved = [];
   
  const laneN = {};
  let top = 999;
  keys.forEach(k => { const n_ = Number(un[k].bay); if(n_ >= 1000 && !plannedN.has(n_)) top = Math.max(top, n_); });
  planned.forEach(b => { top = Math.max(top, Number(b.n) >= 1000 ? Number(b.n) : top); });
  keys.sort((a, b) => (Number(un[a].pos) - Number(un[b].pos)) || String(a).localeCompare(String(b)))
    .forEach(k => {
      const u = un[k];
      const lane = u.bay_name || (laneOfLoc(u.loc) || {}).lane || '';
      const pb = planned.find(b => b.bay === lane);
      const named = !!(pb && (pb.pallets || []).some(p => !p.off_plan && p.loc === u.loc));
      let want;
      if(pb && !named) want = Number(pb.n);
      else {
        const lk = lane + (named ? '|conflict' : '');
        if(laneN[lk] == null){
          const mine = Number(u.bay);
          const taken = new Set(Object.keys(laneN).map(x => laneN[x]));
          laneN[lk] = (mine >= 1000 && !plannedN.has(mine) && !taken.has(mine)) ? mine : (++top);
        }
        want = laneN[lk];
        if(named) conflicts.push({loc:u.loc, pallet_id:u.pallet_id || '', lane:lane, bay:want,
                                  planned_pallet:((pb.pallets || []).find(p => !p.off_plan && p.loc === u.loc) || {}).pallet_id || ''});
      }
      const was = Number(u.bay);
      if(rekeyOffPlan(u, want)) moved.push({loc:u.loc, pallet:u.pallet_id || '', from:was, to:want});
    });
  OFF_CONFLICTS = conflicts;

  const dropped = [];
  moved.forEach(mv_ => {
    if(!(mv_.from >= 1000)) return;
    if(keys.some(k => Number((un[k] || {}).bay) === mv_.from)) return;       
    [['bays', S.bays], ['load_order', S.load_order]].forEach(([nm, store]) => {
      if(!store || !(mv_.from in store)) return;
      if(mv_.to >= 1000 && !(mv_.to in store)) store[mv_.to] = store[mv_.from];
      else dropped.push(nm + ' of ' + mv_.from);
      delete store[mv_.from];
    });
  });
  if(dropped.length) moved.push({loc:'', pallet:'', from:'', to:'', note:'not carried into a planned bay: ' + dropped.join(', ')});
  if(moved.length){

    S.events = S.events || [];
    S.events.push({ts:new Date().toISOString(), kind:'offplan_migrated',
                   moved:moved.map(x => x.note || (x.pallet + ' ' + x.loc + ' ' + x.from + '→' + x.to)).join('; ')});
    try{ writeLocal(); }catch(e){}
  }
}
function materialiseOffPlan(){
  if(!PAYLOAD || !PAYLOAD.bays) return;
  if(OFF_FOR !== PAYLOAD || OFF_SIG !== JSON.stringify(S.unplanned || {}))
    reconcileOffPlanStore(PAYLOAD.bays);
  const un = S.unplanned || {};
  const sig = JSON.stringify(un);
  if(OFF_FOR === PAYLOAD && OFF_SIG === sig) return;        
  OFF_FOR = PAYLOAD; OFF_SIG = sig;
  const bays = PAYLOAD.bays;
  const strip = (arr, test) => { for(let i = arr.length - 1; i >= 0; i--) if(test(arr[i])) arr.splice(i, 1); };
  strip(bays, b => b.off_plan_bay);
  bays.forEach(b => { b.pallets = b.pallets || []; b.putback = b.putback || [];
                      strip(b.pallets, p => p.off_plan); strip(b.putback, x => x.off_plan); });
  const entries = Object.keys(un).map(k => un[k]).filter(u => u && u.loc)
    .sort((a, b) => (Number(a.pos) - Number(b.pos)) || String(a.loc).localeCompare(String(b.loc)));
  const synth = {}, touched = new Set();
  const conflictLoc = new Set(OFF_CONFLICTS.map(c => c.loc));
  entries.forEach(u => {
    const lane = u.bay_name || (laneOfLoc(u.loc) || {}).lane || '';
    const isConflict = conflictLoc.has(u.loc);
    const sk = lane + (isConflict ? '|conflict' : '');
    let b = (!isConflict && bays.find(x => !x.off_plan_bay && x.bay === lane)) || synth[sk];
    if(!b){
      const n_ = Number(u.bay);

      if(!(n_ > 0) || bays.some(x => x.n === n_)){
        OFF_CONFLICTS.push({loc:u.loc, pallet_id:u.pallet_id || '', lane:lane, bay:n_, corrupt:true});
        return; }
      const sh = (PAYLOAD.other_lanes || {})[lane] || {};
      b = {n:n_, bay:lane, deepest:0, est_minutes:0, count_minutes:0, pallets:[], putback:[],
           orphan_pulls:[], cross_in:[], floor:0, down:0,
           depth:Number(sh.depth) || laneDepth(lane), off_plan_bay:true, conflict:isConflict,
           lane:{depth:Number(sh.depth) || laneDepth(lane), dug_to:0, beyond:[]}};
      synth[sk] = b;
    }
    if((b.pallets || []).some(p => p.loc === u.loc)) return;    
    const pos = Number(u.pos) || posOf(u.loc);
    const p = {loc:u.loc, pos:pos, pallet_id:u.pallet_id || '', off_plan:true, spoil:false,
               cleared:false, est_m3:0, deck_m3:0, no_volume:[], why_off_plan:u.why || '',
               goes_back_to:u.loc,

               lines:(u.holds || []).map(h => ({sku:h.sku, desc:h.desc || '',
                        lot:(h.lot_source ? '' : (h.lot || '')),
                        lot_attached:(h.lot_source ? (h.lot || '') : undefined),
                        system_qty:Number(h.qty || 0), kind:'stay', planned_qty:0}))};
    if(isConflict) p.conflict = true;
    b.pallets.push(p); touched.add(b);

    if(!isConflict && !(b.putback || []).some(x => !x.off_plan && x.loc === u.loc))
      b.putback.push({pos:pos, loc:u.loc, pallet_id:p.pallet_id, off_plan:true,
                      from_location:u.loc, leaves:[], waits_for:[], moved:[], arriving:[],
                      items:p.lines.map(l => ({sku:l.sku, qty:l.system_qty, disposition:'stay',
                                               next_needed_wk:null, from_position:String(pos)}))});
  });
  touched.forEach(b => {
    b.pallets.sort((x, y) => Number(x.pos) - Number(y.pos));
    b.putback.sort((x, y) => Number(y.pos) - Number(x.pos));
  });
  Object.keys(synth).map(k => synth[k]).sort((x, y) => x.n - y.n).forEach(b => {
    b.deepest = b.pallets.reduce((m, p) => Math.max(m, Number(p.pos)), 0);
    b.down = b.pallets.length; b.floor = b.pallets.length; b.lane.dug_to = b.deepest;
    const have = new Set(b.pallets.map(p => Number(p.pos)));

    b.lane.beyond = b.conflict ? [] : ((PAYLOAD.other_lanes || {})[b.bay] || {beyond:[]}).beyond
                      .filter(x => !have.has(Number(x.pos)));
    bays.push(b);
  });
  if(S && S.bay >= bays.length) S.bay = Math.max(0, bays.length - 1);
}

function offPlanUsage(loc){
  const u = (S.unplanned || {})[loc]; if(!u) return [];
  const pid = u.pallet_id, why = [];
  let b = null, p = null;
  PAYLOAD.bays.forEach(x => (x.pallets || []).forEach(q => { if(q.loc === loc){ b = x; p = q; } }));
  if(p && (p.lines || []).some((l, i) => { const s_ = st(lid(b.n, loc, l, i)) || {};
                                          return s_.state || s_.lot_attached; }))
    why.push('something is recorded on its items');
  if((S.found_moves || []).some(f => f.from === loc || f.to === loc || (p && fmOnto(f, p))))
    why.push('a find or a location fix names it');
  if((S.found_here || []).some(f => f.loc === loc)) why.push('a find was recorded on it');
  if(Object.keys(S.adhoc_counts || {}).some(k => k.indexOf(loc + '|') === 0))
    why.push('a count was recorded on it');
  if((S.lot_fix || []).some(x => x.loc === loc)) why.push('a lot correction was recorded on it');
  if((S.deck_freed || {})[pid]) why.push('it is marked "deck does not go back"');
  if((S.pallets[loc] || {}).settled) why.push('it is marked "leave it alone"');
  if((S.lane_push || {})[pid]) why.push('it was recorded as pushed into a lane');
  if(Object.keys(S.split_contents || {}).some(k => (S.split_contents[k] || {}).from === pid))
    why.push('a split was made from it');
  let onto = false;
  PAYLOAD.bays.forEach(x => (x.pallets || []).forEach(q => (q.lines || []).forEach((l, i) => {
    const s = st(lid(x.n, q.loc, l, i)) || {};
    if(s.from_actual === loc || (s.placements || []).some(pt => pt.pallet === pid)) onto = true;
  })));
  if(onto) why.push('stock was recorded as moved onto / off it');
  return why;
}
function undoOffPlanUI(loc){
  const r = undoUnplanned(loc);
  if(!r.ok) toast(r.why);
  else if(r.note) toast('↶ undone. ' + r.note);       
  render();
}
function undoUnplanned(loc){
  const u = (S.unplanned || {})[loc];
  if(!u) return {ok:false, why:'not recorded'};

  const lane_ = u.bay_name || (laneOfLoc(loc) || {}).lane || '';
  const deeper = Object.keys(S.unplanned || {}).map(k => S.unplanned[k])
    .filter(x => x && x.loc !== loc && (x.bay_name || (laneOfLoc(x.loc) || {}).lane) === lane_ &&
                 Number(x.pos || posOf(x.loc)) > Number(u.pos || posOf(loc)))
    .sort((a, b) => Number(b.pos) - Number(a.pos));
  if(deeper.length)
    return {ok:false, why:'⛔ ' + deeper.map(x => (x.pallet_id || '') + ' (' + x.loc + ')').join(', ') +
      ' is deeper in ' + lane_ + ' and is recorded as down — it could only come down past this one. '+
      'Undo the deepest one first.'};
  const why = offPlanUsage(loc);
  if(why.length) return {ok:false, why:'⛔ it cannot be undone while ' + why.join('; ') +
                                        ' — undo that first'};
  const pid = u.pallet_id, n_ = u.bay;

  let reopenNote = '';
  const snap = u.reopen;
  if(snap){
    const bayPallets = ((PAYLOAD.bays.find(x => x.n === n_) || {}).pallets || []).filter(q => q.loc !== loc);
    const locs = new Set(bayPallets.map(q => q.loc));
    const pids = new Set(bayPallets.map(q => q.pallet_id).filter(Boolean));
    const why_ = [];
    const sib = Object.keys(S.unplanned || {}).map(k => S.unplanned[k])
      .filter(x => x && x.loc !== loc && x.reopen && x.reopen.at === snap.at);
    const bs_ = S.bays[n_] || {};

    const reconfirmed = !!(bs_.putback_done || bs_.closed);
    if((S.load_order || {})[n_]) why_.push('a load order was recorded since');
    if(Object.keys(S.lines || {}).some(k => k.indexOf(n_ + '|') === 0 && k.indexOf(n_ + '|' + loc + '|') !== 0 &&
                                         String((S.lines[k] || {}).ts || '') > snap.at))
      why_.push('work was recorded in that bay since');
    if([...pids].some(q => { const a = actualFor(q); return a && String(a.ts || '') > snap.at; }))
      why_.push('a pallet position was recorded since');
    if((S.found_moves || []).concat(S.found_here || []).some(x => String(x.ts || '') > snap.at &&
         (locs.has(x.from) || locs.has(x.to) || locs.has(x.loc))))
      why_.push('a find or a location fix was recorded there since');
    if(reconfirmed){
      reopenNote = 'The bay stays as you last confirmed it — put back' +
        (why_.length ? ' (' + why_.join('; ') + ')' : '') + '. Nothing else changes.';
    } else if(sib.length && !why_.length){
      reopenNote = 'The bay stays OPEN for now — ' + sib.map(x => x.pallet_id).join(', ') + ' came down with this '+
        'one and is still recorded. Undo ' + (sib.length === 1 ? 'it' : 'them') + ' too and the bay goes back to how '+
        'it was; otherwise confirm its putback again.';
    } else if(why_.length || sib.length){
      reopenNote = 'The bay stays OPEN — ' + why_.concat(sib.length ? [sib.map(x => x.pallet_id).join(', ') +
        ' came down with it and is still recorded'] : []).join('; ') + '. Confirm its putback again.';
    } else {
      const cur = Object.assign({}, S.bays[n_] || {});
      cur.putback_done = snap.putback_done; cur.closed = snap.closed;
      if(snap.putback_ts) cur.putback_ts = snap.putback_ts; else delete cur.putback_ts;
      if(snap.had_reopened_ts) cur.reopened_ts = snap.had_reopened_ts; else delete cur.reopened_ts;
      if(snap.had_prev_putback_ts) cur.prev_putback_ts = snap.had_prev_putback_ts; else delete cur.prev_putback_ts;
      cur.putback_hist = (cur.putback_hist || []).filter(h => !(h && h.reopened_ts === snap.at));
      if(!cur.putback_hist.length) delete cur.putback_hist;
       
      if(snap.lane_room){ Object.assign(cur, snap.lane_room);
        cur.lane_room_hist = (cur.lane_room_hist || []).filter(h => !(h && h.reopened_ts === snap.at));
        if(!cur.lane_room_hist.length) delete cur.lane_room_hist; }
      if(!cur.putback_done) delete cur.putback_done;
      if(!cur.closed) delete cur.closed;
      S.bays = Object.assign({}, S.bays); S.bays[n_] = cur;
      if(snap.load_order){ S.load_order = Object.assign({}, S.load_order || {}); S.load_order[n_] = snap.load_order; }
      reopenNote = snap.putback_done || snap.closed
        ? 'The bay is back to how it was before — put back' + (snap.load_order ? ', with the load order you recorded.' : '.')
        : (snap.load_order ? 'The load order you recorded is back.' : '');
    }
  }
  S.unplanned = Object.assign({}, S.unplanned); delete S.unplanned[loc];
  delete (S.putback_actual || {})[pid];
  Object.keys(S.load_order || {}).forEach(k => {
    const r = S.load_order[k]; if(r && r.order) r.order = r.order.filter(x => x !== pid); });
   
  if(n_ >= 1000 && !Object.keys(S.unplanned).some(k => S.unplanned[k].bay === n_)){
    delete (S.bays || {})[n_];
    Object.keys(S.lines || {}).forEach(k => { if(k.indexOf(n_ + '|') === 0) delete S.lines[k]; });
  }
  save(); ev('unplanned_undone', {loc:loc, reopen:snap ? (/stays (OPEN|as you last)/.test(reopenNote) ? 'kept' : 'restored') : undefined});
  return {ok:true, note:reopenNote};
}

function bringDownOffPlan(lane, picks, why){
  const sh = laneShapeOf(lane);
  if(!sh) return {ok:false, why:'⛔ this plan carries no record of ' + lane + ' — it was built '+
    'before the whole-freezer change. ⭐ Rebuild the plan rather than typing a position in, or '+
    'the contents would be a guess.'};
  if(!String(why || '').trim())
    return {ok:false, why:'⛔ say why — it is the signal that the plan was wrong about this '+
                          'lane, and nothing else carries it'};

  const pushedHere = lanePushedBy(lane);
  if(pushedHere.length)
    return {ok:false, why:'⛔ you pushed ' + pushedHere.join(', ') + ' into ' + lane + ' this shift, so every '+
      'pallet behind it is one position deeper than Finale lists — what Finale says is at each position '+
      'is no longer true. Do not record a pallet from ' + lane + ' here: tell Jack.'};
  const slots = laneSlots(lane);
  const taken = new Set(), made = [];
  const cards = [];

  const deepest = picks.reduce((m, pk) => Math.max(m, Number(pk.pos) || 0), 0);
  picks = picks.slice();
  slots.forEach(x => {
    if(x.pos < deepest && x.kind === 'rack' && (x.holds || []).length &&
       !picks.some(pk => Number(pk.pos) === x.pos)) picks.push({pos:x.pos});
  });
  picks.sort((a, b) => Number(a.pos) - Number(b.pos));
  for(const pk of picks){
    const sl = slots.find(x => x.pos === Number(pk.pos));
    if(!sl) return {ok:false, why:'⛔ ' + lane + '-' + pk.pos + ' is not a position in this lane'};
    if(sl.kind === 'planned')
      return {ok:false, why:'⛔ ' + sl.loc + ' is already in the plan — work it there rather '+
                            'than recording it twice'};
    if(sl.kind === 'offplan') continue;                    
    let card = 'P-' + nextFreeCard(taken);
    if(pk.card != null && String(pk.card).trim() !== ''){
      card = 'P-' + String(pk.card).trim().replace(/^P-?/i, '');
      if(!/^P-\d+$/.test(card))
        return {ok:false, why:'⛔ a card number is just digits — the number written on the card'};
      if(cardInUse(card) || taken.has(card))
        return {ok:false, why:'⛔ ' + card + ' is already on another pallet. Two pallets wearing '+
                              'one card is how stock gets recorded against the wrong one — pick '+
                              'a free number.'};
    }
    taken.add(card);
    cards.push([sl, card]);
  }
  if(!cards.length) return {ok:true, already:true, made:[]};
  const bayN = sh.bay ? sh.bay.n : syntheticBayN(lane);
  startShift('bring_down');                     

  const bs0 = S.bays[bayN] || {};
  const reopened = !!(bs0.putback_done || bs0.closed);
  const hadOrder = !!(S.load_order || {})[bayN];
  const ts0 = new Date().toISOString();

  const snap = (reopened || hadOrder) ? {at:ts0,
    putback_done:!!bs0.putback_done, closed:!!bs0.closed, putback_ts:bs0.putback_ts || '',
    had_reopened_ts:bs0.reopened_ts || '', had_prev_putback_ts:bs0.prev_putback_ts || '',
    lane_room:bs0.lane_room ? {lane_room:bs0.lane_room, lane_back:bs0.lane_back, lane_room_ts:bs0.lane_room_ts} : null,
    load_order:hadOrder ? JSON.parse(JSON.stringify(S.load_order[bayN])) : null} : null;
  if(reopened){

    const hist = (bs0.putback_hist || []).slice();
    if(bs0.putback_ts) hist.push({putback_ts:bs0.putback_ts, reopened_ts:ts0});
    S.bays[bayN] = Object.assign({}, bs0, {putback_done:false, closed:false,
      reopened_ts:ts0, prev_putback_ts:bs0.putback_ts || bs0.prev_putback_ts || '', putback_hist:hist});
    delete S.bays[bayN].putback_ts;

    if(bs0.lane_room){
      S.bays[bayN].lane_room_hist = (bs0.lane_room_hist || []).concat([{lane_room:bs0.lane_room,
        lane_back:bs0.lane_back, lane_room_ts:bs0.lane_room_ts, reopened_ts:ts0}]);
      delete S.bays[bayN].lane_room; delete S.bays[bayN].lane_back; delete S.bays[bayN].lane_room_ts;
    }
  }
  if(hadOrder){ S.load_order = Object.assign({}, S.load_order); delete S.load_order[bayN]; }
  S.unplanned = Object.assign({}, S.unplanned || {});
  const ts = new Date().toISOString();
  cards.forEach(([sl, card]) => {
    S.unplanned[sl.loc] = {bay:bayN, bay_name:lane, loc:sl.loc, pos:sl.pos, pallet_id:card,
      why:String(why).trim(), ts:ts, synthetic:!sh.bay,
      reopen:snap || undefined,              

      holds:(sl.holds || []).map(h => ({sku:h.sku, lot:h.lot || '', qty:Number(h.qty || 0),
                                        desc:h.desc || ''}))};
    made.push({loc:sl.loc, pallet_id:card});
    noteCard(card);
  });
  materialiseOffPlan();
  noteBayLanes();                               
  save();
  ev('unplanned_down', {bay:bayN, lane:lane, pallets:made.map(x => x.pallet_id).join(','),
                        locs:made.map(x => x.loc).join(','), why:String(why).trim(),
                        piles:cards.reduce((t, c) => t + (c[0].holds || []).length, 0)});
  if(reopened) ev('bay_reopened', {bay:lane, n:bayN, why:'off-plan pallet came down',
                                   load_order_cleared:hadOrder});
  else if(hadOrder) ev('load_order_cleared', {bay:lane, n:bayN, why:'off-plan pallet came down'});
  return {ok:true, made:made, pallet_id:(made[made.length - 1] || {}).pallet_id, bay:bayN,
          reopened:reopened, order_cleared:hadOrder};
}
 
function lanePushedBy(lane){
  return Object.keys(S.lane_push || {}).filter(q => {
    const lp = S.lane_push[q] || {}, a = actualFor(q);
    return lp.lane === lane && a && a.state === 'placed' && (laneOfLoc(a.loc) || {}).lane === lane;
  }).map(q => cardOf(q) || q);
}
 
function bringDownUnplanned(bayN, loc, why, pick){
  const ll = laneOfLoc(loc);
  if(!ll) return {ok:false, why:'⛔ ' + loc + ' is not a position in a reserve lane'};
  const b = PAYLOAD.bays.find(x => x.n === bayN);
  if(b && !b.off_plan_bay && b.bay !== ll.lane)
    return {ok:false, why:'⛔ ' + loc + ' is not a position in this lane'};
  if((S.unplanned || {})[loc]) return {ok:true, already:true};
  return bringDownOffPlan(ll.lane, [{pos:ll.pos, card:pick}], why);
}

function laneAvailable(lane){ return !lanePushedBy(lane).length && laneSlots(lane).some(x => x.kind === 'rack'); }
 
function bayNOfLane(lane){
  const sh = laneShapeOf(lane);
  if(sh && sh.bay) return sh.bay.n;
  const ob = PAYLOAD.bays.find(b => b.off_plan_bay && b.bay === lane);
  return ob ? ob.n : null;
}

function offPlanPicks(lane, pos){
  const out = [];
  laneSlots(lane).forEach(x => {
    if(x.pos > pos || x.kind !== 'rack') return;
    if(x.pos < pos){
      const has = (x.holds || []).length;
      const tick = $('#bdx' + x.pos);
      if(!has && !(tick && tick.checked)) return;
    }
    out.push({pos:x.pos, card:($('#bdc' + x.pos) || {}).value});
  });
  return out;
}

function findPalletAt(loc){
  let hit = null;
  PAYLOAD.bays.forEach(b => (b.pallets || []).forEach(p => { if(p.loc === loc) hit = {b:b, p:p}; }));
  return hit;
}

function palletOnFloor(b, p, plannedHere){
  if(!p || !p.pallet_id) return false;
  if(palletSettled(p) || palletFreed(p)) return false;
  const a = actualFor(p.pallet_id);

  if(a && (a.state === 'floor' || (a.loc && a.loc === floorLoc()))) return true;
  if(a && a.state === 'placed' && a.loc) return false;
  if((S.bays[b.n] || {}).putback_done) return false;
  return !!plannedHere || palletCameDown(b, p);
}

function builtOnFloor(pid){
  if(!pid || palletFreed(pid)) return false;
  const a = actualFor(pid);
  if(!a || !a.loc || a.state === 'floor') return true;
  return !laneOfLoc(a.loc);
}

function palletFate(b, p){
  if(!p || !p.pallet_id) return {k:'unknown'};
  if(palletFreed(p)) return {k:'freed'};
  const a = actualFor(p.pallet_id);
  if(a && (a.state === 'floor' || (a.loc && a.loc === floorLoc()))) return {k:'floor'};
  const fin = palletFinalLoc(p.pallet_id);
  if(!fin) return {k:'unknown'};
  const confirmed = !!(a && a.loc) || !!(S.bays[b.n] || {}).putback_done;
  return {k:confirmed ? 'up' : 'pending', loc:fin};
}
function palletFateWords(b, p){
  const f = palletFate(b, p);
  if(f.k === 'freed') return '⛔ This deck is marked as emptied and does NOT go back — nothing can ride on it. '+
                             'Undo the fix that put it here, or un-mark the deck.';
  if(f.k === 'floor') return 'It stays on the restock floor with this pallet (' + floorLoc() +
                             ') — it moves when the pallet does.';
  if(f.k === 'up') return 'It goes back up with this pallet, to ' + f.loc + '.';
  if(f.k === 'pending') return 'It goes back up with this pallet once the putback is confirmed (placard ' +
                               f.loc + ').';
  return 'Nobody has said where this pallet goes yet — this goes wherever the pallet goes.';
}

function placardOf(b, p){
  const pid = p && p.pallet_id;
  const planned = plannedLocFor(pid) || (p && p.goes_back_to) || '';
  if(!pid) return {k:'none', loc:'', planned:planned};
  if(palletFreed(pid)) return {k:'freed', loc:'', planned:planned};
  const a = actualFor(pid);
  if(a && (a.state === 'floor' || (a.loc && a.loc === floorLoc()))) return {k:'floor', loc:'', planned:planned};
  const fin = palletFinalLoc(pid);
  return fin ? {k:'loc', loc:fin, planned:planned} : {k:'none', loc:'', planned:planned};
}
function floorPalletList(exceptLoc){
  const out = [];
  PAYLOAD.bays.forEach(b => (b.pallets || []).forEach(p => {
    if(p.loc === exceptLoc || !p.pallet_id) return;
    if(!palletOnFloor(b, p)) return;
    out.push({b:b, p:p});
  }));
  return out;
}

function pileRecordText(b, p, l, i){
  const s = st(lid(b.n, p.loc, l, i)) || {};
  const parts = [];
  const dest = pt => pt.location ? (pt.location === tempLoc() ? 'parked at ' + pt.location : pt.location)
                                 : (pt.pallet ? 'onto ' + (cardOf(pt.pallet) || pt.pallet) : 'the floor');
  if(s.state === 'missing') parts.push('not here — written off');
  else if(s.parked_not_here) parts.push('not here — parked at ' + (tempLoc() || 'temp'));
  if(s.from_actual){ const h = findPalletAt(s.from_actual);
    parts.push('really on ' + ((h && h.p.pallet_id) || s.from_actual) + ' — it goes back up with that pallet'); }
  if(s.did_different && (s.placements || []).length)
    parts.push('moved ' + s.placements.map(pt => n(pt.qty) + ' → ' + dest(pt)).join(', '));
  else if((l.kind === 'take' || l.kind === 'aside') && s.state === 'done' && Number(s.actual || 0) > 0)
    parts.push(n(s.actual) + ' carried' + ((s.placements || []).length > 1
      ? ' (' + s.placements.map(pt => n(pt.qty) + ' → ' + dest(pt)).join(', ') + ')' : ''));
  (S.found_moves || []).forEach(fm => {
    if(fm.from === p.loc && fm.sku === l.sku && (fm.lot || '') === (l.lot || ''))
      parts.push('location fix: ' + n(fm.qty) + ' → ' + fm.to); });
  if(s.state === 'skipped') parts.push('skipped');
  if(s.state === 'settled') parts.push('left alone — Finale is right');
  if(!parts.length) return '';
  const left = pileLeft(b, p, l.sku, l.lot);
  return parts.join(' · ') + (s.state === 'missing' || s.from_actual ? '' : ' · ' + n(left) + ' left');
}
function pileStatus(b, p, l, i){
  const s = st(lid(b.n, p.loc, l, i)) || {};
  const rec = pileRecordText(b, p, l, i);
  if(rec) return rec;
  if(s.state === 'done' && (s.adjustment || s.corrected)) return '✎ count changed';
  if(s.state === 'done') return '✓';
  if(((S.pallets[p.loc] || {}).checked || {})[l.sku + '|' + (l.lot || '')]) return '✓ here';
  return '';
}

  const lane = (laneOfLoc(loc) || {}).lane || '';
  const out = [];
  laneSlots(lane).filter(x => x.loc !== loc && (x.holds || []).length).forEach(x => {
    (x.holds || []).forEach(h => {
      const mv = movableFromHome(h.sku, h.lot || '', x.loc);

                on:dp ? (dp.p.pallet_id || '') : ''});

  });
  return out;
}

function buildPallet(pick){
  const card = 'P-' + String(pick || nextFreeCard()).trim().replace(/^P-?/i, '');
  if(!/^P-\d+$/.test(card)) return {ok:false, why:'⛔ a card number is just digits'};
  const clash = cardInUse(card);
  if(clash) return {ok:false, why:'⛔ ' + clash + ' — the next free card is P-' + nextFreeCard()};
  const b = PAYLOAD.bays[S.bay] || PAYLOAD.bays[0] || {};
  startShift('build_pallet');                   
  S.new_pallets = S.new_pallets || {};
  S.new_pallets[card] = {bay:b.bay || '', bay_n:null, built_ts:new Date().toISOString(),
                         built_from_scratch:true};
  noteCard(card);
  save(); ev('pallet_built', {pallet:card});
  return {ok:true, pallet_id:card};
}

function palletRemaining(loc){
  const f = findPalletAt(loc); if(!f) return {units:0, orphans:[]};
  const pid = f.p.pallet_id;
  const had = (S.deck_freed || {})[pid];
  if(had){ S.deck_freed = Object.assign({}, S.deck_freed); delete S.deck_freed[pid]; }
  let m;
  try{ m = moves(); } finally { if(had) S.deck_freed[pid] = had; }

  const piles = ((m._pile || {}).piles || {})[pid] || {};
  const left = Object.keys(piles).reduce((t, k) => t + Math.max(0, Number(piles[k] || 0)), 0);
  const orph = (m.floor_orphans || []).filter(o => o.pallet === pid && !o.fixed);

  const waiting = orph.filter(o => o.cause === 'receiver_already_up' || o.cause === 'awaiting_bay')
                     .reduce((t, o) => t + Number(o.units || 0), 0);
  return {units:Math.round((left + waiting) * 1000) / 1000, orphans:orph};
}
function freeDeck(loc, why){
  const f = findPalletAt(loc);
  if(!f || !f.p.pallet_id) return {ok:false, why:'no pallet at ' + loc};
  if(!palletCameDown(f.b, f.p)) return {ok:false, why:'⛔ that pallet has not come down'};
  if(actualFor(f.p.pallet_id))
    return {ok:false, why:'⛔ you already said where ' + f.p.pallet_id + ' went — an emptied deck '+
                          'has no position. Undo that first (went elsewhere? → change it).'};
  const rem = palletRemaining(loc);
  if(rem.units > 0.001)
    return {ok:false, why:'⛔ the record still has ' + n(rem.units) + ' unit(s) on ' +
                          f.p.pallet_id + ' — move them, park them or correct the count first, '+
                          'or the deck cannot be empty'};
  S.deck_freed = Object.assign({}, S.deck_freed || {});
  S.deck_freed[f.p.pallet_id] = {loc:loc, bay:f.b.n, why:String(why || '').trim(),
                                 ts:new Date().toISOString()};
  save(); ev('deck_freed', {pallet:f.p.pallet_id, loc:loc, bay:f.b.bay});
  return {ok:true};
}
function unfreeDeck(loc){
  const f = findPalletAt(loc); if(!f) return {ok:false};
  if(!(S.deck_freed || {})[f.p.pallet_id]) return {ok:false};
  S.deck_freed = Object.assign({}, S.deck_freed); delete S.deck_freed[f.p.pallet_id];
  save(); ev('deck_unfreed', {pallet:f.p.pallet_id, loc:loc}); return {ok:true};
}

function lotChoices(sku){
  const out = [];
  Object.keys(PAYLOAD.lot_ids || {}).forEach(k => {
    const i = k.indexOf('|');
    if(i > 0 && k.slice(0, i) === sku) out.push({lot:k.slice(i + 1), raw:PAYLOAD.lot_ids[k]});
  });
  return out.sort((a, b) => String(a.lot).localeCompare(String(b.lot)));
}

function attachLot(where, sku, lot, how){
  const v = String(lot || '').trim();
  if(!v) return {ok:false, why:'⛔ which lot? A blank lot is why two piles went through the '+
                               'last shift unmatchable.'};
  if(where && where.unplanned){

    const u = (S.unplanned || {})[where.unplanned];
    if(!u) return {ok:false, why:'that pallet is not recorded'};
    const hit = findPalletAt(where.unplanned);
    let lineId = '';
    if(hit) hit.p.lines.forEach((l2, i2) => {
      if(!lineId && l2.kind !== 'count' && l2.sku === sku && !(l2.lot || ''))
        lineId = lid(hit.b.n, hit.p.loc, l2, i2); });
    if(!lineId) return {ok:false, why:'⛔ ' + sku + ' on that pallet already carries a lot — '+
                                   'changing a lot Finale already holds is forbidden '+
                                   '(a lot id is an identity, and moving it re-points the '+
                                   'FIFO sort, the placards and the barcodes at once).'};
    setLine(lineId, {lot_attached:v, lot_source:how || 'typed'});
    ev('lot_attached', {loc:where.unplanned, line:lineId, sku:sku, lot:v, how:how || 'typed'});
    return {ok:true, line:lineId};
  }
  const id = where && where.line;
  const f = id && find(id);
  if(!f) return {ok:false, why:'that line is not in this plan'};
  if((f.l.lot || '').trim())
    return {ok:false, why:'⛔ this line already carries lot ' + f.l.lot + '. If the box says '+
                          'otherwise, use "✎ The lot on a box is different" on the pallet — it '+
                          'asks you to confirm twice.'};
  setLine(id, {lot_attached:v, lot_source:how || 'typed'});
  ev('lot_attached', {line:id, sku:sku, lot:v, how:how || 'typed'});
  return {ok:true};
}

function skuName(sku){
  if(!sku) return '';
  const n_ = (PAYLOAD.sku_names || {})[sku];
  if(n_) return n_;
  for(const b of PAYLOAD.bays)
    for(const p of (b.pallets || []))
      for(const l of (p.lines || []))
        if(l.sku === sku && l.desc) return l.desc;
  return '';
}
function homesFor(sku, lot){
  return ((PAYLOAD.sku_homes || {})[sku + '|' + (lot || '')]) || [];
}

function decodedLot(sku, rawLot){
  const r = String(rawLot || '').replace(/^Lot:\s*/i, '').trim();
  if(!r) return '';
  const ids = PAYLOAD.lot_ids || {};
  for(const k of Object.keys(ids)){
    const i = k.indexOf('|');
    if(k.slice(0, i) === sku && String(ids[k]).trim() === r) return k.slice(i + 1);
  }
  return r;
}

function lotReadings(raw){
  const s = String(raw || '').trim().replace(/^(L_|Lot:\s*)/i, '').trim();
  if(!s) return [];
  const iso = (y, mo, d) => {
    const t = new Date(Date.UTC(y, mo - 1, d));
    return (t.getUTCFullYear() === y && t.getUTCMonth() === mo - 1 && t.getUTCDate() === d)
      ? t.toISOString().slice(0, 10) : ''; };
  const jul = (yy, ddd) => (ddd >= 1 && ddd <= 366)
    ? new Date(Date.UTC(2000 + yy, 0, 1) + (ddd - 1) * 86400000).toISOString().slice(0, 10) : '';
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?!\d)/);
  if(m){ const d = iso(+m[1], +m[2], +m[3]); if(d) return [d];

         if(/^(\d{4})-(\d{1,2})-(\d{1,2})$/.test(s)) return []; }
  m = s.match(/^(\d{4})-(\d{1,2})(?!\d)/);
  if(m && +m[1] >= 2000 && +m[1] <= 2099 && +m[2] >= 1 && +m[2] <= 12)
    return [m[1] + '-' + String(+m[2]).padStart(2, '0') + '-01'];
  const out = [];
  m = s.match(/^(\d{4})(?!\d)/);
  if(m && +m[1] >= 2020 && +m[1] <= 2029) out.push(m[1] + '-01-01');
  m = s.match(/^(\d{2})(\d{1,3})(?![0-9A-Za-z])/);
  if(m){ const d = jul(+m[1], +m[2]); if(d) out.push(d); }
  return out;
}
function lotReadsAs(raw){ const r = lotReadings(raw); return r.length === 1 ? r[0] : (r[r.length-1] || ''); }
function checkNewLot(sku, raw){
  const v = String(raw || '').replace(/^Lot:\s*/i, '').trim();
  if(!v) return {ok:false, why:'⛔ type or scan the lot off the box'};
  if(v.length > 40 || /[,\n\t]/.test(v))
    return {ok:false, why:'⛔ that does not look like a lot — no commas, 40 characters at most'};
  const held = lotsHeld(sku).filter(x => x.lot);
  const same = held.find(x => x.lot === v || decodedLot(sku, v) === x.lot);
  if(same) return {ok:false, held:same.lot,
                   why:'⭐ Finale already holds ' + sku + ' lot ' + same.lot + ' — pick it from the list instead'};

  if(lotReadings(v).length > 1)
    return {ok:false, why:'⛔ ' + v + ' could be a year or a Julian date — type the full date '+
                          'from the box, year-month-day'};

  const mine = lotReadings(v);
  const heldDates = x => { const raw = (PAYLOAD.lot_ids || {})[sku + '|' + x.lot];
    return [x.lot].concat(lotReadings(x.lot), raw ? lotReadings(raw) : []); };
  for(const d of mine){
    const twin = held.find(x => heldDates(x).indexOf(d) >= 0);
    if(twin) return {ok:false, held:twin.lot,
                     why:'⛔ ' + v + ' reads as ' + d + ', which Finale already holds as lot ' +
                         twin.lot + '. Pick that one — a second spelling makes a duplicate lot.'};
  }
  return {ok:true, lot:v, reads_as:lotReadsAs(v)};
}
function lotsHeld(sku){
  const out = [];
  Object.keys(PAYLOAD.sku_homes || {}).forEach(k => {
    const i = k.indexOf('|');
    if(k.slice(0, i) === sku) out.push({lot:k.slice(i + 1), homes:PAYLOAD.sku_homes[k]});
  });
  return out.sort((a, b) => String(a.lot).localeCompare(String(b.lot)));
}
function identifyCode(code){
  const raw = String(code || '').trim();
  if(!raw) return null;
  const tab = PAYLOAD.product_lookup || {};
  const hit = tab[raw];
  if(hit) return {sku:hit[0], lot:decodedLot(hit[0], hit[1] || ''), how:'scanned', code:raw,

                  gave_lot:!!hit[1]};

  if(skuName(raw)) return {sku:raw, lot:'', how:'typed', code:raw, gave_lot:false};
  const onPlan = PAYLOAD.bays.some(b => (b.pallets || []).some(p =>
    (p.lines || []).some(l => l.sku === raw)));
  if(onPlan) return {sku:raw, lot:'', how:'typed', code:raw, gave_lot:false};
  return {sku:'', lot:'', how:'unknown', code:raw, gave_lot:false,
          why:'⚠️ we do not recognise ' + raw + '. ⭐ It is KEPT on the record either way — '+
              'pick the item from the list or type its SKU. ⛔ This does not mean the product '+
              'does not exist: the lookup covers what the freezer holds, not the whole catalog.'};
}

function foundHere(bayN, loc, sku, lot, qty, reason, why, extra){
  const q = Number(qty);
  if(!isFinite(q) || q <= 0) return {ok:false, why:'⛔ how many did you find?'};
  if(!sku) return {ok:false, why:'⛔ what is it? Scan it, pick it from the list, or type the SKU.'};
   
  const fhp = findPalletAt(loc);
  if(fhp && palletFreed(fhp.p)) return {ok:false, why:'⛔ ' + (fhp.p.pallet_id || loc) + ' is marked as an emptied deck that does not go back — nothing can be put on it. Un-mark the deck first.'};
  const homes = homesFor(sku, lot);
  if(homes.length)
    return {ok:false, homes:homes, offer:'move',
            why:'⛔ Finale already holds ' + sku + (lot ? ' lot ' + lot : '') + ' at ' +
                homes.map(h => h[0] + ' (' + n(h[1]) + ')').join(', ') +
                '. ⭐ That is almost certainly this stock — record it as a MOVE from there. '+
                'A Found here books a gain for inventory we already own, and the other pile '+
                'then waits to be written off in another month.'};
  const list = (PAYLOAD.found_reasons || []);
  if(list.indexOf(reason) < 0)
    return {ok:false, why:'⛔ pick a reason — a Found is a real Finale stock change and a '+
                          'defaulted accounting code is worse than a missing row'};
  S.found_here = (S.found_here || []).concat([Object.assign({bay:bayN, loc:loc, sku:sku,
    lot:lot || '', qty:q, reason:reason, why:String(why || '').trim(),
    ts:new Date().toISOString()}, (extra && extra.lot_new) ? {lot_new:true,
    lot_source:extra.lot_source || 'typed'} : {})]);
  save();
  ev('found_here', {bay:bayN, loc:loc, sku:sku, lot:lot || '', qty:q, reason:reason});
  return {ok:true};
}

function recordLoadOrder(bayN, order){
  const b = PAYLOAD.bays.find(x => x.n === bayN);
  if(!b) return {ok:false, why:'no bay ' + bayN};

  const planned = goingBackInto(b);
  const got = (order || []).filter(Boolean);

  const a_ = planned.slice().sort().join('|'), b_ = got.slice().sort().join('|');
  if(a_ !== b_)
    return {ok:false, why:'⛔ the order must name exactly the pallets this lane reloads (' +
                          (planned.join(', ') || 'none') + '). A missing or extra pallet '+
                          'changes the POSITION of every pallet behind it, not just its own.'};
  const same = got.join('|') === planned.join('|');
  S.load_order = Object.assign({}, S.load_order || {});
  if(same) delete S.load_order[bayN];
  else S.load_order[bayN] = {order:got, ts:new Date().toISOString()};
  save();
  ev('load_order_recorded', {bay:bayN, order:got.join(','), changed:!same});

  const n_ = got.length;
  return {ok:true, changed:!same,
          positions:got.map((pid, i) => ({pallet_id:pid, position:n_ - i}))};
}

function staleLoadOrder(bayN){
  const rec = (S.load_order || {})[bayN];
  if(!rec || !rec.order) return null;
  const b = PAYLOAD.bays.find(x => String(x.n) === String(bayN));
  if(!b) return null;
  const live = rec.order.filter(x => x && !palletFreed(x));

  const now = goingBackInto(b);
  const missing = now.filter(x => live.indexOf(x) < 0), extra = live.filter(x => now.indexOf(x) < 0);
  return (missing.length || extra.length) ? {missing:missing, extra:extra} : null;
}

function goingBackInto(b){
  const lane = (b && b.bay) || '';
  const inLane = loc => String(loc || '').indexOf(lane + '-') === 0 && /^\d+$/.test(String(loc).slice(lane.length + 1));
  return ((b && b.putback) || []).map(x => x.pallet_id).filter(pid => {
    if(!pid || palletFreed(pid)) return false;
    const pu = pushedFinalLoc(pid);
    if(pu) return inLane(pu);
    const a = actualFor(pid);
    if(a && a.state === 'floor') return false;
    if(a && a.loc) return inLane(a.loc);
    return true;
  });
}
function loadOrderPos(pid){
  const keys = Object.keys(S.load_order || {});
  for(const k of keys){
    const rec = S.load_order[k];
    const live = (rec.order || []).filter(x => !palletFreed(x));
    if(live.indexOf(pid) < 0) continue;
    const b = PAYLOAD.bays.find(x => String(x.n) === String(k));
    if(!b) continue;
    const lane = (b.bay || '');
    const dep = loc => { const s_ = String(loc || '');
      if(s_.indexOf(lane + '-') !== 0) return 0;
      const r = s_.slice(lane.length + 1); return /^\d+$/.test(r) ? Number(r) : 0; };

    const back = goingBackInto(b);
    if(back.indexOf(pid) < 0) return '';             
    const named = {};
    back.forEach(x => { const a = actualFor(x); const pu = pushedFinalLoc(x);
      if(!pu && a && a.loc && dep(a.loc)) named[x] = dep(a.loc); });
    let extra = 0;                                    
    Object.keys(S.putback_actual || {}).forEach(x => {
      if((b.putback || []).some(y => y.pallet_id === x)) return;
      const a = actualFor(x); if(a && a.loc && dep(a.loc)) { named[x] = dep(a.loc); extra++; } });
    const ordered = live.filter(x => back.indexOf(x) >= 0 && !(x in named));
    const unnamed = back.filter(x => !(x in named));
     
    if(ordered.length !== unnamed.length) continue;
    const N = back.length + extra, taken = new Set(Object.values(named)), free = [];
    for(let d = N; d >= 1; d--) if(!taken.has(d)) free.push(d);
    const i = ordered.indexOf(pid);
    if(i < 0 || i >= free.length) continue;
    return lane + '-' + free[i];
  }
  return '';
}

function homeLeft(sku, lot, fromLoc){
  const at = homesFor(sku, lot).find(h => h[0] === fromLoc);
  return netPileQty(fromLoc, sku, lot || '', at ? Number(at[1]) : 0);
}

function undoFoundMove(i){
  const fm = (S.found_moves || [])[i];
  if(!fm) return {ok:false, why:'that move is not recorded'};

  const src = downedPalletAt(fm.from);
  if(src && palletFreed(src.p))
    return {ok:false, why:'⛔ undoing this puts ' + n(fm.qty) + ' of ' + fm.sku + ' back on ' +
                          (src.p.pallet_id || fm.from) + ', which is marked as an emptied deck — un-mark the '+
                          'emptied deck first (✂ Deck freed — undo?), then undo this.'};
  S.found_moves = S.found_moves.filter((x, k) => k !== i);
  save();
  ev('found_move_undone', {sku:fm.sku, lot:fm.lot || '', qty:fm.qty, from:fm.from, to:fm.to});
  return {ok:true};
}

function movableFromHome(sku, lot, fromLoc){
  const at = homesFor(sku, lot).find(h => h[0] === fromLoc);
  const home = at ? Number(at[1]) : 0;
  let left = homeLeft(sku, lot, fromLoc);
  let why = '⛔ Finale only holds ' + n(home) + ' at ' + fromLoc +
    (left < home - 0.001 ? ', and this shift has already moved ' + n(home - left) +
       ' of it — only ' + n(Math.max(0, left)) + ' is left to move' : '') + '.';
  const dp = downedPalletAt(fromLoc);
  if(dp){
    const tal = pileTally(dp.b, dp.p, sku, lot || '');
    const already = (S.found_moves || []).filter(x => x.from === fromLoc && x.sku === sku &&
                      (x.lot || '') === (lot || '')).reduce((s_, x) => s_ + Number(x.qty || 0), 0);
    const rem = Math.round((tal.system - tal.movedOut - already) * 1000) / 1000;
    if(rem < left){
      left = rem;
      why = '⛔ ' + fromLoc + ' is down on the floor and this shift has already carried its ' + sku +
            ' off — only ' + n(Math.max(0, rem)) + ' is left there to move.';
    }
  }
  return {left:Math.max(0, Math.round(left * 1000) / 1000), why:why};
}

function moveFromHome(sku, lot, qty, fromLoc, toLoc, why, opts){
  const q = Number(qty);
  if(!isFinite(q) || q <= 0) return {ok:false, why:'⛔ how many?'};
  if(!fromLoc) return {ok:false, why:'⛔ where does Finale think it is?'};
  if(!toLoc) return {ok:false, why:'⛔ where is it really?'};
  if(fromLoc === toLoc) return {ok:false, why:'⛔ that is the same place — nothing moved.'};
  const toPid = (opts && opts.pallet) || '';

  const rackNow = !toPid && !downedPalletAt(toLoc);
  const probe = toPid ? {to:toLoc, to_kind:'pallet', to_pallet:toPid}
                      : {to:toLoc, to_kind:'place', to_rack_pallet:rackNow || undefined};
  const destHit = toPid ? palletById(toPid) : fmDest(probe);

  if(destHit && palletFreed(destHit.p))
    return {ok:false, why:'⛔ ' + (destHit.p.pallet_id || toLoc) + ' is marked as an emptied deck that does '+
                          'not go back — nothing can be put on it. Un-mark the deck first, or put it somewhere else.'};
   
  const srcDown = downedPalletAt(fromLoc);
  const dest = fmDest(probe);
  if(srcDown && dest && dest.p === srcDown.p)
    return {ok:false, why:'⛔ ' + (srcDown.p.pallet_id || fromLoc) + ' is the pallet Finale already has it on' +
                          (toPid ? '' : ', and that pallet goes to ' + toLoc) + ' — nothing moved.'};
  const homes = homesFor(sku, lot);
  const at = homes.find(h => h[0] === fromLoc);
  if(!at) return {ok:false, why:'⛔ Finale does not hold ' + sku + ' at ' + fromLoc +
                                '. ⛔ Moving stock out of a pile that is not there drives it '+
                                'negative — pick one of: ' +
                                (homes.map(h => h[0]).join(', ') || 'nowhere it is held')};

  const mv = movableFromHome(sku, lot, fromLoc);
  if(q > mv.left + 0.001) return {ok:false, why:mv.why};
  S.found_moves = (S.found_moves || []).concat([Object.assign({sku:sku, lot:lot || '', qty:q,
    from:fromLoc, to:toLoc, why:String(why || '').trim(), ts:new Date().toISOString()},
    toPid ? {to_kind:'pallet', to_pallet:toPid} : {to_kind:'place', to_rack_pallet:rackNow || undefined})]);
  save();
  ev('found_as_move', {sku:sku, lot:lot || '', qty:q, from:fromLoc, to:toLoc,
                       to_kind:toPid ? 'pallet' : 'place', to_pallet:toPid || undefined});
  return {ok:true};
}

function adhocSerial(){
  let k = 1;
  const used = new Set(Object.values(S.adhoc_counts || {}).map(x => x.serial));
  while(used.has('A' + k)) k++;
  return 'A' + k;
}
function adhocCount(bayN, loc, sku, lot, counted, reason, why, opts){
  const b = PAYLOAD.bays.find(x => x.n === bayN);
  const p = b && (b.pallets || []).find(x => x.loc === loc);
  if(!p) return {ok:false, why:'no pallet at ' + loc + ' in bay ' + bayN};
  if(palletFreed(p)) return {ok:false, why:'⛔ ' + (p.pallet_id || loc) + ' is marked as an emptied deck that does not go back — nothing can be put on it. Un-mark the deck first.'};
  const v = Number(counted);
  if(!isFinite(v) || v < 0) return {ok:false, why:'⛔ enter the counted quantity'};
   
  const line = (p.lines || []).find(l => l.kind !== 'count' && l.sku === sku &&
                                         (l.lot || '') === (lot || ''));
  if(!line){
    const homes = ((PAYLOAD.sku_homes || {})[sku + '|' + (lot || '')]) || [];
    const where = homes.length
      ? ' ⭐ Finale holds it at ' + homes.map(h => h[0] + ' (' + n(h[1]) + ')').join(', ') +
        ' — so this is very likely a MOVE, not a find. Record it as moved from there.'
      : ' ⚠️ Finale does not hold this SKU-lot anywhere, so a count here would book stock '+
        'out of nothing.';
    return {ok:false, homes:homes,
            why:'⛔ Finale does not list ' + sku + (lot ? ' lot ' + lot : '') + ' at ' + loc +
                ', so there is no baseline to count against — recording 0 would post a ' +
                n(v) + '-unit Found.' + where};
  }
  const base = Number(line.system_qty || 0);

  let carried = 0;
  (p.lines || []).forEach((l2, i2) => {
    if(l2.kind !== 'take' && l2.kind !== 'aside') return;
    if(l2.sku !== sku || (l2.lot || '') !== (lot || '')) return;
    const s2 = S.lines[lid(bayN, loc, l2, i2)];
    if(s2 && s2.state === 'done') carried += Number(s2.actual || 0);
  });

  if(v + 0.001 < carried){
    if(!(opts && opts.resolve === 'took_less'))
      return {ok:false, needs_resolution:true, carried:carried, counted:v,
              why:'⛔ you have already recorded carrying ' + n(carried) + ' off this pile, so '+
                  'it cannot have held only ' + n(v) + '. ⭐ Either you actually took ' + n(v) +
                  ', or the count is of what is LEFT rather than what was on it.'};

    let budget = v;
    (p.lines || []).forEach((l2, i2) => {
      if(l2.kind !== 'take' && l2.kind !== 'aside') return;
      if(l2.sku !== sku || (l2.lot || '') !== (lot || '')) return;
      const id2 = lid(bayN, loc, l2, i2), s2 = S.lines[id2];
      if(!(s2 && s2.state === 'done')) return;
      const had = Number(s2.actual || 0);
      const now = Math.max(0, Math.min(had, budget));
      budget = Math.round((budget - now) * 1000) / 1000;
      if(Math.abs(now - had) > 0.001)
        setLine(id2, {actual: now, as_planned: false,
                      why_different: 'corrected by count ' + adhocSerial() + ': the pile held ' +
                                     n(v) + ', not ' + n(had)});
    });
    ev('count_corrected_take', {bay:bayN, loc:loc, sku:sku, lot:lot||'',
                                was:carried, now:v});
  }
  const vr = Math.round((v - base) * 1000) / 1000;
  const list = vr < 0 ? (PAYLOAD.shrink_reasons || []) : (PAYLOAD.found_reasons || []);
  if(Math.abs(vr) > 0.001 && list.indexOf(reason) < 0)
    return {ok:false, why:'⛔ pick a reason — a count variance is a real Finale stock change, '+
                          'and a defaulted accounting code is worse than a missing row'};
  const key = loc + '|' + sku + '|' + (lot || '');
  const had = (S.adhoc_counts || {})[key];
  S.adhoc_counts = Object.assign({}, S.adhoc_counts || {});
  S.adhoc_counts[key] = {bay:bayN, bay_name:b.bay, loc:loc, pallet_id:p.pallet_id || '',
                         sku:sku, lot:lot || '', system_qty:base, counted:v, variance:vr,
                         reason:(Math.abs(vr) > 0.001 ? reason : undefined),
                         why:String(why || '').trim(),
                         serial:(had && had.serial) || adhocSerial(),
                         ts:new Date().toISOString()};
  save();
  ev('adhoc_count', {bay:bayN, loc:loc, sku:sku, lot:lot || '', counted:v, variance:vr,
                     serial:S.adhoc_counts[key].serial});
  return {ok:true, serial:S.adhoc_counts[key].serial, variance:vr};
}
function undoAdhocCount(key){
  if(!(S.adhoc_counts || {})[key]) return {ok:false};
  delete S.adhoc_counts[key]; save(); render(); return {ok:true};
}
function settlePallet(loc, why){
  let b = null, p = null;
  PAYLOAD.bays.forEach(x => (x.pallets || []).forEach(q => {
    if(q.loc === loc){ b = x; p = q; } }));
  if(!p) return {ok:false, why:'no pallet at ' + loc + ' in this plan'};
  const blockers = settleBlockers(b.n, p, null, -1);
  if(blockers.length) return {ok:false, blockers:blockers,
    why:'⛔ this pallet already records work: ' + blockers.join('; ') +
        '. Settle the individual lines that really are already right, not the whole pallet '+
        '— that is exactly how 85 units were lost on a real shift.'};
  if(!String(why || '').trim())
    return {ok:false, why:'⛔ say why Finale is already right for this whole pallet'};
  S.pallets[loc] = Object.assign({}, S.pallets[loc] || {},
                                 {settled:{why:String(why).trim(), ts:new Date().toISOString()}});
  save();
  ev('pallet_settled', {bay:b.n, pallet:p.pallet_id||'', loc:loc, why:String(why).trim()});
  return {ok:true};
}
function unsettlePallet(loc){
  if(!(S.pallets[loc] || {}).settled) return {ok:false, why:'that pallet is not settled'};
  delete S.pallets[loc].settled;
  save();
  ev('pallet_unsettled', {loc:loc});
  return {ok:true};
}

const ACTIONABLE = ['take', 'aside', 'count'];
function isActionable(l){ return ACTIONABLE.indexOf(l.kind) >= 0; }

function arrivedTooLate(palletId, ts){
  if(!palletId || !ts) return false;

  const a_ = actualFor(palletId);
  if(a_ && a_.ts && a_.ts > ts) return false;
  const rb = PAYLOAD.bays.find(x => (x.pallets||[]).some(y => y.pallet_id === palletId) ||
                                    (x.putback||[]).some(y => y.pallet_id === palletId));
  if(!rb) return false;
  const rst = S.bays[rb.n] || {};
  if(rst.putback_done && rst.putback_ts && ts > rst.putback_ts) return true;

  return (rst.putback_hist || []).some(h => h && h.putback_ts && ts > h.putback_ts &&
                                            (!h.reopened_ts || ts < h.reopened_ts));
}
function arrivalsFor(palletId){
  const out = [];
  if(!palletId) return out;
  PAYLOAD.bays.forEach(bb => bb.pallets.forEach(pp => pp.lines.forEach((l2, i2) => {
    if(l2.kind === 'count') return;
    const st_ = st(lid(bb.n, pp.loc, l2, i2)) || null;

    if(l2.kind !== 'aside' && !(st_ && st_.did_different)) return;
    const state = st_ ? st_.state : null;
    const actual = (st_ && st_.actual != null) ? Number(st_.actual) : null;

    const parts = (st_ && st_.placements && st_.placements.length)
      ? st_.placements.filter(pt => Number(pt.qty || 0) > 0)
                      .map(pt => ({pallet: pt.pallet || '', qty: Number(pt.qty),
                                   deviated: !!pt.deviated, floor: !!pt.floor, ts: pt.ts || ''}))
      : [{pallet: l2.onto_pallet || '', deviated: false, floor: false, ts: '',
          qty: (actual != null ? actual : Number(l2.planned_qty || 0))}];
    parts.forEach(pt => {
      if(pt.pallet !== palletId) return;

      const tooLate = arrivedTooLate(palletId, pt.ts || (st_ && (st_.done_ts || st_.ts)));
      out.push({sku:l2.sku, lot:l2.lot||'', planned:l2.planned_qty, tooLate:tooLate,
                qty:pt.qty,
                from:pp.loc, bay:bb.bay, n:bb.n, cross:!!l2.cross,

                deviated: pt.deviated || (l2.onto_pallet !== palletId),
                state:state, reason:(st_ && st_.reason) || '',

                gone:(state === 'skipped' || state === 'missing' || state === 'settled' ||
                      !!(st_ && st_.parked_not_here) ||
                      pileSettled(bb, pp, l2.sku, l2.lot || '')),
                short:(l2.kind === 'aside' && state === 'done' && actual != null &&
                       Math.abs(pt.qty - Number(l2.planned_qty || 0)) > 0.001)});
    });
  })));
  return out;
}
function arrivalLine(x){

  const head = '<b>'+esc(x.sku)+'</b> ×'+n(x.gone ? x.planned : x.qty)+
    (x.lot?' · lot '+esc(x.lot):'')+
    ' — set aside from '+esc(x.from)+(x.n !== S.bay + 1 ? ' in bay '+x.n+' ('+esc(x.bay)+')' : '')+
    (x.cross ? ' — cross-lane' : '');
  if(x.state === 'skipped')
    return '<div class="sm" style="margin-top:4px;opacity:.75"><s>'+head+'</s><br>'+
      '⛔ <b>SKIPPED in bay '+x.n+'</b>'+(x.reason?' — '+esc(x.reason):'')+
      '. It was never taken off, so do NOT go looking for it.</div>';
  if(x.state === 'missing')
    return '<div class="sm" style="margin-top:4px;opacity:.75"><s>'+head+'</s><br>'+
      '⛔ <b>NOT FOUND in bay '+x.n+'</b>. Nothing is coming.</div>';
  if(x.short)
    return '<div class="sm" style="margin-top:4px">'+head+'<br>'+
      '⚠️ <b>'+n(x.qty)+' actually came off</b>, not the planned '+n(x.planned)+'.</div>';
  if(!x.state)
    return '<div class="sm" style="margin-top:4px">'+head+
      ' <span class="dim">· bay '+x.n+' has not been worked yet</span></div>';
  return '<div class="sm" style="margin-top:4px">'+head+'</div>';
}

function bayTitle(bay, pct){ return pct + '% · ' + bay; }

const CORRECTION_FIELDS = ['left', 'adjustment', 'corrected', 'reason', 'direction',
                           'clamped_from', 'took_from_sibling', 'gave_to_sibling',
                           'baseline', 'sibling_took', 'not_here', 'posted_at'];
function setLine(id, patch){
  const had = S.lines[id];
  S.lines[id] = Object.assign({ts:new Date().toISOString()}, had||{}, patch);
  S.lines[id].ts = new Date().toISOString();

  if(patch && patch.as_planned === true){
    CORRECTION_FIELDS.forEach(k => { delete S.lines[id][k]; });

    delete S.lines[id].placements;
  }

  const term = ['done','missing','skipped'];
  if(term.indexOf(S.lines[id].state) >= 0 && !S.lines[id].done_ts)
    S.lines[id].done_ts = S.lines[id].ts;
  if(term.indexOf(S.lines[id].state) < 0) S.lines[id].done_ts = undefined;
  save();
}

function readQty(id){
  const el = $('#' + id);
  if(!el) return null;
  const raw = String(el.value == null ? '' : el.value).trim();
  if(raw === '') return null;
  const v = Number(raw);
  return (isFinite(v) && v >= 0) ? v : null;
}

function qtyField(id, val){

  return '<div style="margin-top:4px">'+
    '<input type="number" inputmode="numeric" id="'+id+'" value="'+val+'" '+
      'style="width:100%;font-size:30px;text-align:center;min-height:62px">'+
    '<div style="display:flex;gap:8px;margin-top:6px">'+
      '<button type="button" style="flex:1;font-size:26px;min-height:62px" '+
        'onclick="qtyStep(\''+id+'\',-1)">−</button>'+
      '<button type="button" style="flex:1;font-size:26px;min-height:62px" '+
        'onclick="qtyStep(\''+id+'\',1)">+</button>'+
    '</div></div>';
}
function qtyStep(id, dir){
  const el = $('#' + id); if(!el) return;
  const cur = Number(el.value) || 0;
  const step = cur >= 50 ? 5 : 1;
  el.value = String(Math.max(0, cur + dir * step));
  el.dispatchEvent(new Event('input'));       
}

function toast(m){
  const d = document.createElement('div');
  d.textContent = m;
  d.style.cssText = 'position:fixed;left:50%;bottom:110px;transform:translateX(-50%);'+
    'background:#22272e;border:1px solid #30363d;padding:12px 18px;border-radius:12px;'+
    'z-index:200;max-width:90vw;text-align:center';

  const dl = document.querySelector('dialog[open]');

  if(dl){
    const body = dl.querySelector('.db') || dl;
    let bar = body.querySelector('.dlgtoast');
    if(!bar){
      bar = document.createElement('div');
      bar.className = 'dlgtoast badbox';
      bar.style.cssText = 'margin:0 0 10px';
      body.insertBefore(bar, body.firstChild);
    }
    bar.textContent = m;
    if(bar.scrollIntoView) bar.scrollIntoView({block:'nearest'});
    clearTimeout(bar._t);
    bar._t = setTimeout(()=>{ if(bar.parentNode) bar.parentNode.removeChild(bar); }, 5000);
    return false;
  }
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), 3200);
  return false;                  
}

function startShift(via){

function chip(k,v){ return '<span class="chip"><b>'+esc(v==null?'—':v)+'</b> '+esc(k)+'</span>'; }
function hrs(m){ return m ? (Math.round(Number(m)/6)/10) + ' h' : '—'; }
function section(title, rows, kind){
  if(!rows.length) return '';
  const sorted = rows.slice().sort((x,y)=>Number(y.l.planned_qty||0)-Number(x.l.planned_qty||0));
  return '<div class="card"><div class="pad"><h3>'+esc(title)+' <span class="dim sm">('+rows.length+')</span></h3></div>'+
    '<div class="body">'+sorted.map(x=>{
      const s = st(x.id); const q = s && s.approved!=null ? s.approved : x.l.planned_qty;
      const changed = s && s.approved!=null && Number(s.approved)!==Number(x.l.planned_qty);
      return '<div class="ln" onclick="openWhy(\''+x.id+'\')">'+
        '<span class="tag t-'+kind+'">'+(S.opened[x.id]?'✓':'?')+'</span>'+

        '<div class="qty" style="'+(changed?'color:var(--aside)':'')+'">'+n(q)+'</div></div>';

}
function openWhy(id){

    '</table>'+

function row(k,v){ return (v===''||v==null) ? '' : '<tr><td class="dim">'+esc(k)+'</td><td class="num">'+esc(v)+'</td></tr>'; }
function find(id){
  for(const b of PAYLOAD.bays){
    for(const p of b.pallets){
      for(let i=0;i<p.lines.length;i++) if(lid(b.n,p.loc,p.lines[i],i)===id) return {b:b,p:p,l:p.lines[i],i:i};
    }
    for(let i=0;i<(b.orphan_pulls||[]).length;i++){
      const o=b.orphan_pulls[i]; if(lid(b.n,'ORPHAN',o,i)===id) return {b:b,p:null,l:o,i:i};
    }
  }
  return null;
}

function jobProgress(){
  let done = 0, total = 0;
  PAYLOAD.bays.forEach(b => {
    b.pallets.forEach(p => p.lines.forEach((l,i) => {
      if(!isActionable(l)) return;
      total++;
      if(isFinished(st(lid(b.n, p.loc, l, i)))) done++;
    }));
    
    (b.orphan_pulls || []).forEach((o,i) => {
      total++;
      if(isFinished(st(lid(b.n, 'ORPHAN', o, i)))) done++;
    });
  });
  return {done: done, total: total, pct: total ? Math.round(done / total * 100) : 0};
}

function goBay(d){
  if(S.screen !== 'bay'){ S.screen = 'bay'; }
  const nx = S.bay + d;
  if(nx < 0 || nx >= PAYLOAD.bays.length) return;
  S.bay = nx;
  ev('bay_open', {bay: PAYLOAD.bays[nx].bay, via: 'nav'});
  save(); window.scrollTo(0,0); render();
}

  }

  (function(){

      h += '<div class="pad row"><button class="ghost" onclick="askBringDown('+b.n+')">'+

    h += '<div class="pad row"><button class="ghost" onclick="askFixLocation()">'+

  })();
  h += putbackCard(b);
  a.innerHTML = h;

  const allDone = b.pallets.every(p => (S.pallets[p.loc]||{}).done);
  const pb = (S.bays[b.n]||{}).putback_done;
  const btn = $('#mainbtn');
  const wasClosed = !!(S.bays[b.n]||{}).closed;

  const advance = () => {
    ev('bay_close', {bay:b.bay});

    S.bays[b.n] = Object.assign(S.bays[b.n]||{},
                                {closed:true, closed_ts:new Date().toISOString()});
    S.bay++;
    if(S.bay >= PAYLOAD.bays.length) S.screen = 'done';
    else ev('bay_open', {bay:PAYLOAD.bays[S.bay].bay});
    save(); window.scrollTo(0,0); render();
  };
  const openLines = () => {
    const out = [];
    b.pallets.forEach(p => p.lines.forEach((l,i) => {
      const id = lid(b.n, p.loc, l, i);
      if(isActionable(l) && !isFinished(st(id))) out.push({id:id, l:l, loc:p.loc});
    }));

    (b.orphan_pulls || []).forEach((o,i) => {
      const id = lid(b.n, 'ORPHAN', o, i);
      if(!isFinished(st(id))) out.push({id:id, l:o, loc:o.from_location || 'ORPHAN'});
    });

  };
  
  const settleStays = () => {
    b.pallets.forEach(p => p.lines.forEach((l,i) => {

    }));
  };
